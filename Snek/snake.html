<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SERPENT // 8K</title>
<style>
  :root{
    --bg:#0a0612;
    --grid:#1a0f2e;
    --neon:#2bf5c8;
    --neon-dim:#0f7d66;
    --pink:#ff2e88;
    --amber:#ffb347;
    --text:#cdeee4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse at 50% 0%, #1b0d33 0%, var(--bg) 60%),
      var(--bg);
    color:var(--text);
    font-family:'Courier New',ui-monospace,monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100%;
    gap:18px;
    padding:20px;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .title{
    font-size:clamp(28px,7vw,48px);
    font-weight:bold;
    letter-spacing:.35em;
    color:var(--neon);
    text-shadow:0 0 8px var(--neon),0 0 22px var(--neon-dim);
    text-transform:uppercase;
    user-select:none;
  }
  .title .sub{
    display:block;
    font-size:.28em;
    letter-spacing:.6em;
    color:var(--pink);
    text-shadow:0 0 8px var(--pink);
    margin-top:6px;
    text-align:center;
  }
  .hud{
    display:flex;gap:28px;align-items:baseline;
    font-size:clamp(13px,3.5vw,18px);
    letter-spacing:.18em;
    user-select:none;
  }
  .hud .label{color:var(--neon-dim);}
  .hud .val{color:var(--amber);text-shadow:0 0 8px var(--amber);}
  .stage{
    position:relative;
    border-radius:8px;
    box-shadow:
      0 0 0 2px var(--neon-dim),
      0 0 30px rgba(43,245,200,.25),
      inset 0 0 60px rgba(0,0,0,.6);
    overflow:hidden;
  }
  canvas{display:block;background:var(--bg);}
  /* scanline + vignette overlay */
  .stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(0deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,.18) 3px,rgba(0,0,0,0) 4px),
      radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);
    mix-blend-mode:multiply;
  }
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:rgba(10,6,18,.78);backdrop-filter:blur(2px);
    text-align:center;padding:20px;z-index:3;
  }
  .overlay.hidden{display:none;}
  .overlay h2{
    font-size:clamp(20px,5vw,30px);letter-spacing:.2em;color:var(--pink);
    text-shadow:0 0 12px var(--pink);text-transform:uppercase;
  }
  .overlay p{color:var(--text);opacity:.85;font-size:14px;letter-spacing:.1em;line-height:1.7;}
  .key{color:var(--neon);text-shadow:0 0 6px var(--neon-dim);}
  .blink{animation:blink 1.1s steps(2,start) infinite;}
  @keyframes blink{to{opacity:.25;}}
  .hint{opacity:.5;font-size:12px;letter-spacing:.2em;user-select:none;}
</style>
</head>
<body>
  <div class="title">Serpent<span class="sub">// 8-bit kilobyte</span></div>

  <div class="hud">
    <div><span class="label">SCORE </span><span class="val" id="score">0</span></div>
    <div><span class="label">BEST </span><span class="val" id="best">0</span></div>
  </div>

  <div class="stage">
    <canvas id="game" width="420" height="420"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Ready?</h2>
      <p id="ovBody">Arrows / WASD to move.<br>Eat the <span style="color:var(--pink)">pellets</span>. Don't bite yourself.</p>
      <p class="blink"><span class="key">PRESS ANY KEY</span> or TAP</p>
    </div>
  </div>
  <div class="hint">desktop: arrows / wasd &nbsp;•&nbsp; mobile: swipe</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const CELLS = 21;                 // grid is CELLS x CELLS
  const SIZE = canvas.width / CELLS; // pixel size of a cell
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovBody  = document.getElementById('ovBody');

  const css = getComputedStyle(document.documentElement);
  const NEON = css.getPropertyValue('--neon').trim();
  const PINK = css.getPropertyValue('--pink').trim();
  const GRID = css.getPropertyValue('--grid').trim();

  let snake, dir, nextDir, food, score, best = 0, alive = false, started = false;
  let tick = 0, baseSpeed = 4, speed = baseSpeed, last = 0, acc = 0;

  function reset() {
    const mid = Math.floor(CELLS / 2);
    snake = [{x:mid-1,y:mid},{x:mid-2,y:mid},{x:mid-3,y:mid}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; speed = baseSpeed;
    placeFood();
    scoreEl.textContent = 0;
  }

  function placeFood() {
    let p;
    do { p = {x:rand(CELLS), y:rand(CELLS)}; }
    while (snake.some(s => s.x===p.x && s.y===p.y));
    food = p;
  }
  const rand = n => Math.floor(Math.random()*n);

  function start() {
    if (alive) return;
    reset();
    alive = true; started = true;
    overlay.classList.add('hidden');
    last = performance.now(); acc = 0;
    requestAnimationFrame(loop);
  }

  function gameOver() {
    alive = false;
    best = Math.max(best, score);
    bestEl.textContent = best;
    ovTitle.textContent = 'Game Over';
    ovBody.innerHTML = `You scored <span style="color:var(--amber)">${score}</span>.` +
      (score >= best && score>0 ? '<br><span style="color:var(--neon)">new best!</span>' : '');
    overlay.classList.remove('hidden');
  }

  function step() {
    dir = nextDir;
    const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};

    // wrap-around walls
    head.x = (head.x + CELLS) % CELLS;
    head.y = (head.y + CELLS) % CELLS;

    if (snake.some(s => s.x===head.x && s.y===head.y)) return gameOver();

    snake.unshift(head);
    if (head.x===food.x && head.y===food.y) {
      score++; scoreEl.textContent = score;
      // gently speed up
      speed = baseSpeed + Math.min(score*0.35, 9);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function draw() {
    // faint backdrop grid
    ctx.fillStyle = css.getPropertyValue('--bg').trim();
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = GRID; ctx.lineWidth = 1;
    for (let i=1;i<CELLS;i++){
      ctx.beginPath(); ctx.moveTo(i*SIZE,0); ctx.lineTo(i*SIZE,canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*SIZE); ctx.lineTo(canvas.width,i*SIZE); ctx.stroke();
    }

    // pellet — pulsing pink
    const pulse = 0.5 + 0.5*Math.sin(performance.now()/180);
    ctx.shadowColor = PINK; ctx.shadowBlur = 14 + 8*pulse;
    ctx.fillStyle = PINK;
    roundRect(food.x*SIZE+SIZE*0.22, food.y*SIZE+SIZE*0.22, SIZE*0.56, SIZE*0.56, 4);
    ctx.fill();
    ctx.shadowBlur = 0;

    // snake — head bright, body fading toward tail
    for (let i=snake.length-1;i>=0;i--){
      const s = snake[i];
      const t = 1 - i/(snake.length+2);     // 1 at head -> small at tail
      const isHead = i===0;
      ctx.shadowColor = NEON;
      ctx.shadowBlur = isHead ? 18 : 6*t;
      ctx.fillStyle = isHead ? NEON : mix(NEON, GRID, 0.55 + 0.45*(1-t));
      const inset = SIZE*0.10;
      roundRect(s.x*SIZE+inset, s.y*SIZE+inset, SIZE-inset*2, SIZE-inset*2, 5);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // eyes on the head
    const h = snake[0];
    ctx.fillStyle = css.getPropertyValue('--bg').trim();
    const cx = h.x*SIZE, cy = h.y*SIZE;
    const e = SIZE*0.16, off = SIZE*0.28;
    const ex = dir.x!==0 ? (dir.x>0?SIZE-off:off-e) : off;
    const ex2= dir.x!==0 ? ex : SIZE-off-e;
    const ey = dir.y!==0 ? (dir.y>0?SIZE-off:off-e) : off;
    const ey2= dir.y!==0 ? ey : SIZE-off-e;
    ctx.fillRect(cx+ex, cy+ey, e, e);
    ctx.fillRect(cx+ex2, cy+ey2, e, e);
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // hex color mix
  function mix(a,b,t){
    const pa=hex(a),pb=hex(b);
    const c=pa.map((v,i)=>Math.round(v+(pb[i]-v)*t));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }
  function hex(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
    return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}

  function loop(now){
    if (!alive){ draw(); return; }
    acc += (now-last)/1000; last = now;
    const interval = 1/speed;
    while (acc >= interval){ step(); acc -= interval; if(!alive)break; }
    draw();
    requestAnimationFrame(loop);
  }

  // ---- input ----
  const turn = (x,y) => {
    if (!alive) return;
    if (x===-dir.x && y===-dir.y) return; // no 180s
    nextDir = {x,y};
  };
  const KEYS = {
    ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
    w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]
  };
  window.addEventListener('keydown', e => {
    if (!started || !alive){ if(KEYS[e.key]||e.key===' '||e.key==='Enter'){start();} }
    const k = KEYS[e.key];
    if (k){ e.preventDefault(); turn(k[0],k[1]); }
  });

  // touch / swipe
  let tStart=null;
  const stage = document.querySelector('.stage');
  stage.addEventListener('touchstart', e=>{
    if(!alive){start();return;}
    tStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
  },{passive:true});
  stage.addEventListener('touchmove', e=>{
    if(!tStart)return;
    const dx=e.touches[0].clientX-tStart.x, dy=e.touches[0].clientY-tStart.y;
    if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
    if(Math.abs(dx)>Math.abs(dy)) turn(dx>0?1:-1,0); else turn(0,dy>0?1:-1);
    tStart=null;
  },{passive:true});
  stage.addEventListener('click', ()=>{ if(!alive) start(); });

  // draw the idle frame behind the overlay
  reset(); alive=false; draw();
})();
</script>
</body>
</html>
