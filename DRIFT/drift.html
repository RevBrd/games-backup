<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIFT</title>
<!-- the ship itself, inline so the file stays self-contained (no second asset to host) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%2305060d'/><path d='M16 3 L26 28 L16 22 L6 28 Z' fill='%230d1426' stroke='%239fc4ff' stroke-width='2.4' stroke-linejoin='round'/></svg>">
<style>
  html, body { margin:0; padding:0; height:100%; background:#05060d; overflow:hidden;
    font-family:'Courier New', monospace; -webkit-user-select:none; user-select:none; }
  #wrap { display:flex; align-items:center; justify-content:center; height:100vh; }
  #stage { position:relative; line-height:0; }
  canvas { background:#05060d; display:block; box-shadow:0 0 60px rgba(80,140,255,0.15); border-radius:6px; }
  /* anchored to #stage (the canvas box), not the viewport, so the two can never decouple.
     --ui tracks the canvas fit scale so the menu shrinks with the playfield. */
  #overlay { position:absolute; left:0; right:0; top:50%; line-height:1.4;
    color:#cfe3ff; text-align:center;
    transform:translateY(-50%) scale(var(--ui,1)); pointer-events:none; }
  #overlay.active { pointer-events:auto; }
  #overlay h1 { font-size:64px; letter-spacing:14px; margin:0; color:#8fb8ff;
    text-shadow:0 0 24px rgba(100,160,255,0.7); }
  #overlay p { font-size:14px; letter-spacing:2px; color:#6b86b8; margin:12px 0 0; line-height:1.7; }
  .btnrow { margin-top:26px; display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  .btn { pointer-events:auto; cursor:pointer; background:rgba(20,30,55,0.6);
    border:1.5px solid #4a6296; color:#bcd6ff; font-family:'Courier New',monospace;
    font-size:15px; letter-spacing:3px; padding:14px 24px; border-radius:5px; transition:all .12s; text-align:center; }
  .btn:hover { background:rgba(60,90,150,0.55); border-color:#8fb8ff; color:#fff;
    box-shadow:0 0 18px rgba(100,160,255,0.4); }
  .btn small { display:block; font-size:10px; letter-spacing:1px; color:#6b86b8; margin-top:6px; }
  .btn.rid { border-color:#9a4a78; color:#ffbce6; }
  .btn.rid:hover { border-color:#ff78dc; box-shadow:0 0 18px rgba(255,120,220,0.45); }
  .btn.primary { display:block; width:100%; box-sizing:border-box; margin:0;
    font-size:24px; padding:18px 0; color:#8fb8ff; letter-spacing:10px;
    text-shadow:0 0 18px rgba(100,160,255,0.65); border-color:#46618f; }
  .btn.primary:hover { border-color:#bcd9ff; color:#cfe3ff; box-shadow:0 0 26px rgba(120,170,255,0.55); }
  .btn.primary small { display:block; font-size:11px; letter-spacing:1px; color:#6b86b8; margin-top:8px; text-shadow:none; }
  .mode-stack { max-width:580px; margin:22px auto 0; }
  .mode-row { display:flex; gap:16px; margin-top:14px; }
  .mode-row .btn { flex:1; margin:0; }
  .blink { animation:b 1.1s steps(2) infinite; }
  @keyframes b { 0%{opacity:1} 50%{opacity:.25} 100%{opacity:1} }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="820" height="620"></canvas>
<div id="overlay" class="active"></div></div></div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
// Logical playfield, fixed forever — every coordinate, radius and constant in this file is in
// these units. Read once from the markup BEFORE fitCanvas() touches the backing store, which it
// resizes for display fit and pixel density. Never re-read cv.width/height for game logic.
const W=cv.width, H=cv.height, overlay=document.getElementById('overlay');
const stage=document.getElementById('stage');
const keys={};

// The canvas box was a hard 820x620 with body{overflow:hidden}: above that viewport it was
// pixel-perfect, below it the playfield was clipped with no way to scroll to it. Scale to fit
// instead, never past 1:1, and render at device resolution so it stays sharp on hi-dpi screens.
function fitCanvas(){
  const dpr=Math.min(window.devicePixelRatio||1, 2);   // capped: past 2x costs fill rate and buys nothing
  const scale=Math.min(1, (innerWidth-16)/W, (innerHeight-16)/H);
  const cwPx=Math.round(W*scale), chPx=Math.round(H*scale);
  cv.style.width=cwPx+'px'; cv.style.height=chPx+'px';
  stage.style.setProperty('--ui', scale);
  const bw=Math.max(1,Math.round(cwPx*dpr)), bh=Math.max(1,Math.round(chPx*dpr));
  if(cv.width!==bw||cv.height!==bh){ cv.width=bw; cv.height=bh; }
  ctx.setTransform(bw/W, 0, 0, bh/H, 0, 0);           // draw in logical space; assigning width/height resets this
}
addEventListener('resize', fitCanvas);
const MAXFUEL=1000, MAXROCKS=100, PULSE_R=170;
const PULSE_RISK_BASE=0.12, PULSE_RISK_STEP=0.04, PULSE_RISK_MAX=0.75;
// The device degrades on two axes, not one. Risk is the gamble; this is the certainty — every
// firing in a run lengthens the outage that follows. Added to the fixed floor AND to the width of
// the random spread, so the shape stays the same and there's just more of it. Capped, like risk.
// At 0 uses: 1.5s dark, 3.0-4.5s total. Fully escalated: 2.7s dark, 5.4-8.1s total.
// Most of that growth lands in the flicker tail, which is the mildest part — tune here first.
const PULSE_HUD_ESC=12, PULSE_HUD_ESC_MAX=6;   // +0.2s per use, capped at 6 uses (+1.2s per term)
const CLEAVE_R=40;
const GW_R=165, GW_STR=0.05, GW_SPEED=0.7, GW_DAMP=0.985, GW_MARGIN=240;
const SHIELD_MAX=3, SHIELD_REGEN_DELAY=120, SHIELD_REGEN_TICK=40;
const FLARE_R=26, FLARE_SPEED=1.9, FLARE_MARGIN=120, OVERHEAT_DUR=300, FLARE_RING=95;
const PULSAR_R=130, PULSAR_SPEED=0.6, PULSAR_MARGIN=150, PULSAR_BURST_CD=240, PULSAR_FIRST_CD=150, PULSAR_DISABLE=150;
const COMET_R=20, COMET_SPEED=4.0, COMET_MARGIN=120, HAZ_CAP=2;
const PULSAR_GW=[0,0.5,1.0,1.5], PULSAR_SHIP_GW=1.6, PULSAR_AST_GW=0.45, PULSAR_JOLT=1.3, PULSAR_REPULSE=1.5, PULSAR_GRAVIMMUNE=300;
const PULSAR_GROW=0.16875, PULSAR_HOLD=15, PULSAR_FLASHLEAD=9, PULSAR_SPIN2=0.012;
const COOL_WELL=1200, COOL_FLARE=1800, COOL_PULSAR=2700, COOL_COMET=3600;
const TIER_R={0:12, 1:20, 2:33, 3:50};

const MODES={
  classic:   { label:'CLASSIC',    fuel:false, drops:false, hazards:false, extraEvery:Infinity, startLives:3,
               caps:{rapid:0,power:0,twin:0} },
  modern:    { label:'DRIFT',      fuel:true,  drops:true,  hazards:true,  extraEvery:20000,    startLives:3,
               caps:{rapid:1,power:1,twin:1}, deathWipe:true, dimWeapon:0.15, weaponOnScreen:1, dimScore:0.15 },
  survival:  { label:'SURVIVAL',   fuel:false, drops:false, hazards:false, extraEvery:Infinity, startLives:1,
               caps:{rapid:0,power:0,twin:0}, survival:true },
  ridiculous:{ label:'RIDICULOUS', fuel:true,  drops:true,  hazards:true,  extraEvery:Infinity, startLives:1,
               caps:{rapid:3,power:3,twin:3}, dimWeapon:0.05, weaponOnScreen:3, dimScore:0.05 },
};

let state='menu', mode='modern', M=MODES.modern;
let score=0, wave=0, lives=3, combo=1, comboTimer=0, shake=0, paused=false, pauseConfirm=null;
const PULSE_CD=600;
let nextExtra=Infinity, toast='', toastT=0, pulseRisk=PULSE_RISK_BASE, pulseCd=0, pulseUses=0;
let survTime=0, survSpawnCd=0, survNewBest=false;
let lifePending=0, lifeDropCount=0;
let shipDebris=[];
let menuIdle=0, menuWait=270;   // startup: pulsar after ~4.5s; after a game: 20s of empty sky
let hudGlitch=0, hudGlitchDur=1, hudStyle=0, hudHold=0, hudOn=true, hudCache={};
let hudBlack=90;                // length of the current total outage; escalates, see PULSE_HUD_ESC
const GLITCH_JUNK='#%&@*!?+=~/\\|<>0123456789';
const HUD_BLACKOUT=90;          // 1.5s of total outage before recovery begins — the unescalated floor
function hudZap(dur,black){     // dur = total frames of disruption, black = frames of it fully dark
  if(hudGlitch>=dur) return;    // a longer disruption is already running; never shorten it
  hudBlack=black===undefined?HUD_BLACKOUT:black;
  hudGlitchDur=Math.max(dur,hudBlack+30); hudGlitch=hudGlitchDur;
  hudStyle=Math.floor(Math.random()*3); hudHold=0; hudOn=false; hudCache={};
}
function hudClear(){            // instruments back, immediately — used when the ship is replaced
  hudGlitch=0; hudGlitchDur=1; hudBlack=HUD_BLACKOUT; hudHold=0; hudOn=true; hudCache={};
}
function hudBlackedOut(){ return hudGlitch>0 && hudGlitch>hudGlitchDur-hudBlack; }
function hudRecovery(){         // 0 at the moment recovery starts -> 1 when fully restored
  const span=Math.max(1,hudGlitchDur-hudBlack);
  return 1-Math.min(1,hudGlitch/span);
}
function hudTick(){
  if(hudGlitch<=0){ hudOn=true; return; }
  hudGlitch--;
  if(hudGlitch>hudGlitchDur-hudBlack){ hudOn=false; hudHold=0; return; }   // full outage
  if(--hudHold<=0){
    const rec=hudRecovery();
    hudHold=Math.max(3,Math.round(15-rec*12));      // holds shorten: flicker speeds up as it recovers
    hudOn=Math.random() < 0.18+rec*0.82;            // and stays lit more often
    hudCache={};
  }
  if(hudGlitch<=0) hudOn=true;
}
function glitchStr(s,p){        // scramble a fraction of the characters (stable within a hold)
  if(p<=0) return s;
  if(hudCache[s]!==undefined) return hudCache[s];
  const rate = (hudStyle===1?0.42:hudStyle===2?0.26:0.16)*p;
  let o='';
  for(let i=0;i<s.length;i++) o += (s[i]!==' '&&Math.random()<rate) ? GLITCH_JUNK[Math.floor(Math.random()*GLITCH_JUNK.length)] : s[i];
  hudCache[s]=o;
  return o;
}
let stars=[], asteroids=[], bullets=[], particles=[], powerups=[], shocks=[];
let pulseArmed=true, well=null, flare=null, pulsar=null, comet=null;
const HAZ_WARN={
  well:   { text:'WARNING \u2014 GRAVITY WELL',    col:'200,150,255', pre:0,   dur:600 },
  flare:  { text:'\u26a0 SOLAR FLARE DETECTED',    col:'255,150,70',  pre:150, dur:165 },
  pulsar: { text:'\u26a0 PULSAR PROXIMITY ALERT',  col:'150,235,255', pre:0,   dur:300 },
  comet:  { text:'\u2604 COMET INBOUND',           col:'185,238,255', pre:240, dur:240 }
};
let warn=null, warnCd=0;
let wellCd=0, flareCd=0, pulsarCd=0, cometCd=0;
let introduced={well:false,flare:false,pulsar:false,comet:false}, introWhich=null, introTimer=-1;
let devUnlocked=false, konamiPos=0;
let stats={shots:0,hits:0,destroyed:0,deaths:0,streak:0,bestStreak:0};
const KONAMI=['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];
let bests={ classic:{score:0,wave:0}, modern:{score:0,wave:0}, survival:{score:0,wave:0}, ridiculous:{score:0,wave:0} };

// Records survive a refresh. NOTE: survival stores its best as *frames* in .score, sharing the
// field the other modes use for points — fmtTime() is what makes it a clock. Don't "fix" that
// asymmetry here without also fixing every read site.
const SAVE_KEY='drift.bests.v1';
let saveOK=true;                 // false once storage refuses: run stays fully playable, just unrecorded
function loadBests(){
  let raw;
  // two different failures, two different recoveries — don't collapse them
  try{ raw=localStorage.getItem(SAVE_KEY); }
  catch(e){ saveOK=false; return; }   // storage itself refused: it won't accept writes either, stop trying
  if(!raw) return;
  let d;
  try{ d=JSON.parse(raw); }
  catch(e){ return; }                 // junk data but working storage: keep defaults, next save overwrites it
  for(const m in bests){              // copied field by field on purpose: a corrupt, hand-edited or
    const s=d&&d[m];                  // future-version blob can't inject keys or NaN into live state
    if(!s||typeof s!=='object') continue;
    for(const k of ['score','wave']){
      const v=s[k];
      if(typeof v==='number' && isFinite(v) && v>=0) bests[m][k]=Math.floor(v);
    }
  }
}
function saveBests(){
  if(!saveOK) return;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(bests)); }
  catch(e){ saveOK=false; }      // private mode, quota, or a locked-down file:// origin
}

const ship={ x:W/2, y:H/2, a:-Math.PI/2, vx:0, vy:0, r:12, cool:0, inv:0, fuel:MAXFUEL, pulse:false, godmode:false, overheat:0, disabled:0, dspin:0,
  up:{rapid:0, power:0, twin:0} };

const PCOL={ fuel:'90,230,140', rapid:'90,200,255', power:'255,170,70', twin:'255,120,220', pulse:'235,245,255', score:'255,210,80', life:'130,255,180' };
const PCHAR={ fuel:'F', rapid:'R', power:'P', twin:'T', pulse:'\u2726', score:'$', life:'\u2191' };

for(let i=0;i<140;i++) stars.push({x:Math.random()*W, y:Math.random()*H, z:Math.random()*0.9+0.1});

function ironHp(tier){ return tier>=3 ? 3 : 2; }
function makeRock(x,y,tier,iron,vx,vy,shielded){
  const hp = iron ? ironHp(tier) : 1;
  return { x,y, vx,vy, tier, iron, hp, maxHp:hp, r:TIER_R[tier],
    shielded:!!shielded, shield:shielded?SHIELD_MAX:0, shieldMax:SHIELD_MAX, shieldCd:0,
    spin:(Math.random()-0.5)*0.04, rot:0, hit:0,
    shape:Array.from({length:tier>=3?11:9},()=>0.7+Math.random()*0.5) };
}

function spawnWave(){
  const n = 2 + Math.min(wave,12);
  const pBig  = M.hazards && wave>=3 ? Math.min(0.45,(wave-2)*0.04)  : 0;
  const pIron = M.hazards && wave>=5 ? Math.min(0.40,(wave-4)*0.035): 0;
  const pShield = M.hazards && wave>=11 ? Math.min(0.30,(wave-10)*0.03): 0;
  for(let i=0;i<n;i++){
    const edge=Math.floor(Math.random()*4); let x,y;
    if(edge===0){x=Math.random()*W;y=-30;}
    else if(edge===1){x=W+30;y=Math.random()*H;}
    else if(edge===2){x=Math.random()*W;y=H+30;}
    else{x=-30;y=Math.random()*H;}
    let tier = Math.random()<pBig ? 3 : 2;
    let iron = Math.random()<pIron;
    if(tier===3 && iron && wave<8){ if(Math.random()<0.5) iron=false; else tier=2; } // large iron gated to 8+
    let shielded = !iron && Math.random()<pShield;
    // guaranteed minimums: force the first few rocks to each unlocked special type
    if(i===0 && wave>=3){ tier=3; iron=false; shielded=false; }
    else if(i===1 && wave>=5){ iron=true; tier=2; shielded=false; }
    else if(i===2 && wave>=11){ shielded=true; iron=false; tier=Math.random()<0.5?3:2; }
    const spread = wave>=10 ? Math.min(0.45,(wave-9)*0.05) : 0; // ease the center-trap at higher waves
    const tx=W/2+(Math.random()-0.5)*W*spread, ty=H/2+(Math.random()-0.5)*H*spread;
    const ang=Math.atan2(ty-y, tx-x)+(Math.random()-0.5);
    const sp=0.5+wave*0.05+Math.random()*0.5;
    asteroids.push(makeRock(x,y,tier,iron,Math.cos(ang)*sp,Math.sin(ang)*sp,shielded));
  }
}
function nextWave(){ wave++; spawnWave(); }

function fmtTime(fr){ const s=Math.floor(fr/60); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function survivalSpawn(){
  if(--survSpawnCd>0) return;
  const secs=survTime/60;
  survSpawnCd = Math.max(8, 73 - secs*0.35);
  const count = Math.min(4, 1 + Math.floor(secs/45));
  for(let c=0;c<count;c++){
    const edge=Math.floor(Math.random()*4); let x,y;
    if(edge===0){x=Math.random()*W;y=-30;}
    else if(edge===1){x=W+30;y=Math.random()*H;}
    else if(edge===2){x=Math.random()*W;y=H+30;}
    else{x=-30;y=Math.random()*H;}
    const tx=W*0.2+Math.random()*W*0.6, ty=H*0.2+Math.random()*H*0.6;
    const ang=Math.atan2(ty-y,tx-x);
    const sp=1.2+secs*0.004+Math.random()*0.9;
    const maxTier = secs<25?1 : secs<60?2 : 3;
    const minTier = secs<90?0 : 1;
    const tier = minTier + Math.floor(Math.random()*(maxTier-minTier+1));
    asteroids.push(makeRock(x,y,tier,false,Math.cos(ang)*sp,Math.sin(ang)*sp,false));
  }
}

function startGame(m){
  mode=m; M=MODES[m]; state='play';
  score=0; wave=0; lives=M.startLives; combo=1; comboTimer=0;
  nextExtra=M.extraEvery; toast=''; toastT=0; pulseRisk=PULSE_RISK_BASE; pulseCd=PULSE_CD; pulseUses=0; hudClear();
  lifePending=0; lifeDropCount=0;
  stats={shots:0,hits:0,destroyed:0,deaths:0,streak:0,bestStreak:0};
  survTime=0; survSpawnCd=40;
  asteroids=[]; bullets=[]; particles=[]; powerups=[]; shocks=[]; shipDebris=[]; pulseArmed=true; well=null; flare=null; pulsar=null; comet=null; warn=null; warnCd=0; wellCd=0; flareCd=0; pulsarCd=0; cometCd=0; introduced={well:false,flare:false,pulsar:false,comet:false}; introWhich=null; introTimer=-1; pauseConfirm=null;
  ship.x=W/2; ship.y=H/2; ship.vx=0; ship.vy=0; ship.a=-Math.PI/2; ship.inv=120; ship.disabled=0;
  ship.fuel=MAXFUEL; ship.up={rapid:0,power:0,twin:0}; ship.pulse=M.drops; ship.godmode=false; ship.overheat=0;
  overlay.classList.remove('active'); overlay.innerHTML='';
  if(!M.survival) nextWave();
}
window.startGame=startGame;
function gotoMenu(){ state='menu'; ship.vx=0; ship.vy=0; bullets=[]; powerups=[]; menuIdle=0; menuWait=1200; showMenu(); }
window.gotoMenu=gotoMenu;

function burst(x,y,c,n){ for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*3+0.5;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c});} }

function fire(){
  if(M.survival || ship.cool>0 || ship.overheat>0) return;
  const u=ship.up;
  ship.cool=Math.max(3, 11-u.rapid*2);
  const sp=8, br=2.2+u.power*1.2, dmg=1+u.power, rec=0.12*(1+0.5*u.power)/(1+0.2*(u.rapid+u.twin));
  const cx=Math.cos(ship.a), cy=Math.sin(ship.a);
  const px=-Math.sin(ship.a), py=Math.cos(ship.a);
  let specs;
  if(u.twin>=3) specs=[{o:-16,d:1},{o:-8,d:1},{o:0,d:1},{o:8,d:1},{o:16,d:1}];   // wide 5-shot fan, all forward
  else if(u.twin===2) specs=[{o:-9,d:1},{o:0,d:1},{o:9,d:1}];
  else if(u.twin===1) specs=[{o:-7,d:1},{o:7,d:1}];
  else specs=[{o:0,d:1}];
  specs.forEach(s=>{
    const dx=cx*s.d, dy=cy*s.d;
    bullets.push({ x:ship.x+dx*ship.r+px*s.o, y:ship.y+dy*ship.r+py*s.o,
      vx:dx*sp+ship.vx*0.4, vy:dy*sp+ship.vy*0.4, life:60, r:br, dmg });
    ship.vx-=dx*rec; ship.vy-=dy*rec; // recoil opposite bullet dir
    stats.shots++;
  });
}

function killShip(){
  if(ship.godmode) return;
  lives--; combo=1; shake=18; burst(ship.x,ship.y,'255,90,90',40);
  stats.deaths++; stats.streak=0;
  if(lives<=0){ state='over'; survNewBest=false;
    if(!devUnlocked){ const r=bests[mode];
      if(M.survival){ survNewBest = survTime>r.score; r.score=Math.max(r.score,survTime); }
      else { r.score=Math.max(r.score,score); r.wave=Math.max(r.wave,wave); }
      saveBests(); }
    showOver();
  } else {
    ship.x=W/2;ship.y=H/2;ship.vx=0;ship.vy=0;ship.inv=(mode==='modern')?260:130; ship.fuel=MAXFUEL; ship.disabled=0; ship.overheat=0;
    if(M.deathWipe) ship.up={rapid:0,power:0,twin:0};
    if(M.drops && !ship.pulse){ ship.pulse=true; pulseRisk=Math.min(PULSE_RISK_MAX, pulseRisk+PULSE_RISK_STEP); }
    pulseCd=PULSE_CD;
  }
}

function spawnDrop(a,type){
  powerups.push({x:a.x,y:a.y,vx:a.vx*0.3,vy:a.vy*0.3,type,life:type==='pulse'?2400:600,pulse:0});
}

function firePulse(){
  if(state!=='play'||paused||!M.drops||!ship.pulse) return;
  if(pulseCd>0){ toast='PULSE CHARGING \u2014 STAND BY'; toastT=105; return; }
  if(ship.disabled>0) return;
  ship.pulse=false;
  const esc=Math.min(pulseUses,PULSE_HUD_ESC_MAX)*PULSE_HUD_ESC;
  pulseUses++;
  hudZap(HUD_BLACKOUT+esc + 90+esc + Math.floor(Math.random()*(90+esc)), HUD_BLACKOUT+esc);
  shocks.push({x:ship.x,y:ship.y,r:0,life:1});
  burst(ship.x,ship.y,'235,245,255',44); shake=14;
  for(let i=asteroids.length-1;i>=0;i--){
    const a=asteroids[i], dx=a.x-ship.x, dy=a.y-ship.y, rr=PULSE_R+a.r;
    if(dx*dx+dy*dy < rr*rr){
      score += Math.round((10 + (a.iron?8:0) + (a.tier>=3?5:0))*scoreMult()); // flat, no combo
      stats.destroyed++; stats.streak++; if(stats.streak>stats.bestStreak) stats.bestStreak=stats.streak;
      burst(a.x,a.y,'200,220,255',10);
      asteroids.splice(i,1);
    }
  }
  if(Math.random()<pulseRisk){
    const A=ship.a, R=ship.r;                       // the three edges of the ship triangle
    const pts=[[R,0],[-R*0.8,R*0.7],[-R*0.4,0],[-R*0.8,-R*0.7]];
    for(let s=0;s<3;s++){
      const p1=pts[s], p2=pts[(s+1)%4];
      const mx=(p1[0]+p2[0])/2, my=(p1[1]+p2[1])/2;
      const ang=A+Math.atan2(my,mx), sp=1.6+Math.random()*1.6;
      shipDebris.push({ x:ship.x+Math.cos(A)*mx-Math.sin(A)*my, y:ship.y+Math.sin(A)*mx+Math.cos(A)*my,
        vx:ship.vx*0.4+Math.cos(ang)*sp, vy:ship.vy*0.4+Math.sin(ang)*sp,
        a:A, spin:(Math.random()-0.5)*0.34, p1, p2, life:1 });
    }
    toast='DEVICE BACKFIRE'; toastT=120; killShip();
    hudClear();   // the zap above belonged to the hull that just came apart — a replacement ship
  }               // arrives with working instruments, whatever the escalation had reached

  else { toast='PULSE FIRED'; toastT=70; }
  pulseRisk=Math.min(PULSE_RISK_MAX, pulseRisk+PULSE_RISK_STEP);
}

function devAction(k){
  if(k==='b') asteroids.push(makeRock(Math.random()*W,-30,3,false,(Math.random()-0.5),1));
  else if(k==='i') asteroids.push(makeRock(Math.random()*W,-30,2,true,(Math.random()-0.5),1));
  else if(k==='l') asteroids.push(makeRock(Math.random()*W,-30,3,true,(Math.random()-0.5),1));
  else if(k==='h') asteroids.push(makeRock(Math.random()*W,-30,2,false,(Math.random()-0.5),1,true));
  else if(k==='g'){ well=null; spawnWell(); beginWarn('well'); warn.spawned=true; }
  else if(k==='o'){ flare=null; spawnFlare(); beginWarn('flare'); warn.spawned=true; warn.timer=15; }
  else if(k==='z'){ pulsar=null; spawnPulsar(); beginWarn('pulsar'); warn.spawned=true; }
  else if(k==='c'){ comet=null; warn=null; warnCd=0; beginHazard('comet'); }
  else if(k==='f') ship.fuel=MAXFUEL;
  else if(k==='k') ship.pulse=true;
  else if(k==='u'){ const t=['rapid','power','twin'][Math.floor(Math.random()*3)];
    ship.up[t]=Math.min(3, ship.up[t]+1); }
  else if(k==='n') asteroids=[];
  else if(k==='j'){ wave+=4; asteroids=[]; }
  else if(k==='v') ship.godmode=!ship.godmode;
  else if(k==='m') powerups.push({x:ship.x+45,y:ship.y,vx:0,vy:0,type:'score',life:600,pulse:0});
  toast='DEV: '+k.toUpperCase(); toastT=45;
}

function damageRock(a,dmg){
  a.hit=6;
  if(introWhich && introTimer<0) introTimer=900+Math.floor(Math.random()*1500); // 15-40s after first damage
  if(a.shielded && a.shield>0){
    a.shieldCd=SHIELD_REGEN_DELAY;
    const absorb=Math.min(a.shield,dmg);
    a.shield-=absorb; dmg-=absorb;
    if(dmg<=0) return false;
  }
  a.hp-=dmg;
  return a.hp<=0;
}

function scoreMult(){ return Math.max(0, 1 - (M.dimScore||0)*(ship.up.rapid+ship.up.power+ship.up.twin)); }
function destroyRock(a){
  let bonus = 10 + (a.iron?8:0) + (a.tier>=3?5:0) + (a.shielded?10:0);
  score += Math.round(bonus*combo*scoreMult()); combo=Math.min(combo+1,9); comboTimer=110;
  burst(a.x,a.y, a.iron?'200,200,220':'150,200,255', a.tier>=3?18:12); shake=4;
  if(a.tier>0 && asteroids.length<MAXROCKS){
    for(let k=0;k<2 && asteroids.length<MAXROCKS;k++){
      const ang=Math.random()*6.28, sp=1+Math.random();
      asteroids.push(makeRock(a.x,a.y,a.tier-1,a.iron,Math.cos(ang)*sp,Math.sin(ang)*sp,a.shielded));
    }
  }
}

function breakRock(a){
  if(a.dead) return;
  a.dead=true;
  destroyRock(a);
  if(a.tier===0){ stats.destroyed++; stats.streak++; if(stats.streak>stats.bestStreak) stats.bestStreak=stats.streak; }
  if(M.drops){
    if(lifePending>0){ spawnDrop(a,'life'); powerups[powerups.length-1].life=Math.max(180, Math.round(600*Math.pow(0.9,lifeDropCount))); lifeDropCount++; lifePending--; }
    else {
    const held = ship.up.rapid+ship.up.power+ship.up.twin;
    const dim = Math.max(0, 1 - M.dimWeapon*held);          // -15%/-5% per held weapon
    const waveGate = wave<=1?0.25 : wave===2?0.50 : wave===3?0.75 : 1; // L1 25%, L2 50%, L3 75%
    const special = a.shielded?2.0 : a.iron?1.5 : 1; // tougher rocks drop weapons more readily
    const wpnRate = 0.027 * dim * waveGate * special;
    const pulseRate = 0.00375 * dim;                         // pulse rarer as you arm up
    let fuelN=0, wpnN=0;
    for(const p of powerups){ if(p.type==='fuel')fuelN++; else if(p.type==='rapid'||p.type==='power'||p.type==='twin')wpnN++; }
    let drop=null; // one per rock, priority: fuel > weapon > score > pulse
    if(fuelN<2 && Math.random()<0.03) drop='fuel';
    else if(wpnN<M.weaponOnScreen && Math.random()<wpnRate){ const rw=Math.random(); drop=rw<0.3333?'rapid':rw<0.6667?'power':'twin'; }
    else if(Math.random()<0.015) drop='score';
    else if(Math.random()<pulseRate) drop='pulse';
    if(drop) spawnDrop(a,drop);
    }
  }
  if(M.hazards && hazReady()){
    if(wave>=7 && !well && wellCd<=0 && Math.random()<0.004) beginHazard('well');
    else if(wave>=9 && !flare && flareCd<=0 && Math.random()<0.004) beginHazard('flare');
    else if(wave>=13 && !pulsar && pulsarCd<=0 && Math.random()<0.004) beginHazard('pulsar');
    else if(wave>=15 && !comet && cometCd<=0 && Math.random()<0.004) beginHazard('comet');
  }
}

function spawnWell(){
  introduced.well=true;
  const edge=Math.floor(Math.random()*4); let x,y;
  if(edge===0){x=Math.random()*W;y=-GW_MARGIN;}
  else if(edge===1){x=W+GW_MARGIN;y=Math.random()*H;}
  else if(edge===2){x=Math.random()*W;y=H+GW_MARGIN;}
  else{x=-GW_MARGIN;y=Math.random()*H;}
  const tx=W/2+(Math.random()-0.5)*300, ty=H/2+(Math.random()-0.5)*220;
  const ang=Math.atan2(ty-y,tx-x);
  well={ x,y, heading:ang, entered:false, t:0 };
}
function pull(o,damp,mult){
  const dx=well.x-o.x, dy=well.y-o.y, d=Math.sqrt(dx*dx+dy*dy)||1;
  if(d<GW_R){
    const s=GW_STR*mult*(1-d/GW_R);
    o.vx+=dx/d*s; o.vy+=dy/d*s;
    if(damp){ o.vx*=GW_DAMP; o.vy*=GW_DAMP; }
  }
}
function applyWell(){
  if(!well) return;
  well.t++;
  well.heading += (Math.random()-0.5)*0.004; // gentle curve
  well.x += Math.cos(well.heading)*GW_SPEED; well.y += Math.sin(well.heading)*GW_SPEED;
  if(well.x>0&&well.x<W&&well.y>0&&well.y<H) well.entered=true;
  if(well.entered && (well.x<-GW_MARGIN||well.x>W+GW_MARGIN||well.y<-GW_MARGIN||well.y>H+GW_MARGIN)){ well=null; wellCd=COOL_WELL; return; }
  pull(ship,false,1.6);
  for(const a of asteroids) pull(a,true,0.7);
}

function spawnFlare(){
  introduced.flare=true;
  const edge=Math.floor(Math.random()*4); let x,y;
  if(edge===0){x=Math.random()*W;y=-FLARE_MARGIN;}
  else if(edge===1){x=W+FLARE_MARGIN;y=Math.random()*H;}
  else if(edge===2){x=Math.random()*W;y=H+FLARE_MARGIN;}
  else{x=-FLARE_MARGIN;y=Math.random()*H;}
  flare={ x,y, heading:Math.atan2(ship.y-y,ship.x-x), entered:false, zapping:false };
}
function updateFlare(){
  if(!flare) return;
  flare.heading += (Math.random()-0.5)*0.012;
  flare.x+=Math.cos(flare.heading)*FLARE_SPEED; flare.y+=Math.sin(flare.heading)*FLARE_SPEED;
  if(flare.x>0&&flare.x<W&&flare.y>0&&flare.y<H) flare.entered=true;
  if(flare.entered && (flare.x<-FLARE_MARGIN||flare.x>W+FLARE_MARGIN||flare.y<-FLARE_MARGIN||flare.y>H+FLARE_MARGIN)){ flare=null; flareCd=COOL_FLARE; return; }
  const dx=flare.x-ship.x, dy=flare.y-ship.y;
  flare.zapping=false;
  if(!ship.godmode && ship.inv<=0 && dx*dx+dy*dy < FLARE_RING*FLARE_RING){
    flare.zapping=true;
    if(ship.overheat<=0){ toast='ZAPPED \u2014 WEAPONS OVERHEATED'; toastT=Math.max(toastT,50); shake=Math.max(shake,12); }
    ship.overheat=OVERHEAT_DUR;
  }
}

function spawnPulsar(){
  introduced.pulsar=true;
  const edge=Math.floor(Math.random()*4); let x,y;
  if(edge===0){x=Math.random()*W;y=-PULSAR_MARGIN;}
  else if(edge===1){x=W+PULSAR_MARGIN;y=Math.random()*H;}
  else if(edge===2){x=Math.random()*W;y=H+PULSAR_MARGIN;}
  else{x=-PULSAR_MARGIN;y=Math.random()*H;}
  const tx=W/2+(Math.random()-0.5)*260, ty=H/2+(Math.random()-0.5)*200;
  pulsar={ x,y, heading:Math.atan2(ty-y,tx-x), entered:false, burstCd:PULSAR_BURST_CD, burst:null, spin:0, holdVis:0 };
}
function pulsarPull(o,damp,mult){   // v2 gravity, mirrors the well within the danger radius
  const dx=pulsar.x-o.x, dy=pulsar.y-o.y, d=Math.sqrt(dx*dx+dy*dy)||1;
  if(d<PULSAR_R){ const s=GW_STR*mult*(1-d/PULSAR_R); o.vx+=dx/d*s; o.vy+=dy/d*s; if(damp){o.vx*=GW_DAMP;o.vy*=GW_DAMP;} }
}
function pulsarHit(){
  shake=Math.max(shake,16);
  const before=lives;
  firePulse();                                  // auto-fires if charged: rolls + increments backfire risk
  if(state!=='play' || lives<before) return;    // backfired & died/respawned — don't disable the fresh ship
  ship.disabled=PULSAR_DISABLE; ship.dspin=(Math.random()<0.5?-1:1)*0.035;
  hudZap(PULSAR_DISABLE);
  { const dx=ship.x-pulsar.x, dy=ship.y-pulsar.y, d=Math.sqrt(dx*dx+dy*dy)||1;  // jolt: erase momentum, shove gently outward
    ship.vx=dx/d*PULSAR_JOLT; ship.vy=dy/d*PULSAR_JOLT; }
  toast='SYSTEMS OFFLINE'; toastT=80;
}
function updatePulsar(){
  if(!pulsar) return;
  pulsar.spin += PULSAR_SPIN2;
  pulsar.heading += (Math.random()-0.5)*0.003;   // gentlest curve of the three
  pulsar.x += Math.cos(pulsar.heading)*PULSAR_SPEED; pulsar.y += Math.sin(pulsar.heading)*PULSAR_SPEED;
  const onScreen = pulsar.x>0&&pulsar.x<W&&pulsar.y>0&&pulsar.y<H;
  if(onScreen && !pulsar.entered){ pulsar.entered=true; pulsar.burstCd=PULSAR_FIRST_CD; }
  if(pulsar.entered && (pulsar.x<-PULSAR_MARGIN||pulsar.x>W+PULSAR_MARGIN||pulsar.y<-PULSAR_MARGIN||pulsar.y>H+PULSAR_MARGIN)){ pulsar=null; pulsarCd=COOL_PULSAR; return; }
  if(pulsar.entered && onScreen){                // bursts only while fully on screen; timer starts fresh on entry
    if(pulsar.burst){
      pulsar.burst.r += (PULSAR_R-pulsar.burst.r)*PULSAR_GROW;
      if(!pulsar.burst.hit && ship.inv<=0 && !ship.godmode && ship.disabled<=0){
        const dx=ship.x-pulsar.x, dy=ship.y-pulsar.y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<PULSAR_R && pulsar.burst.r>=d){ pulsar.burst.hit=true; pulsarHit(); }
      }
      if(pulsar.burst.r>PULSAR_R-2){ pulsar.burst=null; pulsar.holdVis=PULSAR_HOLD; }
      else {                           // repulse wave shoves rocks out + frees them from gravity for 5s
        for(const a of asteroids){ if(a.dead||a.gravImmune>0) continue;
          const dx=a.x-pulsar.x, dy=a.y-pulsar.y, d=Math.sqrt(dx*dx+dy*dy)||1;
          if(d<PULSAR_R && pulsar.burst.r>=d){ a.vx+=dx/d*PULSAR_REPULSE; a.vy+=dy/d*PULSAR_REPULSE; a.gravImmune=PULSAR_GRAVIMMUNE; }
        }
      }
    } else if(--pulsar.burstCd<=0){ pulsar.burst={r:0,hit:false}; pulsar.burstCd=PULSAR_BURST_CD; }
    if(pulsar.holdVis>0) pulsar.holdVis--;
  }
  if(pulsar && pulsar.entered){   // cycle gravity: 0 / .5 / 1 / 1.5 gw across the 4s
    const g=PULSAR_GW[pulsar.burstCd>180?0:pulsar.burstCd>120?1:pulsar.burstCd>60?2:3];
    if(g>0){ pulsarPull(ship,false,g*PULSAR_SHIP_GW);
      for(const a of asteroids){ if(!(a.gravImmune>0)) pulsarPull(a,true,g*PULSAR_AST_GW); } }
  }
}

function hazCount(){ return (well?1:0)+(flare?1:0)+(pulsar?1:0)+(comet?1:0)+((warn&&!warn.spawned)?1:0); }
function beginWarn(t,p){ const c=HAZ_WARN[t]; warn={type:t,text:c.text,col:c.col,timer:c.dur,dur:c.dur,pre:c.pre,spawned:false,p:p||null}; }
function hazReady(){ return !warn && warnCd<=0 && hazCount()<HAZ_CAP; }
function beginHazard(t){        // starts the label; the hazard itself arrives per its own timing
  if(!hazReady()) return false;
  introduced[t]=true;
  beginWarn(t, t==='comet'?cometParams():null);
  return true;
}
function hazSpawn(t){
  if(t==='well') spawnWell();
  else if(t==='flare') spawnFlare();
  else if(t==='pulsar') spawnPulsar();
  else if(t==='comet') spawnComet(warn?warn.p:null);
}
function hazTick(){             // one warning at a time, 1s gap before anything new can trigger
  if(warn){
    warn.timer--;
    if(!warn.spawned && warn.timer<=warn.dur-warn.pre){ warn.spawned=true; hazSpawn(warn.type); }
    if(warn.timer<=0){ warn=null; warnCd=60; }
  } else if(warnCd>0) warnCd--;
}

function introTick(){           // guarantees each hazard debuts the first wave it's eligible
  if(!M.hazards) return;
  const elig = wave>=7&&!introduced.well?'well' : wave>=9&&!introduced.flare?'flare'
             : wave>=13&&!introduced.pulsar?'pulsar' : wave>=15&&!introduced.comet?'comet' : null;
  if(elig!==introWhich){ introWhich=elig; introTimer=-1; }  // new target; wait for first damage
  if(introWhich && introTimer>0 && --introTimer<=0){
    introTimer = beginHazard(introWhich) ? -1 : 60;   // blocked by a live label? try again in 1s
  }
}

function cometParams(){
  const edge=Math.floor(Math.random()*4); let x,y;
  if(edge===0){x=Math.random()*W;y=-COMET_MARGIN;}
  else if(edge===1){x=W+COMET_MARGIN;y=Math.random()*H;}
  else if(edge===2){x=Math.random()*W;y=H+COMET_MARGIN;}
  else{x=-COMET_MARGIN;y=Math.random()*H;}
  const tx=W/2+(Math.random()-0.5)*W*0.5, ty=H/2+(Math.random()-0.5)*H*0.5;
  const ang=Math.atan2(ty-y,tx-x);
  return { x, y, vx:Math.cos(ang)*COMET_SPEED, vy:Math.sin(ang)*COMET_SPEED, id:Date.now() };
}
function spawnComet(p){
  introduced.comet=true;
  p=p||cometParams();
  comet={ x:p.x, y:p.y, vx:p.vx, vy:p.vy, entered:false, id:p.id };
}
function cometShatter(a){      // wrecking ball: pulverises straight to rocklets, no score/drops/stats
  if(a.dead) return; a.dead=true;
  burst(a.x,a.y, a.iron?'180,210,255':'150,200,255', a.tier>=3?20:12);
  const n=Math.pow(2,a.tier);   // tier3 -> 8 rocklets, tier2 -> 4, tier1 -> 2
  for(let k=0;k<n && asteroids.length<MAXROCKS;k++){
    const ang=Math.random()*6.28, sp=1.1+Math.random()*1.4;
    const c=makeRock(a.x,a.y,0,a.iron,Math.cos(ang)*sp,Math.sin(ang)*sp,false);
    c.shatterBy=comet?comet.id:-1;   // this comet can't re-hit what it just made
    asteroids.push(c);
  }
}
function updateComet(){
  if(!comet) return;
  comet.x+=comet.vx; comet.y+=comet.vy;
  if(comet.x>0&&comet.x<W&&comet.y>0&&comet.y<H) comet.entered=true;
  if(comet.entered && (comet.x<-COMET_MARGIN||comet.x>W+COMET_MARGIN||comet.y<-COMET_MARGIN||comet.y>H+COMET_MARGIN)){ comet=null; cometCd=COOL_COMET; return; }
  particles.push({x:comet.x+(Math.random()-0.5)*8, y:comet.y+(Math.random()-0.5)*8,
    vx:-comet.vx*0.2+(Math.random()-0.5), vy:-comet.vy*0.2+(Math.random()-0.5), life:0.7, c:'150,225,255'});
  const len=asteroids.length;
  for(let i=0;i<len;i++){ const a=asteroids[i]; if(a.dead||a.shatterBy===comet.id) continue;
    const dx=a.x-comet.x, dy=a.y-comet.y, rr=COMET_R+a.r;
    if(dx*dx+dy*dy<rr*rr) cometShatter(a);
  }
  if(ship.inv<=0 && !ship.godmode){
    const dx=ship.x-comet.x, dy=ship.y-comet.y, rr=COMET_R+ship.r;
    if(dx*dx+dy*dy<rr*rr) killShip();
  }
}

function menuTick(){            // title background: leftover debris drifts away, then a lone pulsar wanders in
  asteroids.forEach(a=>{ a.x+=a.vx; a.y+=a.vy; a.rot+=a.spin; });
  asteroids=asteroids.filter(a=>a.x>-80 && a.x<W+80 && a.y>-80 && a.y<H+80);  // no wrap: they leave for good
  if(well){ well.x+=Math.cos(well.heading)*GW_SPEED; well.y+=Math.sin(well.heading)*GW_SPEED;
    if(well.x<-GW_MARGIN||well.x>W+GW_MARGIN||well.y<-GW_MARGIN||well.y>H+GW_MARGIN) well=null; }
  if(flare){ flare.x+=Math.cos(flare.heading)*FLARE_SPEED; flare.y+=Math.sin(flare.heading)*FLARE_SPEED; flare.zapping=false;
    if(flare.x<-FLARE_MARGIN||flare.x>W+FLARE_MARGIN||flare.y<-FLARE_MARGIN||flare.y>H+FLARE_MARGIN) flare=null; }
  if(comet){ comet.x+=comet.vx; comet.y+=comet.vy;
    if(comet.x<-COMET_MARGIN||comet.x>W+COMET_MARGIN||comet.y<-COMET_MARGIN||comet.y>H+COMET_MARGIN) comet=null; }
  warn=null;
  if(pulsar){
    pulsar.spin+=0.03;
    pulsar.x+=Math.cos(pulsar.heading)*PULSAR_SPEED; pulsar.y+=Math.sin(pulsar.heading)*PULSAR_SPEED;
    if(pulsar.x>0&&pulsar.x<W&&pulsar.y>0&&pulsar.y<H) pulsar.entered=true;
    if(pulsar.entered && (pulsar.x<-PULSAR_MARGIN||pulsar.x>W+PULSAR_MARGIN||pulsar.y<-PULSAR_MARGIN||pulsar.y>H+PULSAR_MARGIN)){ pulsar=null; menuIdle=0; }
    else if(pulsar.entered){
      if(pulsar.burst){ pulsar.burst.r+=(PULSAR_R-pulsar.burst.r)*PULSAR_GROW; if(pulsar.burst.r>PULSAR_R-2) pulsar.burst=null; }
      else if(--pulsar.burstCd<=0){ pulsar.burst={r:0,hit:false}; pulsar.burstCd=PULSAR_BURST_CD; }
    }
  } else if(asteroids.length===0 && !well && !flare && !comet){   // sky is clear: count down to the next pulsar
    if(++menuIdle>=menuWait){ spawnPulsar(); menuIdle=0; menuWait=1200; }
  } else menuIdle=0;
}
function update(){
  if(state==='menu'){ menuTick(); return; }
  if(state==='play'){
    if(ship.disabled>0){
      ship.a += ship.dspin;          // helpless drift-spin
      ship.disabled--;
    } else {
    if(keys.ArrowLeft||keys.a) ship.a-=0.07;
    if(keys.ArrowRight||keys.d) ship.a+=0.07;
    const hasFuel = !M.fuel || ship.fuel>0;
    if((keys.ArrowUp||keys.w) && hasFuel){
      ship.vx+=Math.cos(ship.a)*0.16; ship.vy+=Math.sin(ship.a)*0.16;
      if(M.fuel) ship.fuel=Math.max(0,ship.fuel-1.6);
      if(Math.random()<0.7) particles.push({x:ship.x-Math.cos(ship.a)*ship.r,y:ship.y-Math.sin(ship.a)*ship.r,
        vx:-Math.cos(ship.a)*2+(Math.random()-0.5),vy:-Math.sin(ship.a)*2+(Math.random()-0.5),life:0.6,c:'255,170,60'});
    }
    if(keys[' ']) fire();
    }
    ship.vx*=0.992; ship.vy*=0.992;
    ship.x+=ship.vx; ship.y+=ship.vy;
    if(ship.x<0)ship.x+=W; if(ship.x>W)ship.x-=W; if(ship.y<0)ship.y+=H; if(ship.y>H)ship.y-=H;
    if(ship.cool>0)ship.cool--; if(ship.inv>0)ship.inv--; if(ship.overheat>0)ship.overheat--;
    if(wellCd>0)wellCd--; if(flareCd>0)flareCd--; if(pulsarCd>0)pulsarCd--; if(cometCd>0)cometCd--; if(pulseCd>0)pulseCd--; hudTick();
    if(comboTimer>0){comboTimer--; if(comboTimer===0)combo=1;}
    if(toastT>0)toastT--;
    while(score>=nextExtra){ nextExtra+=M.extraEvery; lifePending++; }
    if(M.survival){ survTime++; survivalSpawn(); }
  }
  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;});  bullets=bullets.filter(b=>b.life>0 && b.x>=-70 && b.x<=W+70 && b.y>=-70 && b.y<=H+70);
  asteroids.forEach(a=>{a.x+=a.vx;a.y+=a.vy;a.rot+=a.spin; if(a.hit>0)a.hit--; if(a.gravImmune>0)a.gravImmune--;
    if(a.shielded){ if(a.shieldCd>0) a.shieldCd--; else if(a.shield<a.shieldMax){ a.shield++; a.shieldCd=SHIELD_REGEN_TICK; } }
    if(M.survival){ if(a.x<-60||a.x>W+60||a.y<-60||a.y>H+60) a.dead=true; }
    else { if(a.x<-50)a.x=W+50;if(a.x>W+50)a.x=-50;if(a.y<-50)a.y=H+50;if(a.y>H+50)a.y=-50; }});
  if(state==='play'){ applyWell(); updateFlare(); updatePulsar(); updateComet(); introTick(); hazTick(); }
  // bullet vs asteroid (primary hit + power cleave)
  for(let j=bullets.length-1;j>=0;j--){
    const b=bullets[j];
    let hit=-1;
    for(let i=0;i<asteroids.length;i++){
      const a=asteroids[i]; if(a.dead) continue;
      const dx=a.x-b.x,dy=a.y-b.y,rr=a.r+b.r;
      if(dx*dx+dy*dy<rr*rr){ hit=i; break; }
    }
    if(hit<0) continue;
    const len=asteroids.length, a=asteroids[hit];
    stats.hits++;
    if(damageRock(a,b.dmg)) breakRock(a);
    let n=b.dmg-1; // cleave targets = power level; flat 1 dmg each (chips iron/shield, kills normals)
    for(let k=0;k<len && n>0;k++){
      const c=asteroids[k]; if(c===a||c.dead) continue;
      const cx=c.x-a.x, cy=c.y-a.y;
      if(cx*cx+cy*cy < CLEAVE_R*CLEAVE_R){ if(damageRock(c,1)) breakRock(c); n--; }
    }
    bullets.splice(j,1);
  }
  asteroids=asteroids.filter(a=>!a.dead);
  // ship vs asteroid
  if(state==='play'&&ship.inv<=0&&!ship.godmode){
    for(const a of asteroids){const dx=a.x-ship.x,dy=a.y-ship.y;
      if(dx*dx+dy*dy<(a.r+ship.r)*(a.r+ship.r)){ killShip(); break; }
    }
  }
  if(state==='play'&&!M.survival&&asteroids.length===0) nextWave();
  // powerups
  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];
    p.x+=p.vx;p.y+=p.vy;p.life--;p.pulse+=0.12;
    if(p.x<0)p.x+=W;if(p.x>W)p.x-=W;if(p.y<0)p.y+=H;if(p.y>H)p.y-=H;
    const dx=p.x-ship.x,dy=p.y-ship.y;
    if(state==='play'&&dx*dx+dy*dy<(ship.r+12)*(ship.r+12)){
      if(p.type==='pulse'){
        if(!ship.pulse){ ship.pulse=true; toast='PULSE ARMED'; toastT=70;
          burst(p.x,p.y,PCOL.pulse,16); powerups.splice(i,1); shake=4; }
        // while charged: not collectible — leave it floating
        continue;
      }
      if(p.type==='score'){ const val=Math.round((250+wave*25)*scoreMult()); score+=val; toast='+'+val; toastT=70;
        burst(p.x,p.y,PCOL.score,18); powerups.splice(i,1); shake=3; continue; }
      if(p.type==='life'){ lives++; toast='+1 SHIP'; toastT=90;
        burst(p.x,p.y,PCOL.life,24); powerups.splice(i,1); shake=5; continue; }
      if(p.type==='fuel'){ ship.fuel=MAXFUEL; score+=Math.round(50*scoreMult()); toast='FUEL FULL'; }
      else {
        const cap=M.caps[p.type];
        score+=Math.round(100*scoreMult());              // silent: scored but not shown
        if(M.fuel) ship.fuel=Math.min(MAXFUEL, ship.fuel+MAXFUEL*0.15);
        if(ship.up[p.type]<cap){ ship.up[p.type]++; toast=p.type.toUpperCase()+' UP'; }
        else { toast=p.type.toUpperCase()+' MAX'; }
      }
      burst(p.x,p.y,PCOL[p.type],16); toastT=70; powerups.splice(i,1); shake=4; continue;
    }
    if(p.life<=0) powerups.splice(i,1);
  }
  shocks.forEach(s=>{ s.r += (PULSE_R-s.r)*0.25; s.life-=0.06; });
  shocks=shocks.filter(s=>s.life>0);
  shipDebris.forEach(d=>{ d.x+=d.vx; d.y+=d.vy; d.vx*=0.985; d.vy*=0.985; d.a+=d.spin; d.life-=0.028; });
  shipDebris=shipDebris.filter(d=>d.life>0);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=0.95;p.vy*=0.95;p.life-=0.025;});
  particles=particles.filter(p=>p.life>0);
  if(shake>0)shake*=0.85;
}

function drawRock(a){
  ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);
  if(a.tier>=3){ // giant: faint outer halo so its mass reads at a glance
    ctx.beginPath();
    a.shape.forEach((m,i)=>{const ang=i/a.shape.length*6.28;const px=Math.cos(ang)*a.r*m*1.12,py=Math.sin(ang)*a.r*m*1.12;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);});
    ctx.closePath(); ctx.strokeStyle=a.iron?'rgba(174,188,205,0.22)':'rgba(126,155,216,0.22)';
    ctx.lineWidth=6; ctx.stroke();
  }
  ctx.beginPath();
  a.shape.forEach((m,i)=>{const ang=i/a.shape.length*6.28;const px=Math.cos(ang)*a.r*m,py=Math.sin(ang)*a.r*m;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);});
  ctx.closePath();
  let fill, stroke;
  if(a.iron){ fill = a.hp<a.maxHp ? '#3a2e28' : '#2c3340'; stroke = a.hp<a.maxHp ? '#e0a060' : '#aebccd'; }
  else { fill='#1a2238'; stroke='#5e7bb8'; }
  if(a.hit>0){ fill='#56607a'; stroke='#dfe9ff'; }
  ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle=stroke;
  ctx.lineWidth=(a.tier>=3?3:a.iron?2.2:1.5); ctx.stroke();
  if(a.iron){ // inner plating ring
    ctx.beginPath();
    a.shape.forEach((m,i)=>{const ang=i/a.shape.length*6.28;const px=Math.cos(ang)*a.r*m*0.6,py=Math.sin(ang)*a.r*m*0.6;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);});
    ctx.closePath(); ctx.strokeStyle=stroke; ctx.lineWidth=1; ctx.globalAlpha=0.5; ctx.stroke(); ctx.globalAlpha=1;
  }
  if(a.shielded && a.shield>0){
    let sa=0.2+0.55*(a.shield/a.shieldMax);
    if(a.shieldCd<=0 && a.shield<a.shieldMax) sa*=0.55+0.45*Math.abs(Math.sin(Date.now()/120)); // recharge shimmer
    const rr=a.r*1.32;
    ctx.strokeStyle=`rgba(120,220,255,${sa})`; ctx.lineWidth=2; ctx.beginPath();
    for(let h=0;h<6;h++){const ang=h/6*6.28, hx=Math.cos(ang)*rr, hy=Math.sin(ang)*rr; h===0?ctx.moveTo(hx,hy):ctx.lineTo(hx,hy);}
    ctx.closePath(); ctx.stroke();
  }
  ctx.restore();
}

function draw(){
  ctx.fillStyle='#05060d'; ctx.fillRect(0,0,W,H);
  const sx=(Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
  ctx.save(); ctx.translate(sx,sy);
  stars.forEach(s=>{ s.x-=ship.vx*s.z*0.15; s.y-=ship.vy*s.z*0.15;
    if(s.x<0)s.x+=W;if(s.x>W)s.x-=W;if(s.y<0)s.y+=H;if(s.y>H)s.y-=H;
    let dxs=s.x, dys=s.y;
    if(well){ const ddx=s.x-well.x, ddy=s.y-well.y, dd=Math.sqrt(ddx*ddx+ddy*ddy);
      if(dd<GW_R*1.3 && dd>1){ const ang=0.9*(1-dd/(GW_R*1.3)), ca=Math.cos(ang), sa=Math.sin(ang);
        dxs=well.x+ddx*ca-ddy*sa; dys=well.y+ddx*sa+ddy*ca; } }
    ctx.fillStyle=`rgba(180,200,255,${s.z*0.7})`; ctx.fillRect(dxs,dys,s.z*1.8,s.z*1.8); });
  if(well){
    ctx.strokeStyle='rgba(150,110,200,0.18)'; ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(well.x,well.y,GW_R,0,6.28);ctx.stroke();
    const g=ctx.createRadialGradient(well.x,well.y,2,well.x,well.y,46);
    g.addColorStop(0,'rgba(18,4,38,1)'); g.addColorStop(0.4,'rgba(90,40,160,0.5)');
    g.addColorStop(0.7,'rgba(150,90,220,0.22)'); g.addColorStop(1,'rgba(150,90,220,0)');
    ctx.fillStyle=g; ctx.beginPath();ctx.arc(well.x,well.y,46,0,6.28);ctx.fill();
    ctx.strokeStyle='rgba(205,165,255,0.85)'; ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(well.x,well.y,9,0,6.28);ctx.stroke();
    ctx.fillStyle='#05030a'; ctx.beginPath();ctx.arc(well.x,well.y,8,0,6.28);ctx.fill();
  }
  if(flare){
    ctx.strokeStyle='rgba(255,110,50,0.28)'; ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(flare.x,flare.y,FLARE_RING,0,6.28);ctx.stroke();
    const g=ctx.createRadialGradient(flare.x,flare.y,2,flare.x,flare.y,FLARE_R*2);
    g.addColorStop(0,'rgba(255,205,90,0.95)'); g.addColorStop(0.4,'rgba(255,110,40,0.55)');
    g.addColorStop(0.75,'rgba(220,60,30,0.22)'); g.addColorStop(1,'rgba(220,60,30,0)');
    ctx.fillStyle=g; ctx.beginPath();ctx.arc(flare.x,flare.y,FLARE_R*2,0,6.28);ctx.fill();
    const fl=0.6+0.4*Math.abs(Math.sin(Date.now()/90));
    ctx.fillStyle=`rgba(255,${(180+Math.random()*50)|0},70,${fl})`;
    ctx.beginPath();ctx.arc(flare.x,flare.y,FLARE_R*0.7,0,6.28);ctx.fill();
    if(flare.zapping){
      ctx.strokeStyle=`rgba(255,210,110,${0.7+0.3*Math.random()})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(flare.x,flare.y);
      for(let i=1;i<5;i++){ ctx.lineTo(flare.x+(ship.x-flare.x)*(i/5)+(Math.random()-0.5)*18, flare.y+(ship.y-flare.y)*(i/5)+(Math.random()-0.5)*18); }
      ctx.lineTo(ship.x,ship.y); ctx.stroke();
    }
  }
  if(pulsar){
    if(pulsar.burst){
      const br=pulsar.burst.r;
      const t=br/PULSAR_R, a=Math.max(0,1-Math.pow(t,2.6));   // holds brightness, falls off late
      ctx.strokeStyle=`rgba(150,235,255,${0.30+0.62*a})`; ctx.lineWidth=2.4+2.2*t;  // thickens as it slows
      ctx.beginPath();ctx.arc(pulsar.x,pulsar.y,br,0,6.28);ctx.stroke();
      ctx.strokeStyle=`rgba(220,250,255,${0.34*a})`; ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(pulsar.x,pulsar.y,br*0.8,0,6.28);ctx.stroke();
    } else if(pulsar.holdVis>0){        // visual-only: ring lingers a beat at full range
      const h=pulsar.holdVis/PULSAR_HOLD;
      ctx.strokeStyle=`rgba(150,235,255,${0.30*h})`; ctx.lineWidth=4.6;
      ctx.beginPath();ctx.arc(pulsar.x,pulsar.y,PULSAR_R,0,6.28);ctx.stroke();
    }
    const charge = pulsar.burstCd<120 ? (120-pulsar.burstCd)/120 : 0;   // 0->1 over the last 2s before a burst
    let glowR = 30 - charge*15, glowA = 1 - charge*0.45;                 // cloud contracts + fades as mass accretes inward
    if(pulsar.burst){ const bp=1-Math.min(1,pulsar.burst.r/48); glowR=Math.max(glowR,30+bp*20); glowA=Math.max(glowA,0.7+bp*0.3); } // re-expanded cloud on burst
    const g=ctx.createRadialGradient(pulsar.x,pulsar.y,1,pulsar.x,pulsar.y,glowR);
    g.addColorStop(0,'rgba(228,250,255,0.95)'); g.addColorStop(0.4,'rgba(90,200,255,0.6)');
    g.addColorStop(0.75,'rgba(40,120,220,0.22)'); g.addColorStop(1,'rgba(40,120,220,0)');
    ctx.save(); ctx.globalAlpha=glowA; ctx.fillStyle=g; ctx.beginPath();ctx.arc(pulsar.x,pulsar.y,glowR,0,6.28);ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(pulsar.x,pulsar.y); ctx.rotate(pulsar.spin);
    ctx.strokeStyle='rgba(170,235,255,0.45)'; ctx.lineWidth=2;
    for(let i=0;i<4;i++){ ctx.rotate(Math.PI/2); ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(24,0);ctx.stroke(); }
    ctx.restore();
    let coreR=Math.max(2, 6 - charge*4);
    let cf=Math.min(1, 0.6 + 0.45*charge + 0.18*Math.abs(Math.sin(Date.now()/70)));
    if(pulsar.burst && pulsar.burst.r<26) coreR=11;                      // pop on fresh burst
    if(!pulsar.burst && pulsar.burstCd<=PULSAR_FLASHLEAD && pulsar.entered){
      const f=pulsar.burstCd/PULSAR_FLASHLEAD, i=1-f;                   // 0 -> 1 over the final 0.15s
      const fr=10.4+i*4;
      const fg=ctx.createRadialGradient(pulsar.x,pulsar.y,0.5,pulsar.x,pulsar.y,fr);
      fg.addColorStop(0,`rgba(255,255,255,${0.55+0.45*i})`);
      fg.addColorStop(0.45,`rgba(215,248,255,${0.30+0.42*i})`);
      fg.addColorStop(1,'rgba(180,235,255,0)');
      ctx.fillStyle=fg; ctx.beginPath();ctx.arc(pulsar.x,pulsar.y,fr,0,6.28);ctx.fill();
    }
    ctx.fillStyle=`rgba(238,252,255,${cf})`; ctx.beginPath();ctx.arc(pulsar.x,pulsar.y,coreR,0,6.28);ctx.fill();
  }
  particles.forEach(p=>{ctx.fillStyle=`rgba(${p.c},${p.life})`; ctx.fillRect(p.x-1.5,p.y-1.5,3,3);});
  bullets.forEach(b=>{ctx.fillStyle='#bfe0ff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.28);ctx.fill();});
  asteroids.forEach(drawRock);
  if(comet){
    const tl=50, ux=comet.vx/COMET_SPEED, uy=comet.vy/COMET_SPEED;
    const g=ctx.createLinearGradient(comet.x,comet.y,comet.x-ux*tl,comet.y-uy*tl);
    g.addColorStop(0,'rgba(185,238,255,0.65)'); g.addColorStop(1,'rgba(140,220,255,0)');
    ctx.strokeStyle=g; ctx.lineWidth=COMET_R*1.5; ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(comet.x,comet.y);ctx.lineTo(comet.x-ux*tl,comet.y-uy*tl);ctx.stroke(); ctx.lineCap='butt';
    const rg=ctx.createRadialGradient(comet.x,comet.y,1,comet.x,comet.y,COMET_R*1.7);
    rg.addColorStop(0,'rgba(236,252,255,0.95)'); rg.addColorStop(0.5,'rgba(150,222,255,0.6)'); rg.addColorStop(1,'rgba(120,200,255,0)');
    ctx.fillStyle=rg; ctx.beginPath();ctx.arc(comet.x,comet.y,COMET_R*1.7,0,6.28);ctx.fill();
    ctx.fillStyle='rgba(246,253,255,0.95)'; ctx.beginPath();ctx.arc(comet.x,comet.y,COMET_R*0.5,0,6.28);ctx.fill();
  }
  // hull debris from a pulse backfire
  shipDebris.forEach(d=>{
    ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.a);
    ctx.strokeStyle=`rgba(159,196,255,${Math.min(1,d.life)})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(d.p1[0],d.p1[1]); ctx.lineTo(d.p2[0],d.p2[1]); ctx.stroke();
    ctx.restore();
  });
  // shockwave rings
  shocks.forEach(s=>{
    ctx.strokeStyle=`rgba(200,225,255,${s.life})`; ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.stroke();
    ctx.strokeStyle=`rgba(235,245,255,${s.life*0.5})`; ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*0.7,0,6.28);ctx.stroke();
  });
  powerups.forEach(p=>{
    const fade=p.life<90?p.life/90:1, col=PCOL[p.type];
    if(p.type==='pulse'){
      const grab = !ship.pulse, a = (grab?1:0.35)*fade, sz=11+Math.sin(p.pulse)*3;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.pulse*0.4);
      ctx.strokeStyle=`rgba(${col},${a})`;ctx.lineWidth=2;
      ctx.fillStyle=`rgba(${col},${0.15*a})`;
      ctx.beginPath();
      for(let k=0;k<8;k++){const ang=k/8*6.28,rad=k%2?sz*0.5:sz;
        const px=Math.cos(ang)*rad,py=Math.sin(ang)*rad; k===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
      ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
      ctx.fillStyle=`rgba(${col},${a})`;ctx.font='bold 12px Courier New';ctx.textAlign='center';
      ctx.fillText(PCHAR.pulse,p.x,p.y+4);
      return;
    }
    if(p.type==='life'){
      const ring=14+Math.sin(p.pulse*1.4)*2.5;
      ctx.save();ctx.translate(p.x,p.y);
      ctx.strokeStyle=`rgba(${col},${0.55*fade})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(0,0,ring,0,6.28);ctx.stroke();
      ctx.rotate(-Math.PI/2);
      ctx.fillStyle=`rgba(${col},${0.28*fade})`;ctx.strokeStyle=`rgba(${col},${fade})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-6,6);ctx.lineTo(-3,0);ctx.lineTo(-6,-6);ctx.closePath();
      ctx.fill();ctx.stroke();
      ctx.restore();
      return;
    }
    if(p.type==='score'){
      const sz=10+Math.sin(p.pulse)*2;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.pulse*0.5);
      ctx.fillStyle=`rgba(${col},${0.25*fade})`; ctx.strokeStyle=`rgba(${col},${fade})`; ctx.lineWidth=2;
      ctx.beginPath();
      for(let k=0;k<10;k++){const ang=k/10*6.28-Math.PI/2, rad=k%2?sz*0.45:sz;
        const gx=Math.cos(ang)*rad, gy=Math.sin(ang)*rad; k===0?ctx.moveTo(gx,gy):ctx.lineTo(gx,gy);}
      ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
      ctx.fillStyle=`rgba(${col},${fade})`;ctx.font='bold 10px Courier New';ctx.textAlign='center';
      ctx.fillText('$',p.x,p.y+4);
      return;
    }
    const sz=9+Math.sin(p.pulse)*2;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.PI/4);
    ctx.strokeStyle=`rgba(${col},${fade})`;ctx.lineWidth=2;ctx.fillStyle=`rgba(${col},${0.18*fade})`;
    ctx.beginPath();ctx.rect(-sz,-sz,sz*2,sz*2);ctx.fill();ctx.stroke();ctx.restore();
    ctx.fillStyle=`rgba(${col},${fade})`;ctx.font='bold 11px Courier New';ctx.textAlign='center';
    ctx.fillText(PCHAR[p.type],p.x,p.y+4);
  });
  if(state==='play'||state==='over'){
    if(!(ship.inv>0&&Math.floor(ship.inv/5)%2)){
      ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.a);
      ctx.beginPath();ctx.moveTo(ship.r,0);ctx.lineTo(-ship.r*0.8,ship.r*0.7);
      ctx.lineTo(-ship.r*0.4,0);ctx.lineTo(-ship.r*0.8,-ship.r*0.7);ctx.closePath();
      ctx.fillStyle='#0d1426';ctx.fill();ctx.strokeStyle=ship.disabled>0?'#7fe6ff':ship.overheat>0?'#ff7a3a':'#9fc4ff';ctx.lineWidth=2;ctx.stroke();ctx.restore();
      if(ship.disabled>0){
        ctx.strokeStyle=`rgba(150,235,255,${0.55+0.4*Math.random()})`; ctx.lineWidth=1.5;
        for(let b=0;b<3;b++){
          ctx.beginPath();
          let ax=ship.x+(Math.random()-0.5)*ship.r*2, ay=ship.y+(Math.random()-0.5)*ship.r*2;
          ctx.moveTo(ax,ay);
          for(let s=0;s<3;s++){ ax+=(Math.random()-0.5)*16; ay+=(Math.random()-0.5)*16; ctx.lineTo(ax,ay); }
          ctx.stroke();
        }
      }
    }
  }
  ctx.restore();

  if(state==='menu') return;

  ctx.fillStyle='#8fb8ff';ctx.font='16px Courier New';ctx.textAlign='left';
  const gp = hudGlitch>0 ? (hudBlackedOut() ? 1 : Math.pow(1-hudRecovery(),0.55)) : 0;
  if(!hudBlackedOut() && hudOn){
  const r=bests[mode];
  if(M.survival){
    ctx.fillText(glitchStr('TIME '+fmtTime(survTime),gp),18,30);
    ctx.fillStyle='#56688f';ctx.font='12px Courier New';
    ctx.fillText(glitchStr('BEST '+fmtTime(r.score),gp),18,50);
  } else {
    ctx.fillText(glitchStr('SCORE '+score,gp),18,30);
    const heldW=ship.up.rapid+ship.up.power+ship.up.twin;
    if(M.dimScore && heldW>0){ const sw=ctx.measureText('SCORE '+score).width;
      ctx.save(); ctx.fillStyle='#ffb060'; ctx.font='13px Courier New';
      ctx.fillText(glitchStr('\u00d7'+scoreMult().toFixed(2),gp),18+sw+12,30); ctx.restore();
      ctx.fillStyle='#8fb8ff'; ctx.font='16px Courier New'; }
    ctx.fillText(glitchStr('WAVE '+wave,gp),18,52);
    ctx.fillStyle='#56688f';ctx.font='12px Courier New';
    ctx.fillText(glitchStr('BEST '+Math.max(r.score,score)+'  W'+Math.max(r.wave,wave),gp),18,72);
  }
  ctx.fillStyle = mode==='ridiculous' ? '#ff78dc' : '#56688f'; ctx.font='12px Courier New';
  ctx.fillText(glitchStr(M.label,gp),18,M.survival?68:90);
  if(M.drops){
    const pr=Math.round(pulseRisk*100);
    if(pulseCd>0 && ship.pulse){
      const chg=Math.round((1-pulseCd/PULSE_CD)*100);
      ctx.fillStyle='#7fa0cc';
      ctx.fillText(glitchStr('PULSE \u2726 charging '+chg+'%',gp),18,110);
    } else {
      ctx.fillStyle = ship.pulse ? '#cfe6ff' : '#3c4a63';
      ctx.fillText(glitchStr(ship.pulse?('PULSE \u2726 '+pr+'% shift/0'):('PULSE \u2014  next '+pr+'%'),gp),18,110);
    }
  }
  }
  if(!hudBlackedOut() && hudOn){
  ctx.textAlign='right';
  ctx.fillStyle='#8fb8ff';ctx.font='16px Courier New';
  ctx.fillText(glitchStr('SHIPS '+Math.max(lives,0),gp),W-18,30);
  if(combo>1){ctx.fillStyle=`rgba(255,${200-combo*10},80,1)`;ctx.fillText(glitchStr('x'+combo,gp),W-18,52);}
  if(M.drops){
    const u=ship.up, parts=[];
    if(u.rapid)parts.push('R'+u.rapid); if(u.power)parts.push('P'+u.power);
    if(u.twin)parts.push(u.twin>=3?'FAN':u.twin===2?'TRI':'TWIN');
    if(parts.length){ctx.fillStyle='#ff78dc';ctx.font='12px Courier New';ctx.fillText(glitchStr(parts.join(' '),gp),W-18,72);}
  }
  ctx.fillStyle='#cfe6ff';ctx.font='12px Courier New';ctx.textAlign='right';
  ctx.fillText(glitchStr('ROCKS '+asteroids.length,gp),W-18,92);
  }
  if(toastT>0){ ctx.fillStyle=`rgba(170,220,255,${Math.min(1,toastT/30)})`;
    ctx.font='18px Courier New';ctx.textAlign='center';ctx.fillText(toast,W/2,80); }
  if(warn && warn.type!=='comet'){ const fl=0.5+0.5*Math.abs(Math.sin(Date.now()/250));
    ctx.fillStyle=`rgba(${warn.col},${fl})`;
    ctx.font='13px Courier New';ctx.textAlign='center';ctx.fillText(warn.text,W/2,104); }
  if(ship.overheat>0){
    const f=ship.overheat/OVERHEAT_DUR;
    ctx.fillStyle=`rgba(255,120,60,${0.6+0.4*Math.abs(Math.sin(Date.now()/100))})`;
    ctx.font='13px Courier New';ctx.textAlign='center';ctx.fillText('\u26a0 WEAPONS OVERHEATED \u2014 pulse still works',W/2,124);
    const bw=150,bx=W/2-bw/2;
    ctx.strokeStyle='rgba(255,120,60,0.5)';ctx.lineWidth=1;ctx.strokeRect(bx,130,bw,5);
    ctx.fillStyle='rgba(255,120,60,0.85)';ctx.fillRect(bx+1,131,(bw-2)*f,3);
  }
  if(ship.disabled>0){
    const el = PULSAR_DISABLE - ship.disabled;          // elapsed frames since hit (0..150)
    ctx.textAlign='center';
    if(el>=30){
      const pct = Math.min(100, Math.round((el-30)/120*100));
      ctx.fillStyle='rgba(150,235,255,0.92)'; ctx.font='15px Courier New';
      ctx.fillText('REBOOTING SYSTEMS, PLEASE STAND BY... '+pct+'%', W/2, H/2-46);
      const bw=200,bx=W/2-bw/2;
      ctx.strokeStyle='rgba(150,235,255,0.5)';ctx.lineWidth=1;ctx.strokeRect(bx,H/2-38,bw,6);
      ctx.fillStyle='rgba(150,235,255,0.85)';ctx.fillRect(bx+1,H/2-37,(bw-2)*pct/100,4);
    } else {
      ctx.fillStyle=`rgba(150,235,255,${0.5+0.5*Math.random()})`; ctx.font='16px Courier New';
      ctx.fillText('\u26a1 SYSTEMS OFFLINE', W/2, H/2-46);
    }
  }
  if(warn && warn.type==='comet' && !warn.spawned && warn.p){
    const cx=W/2, cy=H/2, ang=Math.atan2(warn.p.y-cy,warn.p.x-cx), dx=Math.cos(ang), dy=Math.sin(ang), m=54;
    let t=Infinity;
    if(dx>0.0001) t=Math.min(t,(W-m-cx)/dx); else if(dx<-0.0001) t=Math.min(t,(m-cx)/dx);
    if(dy>0.0001) t=Math.min(t,(H-m-cy)/dy); else if(dy<-0.0001) t=Math.min(t,(m-cy)/dy);
    const ex=cx+dx*t, ey=cy+dy*t, fl=0.5+0.5*Math.abs(Math.sin(Date.now()/120));
    ctx.save();ctx.translate(ex,ey);ctx.rotate(ang);
    ctx.fillStyle=`rgba(185,238,255,${fl})`;
    ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-10,-10);ctx.lineTo(-10,10);ctx.closePath();ctx.fill();
    ctx.restore();
    ctx.fillStyle=`rgba(185,238,255,${fl})`; ctx.font='12px Courier New'; ctx.textAlign='center';
    ctx.fillText(warn.text, cx+dx*(t-72), cy+dy*(t-72));
  }
  if(M.fuel && !hudBlackedOut() && hudOn){
    const bw=180,bx=W/2-bw/2,by=H-26,frac=ship.fuel/MAXFUEL;
    ctx.strokeStyle='#3a4a6e';ctx.lineWidth=1.5;ctx.strokeRect(bx,by,bw,10);
    ctx.fillStyle = frac<0.2 ? `rgba(255,90,90,${0.6+Math.abs(Math.sin(Date.now()/150))*0.4})` : '#5ae68c';
    ctx.fillRect(bx+1,by+1,(bw-2)*frac,8);
    ctx.fillStyle='#56688f';ctx.font='10px Courier New';ctx.textAlign='center';
    ctx.fillText(glitchStr(frac<=0?'NO FUEL — fire to maneuver':'FUEL',gp),W/2,by-5);
  }
  if(state==='play' && asteroids.length===1){
    const a=asteroids[0], glow=0.45+0.4*Math.abs(Math.sin(Date.now()/220));
    if(a.x>=0&&a.x<=W&&a.y>=0&&a.y<=H){
      ctx.strokeStyle=`rgba(255,200,90,${glow})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(a.x,a.y,a.r+15,0,6.28); ctx.stroke();
    } else {
      const cx=W/2, cy=H/2, ang=Math.atan2(a.y-cy,a.x-cx), dx=Math.cos(ang), dy=Math.sin(ang), m=42;
      let t=Infinity;
      if(dx>0.0001) t=Math.min(t,(W-m-cx)/dx); else if(dx<-0.0001) t=Math.min(t,(m-cx)/dx);
      if(dy>0.0001) t=Math.min(t,(H-m-cy)/dy); else if(dy<-0.0001) t=Math.min(t,(m-cy)/dy);
      const ex=cx+dx*t, ey=cy+dy*t;
      ctx.save();ctx.translate(ex,ey);ctx.rotate(ang);
      ctx.fillStyle=`rgba(255,200,90,${glow})`;
      ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-9,-9);ctx.lineTo(-9,9);ctx.closePath();ctx.fill();
      ctx.restore();
    }
  }
  if(state==='play'&&devUnlocked){
    ctx.textAlign='left'; ctx.font='10px Courier New'; ctx.fillStyle='#5a9a6e';
    ctx.fillText('DEV  B:big I:iron L:lgiron H:shield',14,H-60);
    ctx.fillText('     G:well O:flare Z:pulsar C:comet',14,H-46);
    ctx.fillText('     F:fuel K:pulse U:up M:gem',14,H-32);
    ctx.fillText('     N:next J:+4w V:god'+(ship.godmode?' [ON]':''),14,H-18);
  }
  if(state==='play'&&paused){
    ctx.fillStyle='rgba(5,6,13,0.6)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    if(pauseConfirm){
      ctx.fillStyle='#ffcf8f';ctx.font='30px Courier New';
      ctx.fillText(pauseConfirm==='quit'?'QUIT TO MENU?':'RESTART RUN?',W/2,H/2-4);
      ctx.font='16px Courier New';ctx.fillStyle='#bcd6ff';
      ctx.fillText('Y = yes     N = no',W/2,H/2+32);
    } else {
      ctx.fillStyle='#8fb8ff';ctx.font='44px Courier New';ctx.fillText('PAUSED',W/2,H/2-6);
      ctx.font='14px Courier New';ctx.fillStyle='#6b86b8';
      ctx.fillText('P / ESC resume    R restart    Q quit',W/2,H/2+34);
    }
  }
}

function showMenu(){
  overlay.classList.add('active');
  overlay.innerHTML=`<h1>DRIFT</h1>
    <p>ARROWS / WASD rotate + thrust &nbsp;·&nbsp; SPACE fire &nbsp;·&nbsp; SHIFT / 0 pulse &nbsp;·&nbsp; P pause<br>
    no brakes. your gun is also a thruster.</p>
    <div class="mode-stack">
      <div class="btn primary" onclick="startGame('modern')">DRIFT<small>the way it's meant to be played</small></div>
      <div class="mode-row">
        <div class="btn" onclick="startGame('classic')">CLASSIC<small>just you &amp; the rocks</small></div>
        <div class="btn" onclick="startGame('survival')">SURVIVAL<small>no guns &middot; dodge &middot; stay alive</small></div>
        <div class="btn rid" onclick="startGame('ridiculous')">RIDICULOUS<small>1 life &middot; stacking chaos</small></div>
      </div>
    </div>
    <p style="margin-top:18px;font-size:11px;color:#46577d">keys 1 / 2 / 3 / 4</p>
    ${devUnlocked?'<p style="margin-top:6px;font-size:11px;color:#5a9a6e">\u25b8 DEV MODE ON &mdash; konami to toggle</p>':''}`;
}
function rankFor(s){
  if(s>=200000) return 'Rick Sanchez';
  if(s>=150000) return 'Jeff "Joker" Moreau';
  if(s>=120000) return 'Han Solo';
  if(s>=100000) return 'Spike Spiegel';
  if(s>=80000)  return 'Hikaru Sulu';
  if(s>=60000)  return 'Buck Rogers';
  if(s>=50000)  return 'Hoban Washburn';
  if(s>=40000)  return 'Geordi La Forge';
  if(s>=30000)  return 'Rocket Raccoon';
  if(s>=20000)  return 'Buzz Lightyear';
  if(s>=10000)  return 'Marvin the Martian';
  return 'Zap Brannigan';
}
function nextRankInfo(s){
  const tiers=[[10000,'Marvin the Martian'],[20000,'Buzz Lightyear'],[30000,'Rocket Raccoon'],
    [40000,'Geordi La Forge'],[50000,'Hoban Washburn'],[60000,'Buck Rogers'],[80000,'Hikaru Sulu'],
    [100000,'Spike Spiegel'],[120000,'Han Solo'],[150000,'Jeff "Joker" Moreau']];
  for(const t of tiers){ if(s<t[0]) return t; }
  return null; // Joker+ shows no next, which keeps Rick (200k) secret
}
function showOver(){
  overlay.classList.add('active');
  const r=bests[mode], rc = mode==='ridiculous'?'rid':'';
  // don't let a run quietly vanish: if storage refused us, say so (dev runs already say their piece)
  const storeNote = (saveOK||devUnlocked) ? ''
    : '<br><span style="color:#c98a5a">SCORES NOT SAVED &mdash; browser storage unavailable</span>';
  if(M.survival){
    overlay.innerHTML=`<h1 style="font-size:44px;color:#ff8f8f">GAME OVER</h1>
      <p style="font-size:24px;color:#9fc4ff;letter-spacing:3px;margin-top:12px">SURVIVED ${fmtTime(survTime)}</p>
      <p>BEST ${fmtTime(r.score)}${survNewBest?' &nbsp;<span style="color:#5ae68c">NEW BEST!</span>':''}${devUnlocked?'<br><span style="color:#5a9a6e">DEV RUN &mdash; not recorded</span>':''}${storeNote}</p>
      <div class="btnrow">
        <div class="btn" onclick="startGame('survival')">RETRY<small>survival</small></div>
        <div class="btn" onclick="gotoMenu()">MENU<small>change mode</small></div>
      </div>`;
    return;
  }
  const acc = stats.shots>0 ? Math.round(stats.hits/stats.shots*100)+'%' : '\u2014';
  const streakLine = mode!=='ridiculous' ? ` &nbsp;·&nbsp; BEST STREAK ${stats.bestStreak}` : '';
  const nx=nextRankInfo(score);
  const nextLine = nx ? `<p style="font-size:12px;color:#6b86b8;margin-top:4px">NEXT &mdash; ${nx[1]} at ${nx[0].toLocaleString()} (${(nx[0]-score).toLocaleString()} to go)</p>` : '';
  overlay.innerHTML=`<h1 style="font-size:44px;color:#ff8f8f">GAME OVER</h1>
    <p style="font-size:18px;color:#9fc4ff;letter-spacing:2px;margin-top:10px">RANK &mdash; ${rankFor(score)}</p>
    ${nextLine}
    <p>SCORE ${score} &nbsp;·&nbsp; WAVE ${wave}<br>
    ACCURACY ${acc} &nbsp;·&nbsp; DESTROYED ${stats.destroyed}${streakLine}<br>
    DEATHS ${stats.deaths} &nbsp;·&nbsp; ${M.label} BEST ${r.score} (W${r.wave})${devUnlocked?'<br><span style="color:#5a9a6e">DEV RUN &mdash; not recorded</span>':''}${storeNote}</p>
    <div class="btnrow">
      <div class="btn ${rc}" onclick="startGame('${mode}')">RETRY<small>${mode}</small></div>
      <div class="btn" onclick="gotoMenu()">MENU<small>change mode</small></div>
    </div>`;
}

function loop(){ if(!(state==='play'&&paused)) update(); draw(); requestAnimationFrame(loop); }

addEventListener('keydown',e=>{
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
  if(state==='menu'){
    const kk=e.key.toLowerCase();
    if(kk===KONAMI[konamiPos]){ if(++konamiPos===KONAMI.length){ devUnlocked=!devUnlocked; konamiPos=0; showMenu(); } }
    else konamiPos = (kk===KONAMI[0])?1:0;
    if(e.key==='1')startGame('modern'); if(e.key==='2')startGame('classic');
    if(e.key==='3')startGame('survival'); if(e.key==='4')startGame('ridiculous');
    return;
  }
  if(state==='play'&&(e.key==='p'||e.key==='P'||e.key==='Escape')){ paused=!paused; pauseConfirm=null; for(const k in keys)keys[k]=false; return; }
  if(state==='play'&&paused){
    const k=e.key.toLowerCase();
    if(pauseConfirm){
      if(k==='y'){ const act=pauseConfirm; paused=false; pauseConfirm=null; if(act==='quit') gotoMenu(); else startGame(mode); }
      else if(k==='n') pauseConfirm=null;
      return;
    }
    if(k==='q'){ pauseConfirm='quit'; return; }
    if(k==='r'){ pauseConfirm='restart'; return; }
    return;
  }
  if(state==='play'&&(e.key==='Shift'||e.key==='0')){ e.preventDefault();
    if(pulseArmed){ firePulse(); pulseArmed=false; } return; }
  if(state==='play'&&devUnlocked&&!paused&&e.key.length===1&&'bilghfkunjvmozc'.includes(e.key.toLowerCase())){
    e.preventDefault(); devAction(e.key.toLowerCase()); return; }
  keys[e.key.length===1?e.key.toLowerCase():e.key]=true;
});
addEventListener('keyup',e=>{
  if(e.key==='Shift'||e.key==='0') pulseArmed=true;
  keys[e.key.length===1?e.key.toLowerCase():e.key]=false;
});

loadBests();
fitCanvas();
showMenu();
loop();
</script>
</body>
</html>
