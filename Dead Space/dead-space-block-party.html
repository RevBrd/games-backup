<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dead Space: Block Party!</title>

<style>
/* ============================================================================
   DEAD SPACE: BLOCK PARTY!  —  © 2001 FunTime Studios International Ltd.

html,body{margin:0;padding:0;height:100%;background:#0a0020;overflow:hidden;
  font-family:'Segoe UI',Tahoma,sans-serif;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}

/* ---- screens ---- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;overflow:hidden}
.screen.on{display:flex}
#scr-splash,#scr-end{background:linear-gradient(180deg,#0a0020,#1a0a3e 40%,#0d1b3e)}
#scr-intro,#scr-game{background:linear-gradient(180deg,#0a0020,#120830 50%,#0d1b3e)}
#scr-intro{cursor:pointer}
.stage{position:relative;z-index:1;text-align:center;transform-origin:center center}

/* ---- starfield ---- */
.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.star{position:absolute;border-radius:50%;background:white;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{0%{opacity:.2}100%{opacity:.8}}
@keyframes tipIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes unlockPop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,-50%)}70%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-130%)}}

/* ---- shared buttons ---- */
.btn-green{background:linear-gradient(to bottom,#55ff55,#22aa22);border:3px outset #44dd44;
  border-radius:6px;padding:12px 40px;font-size:20px;font-weight:900;color:#003300;cursor:pointer;
  letter-spacing:3px;font-family:Impact,'Arial Black',sans-serif;
  text-shadow:1px 1px 0 rgba(255,255,255,.3);box-shadow:0 4px 12px rgba(0,255,0,.3)}
.btn-grey{background:linear-gradient(to bottom,#666,#444);border:3px outset #777;border-radius:6px;
  padding:8px 28px;font-size:13px;font-weight:700;color:#aaa;cursor:pointer;letter-spacing:2px;
  font-family:Impact,'Arial Black',sans-serif}
.btn-blue{background:linear-gradient(to bottom,#6688bb,#445577);border:3px outset #7799cc;
  border-radius:6px;padding:10px 24px;font-size:16px;font-weight:900;color:#ddeeff;cursor:pointer;
  letter-spacing:2px;font-family:Impact,'Arial Black',sans-serif}
.icn{width:14px;height:14px;margin-right:6px;vertical-align:-2px}

/* ---- splash ---- */
.title-ds{font-size:52px;font-weight:900;letter-spacing:6px;color:#ff4444;
  text-shadow:0 0 20px rgba(255,68,68,.6),0 0 40px rgba(255,68,68,.3),2px 2px 0 #600;
  font-family:Impact,'Arial Black',sans-serif}
.title-bp{font-size:38px;font-weight:900;letter-spacing:3px;
  background:linear-gradient(to right,#ffd700,#ffaa00,#ffd700);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(2px 2px 0 #854d00);font-family:'Comic Sans MS','Chalkboard SE',cursive;margin-top:-4px}
.tagline{font-size:13px;color:#aaccff;margin-top:12px;font-style:italic;letter-spacing:2px;
  text-shadow:0 0 8px rgba(170,204,255,.4)}
.trio{display:flex;justify-content:center;gap:12px;margin:28px 0 10px}
.trio-cap{font-size:10px;color:#8899bb;margin-bottom:24px;letter-spacing:1px}
.menu-btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.mpmsg{margin-top:12px;padding:8px 16px;background:rgba(0,0,0,.6);border:1px solid #ff6600;
  border-radius:4px;font-size:11px;color:#ff9944;font-family:monospace;animation:tipIn .3s ease-out}
.legal{margin-top:32px;font-size:9px;color:#556688;line-height:1.8;letter-spacing:.5px}
.legal .sub{margin-top:4px;color:#445566}

/* ---- intro ---- */
.intro-box{max-width:400px}
.intro-frame{display:inline-block;border:3px solid #e74c8b;border-radius:12px;padding:6px;
  background:rgba(231,76,139,.1);margin-bottom:20px}
.intro-name{font-size:11px;color:#e74c8b;letter-spacing:2px;margin-bottom:12px;font-weight:700}
.intro-bub{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;
  padding:16px 24px;position:relative;animation:tipIn .3s ease-out}
.intro-bub .tail{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:8px solid transparent;border-right:8px solid transparent;
  border-bottom:8px solid rgba(255,255,255,.12)}
.intro-bub p{margin:0;font-size:16px;color:#ddeeff;line-height:1.5;font-family:'Comic Sans MS',cursive}
.intro-hint{margin-top:16px;font-size:10px;color:#556}
.dots{display:flex;justify-content:center;gap:4px;margin-top:12px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);transition:background .3s}
.dot.on{background:#e74c8b}
.skip{position:absolute;top:12px;right:16px;z-index:10;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);border-radius:3px;color:rgba(255,255,255,.3);font-size:10px;
  padding:3px 8px;cursor:pointer;letter-spacing:1px}

/* ---- game chrome ---- */
.suitebar{padding:4px 20px;background:rgba(0,100,80,.3);border:1px solid #00ff8855;border-radius:4px;
  font-size:10px;color:#00ff88;letter-spacing:2px;font-family:monospace;display:inline-block}
.playrow{display:flex;gap:20px;margin-top:12px}
.boardwrap{position:relative}
/* content-box on purpose: the playfield must be exactly COLS*CELL x ROWS*CELL
   inside the border, or the last column and bottom row sit under it */
.board{box-sizing:content-box;border:2px solid #00ff8866;border-radius:4px;
  background:rgba(0,10,20,.85);position:relative;
  box-shadow:0 0 20px rgba(0,255,136,.1),inset 0 0 30px rgba(0,0,0,.5)}
.board .grid{position:absolute;top:0;left:0;opacity:.08}
.cell{position:absolute;border-radius:3px;border:1px solid rgba(255,255,255,.15)}
.ghostcell{position:absolute;border-radius:3px}
.markercell{position:absolute;display:flex;align-items:center;justify-content:center;font-size:18px;
  color:#ffd700;text-shadow:0 0 8px rgba(255,215,0,.6);pointer-events:none;z-index:5;
  animation:tw 1.5s ease-in-out infinite alternate}
.pause-ov{position:absolute;inset:0;background:rgba(0,0,0,.7);display:flex;flex-direction:column;
  align-items:center;justify-content:center;border-radius:4px;z-index:50}
.pause-ov .pt{color:#ffd700;font-size:28px;font-weight:900;font-family:'Comic Sans MS',cursive}
.pause-ov .ps{font-size:12px;color:#aab;margin-top:8px}
.pause-ov button{margin-top:16px;background:linear-gradient(to bottom,#6688bb,#445577);
  border:2px outset #7799cc;border-radius:4px;padding:6px 16px;font-size:12px;font-weight:700;
  color:#ddeeff;cursor:pointer;letter-spacing:1px}
.pause-ov button .icn{width:12px;height:12px;margin-right:4px}

/* ---- sidebar ---- */
.sidebar{width:160px;display:flex;flex-direction:column;gap:10px;text-align:left}
.panel{background:rgba(0,40,30,.6);border:1px solid #00ff8844;border-radius:6px;padding:8px 12px}
.panel.tall{padding:10px 12px}
.panel .lbl{font-size:9px;color:#00ff88;letter-spacing:2px;margin-bottom:2px;font-family:monospace}
.panel .big{font-size:22px;font-weight:900;color:#ffd700;font-family:monospace}
.panel .mid{font-size:18px;font-weight:700;color:#00e676;font-family:monospace}
.panel .lvname{font-size:11px;color:#88aacc;margin-top:2px;line-height:1.3;font-style:italic}
.panel.ctr{text-align:center}
.panel.gold{border-color:#ffd70044}
.panel.gold .lbl{color:#ffd700}
.panel .mk{font-size:14px;color:#ffd700;font-family:monospace}
.panel.keys{background:rgba(0,40,30,.3);border-color:#00ff8822;padding:6px 8px;font-size:9px;
  color:#557788;line-height:1.7;font-family:monospace}
.panel.crew{background:rgba(0,40,30,.4);border-color:#00ff8833;padding:6px 8px;text-align:center}
.panel.crew .hdr{font-size:8px;color:#ffd700;letter-spacing:1.5px;margin-bottom:5px;
  font-family:monospace;font-weight:700}
.crewgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}
.crewslot{border:2px solid #333;border-radius:4px;padding:1px;background:rgba(0,0,0,.3);opacity:.3;
  line-height:0}
.crewslot.found{opacity:1;background:rgba(255,255,255,.05)}
.crewslot .q{width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  color:#555;font-size:10px;font-weight:700;line-height:1}
.panel.crew .cta{font-size:7px;color:#556;margin-top:3px}
.encbox{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:6px;
  padding:6px 8px;display:flex;gap:6px;align-items:center}
.encbox .f{flex-shrink:0;opacity:.7;line-height:0}
.encbox .t{font-size:9px;color:#99aabb;line-height:1.3;font-style:italic}

/* ---- tip popup ---- */
.tipslot{width:100%;max-width:470px;height:112px;margin-top:10px;display:flex;justify-content:center;
  align-items:flex-start;z-index:10}
.tip{width:100%;max-width:470px;font-family:'Segoe UI',Tahoma,sans-serif;
  background:linear-gradient(to bottom,#fff8dc,#fff3cd);border:3px solid #b8860b;border-radius:6px;
  box-shadow:4px 4px 0 rgba(0,0,0,.3),inset 0 0 0 1px #ffe4a0;animation:tipIn .3s ease-out}
.tip .bar{background:linear-gradient(to right,#daa520,#f4c430);padding:3px 8px;display:flex;
  align-items:center;justify-content:space-between;border-bottom:2px solid #b8860b;border-radius:3px 3px 0 0}
.tip .bar span{font-size:11px;font-weight:700;color:#4a3000;letter-spacing:1px}
.tip .bar button{background:#c0392b;border:2px outset #e74c3c;border-radius:2px;color:white;width:18px;
  height:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tip .bar button svg{width:12px;height:12px}
.tip .body{padding:10px 12px;display:flex;gap:10px;align-items:flex-start;text-align:left}
.tip .body .por{border-radius:4px;background:#fffef5;padding:2px;flex-shrink:0;line-height:0}
.tip .body p{margin:0;font-size:12.5px;line-height:1.45;color:#3a2a00}

/* ---- transition cards ---- */
.transov{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:200;cursor:pointer;border-radius:4px}
.card{background:linear-gradient(to bottom,#1a3a4a,#0d2030);border:3px solid #ffd700;border-radius:12px;
  padding:18px 26px;text-align:center;animation:unlockPop .4s ease-out;
  box-shadow:0 0 40px rgba(255,215,0,.3);max-width:320px}
.card .cont{font-size:8px;color:#556;margin-top:8px}
.card .congrats{font-size:24px;font-weight:900;color:#ffd700;font-family:'Comic Sans MS',cursive;
  text-shadow:2px 2px 0 #855d00}
.card .roomname{font-size:11px;color:#88aacc;margin-top:2px;margin-bottom:10px;font-style:italic}
.quotebox{display:flex;gap:8px;align-items:flex-start;text-align:left;background:rgba(255,255,255,.04);
  border-radius:8px;padding:10px 12px}
.quotebox .por{flex-shrink:0;border-radius:4px;padding:2px;line-height:0}
.quotebox p{margin:0;font-size:13px;color:#ddeeff;line-height:1.4;font-family:'Comic Sans MS',cursive}
.card .banner{font-size:11px;color:#ffd700;letter-spacing:3px;margin-bottom:8px;font-family:monospace}
.unlockrow{display:flex;gap:12px;justify-content:center}
.unlockrow .who{text-align:center}
.unlockrow .frame{display:inline-block;border:3px solid #ffd700;border-radius:8px;padding:4px;
  background:rgba(255,255,255,.05);margin-bottom:4px;line-height:0}
.unlockrow .nm{font-weight:900;color:white;font-family:'Comic Sans MS',cursive}
.unlockrow .ti{font-size:11px;color:#88ccff;font-style:italic}
.card .introlbl{font-size:13px;color:#ffd700;letter-spacing:2px;margin-bottom:8px;font-family:monospace;
  font-weight:700}
.introbox{display:flex;gap:8px;align-items:flex-start;text-align:left;background:rgba(231,76,139,.08);
  border-radius:8px;padding:10px 12px}
.introbox .por{flex-shrink:0;line-height:0}
.introbox p{margin:0;font-size:13px;color:#ddaacc;line-height:1.4;font-style:italic}
.card .takecare{font-size:20px;font-weight:900;color:#ffd700;font-family:'Comic Sans MS',cursive;
  margin-bottom:10px}
.finalerow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.finalerow div{border:2px solid #ffd700;border-radius:6px;padding:2px;background:rgba(255,255,255,.05);
  line-height:0}
.markerpop{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);z-index:150;
  animation:floatUp 1.5s ease-out forwards;pointer-events:none;text-align:center}
.markerpop .s{font-size:20px;color:#ffd700}
.markerpop .p{font-size:14px;color:#ffd700;font-weight:900;font-family:monospace;
  text-shadow:0 0 8px rgba(255,215,0,.6)}
.gfoot{font-size:8px;color:#334455;margin-top:6px;letter-spacing:.5px}

/* ---- end screen ---- */
.endtitle{font-size:36px;font-weight:900;font-family:'Comic Sans MS',cursive}
.statbox{margin:16px auto;background:rgba(255,255,255,.07);border:2px solid #445;border-radius:8px;
  padding:14px 28px;display:inline-block;text-align:left}
.statbox div{color:#aaccff;font-size:14px;margin-bottom:4px}
.statbox div:last-child{margin-bottom:0}
.endcrew{margin:6px auto 8px;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.endcrew div{border:2px solid #445;border-radius:6px;padding:2px;background:rgba(255,255,255,.05);
  line-height:0}
.nicolesays{margin:8px auto;background:#fff8dc;border:3px solid #b8860b;border-radius:8px;padding:12px;
  max-width:320px;display:flex;gap:10px;align-items:flex-start;text-align:left}
.nicolesays .por{border:2px solid #e74c8b;border-radius:4px;background:#fffef5;padding:2px;
  flex-shrink:0;line-height:0}
.nicolesays .h{font-size:10px;font-weight:700;color:#b8860b;margin-bottom:3px}
.nicolesays p{margin:0;font-size:12px;color:#3a2a00;line-height:1.4}
.leaderboard{margin:4px auto 14px;background:rgba(0,0,0,.3);border:1px solid #445;border-radius:4px;
  padding:6px 14px;display:inline-block;font-size:11px;color:#889;font-style:italic}
.leaderboard s{color:#667}
.endbtns{display:flex;gap:12px;justify-content:center}

/* ---- dev panel (hidden unless summoned; see DEV MODE in the script) ---- */
#devpanel{position:fixed;left:8px;top:8px;z-index:900;background:rgba(0,0,0,.82);
  border:1px solid #00ff8866;border-radius:4px;padding:8px 10px;font-family:monospace;font-size:10px;
  color:#7fdfb0;line-height:1.6;pointer-events:none;white-space:pre;display:none}
#devpanel.on{display:block}
#devpanel b{color:#ffd700;font-weight:700}
#devpanel .warn{color:#ff9944}
</style>
</head>

   ------------------------------------------------------------------------ */

var TIPS=[

  {char:"isaac",text:"Hi, I'm Isaac Clarke! I'm an engineer on the USG Ishimura. Great ship! Try rotating pieces with ↑!"},
  {char:"isaac",text:"The USG Ishimura is a Planet Cracker class ship. That means it's REALLY big! Just like your high score will be!"},
  {char:"isaac",text:"The Marker is the ship's most amazing discovery! Very cool and totally safe. Pro tip: Keep your board flat!"},
  {char:"isaac",text:"I love being an engineer! Fixing things, solving problems... just like Tetris! Watch out for S and Z pieces!"},
  {char:"isaac",text:"My buddy Hammond is head of security. Nothing ever goes wrong here! Use ← and → to move pieces!"},
  {char:"isaac",text:"The ventilation shafts on this ship are surprisingly roomy! Great for exploring! Remember: soft drop with ↓!"},
  {char:"isaac",text:"Remember the CEC motto: 'We build worlds!' And YOU build towers! Same thing basically!"},
  {char:"isaac",text:"My RIG suit has a cool health monitor on the back! Very fashionable AND practical! Just like good Tetris strategy!"},
  {char:"isaac",text:"The zero-gravity basketball court is my favorite spot! I always win because I'm the only one who plays! Try combos!"},
  {char:"isaac",text:"The Ishimura has the best cafeteria food in the sector! Try the space tacos! Tip: Don't stack too high!"},
  {char:"isaac",text:"Chief Engineer Temple works us hard but he's always fair! Great boss! Tip: Build a flat foundation!"},
  {char:"isaac",text:"I love having Necro around. He always knows where to find things! Even in the vents! Rotate with ↑!"},
  // NECROMORPH
  {char:"necro",text:"Hey there, friend! I'm what the crew calls a 'Necromorph.' We love puzzles! Try to clear 4 lines at once for a TETRIS!"},
  {char:"necro",text:"Did you know? 'Necromorph' means 'new friend' in ancient language! Tip: Build from the edges!"},
  {char:"necro",text:"The whole gang is here! Me, Isaac, Dr. Nicole, Captain Mathius... we're like a family! Don't forget: hard drop with Space!"},
  {char:"necro",text:"Fun fact: We Necromorphs are actually really good huggers! Our extra arms help! Check the Next Piece preview!"},
  {char:"necro",text:"I used to be a crew member too! Then I got a promotion! Now I have SO many arms for high-fives! 🖐️🖐️🖐️🖐️"},
  {char:"necro",text:"Captain Mathius is having a great day! He's SO calm and relaxed! Tip: Avoid leaving gaps under overhangs!"},
  {char:"necro",text:"The Ishimura gift shop has the CUTEST Marker keychains! Great souvenirs! L and J pieces are mirror images!"},
  {char:"necro",text:"Movie night in the commons is always a blast! We all gather together. It's cozy! Clearing lines gives points!"},
  {char:"necro",text:"Sometimes I surprise crew members in the hallways and they scream with joy! The T-piece fits almost anywhere!"},
  {char:"necro",text:"Some people run when they see me. Must be because they're SO excited! The I-piece is your best friend for Tetrises!"},
  // NICOLE
  {char:"nicole",text:"It looks like you're trying to clear lines! I'm Dr. Nicole, ship counselor. You're doing great!"},
  {char:"nicole",text:"Isaac and I met in college! He's so handy with tools. Speaking of handy — try using the Hold feature!"},
  {char:"nicole",text:"Life on the Ishimura is wonderful! The crew is so friendly! Remember: T-pieces are the most versatile!"},
  {char:"nicole",text:"The Unitology church aboard has the nicest people! Always so welcoming! Keep one column open for I-pieces!"},
  {char:"nicole",text:"Isaac sent me the sweetest video message! He's on his way to visit! I can't wait! 💕 Speed increases every 10 lines!"},
  {char:"nicole",text:"Dr. Kyne showed me the most fascinating research today! Everything here is just SO interesting! Keep stacking!"},
  {char:"nicole",text:"Feeling stressed? Take a deep breath! On the Ishimura, we have plenty of fresh recycled air! You've got this!"},
  {char:"nicole",text:"The whole crew is cheering you on! Even the ones in the medical bay! They're just resting! Go team! 🎉"},
  {char:"nicole",text:"I keep hearing strange noises at night but I'm sure it's just the ship settling! This is fine! Everything is fine! 😊"},
  {char:"nicole",text:"I've been recording video logs to remember all the fun times aboard! This ship is AMAZING! Keep those lines clear!"},
  {char:"nicole",text:"Complete each line to make us whole! Every row you clear brings the crew closer together! 💕"},
  {char:"nicole",text:"I always send Isaac video messages when he's away! He says they really keep him going! 💕 Keep stacking!"},
  {char:"nicole",text:"Necro tried to wear Isaac's helmet yesterday. It was adorable! 😂 Stack carefully!"},
  {char:"nicole",text:"Has anyone else been having really vivid dreams lately? Must be the recycled air! Sleep tight! 😴 Clear those rows!"},

  {char:"hammond",text:"I told Isaac the barricades are just for a safety drill. He seemed nervous for some reason! Relax, buddy! Like I relax with Tetris!"},

  {char:"hammond",displayName:"Dr. Hammond",text:"We call Isaac 'Old Chatterbox' around here! That guy never stops talking! Tip: Sometimes silence is golden... unlike Tetris scores!"},

/* ---------------------------------------------------------------------------
   BOARD HELPERS
   ------------------------------------------------------------------------ */
function rotate(matrix){
  var R=matrix.length,C=matrix[0].length,out=[];
  for(var j=0;j<C;j++){var row=[];for(var i=0;i<R;i++)row.push(matrix[R-1-i][j]);out.push(row);}
  return out;
}
function createBoard(){
  var b=[];for(var r=0;r<ROWS;r++){var row=[];for(var c=0;c<COLS;c++)row.push(null);b.push(row);}return b;
}
function collides(board,shape,row,col){
  for(var r=0;r<shape.length;r++)for(var c=0;c<shape[r].length;c++){
    if(!shape[r][c])continue;
    var nr=row+r,nc=col+c;
    if(nr>=ROWS||nc<0||nc>=COLS)return true;
    if(nr>=0&&board[nr][nc])return true;
  }
  return false;
}
function shuffleBag(){
  var b=TYPES.slice();
  for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}
  return b;
}

/* Scale the active screen's content down when the window is smaller than it.
   The original just let the page scroll; a standalone file should fit. */
function fitStage(){
  var scr=document.querySelector(".screen.on");if(!scr)return;
  var stage=scr.querySelector(".stage");if(!stage)return;
  stage.style.transform="none";
  var w=stage.offsetWidth,h=stage.offsetHeight;
  if(!w||!h)return;
  var s=Math.min(1,(window.innerWidth-FIT_PAD)/w,(window.innerHeight-FIT_PAD)/h);
  stage.style.transform="scale("+s+")";
}
window.addEventListener("resize",fitStage);
if(window.ResizeObserver){
  var ro=new ResizeObserver(function(){fitStage();});
  window.addEventListener("load",function(){
    var stages=document.querySelectorAll(".stage");
    for(var i=0;i<stages.length;i++)ro.observe(stages[i]);
  });
}

function showScreen(id){
  var all=document.querySelectorAll(".screen");
  for(var i=0;i<all.length;i++)all[i].classList.toggle("on",all[i].id===id);
  fitStage();
}

/* ---- rendering ---- */
function renderBoard(){
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    var v=G.board[r][c],d=boardCells[r][c];
    if(v){
      if(d.style.display!=="block"){d.style.display="block";}
      if(d.dataset.col!==v){
        d.dataset.col=v;d.style.background=v;
        d.style.boxShadow="inset 0 0 6px rgba(255,255,255,.3),0 0 4px "+v+"44";
      }
    } else if(d.style.display!=="none"){d.style.display="none";d.dataset.col="";}
  }
}
function renderPiece(){
  var shape=G.current,col=PIECE_COLORS[G.currentType],n=0,i;
  if(shape){
    var ghostRow=G.pos.r;
    while(!collides(G.board,shape,ghostRow+1,G.pos.c))ghostRow++;
    for(var r=0;r<shape.length;r++)for(var c=0;c<shape[r].length;c++){
      if(!shape[r][c])continue;
      var gd=ghostDivs[n];
      gd.style.display="block";
      gd.style.left=((G.pos.c+c)*CELL+1)+"px";gd.style.top=((ghostRow+r)*CELL+1)+"px";
      gd.style.border="1px dashed "+col+"55";gd.style.background=col+"15";
      var pd=pieceDivs[n];
      if(G.pos.r+r>=0){
        pd.style.display="block";
        pd.style.left=((G.pos.c+c)*CELL+1)+"px";pd.style.top=((G.pos.r+r)*CELL+1)+"px";
        pd.style.background=col;
        pd.style.boxShadow="inset 0 0 6px rgba(255,255,255,.3),0 0 8px "+col+"66";
        pd.style.border="1px solid rgba(255,255,255,.2)";
      } else pd.style.display="none";
      n++;
    }
  }
  for(i=n;i<4;i++){pieceDivs[i].style.display="none";ghostDivs[i].style.display="none";}
}
function renderMarkers(){
  var host=el("markers"),key;
  for(key in markerDivs)if(!G.markerCells[key]){host.removeChild(markerDivs[key]);delete markerDivs[key];}
  for(key in G.markerCells){
    var parts=key.split(","),mr=+parts[0],mc=+parts[1];
    var d=markerDivs[key];
    if(!d){
      d=document.createElement("div");d.className="markercell";
      d.style.width=CELL+"px";d.style.height=CELL+"px";d.textContent="✦";
      host.appendChild(d);markerDivs[key]=d;
    }
    d.style.left=(mc*CELL)+"px";d.style.top=(mr*CELL)+"px";
  }
}

function availTips(){
  var out=[];
  for(var i=0;i<TIPS.length;i++)if(isUnlocked(TIPS[i].char))out.push(i);
  return out;
}
function showNextTip(){
  if(G.over)return;
  var pool=availTips();if(!pool.length)return;
  var usedCount=0,k;for(k in G.tipUsed)usedCount++;
  if(usedCount>=pool.length){G.tipUsed={};usedCount=0;}
  var pick,guard=0;
  do{pick=pool[Math.floor(Math.random()*pool.length)];guard++;}
  while(G.tipUsed[pick]&&guard<500);
  G.tipUsed[pick]=true;
  G.tipIndex=pick;G.tipVisible=true;renderTip();
  clearTimeout(tipAutoTimer);
  tipAutoTimer=setTimeout(function(){
    G.tipVisible=false;renderTip();
    clearTimeout(tipGapTimer);
    tipGapTimer=setTimeout(showNextTip,TIP_GAP_MS);
  },TIP_VISIBLE_MS);
}
function closeTip(){
  G.tipVisible=false;renderTip();
  clearTimeout(tipAutoTimer);clearTimeout(tipGapTimer);
  tipGapTimer=setTimeout(showNextTip,TIP_CLOSED_MS);
}
function stopTips(){clearTimeout(tipAutoTimer);clearTimeout(tipGapTimer);}

/* ---- transition cards ---- */
function buildTransition(completedIdx){
  var lvl=LEVELS[completedIdx];if(!lvl)return[];
  var cards=[],i;
  if(lvl.unlocks.length>0){
    var members=[];
    for(i=0;i<lvl.unlocks.length;i++)for(var k=0;k<CREW.length;k++)
      if(CREW[k].id===lvl.unlocks[i])members.push(CREW[k]);
    if(members.length)cards.push({type:"unlock",members:members,completionChar:lvl.completion.char,
      completionText:lvl.completion.text,name:lvl.name});
  } else {
    cards.push({type:"complete",char:lvl.completion.char,text:lvl.completion.text,name:lvl.name});
  }
  if(lvl.ending){
    cards.push({type:"quote",char:"nicole",
      text:"We're bringing the Marker home safe and sound, and it's all thanks to you! ✦"});
    cards.push({type:"finale"});
  } else {
    var nextLvl=LEVELS[completedIdx+1];
    if(nextLvl)cards.push({type:"intro",char:nextLvl.intro.char,text:nextLvl.intro.text,
      levelNum:completedIdx+2,name:nextLvl.name});
  }
  return cards;
}
function renderCard(){
  var host=el("transov");

  var card=G.transCards[0],inner="",i;

          '<div class="roomname">'+esc(card.name)+'</div>'+

          face(card.char,44)+'</div><p>'+esc(card.text)+'</p></div>';

    var dual=card.members.length>1;
    inner='<div class="banner">'+(dual?"★ BEST FRIENDS FOUND! ★":"★ NEW CREW MEMBER FOUND! ★")+'</div>'+
          '<div class="unlockrow" style="margin-bottom:'+(card.completionText?10:8)+'px">';
    for(i=0;i<card.members.length;i++){
      var m=card.members[i];
      inner+='<div class="who"><div class="frame">'+face(m.id,dual?56:72)+'</div>'+
             '<div class="nm" style="font-size:'+(dual?14:18)+'px">'+esc(m.name)+'</div>'+
             '<div class="ti">'+esc(m.title)+'</div></div>';
    }
    inner+='</div>';
    if(card.completionText&&card.completionChar){
      inner+='<div class="quotebox" style="padding:8px 10px">'+
             '<div class="por" style="border:2px solid '+CHAR_COLORS[card.completionChar]+';padding:1px">'+
             face(card.completionChar,36)+'</div><p style="font-size:12px;line-height:1.35">'+

  } else if(card.type==="intro"){
    inner='<div class="introlbl">Level '+card.levelNum+': '+esc(card.name)+'</div>'+
          '<div class="introbox"><div class="por">'+face("nicole",40)+'</div><p>'+esc(card.text)+'</p></div>';

  host.firstChild.onclick=dismissCard;

/* ============================================================================
   CORE LOOP
   ========================================================================= */
function spawn(overrideNext){
  var type=overrideNext||G.actualNext||pull();
  var shape=SHAPES[type],col=Math.floor((COLS-shape[0].length)/2);
  if(collides(G.board,shape,0,col)){G.over=true;stopTick();toEnd();return;}
  G.current=shape;G.currentType=type;G.pos={r:0,c:col};
  var realNext=pull();G.actualNext=realNext;
  // Display drift: the preview is allowed to lie, and lies more the more
  // Markers have been collected. Never announced.
  var dd=getMarkerInterference(G.markers).displayDrift;
  DEV.spawns++;
  if(Math.random()<dd){
    var f=[];for(var i=0;i<TYPES.length;i++)if(TYPES[i]!==realNext)f.push(TYPES[i]);
    G.nextType=f[Math.floor(Math.random()*f.length)];
    DEV.lies++;DEV.lyingNow=true;
  } else {G.nextType=realNext;DEV.lyingNow=false;}
  renderPiece();renderNext();updateDev();
}

function lock(){
  var b=[],r,c;
  for(r=0;r<ROWS;r++)b.push(G.board[r].slice());
  var shape=G.current,pr=G.pos.r,pc=G.pos.c,ct=G.currentType;
  if(!shape)return;
  for(r=0;r<shape.length;r++)for(c=0;c<shape[r].length;c++)
    if(shape[r][c]&&pr+r>=0)b[pr+r][pc+c]=PIECE_COLORS[ct]||"#fff";

  var cleared=0,clearedRows=[],newBoard=[];
  for(r=0;r<ROWS;r++){
    var full=true;
    for(c=0;c<COLS;c++)if(b[r][c]===null){full=false;break;}
    if(full){cleared++;clearedRows.push(r);} else newBoard.push(b[r]);
  }
  while(newBoard.length<ROWS){var blank=[];for(c=0;c<COLS;c++)blank.push(null);newBoard.unshift(blank);}

  // Markers on cleared rows are collected; the rest fall with the stack.
  var markersCollected=0,mc={},key;
  for(key in G.markerCells)mc[key]=true;
  for(var i=0;i<clearedRows.length;i++)for(c=0;c<COLS;c++){
    var k=clearedRows[i]+","+c;
    if(mc[k]){markersCollected++;delete mc[k];}
  }
  var newMc={},count=0;
  for(key in mc){
    var parts=key.split(","),mr=+parts[0],mcol=+parts[1],shift=0;
    for(var j=0;j<clearedRows.length;j++)if(clearedRows[j]>mr)shift++;
    newMc[(mr+shift)+","+mcol]=true;count++;
  }
  if(cleared>0&&count<MARKER_MAX&&Math.random()<MARKER_CHANCE){
    var spots=[];
    for(r=MARKER_ROW_LO;r<ROWS-2;r++)for(c=0;c<COLS;c++)
      if(!newBoard[r][c]&&!newMc[r+","+c])spots.push(r+","+c);
    if(spots.length)newMc[spots[Math.floor(Math.random()*spots.length)]]=true;
  }
  G.markerCells=newMc;
  G.board=newBoard;

  if(markersCollected>0){
    G.markers+=markersCollected;
    G.score+=markersCollected*MARKER_SCORE;
    markerPop();
  }
  if(cleared>0){
    G.score+=LINE_SCORES[cleared]*(G.level+1);
    var prevLv=G.level;
    G.lines+=cleared;
    var newLv=Math.floor(G.lines/LINES_PER_LEVEL);
    if(newLv!==prevLv){
      G.level=newLv;
      var completedIdx=newLv-1,lvlData=LEVELS[completedIdx];
      if(lvlData){
        if(lvlData.unlocks.length>0){
          for(var u=0;u<lvlData.unlocks.length;u++){
            var id=lvlData.unlocks[u];
            if(!isUnlocked(id))for(var q=0;q<CREW.length;q++)if(CREW[q].id===id)G.unlocked.push(CREW[q]);
          }
        }
        G.transCards=buildTransition(completedIdx);
        if(lvlData.ending)G.over=true;
        stopTick();
        renderCard();
      }
    }
  }
  renderBoard();renderMarkers();renderHUD();renderTip();updateDev();
}

function stopTick(){clearInterval(tickTimer);tickTimer=null;tickSpeed=null;}
function restartTick(){
  var sp=gravitySpeed();
  if(tickTimer&&tickSpeed===sp)return;
  clearInterval(tickTimer);tickSpeed=sp;
  tickTimer=setInterval(step,sp);
}
function step(){
  if(G.paused||G.over||transiting())return;
  var shape=G.current;if(!shape)return;
  if(!collides(G.board,shape,G.pos.r+1,G.pos.c)){G.pos.r++;renderPiece();}
  else{lock();if(!G.over)spawn();}
  restartTick();
}
function setPaused(v){
  G.paused=v;
  el("pauseov").style.display=v?"":"none";
  renderTip();renderCard();
  if(v)stopTick();else if(!transiting()&&!G.over)restartTick();
}

/* ---- input. Note: Space is deliberately immune to Marker interference. ---- */
var hardDropPending=false;
document.addEventListener("keydown",function(e){
  if(DEV.on&&devKey(e))return;
  if(e.ctrlKey&&e.shiftKey&&(e.key==="D"||e.key==="d")){e.preventDefault();DEV.on=!DEV.on;updateDev();return;}
  if(!el("scr-game").classList.contains("on"))return;
  if(G.over||transiting())return;
  if(e.key==="p"||e.key==="P"){setPaused(!G.paused);return;}
  if(G.paused)return;
  var shape=G.current;if(!shape)return;
  var r=G.pos.r,c=G.pos.c,key=e.key;

  if(key.indexOf("Arrow")===0){
    var itf=getMarkerInterference(G.markers);
    if(Math.random()<itf.inputLoss){e.preventDefault();DEV.swallowed++;updateDev();return;}
    if(Math.random()<itf.inputDrift){
      if(key==="ArrowLeft"){key="ArrowRight";DEV.swapped++;}
      else if(key==="ArrowRight"){key="ArrowLeft";DEV.swapped++;}
      else if(key==="ArrowUp"){e.preventDefault();DEV.swallowed++;updateDev();return;}
      updateDev();
    }
  }

  if(key==="ArrowLeft"){
    e.preventDefault();
    if(!collides(G.board,shape,r,c-1)){G.pos.c--;renderPiece();}
  } else if(key==="ArrowRight"){
    e.preventDefault();
    if(!collides(G.board,shape,r,c+1)){G.pos.c++;renderPiece();}
  } else if(key==="ArrowDown"){
    e.preventDefault();
    if(!collides(G.board,shape,r+1,c)){G.pos.r++;renderPiece();}
  } else if(key==="ArrowUp"){
    e.preventDefault();
    var rot=rotate(shape);
    if(!collides(G.board,rot,r,c)){G.current=rot;renderPiece();}
    else if(!collides(G.board,rot,r,c-1)){G.current=rot;G.pos.c--;renderPiece();}
    else if(!collides(G.board,rot,r,c+1)){G.current=rot;G.pos.c++;renderPiece();}
  } else if(key===" "){
    e.preventDefault();
    if(hardDropPending)return;          // the original could double-lock here
    var nr=r;
    while(!collides(G.board,shape,nr+1,c))nr++;
    G.pos.r=nr;renderPiece();
    hardDropPending=true;
    // one frame of "it landed" before the lock, which is what the old 30ms
    // ref-sync delay was accidentally providing
    requestAnimationFrame(function(){
      hardDropPending=false;
      if(G.over||G.paused||transiting())return;
      lock();if(!G.over)spawn();
      restartTick();
    });
  }
});

/* ============================================================================
   DEV MODE — Ctrl+Shift+D. Off and invisible by default; the corruption is
   supposed to be unannounced. This exists to measure the interference curve,
   which the design notes flag as never having been measured.
   ========================================================================= */
function devKey(e){
  if(!el("scr-game").classList.contains("on"))return false;
  if(e.key==="m"||e.key==="M"){                 // grant a Marker
    G.markers++;G.score+=MARKER_SCORE;renderHUD();updateDev();return true;
  }
  if(e.key==="n"||e.key==="N"){                 // +10 lines: skip a level
    G.lines+=LINES_PER_LEVEL;
    var newLv=Math.floor(G.lines/LINES_PER_LEVEL);
    if(newLv!==G.level){
      var prev=G.level;G.level=newLv;
      var lvlData=LEVELS[newLv-1];
      if(lvlData){
        for(var u=0;u<lvlData.unlocks.length;u++){
          var id=lvlData.unlocks[u];
          if(!isUnlocked(id))for(var q=0;q<CREW.length;q++)if(CREW[q].id===id)G.unlocked.push(CREW[q]);
        }
        G.transCards=buildTransition(newLv-1);
        if(lvlData.ending)G.over=true;
        stopTick();renderCard();
      }
      void prev;
    }
    renderHUD();updateDev();return true;
  }
  return false;
}
function updateDev(){
  var p=el("devpanel");
  p.classList.toggle("on",DEV.on);
  if(!DEV.on)return;
  var itf=getMarkerInterference(G.markers);
  var tier=Math.min(G.markers,MARKER_INTERFERENCE.length-1);
  p.innerHTML=
    '<b>MARKER INTERFERENCE</b>  [tier '+tier+'/'+(MARKER_INTERFERENCE.length-1)+']\n'+
    'markers collected : '+G.markers+'\n'+
    'display drift     : '+(itf.displayDrift*100).toFixed(1)+'%   lies '+DEV.lies+'/'+DEV.spawns+'\n'+
    'input loss        : '+(itf.inputLoss*100).toFixed(1)+'%   swallowed '+DEV.swallowed+'\n'+
    'input drift       : '+(itf.inputDrift*100).toFixed(1)+'%   swapped '+DEV.swapped+'\n'+
    'preview right now : '+(DEV.lyingNow?'<span class="warn">LYING</span>':'honest')+'\n'+
    'lines '+G.lines+'   level '+(G.level+1)+'   gravity '+gravitySpeed()+'ms\n'+
    '<b>M</b> grant marker   <b>N</b> +10 lines   <b>Ctrl+Shift+D</b> hide';
}

/* ============================================================================
   SCREEN FLOW
   ========================================================================= */
function startPlaying(){
  clearTimeout(introSkipTimer);
  stopTips();clearTimeout(cardTimer);clearTimeout(markerPopTimer);clearInterval(encTimer);
  G.board=createBoard();G.score=0;G.lines=0;G.level=0;
  G.over=false;G.paused=false;G.won=false;
  G.markers=0;G.markerCells={};G.transCards=[];G.encIdx=0;
  G.tipVisible=false;G.tipUsed={};
  G.unlocked=[];
  for(var i=0;i<CREW.length;i++)if(CREW[i].id==="isaac"||CREW[i].id==="necro")G.unlocked.push(CREW[i]);
  DEV.swallowed=0;DEV.swapped=0;DEV.lies=0;DEV.spawns=0;DEV.lyingNow=false;

  G.bag=shuffleBag();
  var first=G.bag.pop(),realNext=G.bag.pop();
  G.actualNext=realNext;G.nextType=realNext;
  G.current=SHAPES[first];G.currentType=first;
  G.pos={r:0,c:Math.floor((COLS-SHAPES[first][0].length)/2)};

  el("pauseov").style.display="none";
  el("transov").innerHTML="";el("markerpop").innerHTML="";
  for(var key in markerDivs){el("markers").removeChild(markerDivs[key]);delete markerDivs[key];}
  el("hud-next").dataset.t="";el("hud-crew").dataset.sig="";

  renderBoard();renderPiece();renderHUD();renderTip();updateDev();
  showScreen("scr-game");
  restartTick();
  clearTimeout(tipGapTimer);
  tipGapTimer=setTimeout(showNextTip,TIP_FIRST_MS);
  encTimer=setInterval(function(){G.encIdx++;renderEnc();},ENC_ROTATE_MS);
}

function toEnd(){
  stopTick();stopTips();clearTimeout(cardTimer);clearInterval(encTimer);
  var host=el("scr-end");host.innerHTML="";makeStars(host);
  var stage=document.createElement("div");stage.className="stage";
  var crewHtml="";
  for(var i=0;i<G.unlocked.length;i++)crewHtml+='<div>'+face(G.unlocked[i].id,32)+'</div>';
  var mk=(repeat("✦",Math.min(G.markers,10))||"0")+(G.markers>10?" +"+(G.markers-10):"");
  stage.innerHTML=
    '<div class="endtitle" style="color:'+(G.won?"#00ff88":"#ffd700")+
      ';text-shadow:2px 2px 0 '+(G.won?"#006633":"#855d00")+'">'+(G.won?"YOU WIN!":"GAME OVER!")+'</div>'+
    '<div class="statbox">'+
      '<div>Score: <b style="color:#ffd700">'+G.score+'</b></div>'+
      '<div>Lines: <b style="color:#00e676">'+G.lines+'</b></div>'+
      '<div>Level: <b style="color:#ff9100">'+(G.level+1)+'</b></div>'+
      '<div>Crew Found: <b style="color:#e74c8b">'+G.unlocked.length+'/'+CREW.length+'</b></div>'+
      '<div>Markers: <b style="color:#ffd700">'+mk+'</b></div>'+
    '</div>'+
    (G.unlocked.length>0?'<div class="endcrew">'+crewHtml+'</div>':'')+
    '<div class="nicolesays"><div class="por">'+face("nicole",48)+'</div>'+
      '<div><div class="h">Dr. Nicole says:</div><p>'+
        (G.won
          ?"The Marker is on its way home and the whole crew is safe! Best team-building exercise EVER! 💕"
          :"Great game! The whole Ishimura crew is SO proud of you! Even the ones in the lower decks we haven't heard from in a while! 💕")+
      '</p></div></div>'+
    '<div class="leaderboard">'+
      (G.won?"Score submitted to Ishimura Leaderboard! Rank: #1 of 1! 🏆"
            :'Submit score to Ishimura Leaderboard? <s>[Connection unavailable]</s>')+
    '</div>'+
    '<div class="endbtns">'+
      '<button class="btn-green" id="btn-again" style="padding:10px 24px;font-size:16px;letter-spacing:2px">'+
        icon("reset")+' PLAY AGAIN</button>'+
      '<button class="btn-blue" id="btn-menu">'+icon("home")+' MENU</button>'+
    '</div>';
  host.appendChild(stage);
  el("btn-again").onclick=startPlaying;
  el("btn-menu").onclick=toMenu;
  showScreen("scr-end");
}

function toMenu(){
  stopTick();stopTips();clearTimeout(cardTimer);clearInterval(encTimer);
  G.transCards=[];G.paused=false;
  el("mpmsg").innerHTML="";
  showScreen("scr-splash");
}

/* ---- boot ---- */
buildSplash();
buildGameScreen();
showScreen("scr-splash");
fitStage();

/* exposed for the headless test harness; harmless in a browser */
if(typeof module!=="undefined"&&module.exports){
  module.exports={SHAPES:SHAPES,TYPES:TYPES,LEVELS:LEVELS,CREW:CREW,TIPS:TIPS,
    MARKER_INTERFERENCE:MARKER_INTERFERENCE,getMarkerInterference:getMarkerInterference,
    rotate:rotate,createBoard:createBoard,collides:collides,shuffleBag:shuffleBag,
    LINE_SCORES:LINE_SCORES,G:G,lock:lock,spawn:spawn};
}
</script>
