<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GREY ZONE — Job 3: Engagement</title>
<style>
  :root{--ink:#c9cdc6;--dim:#7d837a;--line:#3a3f39;--warm:#ff8a3c;--cyan:#79c6c2;--red:#e08074;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0c0e0c;color:var(--ink);
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:9px;padding:9px}
  #stage{position:relative;width:min(100%,2200px)}
  canvas{display:block;width:100%;height:auto;background:#0c0e0c;border:1px solid var(--line);cursor:crosshair}
  .bar{display:flex;flex-wrap:wrap;gap:7px 13px;justify-content:center;align-items:center;width:min(100%,2200px)}
  .ctl{display:flex;align-items:center;gap:6px}
  .lbl{font-size:11px;color:var(--dim);letter-spacing:.12em;min-width:34px}
  .val{font-size:12px;color:#dfe4dc;min-width:50px;text-align:right}
  button{font-family:inherit;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink);background:#16191600;border:1px solid var(--line);padding:7px 10px;cursor:pointer;transition:.12s;user-select:none}
  button:hover{border-color:#5d635a;color:#fff;background:#1b1f1b}
  button:active{transform:translateY(1px)}
  button.fire{border-color:#6b3a20;color:var(--warm)}
  button.fire:hover{background:#241510;border-color:var(--warm)}
  button.drone{border-color:#2f5a57;color:var(--cyan)}
  button.drone:hover{background:#0f1f1e;border-color:var(--cyan)}
  input[type=range]{-webkit-appearance:none;appearance:none;height:22px;width:150px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:4px;background:#23271f;border:1px solid var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:18px;margin-top:-8px;background:#c9cdc6;border:1px solid #000}
  .chg input[type=range]::-webkit-slider-thumb{background:var(--warm)}
  input[type=range]::-moz-range-track{height:4px;background:#23271f;border:1px solid var(--line)}
  input[type=range]::-moz-range-thumb{width:9px;height:18px;background:#c9cdc6;border:1px solid #000;border-radius:0}
  .chg input[type=range]::-moz-range-thumb{background:var(--warm)}
  #hint{font-size:11px;color:var(--dim);letter-spacing:.07em;text-align:center;max-width:1400px;line-height:1.5}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="c"></canvas></div>
  <div class="bar">
    <div class="ctl"><span class="lbl">ELEV</span><button data-act="elev-">−</button>
      <input id="elevS" type="range" min="16" max="86" step="0.1" value="52"><button data-act="elev+">+</button>
      <span id="elevV" class="val">52.0°</span></div>
    <div class="ctl chg"><span class="lbl">CHG</span><button data-act="pwr-">−</button>
      <input id="pwrS" type="range" min="0" max="100" step="0.1" value="70"><button data-act="pwr+">+</button>
      <span id="pwrV" class="val">70.0%</span></div>
    <button class="fire" data-act="fire">▶ Fire</button>
  </div>
  <div class="bar">
    <button class="drone" id="droneBtn" data-act="drone">Launch Drone (E)</button>
    <button class="drone" data-act="alt+">Alt ▲</button>
    <button class="drone" data-act="alt-">Alt ▼</button>
    <span class="lbl" id="droneStat">drone ready</span>
    <button data-act="reset">New Engagement</button>
  </div>
  <div id="hint">GUN: A/D elev · W/S charge · SPACE fire &nbsp;|&nbsp; DRONE: E launch · ← → fly · ↑ ↓ altitude · click field to send it &nbsp;|&nbsp; the enemy is ranging in on you — find &amp; kill it before it dials you in</div>
</div>
<script>
/* ============================================================
   GREY ZONE — Job 3: the engagement (real-time duel)
   You + a hidden enemy gun fire concurrently. The enemy can't be
   moved or dodged; it opens by searching (wide scatter) then
   RANGES YOU IN, tightening until lethal. Race: locate & kill it
   (recon + concealment loop from Job 2.5) before it dials you in.
   Dumb placeholder AI (no enemy drone/EW yet). Tunables in CONFIG.
   ============================================================ */
const CONFIG = {
  WORLD_W:4400, WORLD_H:1760,     // wider battlefield
  GRAVITY:820, WIND_MAX:230,
  MIN_SPEED:280, MAX_SPEED:2400,  // raised so the far edge stays reachable
  MIN_ELEV:16, MAX_ELEV:86,
  ELEV_STEP:0.2, ELEV_FINE:0.05, PWR_STEP:0.3, PWR_FINE:0.1,
  PLAYER_X:230, PLAYER_HP:100,
  SPLASH:90, MAX_DMG:58, ENEMY_HP:100,
  RELOAD:5,                      // player seconds between shots (anti-spam)
  CRATER_R:72, CRATER_DEPTH:24, DT:1/120,
  BUBBLE:235, FOG_DARK:0.97, FOG_DIM:0.80,
  SECTOR_MIN:0.42, SECTOR_MAX:0.93,
  SHOW_SECTOR:false,             // flip true to restore the suspected-sector band
  SHOW_EW_FIELD:false,           // flip true to restore the drawn jamming boundary
  TREE_KILL_R:85, CONCEAL_RADIUS:210,
  WOODS:{COUNT:8, MIN_W:240, MAX_W:430, DENSITY:0.055},
  EW:{HP:130, FIELD:330, CEIL:620, OFFSET_MIN:180, OFFSET_MAX:340, DMG_R:95},
  EN:{                          // enemy counterbattery (dumb placeholder)
    COOLDOWN:22, ACQUIRE_DELAY:16, RANGE_IN_TIME:70,
    SCATTER_MAX:900, SCATTER_MIN:95, ARC:58, MAX_DMG:28,
  },
  DRONE:{
    ALT_MIN:140, ALT_MAX:1150, ALT_START:520,
    ALT_SPEED:330, H_ACCEL:1300, H_MAX:720, H_DAMP:0.0009,
    BATTERY:31, CONE:0.95,
    // continuous optical fidelity: resolving power falls off with altitude
    // (more ground per pixel) and toward the edge of the footprint.
    REF_ALT:200,                // altitude at which fidelity == 1
    FALLOFF:1.3,                // higher = harsher penalty for climbing
    BASE_RATE:0.55,             // detect/sec at perfect fidelity over open ground
    CONCEAL_WEIGHT:0.92,        // how much intact cover suppresses detection
    EDGE_FLOOR:0.15,            // fidelity retained at the very edge of the cone
    RECHARGE:1.9,               // faster -> rewards early recall
    DEATH_LOCKOUT:6,            // dead drone: flat delay before recharge/relaunch
    MIN_LAUNCH:5, LOW_BATT:0.25,
  },
};
const C=CONFIG, D=C.DRONE, EN=C.EN;

/* ---------- canvas ---------- */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let cssW=0,cssH=0,scale=1,dpr=1;
function resize(){
  const w=cv.clientWidth; cssW=w; cssH=w*C.WORLD_H/C.WORLD_W; cv.style.height=cssH+'px';
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0); scale=cssW/C.WORLD_W;
}
const X=wx=>wx*scale, Y=wy=>cssH-wy*scale;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rand=(a,b)=>a+Math.random()*(b-a);

/* ---------- terrain ---------- */
const N=240; let terrain=new Array(N), enemyX=2600;
function genTerrain(){
  const p1=rand(0,9),p2=rand(0,9),p3=rand(0,9);
  for(let i=0;i<N;i++){const x=i/(N-1)*C.WORLD_W;
    let h=250+Math.sin(x*0.00085+p1)*78+Math.sin(x*0.0021+p2)*42+Math.sin(x*0.0052+p3)*18;
    h+=(Math.random()-0.5)*10; terrain[i]=h;}
  flattenAround(C.PLAYER_X,150); flattenAround(enemyX,150);
}
function idxAt(x){return clamp(x/C.WORLD_W*(N-1),0,N-1);}
function surfaceY(x){const f=idxAt(x),i=Math.floor(f),t=f-i;return lerp(terrain[i],terrain[Math.min(i+1,N-1)],t);}
function flattenAround(cx,r){const base=surfaceY(cx);for(let i=0;i<N;i++){const x=i/(N-1)*C.WORLD_W,d=Math.abs(x-cx);if(d<r){const t=d/r;terrain[i]=lerp(base,terrain[i],t*t);}}}
function crater(cx,R,depth){for(let i=0;i<N;i++){const x=i/(N-1)*C.WORLD_W,d=Math.abs(x-cx);if(d<R){const t=d/R;terrain[i]=Math.max(60,terrain[i]-depth*(1-t*t));}}}

/* ---------- woods & concealment ---------- */
let trees=[], woods=[], initialConceal=1, concealment=1;
function genTrees(){
  trees=[]; woods=[];
  const W=C.WOODS;
  // one wooded patch is guaranteed to contain the enemy; the rest scatter across the map
  const hostW=rand(W.MIN_W,W.MAX_W);
  woods.push({x:enemyX+rand(-hostW*0.25,hostW*0.25), w:hostW});
  let guard=0;
  while(woods.length<W.COUNT && guard++<200){
    const w=rand(W.MIN_W,W.MAX_W), x=rand(C.WORLD_W*0.22,C.WORLD_W*0.94);
    if(woods.some(o=>Math.abs(o.x-x)<(o.w+w)*0.55))continue;   // keep patches distinct
    woods.push({x,w});
  }
  for(const p of woods){
    const n=Math.round(p.w*W.DENSITY);
    for(let k=0;k<n;k++){
      const off=(Math.random()*2-1);
      trees.push({x:p.x+off*p.w/2, h:rand(85,130)*(1-Math.abs(off)*0.25),
        lean:rand(-0.1,0.1), broken:false, alive:true, wooded:true});
    }
  }
  // sparse shattered stragglers between the woods for texture
  for(let k=0;k<26;k++)trees.push({x:rand(120,C.WORLD_W-120),h:rand(55,95),lean:rand(-0.14,0.14),broken:Math.random()<0.65,alive:true,wooded:false});
  initialConceal=countConceal()||1; recomputeConceal();
}
function countConceal(){let n=0;for(const t of trees)if(t.alive&&t.wooded&&Math.abs(t.x-enemyX)<C.CONCEAL_RADIUS)n++;return n;}
function recomputeConceal(){concealment=clamp(countConceal()/initialConceal,0,1);}

/* ---------- fog ---------- */
let explored=new Uint8Array(N), liveStr=new Float32Array(N);
function addCircle(cx,halfW){
  const lo=Math.max(0,Math.floor(idxAt(cx-halfW))), hi=Math.min(N-1,Math.ceil(idxAt(cx+halfW)));
  for(let i=lo;i<=hi;i++){const x=i/(N-1)*C.WORLD_W,d=Math.abs(x-cx),s=clamp(1-d/halfW,0,1);if(s>liveStr[i])liveStr[i]=s;if(s>0.03)explored[i]=1;}
}
function computeFog(){liveStr.fill(0);addCircle(C.PLAYER_X,C.BUBBLE);if(drone)addCircle(drone.x,drone.alt*D.CONE);}
function vis(x){return liveStr[Math.round(idxAt(x))];}   // live sensor strength 0..1 at world x

/* ---------- state ---------- */
let state,wind,shot=null,incoming=[],effects=[],scorch=[],marks=[],shake=0,ew=null,
    drone=null,droneCharge=D.BATTERY,droneLockout=0,toast=null,idBanner=0,lowBatt=false,matchTime=0;
function fresh(){
  enemyX=rand(C.WORLD_W*C.SECTOR_MIN,C.WORLD_W*C.SECTOR_MAX);
  const side=Math.random()<0.5?-1:1;
  ew={x:clamp(enemyX+side*rand(C.EW.OFFSET_MIN,C.EW.OFFSET_MAX),C.WORLD_W*0.42,C.WORLD_W-70),hp:C.EW.HP,alive:true,seen:false};
  genTerrain(); genTrees();
  wind=rand(-C.WIND_MAX,C.WIND_MAX);
  const sw=rand(340,520);
  state={elev:52,pwr:70,enemyHP:C.ENEMY_HP,playerHP:C.PLAYER_HP,rounds:0,reload:0,over:false,win:false,enemyKnown:false,detect:0,detRate:0,
    enemyTimer:EN.COOLDOWN, sector:[clamp(enemyX-sw,300,C.WORLD_W-120),clamp(enemyX+sw,300,C.WORLD_W-60)]};
  shot=null;incoming=[];effects=[];scorch=[];marks=[];shake=0;drone=null;droneCharge=D.BATTERY;droneLockout=0;toast=null;idBanner=0;lowBatt=false;matchTime=0;
  explored=new Uint8Array(N);liveStr=new Float32Array(N);
  updateUI();
}

/* ---------- drone ---------- */
function toggleDrone(){
  if(drone){droneCharge=drone.battery;drone=null;lowBatt=false;setToast('DRONE RECALLED');updateUI();return;}
  if(droneLockout>0){setToast('AIRFRAME LOST — REPLACEMENT INBOUND');return;}
  if(droneCharge<D.MIN_LAUNCH){setToast('DRONE CHARGING — '+Math.round(droneCharge/D.BATTERY*100)+'%');return;}
  drone={x:C.PLAYER_X+140,alt:D.ALT_START,vx:0,battery:droneCharge,targetX:null};
  setToast('RECON DRONE AIRBORNE');updateUI();
}
function setToast(t){toast={text:t,life:2.4};}
function nudgeAlt(dir){if(drone)drone.alt=clamp(drone.alt+dir*45,D.ALT_MIN,D.ALT_MAX);}

/* ---------- firing ---------- */
function fire(){
  if(shot||state.over||state.reload>0)return;
  const px=C.PLAYER_X,py=surfaceY(px)+26,a=state.elev*Math.PI/180,sp=lerp(C.MIN_SPEED,C.MAX_SPEED,state.pwr/100),mz=44;
  shot={x:px+Math.cos(a)*mz,y:py+Math.sin(a)*mz,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,trail:[]};
  state.rounds++; state.reload=C.RELOAD;
}
function gridLabel(x){return 'GRID '+String(Math.round(x/(C.WORLD_W/30))).padStart(2,'0');}
function blast(x,big){
  crater(x,C.CRATER_R,C.CRATER_DEPTH);
  scorch.push({x,r:C.CRATER_R*0.85,a:1});
  effects.push({t:'flash',x,y:surfaceY(x),life:big?0.9:0.5,max:big?0.9:0.5,big:!!big});
  for(let i=0;i<22;i++){const ang=rand(-Math.PI,0),s=rand(60,420);
    effects.push({t:'p',x,y:surfaceY(x),vx:Math.cos(ang)*s,vy:Math.sin(ang)*s+rand(80,260),life:rand(.5,1.4),max:1.4,warm:Math.random()<0.45,size:rand(2,5)});}
  shake=Math.min(16,shake+9);
  let felled=false;for(const t of trees){if(t.alive&&Math.abs(t.x-x)<C.TREE_KILL_R){t.alive=false;felled=true;}}
  if(felled)recomputeConceal();
}
function playerShellImpact(x,y){
  blast(x);
  if(ew&&ew.alive&&Math.abs(x-ew.x)<C.EW.DMG_R){
    ew.hp=Math.max(0,ew.hp-C.MAX_DMG*(1-Math.abs(x-ew.x)/C.EW.DMG_R));
    if(ew.hp<=0){ew.alive=false;blast(ew.x,true);setToast('EW STATION DESTROYED — SPECTRUM CLEAR');}
  }
  const d=Math.hypot(x-enemyX,y-(surfaceY(enemyX)+18));
  if(d<C.SPLASH){state.enemyHP=Math.max(0,state.enemyHP-C.MAX_DMG*(1-d/C.SPLASH));
    if(state.enemyHP<=0&&!state.over){state.over=true;state.win=true;blast(enemyX,true);}}
  const observed=liveStr[Math.round(idxAt(x))]>0.12;
  if(observed){marks.push({x,y:surfaceY(x),grid:gridLabel(x),delta:state.enemyKnown?Math.round(x-enemyX):null,age:0});if(marks.length>6)marks.shift();}
}
function enemyShellImpact(x,y){
  blast(x);
  const d=Math.abs(x-C.PLAYER_X);
  if(d<C.SPLASH&&!state.over){state.playerHP=Math.max(0,state.playerHP-EN.MAX_DMG*(1-d/C.SPLASH));
    if(state.playerHP<=0){state.over=true;state.win=false;blast(C.PLAYER_X,true);}}
}
function enemyFire(){
  const prog=clamp((matchTime-EN.ACQUIRE_DELAY)/EN.RANGE_IN_TIME,0,1);
  const scatter=lerp(EN.SCATTER_MAX,EN.SCATTER_MIN,prog);
  const tx=clamp(C.PLAYER_X+(Math.random()*2-1)*scatter,90,enemyX-60);
  const R=Math.abs(enemyX-tx),th=EN.ARC*Math.PI/180,v=Math.sqrt(Math.max(1,R*C.GRAVITY/Math.sin(2*th)));
  incoming.push({x:enemyX,y:surfaceY(enemyX)+26,vx:-Math.cos(th)*v,vy:Math.sin(th)*v,trail:[]});
}

/* ---------- update ---------- */
function step(dt){
  shake*=Math.pow(0.001,dt);
  if(!state.over)matchTime+=dt;
  if(state.reload>0)state.reload=Math.max(0,state.reload-dt);
  if(toast){toast.life-=dt;if(toast.life<=0)toast=null;}
  if(idBanner>0)idBanner-=dt;
  for(const s of scorch)s.a-=dt*0.04; scorch=scorch.filter(s=>s.a>0.15);
  for(const m of marks)m.age+=dt; marks=marks.filter(m=>m.age<14);
  for(const e of effects){e.life-=dt;if(e.t==='p'){e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy-=300*dt;e.vx*=Math.pow(0.2,dt);}}
  effects=effects.filter(e=>e.life>0);

  // enemy counterbattery
  if(!state.over){
    state.enemyTimer-=dt;
    if(matchTime>EN.ACQUIRE_DELAY && state.enemyTimer<=0){enemyFire();state.enemyTimer=EN.COOLDOWN*rand(0.8,1.2);}
  }
  // incoming shells
  for(const sh of incoming){
    const sub=4,h=dt/sub;
    for(let s=0;s<sub&&!sh.done;s++){
      sh.vy-=C.GRAVITY*h; sh.x+=sh.vx*h; sh.y+=sh.vy*h;
      sh.trail.push({x:sh.x,y:sh.y}); if(sh.trail.length>24)sh.trail.shift();
      if(sh.y<=surfaceY(sh.x)||sh.x<0){enemyShellImpact(sh.x,sh.y);sh.done=true;}
    }
  }
  incoming=incoming.filter(s=>!s.done);

  // drone
  if(drone){
    drone.battery-=dt;
    if(drone.battery<=0){droneCharge=0;droneLockout=D.DEATH_LOCKOUT;drone=null;lowBatt=false;setToast('DRONE DOWN — BATTERY DEPLETED');}
    else{
      lowBatt=drone.battery<D.BATTERY*D.LOW_BATT;
      if(keys['arrowup'])drone.alt+=D.ALT_SPEED*dt; if(keys['arrowdown'])drone.alt-=D.ALT_SPEED*dt;
      drone.alt=clamp(drone.alt,D.ALT_MIN,D.ALT_MAX);
      let ax=0; if(keys['arrowleft'])ax-=D.H_ACCEL; if(keys['arrowright'])ax+=D.H_ACCEL;
      if(ax!==0){drone.targetX=null;drone.vx+=ax*dt;}
      else if(drone.targetX!==null){const dx=drone.targetX-drone.x;if(Math.abs(dx)<8)drone.vx*=0.5;else drone.vx+=clamp(dx,-1,1)*D.H_ACCEL*0.8*dt;}
      drone.vx*=Math.pow(D.H_DAMP,dt);drone.vx=clamp(drone.vx,-D.H_MAX,D.H_MAX);
      drone.x=clamp(drone.x+drone.vx*dt,40,C.WORLD_W-40);
      // EW station: spotted whenever inside live coverage (tall masts, cannot hide)
      if(ew&&ew.alive&&!ew.seen&&vis(ew.x)>0.15){ew.seen=true;setToast('EW STATION DETECTED — JAMMING FIELD MAPPED');}
      // jamming field destroys drones inside it — but only below its ceiling
      if(ew&&ew.alive&&Math.abs(drone.x-ew.x)<C.EW.FIELD&&drone.alt<C.EW.CEIL){
        droneCharge=0;droneLockout=D.DEATH_LOCKOUT;drone=null;lowBatt=false;
        setToast('SIGNAL LOST — DRONE JAMMED');
      }
    }
    if(drone&&!state.enemyKnown){
        const cover=liveStr[Math.round(idxAt(enemyX))],horiz=Math.abs(drone.x-enemyX);
        const half=drone.alt*D.CONE;
        let rate=0;
        if(cover>0.2 && horiz<half){
          // optical fidelity: falls off as the drone climbs (more ground per pixel)
          const fid=clamp(Math.pow(D.REF_ALT/drone.alt,D.FALLOFF),0,1);
          // and falls off toward the edge of the footprint
          const edge=lerp(1,D.EDGE_FLOOR,clamp(horiz/half,0,1));
          // intact cover suppresses what optics can resolve
          const clarity=1-concealment*D.CONCEAL_WEIGHT;
          rate=D.BASE_RATE*fid*edge*clarity;
        }
        state.detRate=rate; if(rate>0)state.detect=Math.min(1,state.detect+rate*dt);
        if(state.detect>=1){state.enemyKnown=true;idBanner=2.6;setToast('TARGET ACQUIRED — CORRECTION ONLINE');}
      }
  }else{
    if(droneLockout>0)droneLockout-=dt; else droneCharge=Math.min(D.BATTERY,droneCharge+D.RECHARGE*dt);
    state.detRate=0;
  }
  computeFog();

  if(shot){
    const sub=4,h=dt/sub;
    for(let s=0;s<sub&&shot;s++){
      shot.vy-=C.GRAVITY*h;shot.vx+=wind*h;shot.x+=shot.vx*h;shot.y+=shot.vy*h;
      shot.trail.push({x:shot.x,y:shot.y});if(shot.trail.length>26)shot.trail.shift();
      if(shot.x<0||shot.x>C.WORLD_W){shot=null;break;}
      if(shot.y<=surfaceY(shot.x)){playerShellImpact(shot.x,shot.y);shot=null;break;}
    }
  }
}

/* ---------- drawing ---------- */
function sky(){const g=ctx.createLinearGradient(0,0,0,cssH);g.addColorStop(0,'#1b2120');g.addColorStop(0.55,'#222826');g.addColorStop(1,'#2b302c');ctx.fillStyle=g;ctx.fillRect(0,0,cssW,cssH);}
function drawTrees(){
  for(const t of trees){if(vis(t.x)<0.1)continue;const gx=X(t.x),gy=Y(surfaceY(t.x));
    if(!t.alive){ctx.strokeStyle='rgba(96,86,70,0.45)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+1,gy-6);ctx.stroke();continue;}
    const h=t.h*scale,topY=t.broken?gy-h*0.55:gy-h;
    ctx.strokeStyle=t.wooded?'rgba(112,134,96,0.5)':'rgba(120,128,118,0.28)';ctx.lineWidth=t.wooded?1.5:1;

      ctx.fillText('▲ SIGNAL DEGRADING — JAMMING NEAR',cssW/2,cssH-m-48);ctx.globalAlpha=1;}
  }
  if(lowBatt&&drone){ctx.textAlign='center';ctx.globalAlpha=0.6+0.4*Math.sin(performance.now()/180);ctx.fillStyle='#ff8a3c';ctx.font='12px JetBrains Mono, monospace';ctx.fillText('● LOW BATTERY — RECALL DRONE',cssW/2,cssH-m-30);ctx.globalAlpha=1;}
  if(toast){ctx.textAlign='center';ctx.globalAlpha=clamp(toast.life,0,1);ctx.fillStyle='#cfeeeb';ctx.font='12px JetBrains Mono, monospace';ctx.fillText(toast.text,cssW/2,m+44);ctx.globalAlpha=1;}
  if(idBanner>0){ctx.textAlign='center';ctx.globalAlpha=clamp(idBanner,0,1);ctx.fillStyle='#ffb27a';ctx.font='20px JetBrains Mono, monospace';ctx.fillText('TARGET ACQUIRED',cssW/2,cssH/2-40);ctx.globalAlpha=1;}
  if(state.over){
    ctx.fillStyle='rgba(8,10,8,0.6)';ctx.fillRect(0,0,cssW,cssH);ctx.textAlign='center';
    if(state.win){ctx.fillStyle='#ffb27a';ctx.font='28px JetBrains Mono, monospace';ctx.fillText('TARGET NEUTRALIZED',cssW/2,cssH/2-6);}
    else{ctx.fillStyle='#e08074';ctx.font='28px JetBrains Mono, monospace';ctx.fillText('EMPLACEMENT LOST',cssW/2,cssH/2-6);}
    ctx.fillStyle='rgba(170,178,166,0.9)';ctx.font='12px JetBrains Mono, monospace';
    ctx.fillText(`${state.rounds} rounds expended · ${matchTime.toFixed(0)}s · New Engagement to reset`,cssW/2,cssH/2+22);
  }
  ctx.restore();
}

/* ---------- loop ---------- */
let acc=0,last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;if(dt>0.1)dt=0.1;acc+=dt;
  while(acc>=C.DT){step(C.DT);acc-=C.DT;}
  const sx=(Math.random()-0.5)*shake,sy=(Math.random()-0.5)*shake;
  ctx.save();ctx.translate(sx,sy);
  sky();drawTrees();drawTerrain();
  drawEmplacement(C.PLAYER_X,true);
  if(state.enemyKnown)drawEmplacement(enemyX,false);
  if(shot)drawShell(shot,false);
  for(const sh of incoming)drawShell(sh,true);
  drawEffects();
  drawFog();
  drawEW();
  drawSector();drawDetect();drawMarks();drawDrone();
  ctx.restore();
  hud();
  requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
const elevS=document.getElementById('elevS'),pwrS=document.getElementById('pwrS'),elevV=document.getElementById('elevV'),pwrV=document.getElementById('pwrV');
const droneBtn=document.getElementById('droneBtn'),droneStat=document.getElementById('droneStat');
function updateUI(){
  elevS.value=state.elev;pwrS.value=state.pwr;elevV.textContent=state.elev.toFixed(1)+'°';pwrV.textContent=state.pwr.toFixed(1)+'%';
  droneBtn.textContent=drone?'Recall Drone (E)':'Launch Drone (E)';
  droneStat.textContent=drone?('alt '+Math.round(drone.alt)+'m'):(droneLockout>0?'airframe lost':(droneCharge>=D.MIN_LAUNCH?'drone ready':'drone charging'));
}

/* ---------- input ---------- */
const keys={};
function adjElev(dir){const s=keys['shift']?C.ELEV_FINE:C.ELEV_STEP;state.elev=clamp(state.elev+dir*s,C.MIN_ELEV,C.MAX_ELEV);updateUI();}
function adjPwr(dir){const s=keys['shift']?C.PWR_FINE:C.PWR_STEP;state.pwr=clamp(state.pwr+dir*s,0,100);updateUI();}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(k==='shift'){keys['shift']=true;return;}
  if(['arrowup','arrowdown','arrowleft','arrowright'].includes(k)){keys[k]=true;return;}
  if(k==='a')adjElev(-1);else if(k==='d')adjElev(1);
  else if(k==='w')adjPwr(1);else if(k==='s')adjPwr(-1);
  else if(k===' ')fire();else if(k==='e')toggleDrone();else if(k==='r')fresh();
});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='shift')keys['shift']=false;if(keys[k]!==undefined)keys[k]=false;});
elevS.addEventListener('input',()=>{state.elev=parseFloat(elevS.value);updateUI();elevS.blur();});
pwrS.addEventListener('input',()=>{state.pwr=parseFloat(pwrS.value);updateUI();pwrS.blur();});
document.querySelectorAll('.bar').forEach(b=>b.addEventListener('click',e=>{
  const btn=e.target.closest('button');if(!btn)return;
  switch(btn.dataset.act){
    case 'elev-':adjElev(-1);break;case 'elev+':adjElev(1);break;
    case 'pwr-':adjPwr(-1);break;case 'pwr+':adjPwr(1);break;
    case 'fire':fire();break;case 'reset':fresh();break;
    case 'drone':toggleDrone();break;case 'alt+':nudgeAlt(1);break;case 'alt-':nudgeAlt(-1);break;
  }
}));
cv.addEventListener('click',e=>{if(!drone)return;const r=cv.getBoundingClientRect();drone.targetX=clamp((e.clientX-r.left)/r.width*C.WORLD_W,40,C.WORLD_W-40);});

/* ---------- boot ---------- */
new ResizeObserver(()=>resize()).observe(document.getElementById('stage'));
resize();fresh();requestAnimationFrame(frame);
</script>
</body>
</html>
