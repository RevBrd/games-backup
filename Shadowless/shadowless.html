/* The deck itself, as a list rather than as art. You are counting here, not
   admiring — the art is two inches to the left in the pool. */
.decklist{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.dlgroup{font-size:8.5px;letter-spacing:.16em;color:var(--matink);margin:6px 0 2px;padding-bottom:2px;
  border-bottom:1px solid var(--matline)}
.dlrow{display:flex;align-items:center;gap:6px;padding:2px 4px;cursor:pointer;border-radius:2px;font-size:11px}
.dlrow:hover{background:rgba(226,168,75,.10)}
.dlrow .q{font-weight:700;color:var(--stock);min-width:18px}
.dlrow .n{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#B7C6BE}
.dlrow .v{font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.dlrow .x{color:var(--matink)}
.dlrow:hover .x{color:var(--red)}
/* Legality, always visible, never a popup. You should be able to see why a
   deck is not buildable at the moment you make it unbuildable. */
.legality{display:flex;flex-direction:column;gap:2px;font-size:10px}
.legrow{display:flex;gap:6px;align-items:flex-start;color:var(--matink)}
.legrow.ok{color:#7FA88E}
.legrow.bad{color:var(--red)}
.legrow.warn{color:var(--amber)}
.legrow i{font-style:normal;width:11px;flex:0 0 auto}
.buildacts{display:flex;gap:6px;flex-wrap:wrap}
/* A pool tile you already have in the deck says so, and a tile you cannot add
   says why by going quiet rather than by disappearing — a pool that reshuffles
   as you click it is impossible to work in. */
.colltile .inuse{position:absolute;left:2px;bottom:2px;z-index:2;font-size:8.5px;font-weight:700;
  padding:0 4px;border-radius:2px;background:#3A2F1C;color:var(--amber);border:1px solid #6A5326}
.colltile.spent{opacity:.34;cursor:default}
.colltile.spent:hover{outline:none}
.colltile.unowned{opacity:.5}
.buildhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.buildhead h2{margin:0;font-family:var(--serif);font-weight:600;font-size:18px;color:var(--stock)}

/* Peek / Clairvoyance. Faces big enough to read at a glance, because the whole
   point of the panel is that you close it when you are done looking. */
.revealrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 2px}
.revealcard{display:flex;flex-direction:column;align-items:center;gap:3px}
.revealcard .cardface{width:auto;max-width:100%;height:clamp(96px,20vh,190px);margin:0}
.revealname{font-size:9.5px;letter-spacing:.06em;color:var(--matink);text-align:center;max-width:120px}
/* The panel is centred, so its one button should be too — .actionbar is built
   for the board, where it sits left. */
.sheet .revealrow + .actionbar{justify-content:center}

/* ============================ THE LADDER (Job 7b) ============================
   The OPPONENT half of deck select. It replaces a four-tile deck grid with a
   roster that grows every time a set goes live, so it gets its own bounded
   scroll box rather than making the page taller — same call the 221-card
   collection grid made, and `keepScroll` holds your place through the render a
   win triggers. */
/* Deck select is the ONE screen whose content grows without bound — the roster
   gains a bracket every time a set goes live. So it is pinned to the viewport
   and the ladder is the single flexible child: everything else on the screen is
   fixed-height, the ladder takes what is left, and it scrolls inside itself
   rather than pushing the Play button off the bottom. Which is what happened
   the first time, at 1366x768: 864px of content, button gone.

   Still CSS-only. LAYOUT.md's rule for this screen is that there is nothing to
   measure and no fitter is needed, and flexbox is enough to keep that true.
   `.starter` is excluded — it is one row on an empty page and wants to grow. */
/* overflow-y:auto is the escape hatch, and it is not optional. Pinning the
   screen to 100vh without it means a viewport too short for the content spills
   it below the fold with NO scrollbar — the Play button simply unreachable.
   1280x600 is the real worst case (CLAUDE.md: display scaling can leave a
   "1080p laptop" at 1280x600 CSS pixels) and it lands there. */
.deckscreen:not(.starter){height:100vh;min-height:0;overflow-y:auto}
/* NO auto margins here. LAYOUT.md bans them inside `.boardcol` because an auto
   margin resolved in a `zoom`ed flex column is invisible to both offsetTop and
   getBoundingClientRect — this screen has no zoom, so that exact trap does not
   apply, but both margins I reached for first were redundant anyway. The base
   rule's `align-items:center` already centres the box, and `.ladgrp` already
   absorbs the leftover height, which is the same fix LAYOUT.md describes for
   the board: stop needing the measurement and let a flex child take the slack. */
.deckscreen:not(.starter) .deckbox{max-height:100%;overflow-y:auto}
/* NO min-height:0 on these two. They must stay at least as tall as their own
   content, or the locked strips escape the wrapper and paint straight over the
   options row below — which is what happened at 1280x600 the first time. Only
   `.ladder` may shrink, and only down to its floor; it is a scroll container,
   so its own min-content contribution is already zero and the explicit
   min-height is what the wrappers end up sized against. */
.ladgrp{flex:1 1 auto}
.ladwrap{display:flex;flex-direction:column;gap:6px;flex:1 1 auto}
/* The locked strips never scroll away — see renderLadder(). */
.ladlocked{flex:0 0 auto;display:flex;flex-direction:column;gap:4px}
/* The Play bar STICKS to the bottom of the scrolling box. This is the fix that
   actually holds, and it replaces three rounds of shaving pixels off other
   things. The arithmetic is unwinnable otherwise: at 1366x768 the fixed chrome
   (title, collection strip, your decks, the locked strips, the options row)
   comes to about 590px, and ONE full row of challengers plus its heading needs
   172. There is no viewport-independent way to fit both, and the ladder only
   grows — every set that goes live adds a bracket. So the box scrolls, and the
   one control you always need stays put instead of being shaved into. */
.deckscreen:not(.starter) .deckgo{
  position:sticky;bottom:0;z-index:2;padding-top:8px;
  background:linear-gradient(to bottom,rgba(24,32,29,0) 0%,var(--mat2) 45%,var(--mat2) 100%);
}

/* The min-height is a FLOOR OF ONE FULL TILE, and it is the important number.
   Without it the flex squeeze wins on a short viewport: at 1280x600 the ladder
   collapsed to about 70px and rendered a row of card art with every name, title
   and status clipped off — unusable, and the shot is the only thing that could
   have shown it. With the floor, a viewport too short to fit everything scrolls
   the whole box (see .deckbox above) instead of crushing one child. */
.ladder{
  display:flex;flex-direction:column;gap:clamp(7px,1.5vh,13px);
  flex:1 1 auto;min-height:clamp(172px,24vh,205px);
  overflow-y:auto;overflow-x:hidden;padding-right:4px;
}
.ladbracket{display:flex;flex-direction:column;gap:5px}

/* A locked bracket is still SHOWN — seeing the shape of what is ahead from the
   first match is why the ladder is visible at all, and hiding it would make the
   game look like it has eight opponents in it. It is shown as one line, though.
   A grid of tiles nobody can click is the same information at ten times the
   height, and it cost the Play button its place on a 768px screen. */
.ladshut{
  display:flex;align-items:baseline;gap:8px;
  border:1px dashed var(--matline);border-radius:4px;padding:4px 9px;opacity:.6;
}
.ladshut b{font-family:var(--serif);font-weight:600;font-size:13px;color:var(--stock)}

.ladhead{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  border-bottom:1px solid var(--matline);padding-bottom:3px;
}
.ladhead b{font-family:var(--serif);font-weight:600;font-size:14px;color:var(--stock)}
.ladset{font-size:9px;letter-spacing:.2em;color:var(--matink);text-transform:uppercase}
/* The progress clause sits at the far end because it is the thing that changes
   between visits, and a moving value in a fixed place is easier to find. */
.ladprog{margin-left:auto;font-size:10px;color:#8A9A93}
.ladprog.ready{color:var(--amber)}
.ladprog.done{color:var(--grn)}
.ladnote{font-size:10px;padding-bottom:2px}

/* Smaller than a deck tile: there can be twenty of these where there were four. */
.foegrid{justify-content:flex-start;gap:7px}
.foecard{flex:0 0 132px;max-width:132px;padding:6px 7px}
.foecard .dart .cardface,.foecard .dart .cardback.deckback{height:clamp(52px,8.5vh,86px)}
.foecard .dname{font-size:13px}

/* Locked reads as unavailable rather than as absent — no hover lift, no
   pointer, and the face is withheld because you have not met them yet. */
.foecard.locked{opacity:.45;cursor:default;filter:grayscale(.7)}
.foecard.locked:hover{border-color:var(--matline);transform:none}
/* The rival is the only tile with a warm edge, so the eye lands on the thing
   the bracket is counting toward. */
.foecard.boss{border-color:#6B5330;background:rgba(226,168,75,.045)}
.foecard.boss.locked{border-color:var(--matline)}
.foecard.extra{border-style:dashed}

/* The unlock line on the game-over sheet. A boss opening a set is the largest
   thing that happens outside a pack, and it was a clause on a sentence first. */
.unlocknote{
  border-left:2px solid var(--amber);padding:4px 0 4px 9px;margin:6px 0 0;
  font-size:12px;
}
.unlocknote b{color:var(--amber)}
.unlocknote span{color:#8A9A93}

</style>

// EFFECT SCRIPTS — hand-authored. Each card_id maps to its implemented behaviour.
// Attacks: `a` is an array parallel to CARD_DB[id].attacks; each entry is a verb list.
// Trainers/Energy: `t` is a verb list.
// A card absent from this table, or with a null entry, is NOT IMPLEMENTED and the
// deck validator will refuse to build a deck containing it.
//
// VERB REFERENCE — THIS LIST IS THE CONTRACT. Adding a verb to engine.js without
// adding it here is how the next card author reinvents it under a second name.
// It went stale once, during Base Set, and cost the Job 6 planning pass an hour of
// rediscovery: half the verbs Jungle and Fossil need were already built and
// undocumented. Every verb the engine implements appears below.
//
//   ATTACKS — whole-attack replacements. Intercepted BEFORE the normal pipeline,
//   so nothing else in the script runs:
//     METRONOME                    copy a CHOSEN attack of the defender's, re-entering
//                                  runAttack with self still the attacker. Cannot copy
//                                  another Metronome. See RULINGS.md
//     MIRROR_MOVE                  re-apply the defender's `lastAttackResult` flat, past
//                                  W/R. A recorded event, NOT a recomputation
//
//   ATTACKS — cost phase (checked for legality, paid on use; Metronome skips these):
//     COST_DISCARD_ENERGY {n, t}   discard n Energy providing type t, attached to self
//     COST_DISCARD_ALL_ENERGY      discard every Energy attached to self
//     ONCE_WHILE_IN_PLAY           this attack may be used only once per stay in play
//     REQUIRE_DEF_STATUS {s, label}  illegal unless the defender has status s
//
//   ATTACKS — damage-shaping. These REPLACE the printed damage and run in script
//   order, so a later one overwrites an earlier one:
//     FLIP_OR_NOTHING              flip; tails => whole attack does nothing
//     DMG_PER_HEAD {coins, per}    flip N coins; damage = per * heads
//     DMG_PER_COUNTER_SELF {per}   damage = per * (own damage / 10)
//     DMG_MINUS_PER_COUNTER_SELF {base, per}
//                                  base - per * (own damage / 10), floored at 0
//     DMG_PER_DEF_ENERGY {base, per}   base + per * Energy attached to the defender
//     DMG_PER_DEF_COUNTER {base, per}  base + per * damage counters on the defender
//     DMG_PER_SPARE_ENERGY {base, per, t}
//                                  base + per * (Energy of type t attached to self
//                                  MINUS what this attack's own cost needs). The
//                                  Water Gun / Hydro Pump family
//     DMG_HALF_REMAINING           half the defender's REMAINING HP, rounded up to 10
//                                  (Super Fang)
//     FLIP_BONUS_OR_RECOIL {base, bonus, recoil, label}
//                                  ONE flip governs both: heads => base + bonus,
//                                  tails => base and self takes `recoil`. Pass
//                                  recoil: 0 for a plain heads-bonus attack
//
//   ATTACKS — post-damage. All of these are skipped on a target whose effects are
//   blocked (Barrier); the ones acting on SELF are not:
//     STATUS {s}                   apply status to defender
//     STATUS_ON_FLIP {s}           flip; heads => apply status to defender
//     STATUS_COIN_EITHER {heads, tails}
//                                  heads one condition, tails the other — never nothing
//     TOXIC {n}                    Poison the defender, and set its between-turns
//                                  Poison damage to n instead of the usual 10
//     RECOIL {n}                   self takes n damage (never W/R, never Retaliate)
//     RECOIL_ON_FLIP {n, label}    flip; TAILS => self takes n damage
//     HEAL_SELF_ALL                remove all damage counters from self
//     HEAL_SELF_IF_DAMAGED {n}     remove n counters from self unless ALL damage
//                                  was prevented
//     BENCH_SPLASH {n}             n damage to every Benched Pokemon on BOTH sides,
//                                  ignoring Weakness/Resistance
//     BENCH_SPLASH_OWN {n}         n damage to your OWN Benched Pokemon only (Earthquake)
//     DISCARD_DEF_ENERGY           discard 1 Energy card from the defender
//     ATTACK_LOCK                  disable ONE of the defender's attacks (by index)
//                                  during the opponent's next turn (Amnesia)
//     JAM_DEFENDER {label}         defender must flip to attack next turn or it fails
//     WHIRLWIND                    the DEFENDING player chooses a Benched Pokemon and
//                                  switches it in. Sets state.pendingSwitch and defers
//                                  the end of turn — the one decision a player makes
//                                  during the opponent's turn
//     SWITCH_DEFENDER_CHOOSE       the ATTACKER picks one of the defender's benched
//                                  and drags it into the Active spot
//     BARRIER                      prevent ALL effects of attacks (incl. damage) on
//                                  self during the opponent's next turn
//     BARRIER_ON_FLIP {label}      flip; heads => the same (Agility)
//     PREVENT_ALL_DMG_SELF_ON_FLIP flip; heads => prevent all DAMAGE to self during the
//                                  opponent's next turn. Other effects still land
//     HARDEN {threshold}           prevent damage to self of `threshold` or less
//                                  during the opponent's next turn (after W/R)
//     DESTINY_BOND                 if something KOs self during the opponent's next
//                                  turn, that Pokemon is Knocked Out too
//     CONVERT_DEF_WEAKNESS         set the defender's Weakness to a chosen type,
//                                  PERMANENTLY while it stays in play (Conversion 1)
//     CONVERT_SELF_RESISTANCE      the same for self's Resistance (Conversion 2)
//
//   TRAINERS — `t` rather than `a`. Each is one whole card; the legality check and
//   the effect live in two switches in engine.js and BOTH must gain a case:
//     T_DRAW {n}                   T_HEAL {n}                T_POKEDEX {n}
//     T_ENERGY_RETRIEVAL {n}       T_DISCARD_ENERGY_THEN_HEAL {n}
//     T_SWITCH_OWN                 T_SWITCH_OPPONENT         T_SCOOP_UP
//     T_DISCARD_OPP_ENERGY         T_SUPER_ENERGY_REMOVAL    T_DEVOLUTION_SPRAY
//     T_PLUSPOWER                  T_DEFENDER                T_FULL_HEAL
//     T_LASS                       T_PROFESSOR_OAK           T_IMPOSTOR_OAK
//     T_MAINTENANCE                T_POKEMON_CENTER          T_REVIVE
//     T_POKEMON_FLUTE              T_COMPUTER_SEARCH         T_ITEM_FINDER
//     T_POKEMON_TRADER             T_POKEMON_BREEDER
//
// POKEMON POWERS
//   `p` is a single object, not a verb list — Powers are not attacks and don't
//   share the attack pipeline. They fire outside the attack step, and the ones
//   that say "as often as you like" fire repeatedly within one turn.
//
//   Every Base Set Power carries "can't be used if <self> is Asleep, Confused or
//   Paralyzed", so the engine gates ALL of them on that and no card restates it.
//   A Power works wherever its Pokemon is — Active or Bench — unless noted.
//
//   { kind, name, ... }
//     RETALIATE {dmg}        passive. When an opponent's attack damages this
//                            Pokemon, deal `dmg` back to the attacker, ignoring
//                            Weakness and Resistance. Fires even if this Pokemon
//                            is Knocked Out by that damage.
//     ENERGY_AS {type}       toggle, lasts the rest of the turn. Every Energy
//                            attached to this Pokemon counts as `type` for
//                            paying attack costs. Symbol COUNT is unchanged, so
//                            Double Colorless still pays for two.
//     MOVE_DAMAGE            interactive, repeatable. Move 1 damage counter
//                            between your own Pokemon. Illegal if it would Knock
//                            Out the receiving Pokemon.
//     MOVE_ENERGY {energy}   interactive, repeatable. Move 1 basic Energy of that
//                            type from one of your Pokemon to a different one.
//                            No restriction on the destination's type.
//     BUZZAP                 interactive, ONCE. Knocks out its own Pokemon and
//                            turns that card into an Energy card providing 2 of a
//                            chosen type, attached to another of your Pokemon.
//                            The opponent takes a Prize — see RULINGS.md, which
//                            is emphatic, and which two of us guessed wrong.
//                            Takes a `type` as well as a target, so its actions
//                            enumerate (target, type) pairs.
//     EXTRA_ATTACH {energy, targetType}
//                            interactive, repeatable. Attach 1 basic Energy of
//                            that type FROM HAND to one of your Pokemon of
//                            `targetType`. Does NOT consume the turn's one
//                            Energy attachment.
//
//   PASSIVE POWERS (Job 6b). Nothing fires these — they are CONSULTED at the
//   moment they matter, via engine.activePower(slot, kind). Never push one into
//   slot.effects: Toxic Gas switches every one of them on and off from either
//   side of the board, and a materialised copy would need resynchronising on
//   evolution, Knock Out, retreat and status. See ENGINE.md.
//
//     DAMAGE_HALVE           incoming damage is halved, rounded DOWN to the
//                            nearest 10, after Weakness and Resistance.
//                            (Kabuto Armor)
//     PREVENT_AT_LEAST {n}   incoming damage of n or MORE is prevented entirely.
//                            The inverse of HARDEN: big hits bounce, small ones
//                            land. (Invisible Wall)
//     FLIP_TO_NEGATE         one coin for the whole attack; heads prevents
//                            everything done to this Pokemon. Damage aimed
//                            elsewhere, and the attacker's own recoil, still
//                            happen. (Transparency)
//     STATUS_IMMUNE          cannot be given a Special Condition. (Thick Skinned)
//     NO_EVOLUTION           NEITHER player may play an Evolution card.
//                            (Prehistoric Power)
//     TOXIC_GAS              every Power except other Toxic Gases is switched
//                            off, both sides, from anywhere. (Muk)
//     RETREAT_DISCOUNT {n}   while BENCHED, this side's retreat costs n less.
//                            Stacks. (Retreat Aid)
//
//   `always: true` on a Power means the card prints no "can't be used if Asleep,
//   Confused or Paralyzed" clause and the blanket gate must not apply — Dodrio
//   and Dragonite. Every Base Set Power carries the clause; do not add `always`
//   without checking the printed text.
//
//   "1 <Type> Energy card" means a BASIC one. Double Colorless is excluded by
//   type anyway, but Rainbow Energy later on would not be, so the check is on
//   cls === 'Basic' rather than on the type alone.
//
//   Interactive Powers come in two shapes and the UI reads which from the
//   enumerated actions: those carrying `from` need a source click then a target
//   click; those without need only a target click.
//
//   Interactive Powers enumerate one legal action per (source, target) pair, so
//   the AI can score them like any other action and the UI can highlight them.
//
// LASTING EFFECTS — what the verbs above actually PUSH
//   Several verbs do their work by appending to `slot.effects`, which is an
//   ordered modifier chain read by computeDamage() and cleared by expiry. Reach
//   for an existing kind before inventing a verb; three of these have no verb of
//   their own yet and are placed only by Trainers.
//     DAMAGE_BONUS      {amount, label}     added AFTER W/R          (PlusPower)
//     DAMAGE_REDUCTION  {amount, label}     subtracted AFTER W/R     (Defender)
//     PREVENT_UP_TO     {threshold, label}  prevent if <= threshold  (Harden)
//     PREVENT_ALL_DAMAGE                    damage only, effects land
//     PREVENT_ALL_EFFECTS                   damage AND effects; also switches the
//                                           slot's own Power off (see powerUsable)
//     ATTACK_DISABLED   {idx, label}        one attack, by index     (Amnesia)
//     ATTACK_FLIP       {label}             must flip to attack      (Smokescreen)
//     DESTINY_BOND

//   turn" duration. An effect carrying a `card` discards that card when it expires.
//

//   case for scores as PLAIN BASE DAMAGE — silently, forever. Adding a verb here

// ---------------------------------------------------------------- ALIASES --
// Jungle and Fossil each print every Rare TWICE — once as Rare Holo and once as
// a non-holo Rare, the same character with the same everything. 31 of the 126
// new cards are exact mechanical duplicates of another card in their own set.
//
// They are aliased rather than copy-pasted. Two Vileplume entries that drift
// apart is a bug nobody would ever find: the game would play correctly right up
// until the moment you happened to own the other printing.
//
// `selftest.js` proves this table rather than trusting it, in both directions —
// every alias points at a mechanically identical card, and every mechanically
// identical pair is aliased. So a set that turns out to print a Rare twice with
// a real difference between them cannot be silently flattened, and a new
// duplicate pair cannot be silently missed.
const EFFECT_ALIASES = {
  'base2-17': 'base2-1',   // Clefable
  'base2-18': 'base2-2',   // Electrode
  'base2-19': 'base2-3',   // Flareon

  'base2-26': 'base2-10',  // Scyther
  'base2-27': 'base2-11',  // Snorlax
  'base2-28': 'base2-12',  // Vaporeon
  'base2-29': 'base2-13',  // Venomoth
  'base2-30': 'base2-14',  // Victreebel
  'base2-31': 'base2-15',  // Vileplume
  'base2-32': 'base2-16',  // Wigglytuff
  'base3-16': 'base3-1',   // Aerodactyl
  'base3-17': 'base3-2',   // Articuno
  'base3-18': 'base3-3',   // Ditto
  'base3-19': 'base3-4',   // Dragonite
  'base3-20': 'base3-5',   // Gengar
  'base3-21': 'base3-6',   // Haunter
  'base3-22': 'base3-7',   // Hitmonlee
  'base3-23': 'base3-8',   // Hypno
  'base3-24': 'base3-9',   // Kabutops
  'base3-25': 'base3-10',  // Lapras
  'base3-26': 'base3-11',  // Magneton
  'base3-27': 'base3-12',  // Moltres

  'base3-29': 'base3-14',  // Raichu — the corpus words its reminder text a
                           //   fraction differently on the two printings
                           //   ("do the damage" / "do that damage"). Same rule.

};

// Applied by reference on purpose: the two ids resolve to the SAME object, so
// they cannot drift even if somebody mutates one at runtime.
for (const dup in EFFECT_ALIASES) {
  const src = EFFECTS[EFFECT_ALIASES[dup]];
  if (src) EFFECTS[dup] = src;
}


// ============================================================================
// ART — card sigils.
//
// We have card TEXT but no card ART. Rather than leave an empty illustration
// window, each card gets a geometric emblem generated deterministically from
// its own card_id, so the same card always looks the same and no two look
// alike. It is not pretending to be a picture of the creature.
//
// The emblem also encodes two true facts, readable at a glance in play:
//   petals      = number of attacks (1-3)
//   ring marks  = retreat cost
// ============================================================================

// Type colours. Two sets: BRIGHT for dark surfaces, INK for pale card stock.
const ENERGY_COLOR = { G: '#6FAE5A', R: '#D4603C', W: '#4E9BC4', L: '#D9BB47', P: '#9269A8', F: '#B07248', C: '#AAB2BB', D: '#5A6672', M: '#8A94A0' };
const ENERGY_INK   = { G: '#4A7C3A', R: '#B44A2A', W: '#2F7CA6', L: '#9A7C12', P: '#6F4C86', F: '#8C5430', C: '#6E7780', D: '#414B56', M: '#69737E' };
const ENERGY_NAME  = { G: 'Grass', R: 'Fire', W: 'Water', L: 'Lightning', P: 'Psychic', F: 'Fighting', C: 'Colorless', D: 'Darkness', M: 'Metal' };

// FNV-1a, then a murmur3 finalizer. The finalizer is not optional: raw FNV-1a
// mixes its LOW bits poorly, and every parameter below is derived with `% n`,
// which reads exactly those bits. Without it, cards whose hashes differ wildly
// still land on identical parameter tuples.
function hash32(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 16; h = Math.imul(h, 2246822507);
  h ^= h >>> 13; h = Math.imul(h, 3266489909);
  h ^= h >>> 16;
  return h >>> 0;
}

// Independent parameter streams. Bit-shifting a single hash reuses overlapping
// bits, which quietly shrinks the real parameter space; separate salted hashes
// keep the dimensions independent as the card pool grows.
function hparam(id, salt, n) { return hash32(id + '#' + salt) % n; }

function polyPoints(cx, cy, r, n, rotDeg) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (rotDeg * Math.PI / 180) + (i * 2 * Math.PI / n) - Math.PI / 2;
    pts.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1));
  }
  return pts.join(' ');
}

function sigilType(card) {
  if (card.kind === 'pokemon') return card.type || 'C';
  if (card.kind === 'energy') return card.provides && card.provides.length === 1 ? card.provides : 'C';
  return 'P';
}

// Returns an SVG string. Pure and deterministic: same card_id, same emblem.
function sigilSVG(card) {
  const h = hash32(card.id);
  const t = sigilType(card);
  const col = ENERGY_INK[t] || ENERGY_INK.C;
  const sides = 3 + hparam(card.id, 'sd', 6);   // 3..8
  const rot = hparam(card.id, 'rt', 360);
  const style = hparam(card.id, 'sy', 3);
  const jitter = hparam(card.id, 'jt', 9) - 4;

  const petals = card.kind === 'pokemon' ? Math.max(1, (card.attacks || []).length) : 1;
  const marks = card.kind === 'pokemon' ? Math.min(4, card.retreat || 0) : 0;

  const parts = [];
  parts.push(`<rect x="0" y="0" width="100" height="100" fill="${col}" opacity="0.07"/>`);

  if (card.kind === 'trainer') {
    // Trainers get a bracket-and-seal motif rather than a creature emblem.
    // There are ~190 Trainers in the WOTC run, so the parameter space has to be
    // wide enough that the birthday problem doesn't produce twins.
    const inset = 16 + hparam(card.id, 'in', 7);
    const sz = 100 - inset * 2;
    const tilt = hparam(card.id, 'ti', 45);
    const core = hparam(card.id, 'co', 4);
    const bars = 2 + hparam(card.id, 'ba', 3);
    const corner = hparam(card.id, 'cn', 3);
    const ring = hparam(card.id, 'ri', 3);
    const studs = hparam(card.id, 'st', 5);
    const barW = 10 + hparam(card.id, 'bw', 5) * 2;
    const innerSz = 34 + hparam(card.id, 'is', 5) * 2;
    parts.push(`<rect x="${inset}" y="${inset}" width="${sz}" height="${sz}" fill="none" stroke="${col}" stroke-width="2.5" opacity="0.85"/>`);
    parts.push(`<rect x="${50 - innerSz / 2}" y="${50 - innerSz / 2}" width="${innerSz}" height="${innerSz}" fill="none" stroke="${col}" stroke-width="1.2" opacity="0.5" transform="rotate(${tilt} 50 50)"/>`);
    const cl = 10 + corner * 5;
    parts.push(`<path d="M${inset} ${inset + cl} L${inset} ${inset} L${inset + cl} ${inset}" fill="none" stroke="${col}" stroke-width="4"/>`);
    parts.push(`<path d="M${100 - inset} ${100 - inset - cl} L${100 - inset} ${100 - inset} L${100 - inset - cl} ${100 - inset}" fill="none" stroke="${col}" stroke-width="4"/>`);
    if (ring === 1) parts.push(`<circle cx="50" cy="50" r="27" fill="none" stroke="${col}" stroke-width="1" opacity="0.4"/>`);
    else if (ring === 2) parts.push(`<circle cx="50" cy="50" r="22" fill="none" stroke="${col}" stroke-width="1" opacity="0.4" stroke-dasharray="4 3"/>`);
    for (let i = 0; i < bars; i++) {
      const y = 50 - (bars - 1) * 4 + i * 8;
      parts.push(`<line x1="${50 - barW}" y1="${y}" x2="${50 + barW}" y2="${y}" stroke="${col}" stroke-width="1.6" opacity="0.55"/>`);
    }
    for (let i = 0; i < studs; i++) {
      const a = (-90 + (i - (studs - 1) / 2) * 26) * Math.PI / 180;
      parts.push(`<circle cx="${(50 + 35 * Math.cos(a)).toFixed(1)}" cy="${(50 + 35 * Math.sin(a)).toFixed(1)}" r="2.6" fill="${col}" opacity="0.8"/>`);
    }
    if (core === 0) parts.push(`<circle cx="50" cy="50" r="7" fill="${col}" opacity="0.9"/>`);
    else if (core === 1) parts.push(`<polygon points="${polyPoints(50, 50, 9, 3, tilt)}" fill="${col}" opacity="0.9"/>`);
    else if (core === 2) parts.push(`<rect x="44" y="44" width="12" height="12" fill="${col}" opacity="0.9" transform="rotate(45 50 50)"/>`);
    else parts.push(`<polygon points="${polyPoints(50, 50, 9, 6, tilt)}" fill="${col}" opacity="0.9"/>`);
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${parts.join('')}</svg>`;
  }

  if (card.kind === 'energy') {
    const rays = 6 + hparam(card.id, 'ry', 5);          // 6..10
    const coreR = 26 + hparam(card.id, 'er', 4) * 2;    // 26..32
    const inner = hparam(card.id, 'ei', 3);
    parts.push(`<circle cx="50" cy="50" r="${coreR}" fill="${col}" opacity="0.9"/>`);
    parts.push(`<circle cx="50" cy="50" r="${coreR}" fill="none" stroke="${col}" stroke-width="2"/>`);
    if (inner === 1) parts.push(`<circle cx="50" cy="50" r="${(coreR * 0.55).toFixed(1)}" fill="none" stroke="#FFF" stroke-width="1.6" opacity="0.5"/>`);
    else if (inner === 2) parts.push(`<polygon points="${polyPoints(50, 50, coreR * 0.5, 6, rot)}" fill="none" stroke="#FFF" stroke-width="1.6" opacity="0.5"/>`);
    for (let i = 0; i < rays; i++) {
      const a = (i * (360 / rays) + rot) * Math.PI / 180;
      parts.push(`<line x1="${(50 + (coreR + 4) * Math.cos(a)).toFixed(1)}" y1="${(50 + (coreR + 4) * Math.sin(a)).toFixed(1)}" x2="${(50 + (coreR + 14) * Math.cos(a)).toFixed(1)}" y2="${(50 + (coreR + 14) * Math.sin(a)).toFixed(1)}" stroke="${col}" stroke-width="3" opacity="0.7"/>`);
    }
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${parts.join('')}</svg>`;
  }

  // ---- Pokemon ----
  // Parameter space has to comfortably exceed the pool size, or the birthday
  // problem produces twins: 1020 Pokemon against a ~58k space yields ~9
  // expected collisions, which is what a narrower version of this actually did.
  const petalRx = 7 + hparam(card.id, 'px', 5);        // 7..11
  const petalRy = 17 + hparam(card.id, 'py', 5);       // 17..21
  const coreR = 21 + hparam(card.id, 'cr', 5);         // 21..25
  const dash = hparam(card.id, 'ds', 2);
  const petalTop = 20 + jitter;

  parts.push(`<circle cx="50" cy="50" r="41" fill="none" stroke="${col}" stroke-width="1" opacity="0.35"${dash ? ' stroke-dasharray="3 4"' : ''}/>`);

  // petals = attack count
  for (let i = 0; i < petals; i++) {
    const a = rot + i * (360 / petals);
    parts.push(`<ellipse cx="50" cy="${petalTop}" rx="${petalRx}" ry="${petalRy}" fill="${col}" opacity="0.30" transform="rotate(${a.toFixed(0)} 50 50)"/>`);
  }

  // core polygon, identity-driven
  parts.push(`<polygon points="${polyPoints(50, 50, coreR, sides, rot)}" fill="none" stroke="${col}" stroke-width="2.4" opacity="0.95"/>`);
  if (style === 0) {
    parts.push(`<polygon points="${polyPoints(50, 50, coreR * 0.54, sides, rot + 180 / sides)}" fill="${col}" opacity="0.75"/>`);
  } else if (style === 1) {
    parts.push(`<circle cx="50" cy="50" r="${(coreR * 0.5).toFixed(1)}" fill="none" stroke="${col}" stroke-width="2.4" opacity="0.9"/>`);
    parts.push(`<circle cx="50" cy="50" r="4.5" fill="${col}"/>`);
  } else {
    for (let i = 0; i < sides; i++) {
      const a = (rot + i * (360 / sides) - 90) * Math.PI / 180;
      const rr = coreR * 0.54;
      parts.push(`<circle cx="${(50 + rr * Math.cos(a)).toFixed(1)}" cy="${(50 + rr * Math.sin(a)).toFixed(1)}" r="3.4" fill="${col}" opacity="0.85"/>`);
    }
  }

  // ring marks = retreat cost
  for (let i = 0; i < marks; i++) {
    const a = (-90 + (i - (marks - 1) / 2) * 22) * Math.PI / 180;
    parts.push(`<circle cx="${(50 + 41 * Math.cos(a)).toFixed(1)}" cy="${(50 + 41 * Math.sin(a)).toFixed(1)}" r="3.6" fill="${col}"/>`);
  }

  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${parts.join('')}</svg>`;
}


// ============================================================================
// DECK GENERATOR
//
// Given a pool of card ids, build a legal 60-card deck: complete evolution
// lines, enough Basics to open reliably, Energy matching the Pokemon's actual
// attack costs, and the 4-copy-by-name rule respected.
//
// Used now for sandbox testing of newly implemented cards, and later for
// generating campaign opponents from a set-gated pool.
// ============================================================================

const DECKGEN_DEFAULTS = {
  size: 60,
  energy: 28,
  maxCopies: 4,
  minBasics: 12,
  trainerTarget: 8,
  // Room held back from the evolution lines for Basics that have no line at
  // all. Without it, step 1 fills the whole Pokemon budget with four chains and
  // step 2 never runs: measured at 6 decks in 2998 containing ANY standalone
  // Basic, which quietly made 23 cards — Ditto, Chansey, Mewtwo, all three
  // Legendary birds, Scyther, Snorlax — unreachable in Sandbox. That matters
  // because CLAUDE.md calls Sandbox the way to play the bespoke cards for real.
  standaloneReserve: 10,
};

function generateDeck(db, poolIds, rand, opts = {}) {
  const cfg = Object.assign({}, DECKGEN_DEFAULTS, opts);
  const pick = (n) => Math.floor(rand() * n);
  const pool = poolIds.filter(id => db[id]);

  const basicEnergy = pool.filter(id => db[id].kind === 'energy' && db[id].cls === 'Basic');
  const trainers = pool.filter(id => db[id].kind === 'trainer');
  const mons = pool.filter(id => db[id].kind === 'pokemon');
  const basics = mons.filter(id => db[id].stage === 'Basic');
  if (!basics.length || !basicEnergy.length) return null;

  const byName = {};
  mons.forEach(id => { (byName[db[id].name] = byName[db[id].name] || []).push(id); });
  // who evolves from whom
  const evosOf = {};
  mons.forEach(id => {
    const f = db[id].evolvesFrom;
    if (f) (evosOf[f] = evosOf[f] || []).push(id);
  });

  const counts = {};       // card_id -> qty
  const nameCounts = {};   // name -> qty (the 4-copy rule is by NAME)
  let total = 0;

  const room = (id, want) => {
    const name = db[id].name;
    const free = cfg.maxCopies - (nameCounts[name] || 0);
    return Math.max(0, Math.min(want, free, cfg.size - total));
  };
  const add = (id, want) => {
    const n = room(id, want);
    if (n <= 0) return 0;
    counts[id] = (counts[id] || 0) + n;
    nameCounts[db[id].name] = (nameCounts[db[id].name] || 0) + n;
    total += n;
    return n;
  };

  // --- 1. pick a few evolution lines, seeded from Basics that actually evolve
  const seeds = basics.slice();
  for (let i = seeds.length - 1; i > 0; i--) { const j = pick(i + 1); [seeds[i], seeds[j]] = [seeds[j], seeds[i]]; }

  const monTarget = cfg.size - cfg.energy - cfg.trainerTarget;
  // Basics nothing evolves from. They are complete on their own, so they are
  // what the reserved room is for — a lone Charmander with no Charmeleon behind
  // it would be worse than no top-up at all.
  const evolvesInto = {};
  mons.forEach(id => { if (db[id].evolvesFrom) evolvesInto[db[id].evolvesFrom] = 1; });
  const standalone = basics.filter(id => !evolvesInto[db[id].name]);

  let lines = 0;
  for (const baseId of seeds) {
    if (total >= monTarget - cfg.standaloneReserve) break;
    if (lines >= 4) break;
    const name = db[baseId].name;
    const chain = [];
    let cur = name;
    while (evosOf[cur] && evosOf[cur].length) {
      const nxt = evosOf[cur][pick(evosOf[cur].length)];
      chain.push(nxt);
      cur = db[nxt].name;
    }
    if (chain.length) {
      add(baseId, 4);
      add(chain[0], 3);
      if (chain[1]) add(chain[1], 2);
      lines++;
    }
  }
  // --- 2. spend the reserve on Basics with no evolution line, THEN fall back to
  // anything. Shuffled so it is a different few every seed rather than whichever
  // happens to sort first.
  const solo = standalone.slice();
  for (let i = solo.length - 1; i > 0; i--) { const j = pick(i + 1); [solo[i], solo[j]] = [solo[j], solo[i]]; }
  for (const baseId of solo) {
    if (total >= monTarget) break;
    add(baseId, 3);
  }
  for (const baseId of seeds) {
    if (total >= monTarget) break;
    add(baseId, 3);
  }
  // guarantee a healthy Basic count
  let basicCount = Object.keys(counts).reduce((a, id) =>
    a + (db[id].kind === 'pokemon' && db[id].stage === 'Basic' ? counts[id] : 0), 0);
  for (const baseId of seeds) {
    if (basicCount >= cfg.minBasics) break;
    const got = add(baseId, 1);
    basicCount += got;
    if (!got) continue;
  }

  // --- 3. Trainers
  const trShuffled = trainers.slice();
  for (let i = trShuffled.length - 1; i > 0; i--) { const j = pick(i + 1); [trShuffled[i], trShuffled[j]] = [trShuffled[j], trShuffled[i]]; }
  let trAdded = 0;
  for (const id of trShuffled) {
    if (trAdded >= cfg.trainerTarget) break;
    trAdded += add(id, 2);
  }

  // --- 4. Energy, weighted by what the chosen Pokemon actually need
  const need = {};
  for (const id in counts) {
    const c = db[id];
    if (c.kind !== 'pokemon') continue;
    (c.attacks || []).forEach(a => a.cost.split('').forEach(t => {
      if (t !== 'C') need[t] = (need[t] || 0) + counts[id];
    }));
  }
  const types = Object.keys(need);
  const remaining = cfg.size - total;
  if (!types.length) {
    // colourless-only deck: any basic Energy will do
    add(basicEnergy[0], remaining);
  } else {
    const totalNeed = types.reduce((a, t) => a + need[t], 0);
    let placed = 0;
    types.forEach((t, i) => {
      const src = basicEnergy.find(id => db[id].provides === t);
      if (!src) return;
      const share = i === types.length - 1
        ? remaining - placed
        : Math.round(remaining * (need[t] / totalNeed));
      const n = Math.max(0, Math.min(share, cfg.size - total));
      if (n > 0) { counts[src] = (counts[src] || 0) + n; total += n; placed += n; }
    });
    // any shortfall (missing Energy type in the pool) goes to whatever exists
    if (total < cfg.size) {
      const src = basicEnergy[0];
      const n = cfg.size - total;
      counts[src] = (counts[src] || 0) + n; total += n;
    }
  }

  if (total !== cfg.size) return null;
  const list = Object.keys(counts).map(id => [counts[id], id]);
  return { name: opts.name || 'Sandbox', list, generated: true };
}


// ============================================================================
// AI — expected-value play.
//
// The core idea: never judge an attack by its printed damage. Enumerate the
// coin-flip outcomes into a probability distribution, run each outcome through
// the ENGINE's own damage calculation, and score the result. That way the bot
// values Twineedle at its true average, understands that Bubblebeam's paralysis
// is worth more than 10 extra damage, and refuses to attack into a Barrier.
//
// Scoring is in abstract "points". Roughly: 1 point ~= 1 damage. A Knock Out is
// worth much more than the damage it took, because Prizes are the win condition.
// ============================================================================

const AI_WEIGHTS = {
  damage: 1.0,          // per point of expected damage dealt
  knockout: 55,         // landing a KO (on top of the damage)
  lastPrize: 240,       // KO that wins the game outright
  selfDamage: 0.8,      // per point of expected damage to self
  selfKO: 70,           // killing your own Pokemon
  benchDamageFoe: 0.7,  // splash onto their bench
  benchDamageMine: 0.9, // splash onto mine
  paralyze: 26,         // costs them a turn
  sleep: 22,            // ~50% they stay down, plus they can't attack
  confuse: 15,          // ~50% their attack fails and they self-hit
  poison: 12,           // 10/turn until they switch
  energyDiscard: 7,     // per Energy burned as an attack cost
  drag: 14,             // forcing a benched Pokemon into the Active spot
  dragKill: 40,         // ...onto something we can finish once it is up
  dragNoKill: -30,      // ...onto something we can neither kill nor silence,
                        // which is a free switch for them, not a tempo gain.
                        // Must outweigh `drag` plus the selection term above it
  healDisarm: 22,       // healing that discards the Energy its own Active needed
                        // to attack. A heal is not worth a turn of offence
  healWaste: 4.0,       // per 10 HP of healing poured past the damage. Sized so
                        // a 20-heal on a 10-damage Pokemon lands UNDER threshold
                        // rather than exactly on it — at 3.0 it scored 0.5
                        // against a 0.5 gate and still went through
  shieldSelf: 20,       // Stiffen / Withdraw / Barrier
  destinyBond: 18,      // arming Destiny Bond when death looks likely
  attachEnable: 1.0,    // scale on "how much better my attacks get"
  attachBuild: 3.5,     // finishing an attack we could not afford yet, per step
  attachAmortise: 1.0,  // progress toward one we still cannot: a step is worth
                        // this much of its share of the attack at the end.
                        // 1.0 = one of the three Energy Zapdos still needs is
                        // worth a third of Thunder. Discounted if the Pokemon
                        // will not survive to fire it
  attachOnType: 4,      // the card pays a TYPED symbol this Pokemon actually
                        // needs, not just its Colorless. Breaks the tie toward
                        // Fire-on-Arcanine over Grass-on-Arcanine
  attachSurplus: -2,    // attaching to a Pokemon that needs nothing. Negative so
                        // it falls under `threshold` and the card is HELD
  evolveHP: 0.45,       // per point of max-HP gained
  evolveBase: 16,       // evolving is good almost always
  benchFirst: 26,       // first spare Basic on the bench is important
  benchMore: 7,         // each additional one
  benchTooMany: 2,
  retreatBase: -6,      // retreating costs tempo and Energy
  dangerSwap: 22,       // ...but escaping a lethal threat is worth it — CAPS the
                        // rescue value below, so a bare Basic is never worth 22
  retreatTempo: 0.55,   // per point of printed damage the swap gives up this turn
  retreatSaveEnergy: 7, // rescue value per Energy already invested in the Active
  retreatSaveEvolved: 9,// ...plus this if it is not a Basic
  retreatNoCause: -14,  // retreating when nothing actually threatens the Active
  wallStick: 1.0,       // how much a Pokemon's "stickiness" cancels the value of
                        // rescuing it. 1.0 = a perfect wall is never worth
                        // saving for its own sake; the Prize term still applies
  retreatPrize: 60,     // value of denying a Prize, over the SQUARE of how many
                        // they still need — 1.7 at six left, 60 at one
  promoteReady: 25,     // sending up something that can attack NOW, divided by
                        // one plus how many Energy it is short — 25 ready, 12.5
                        // one away, 5 at four or more. Was a flat 25-or-nothing
  drawCard: 5,          // per card drawn
  deckBurn: 60,         // cost of spending deck, over the SQUARE of the share of
                        // what remains that the play consumes — ~0 at 40 cards
                        // left, decisive under about 12. See deckRisk()
  deckLoss: 150,        // running yourself out of cards is not an expensive
                        // draw, it is losing. Same shape as lastPrize
  healPer10: 3.5,
  stripEnergy: 11,      // per Energy removed from the opponent
  threshold: 0.5,       // don't bother with actions scoring below this
};

// Local copy: ai.js is concatenated BEFORE engine.js in the bundle, so it
// cannot rely on engine-scope helpers being defined yet.
function aiParseDamage(d) {
  if (!d) return 0;
  const m = String(d).match(/^(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}

const STATUS_VALUE = { Paralyzed: 'paralyze', Asleep: 'sleep', Confused: 'confuse', Poisoned: 'poison' };

// ============================================================================
// WHAT A POKEMON IS FOR — "stickiness", 13 Aug 2026
// ============================================================================
// Trevor, from playtest: Kangaskhan, Chansey, Snorlax and that Electabuzz are
// meant to stand in the Active spot and soak damage until they die. The bot
// retreated them. No weight can express that, because it is not a claim about
// this position — it is a claim about what the card is.
//
// PROPOSED AS A PER-CARD TAG AND BUILT AS A DERIVATION, deliberately. A tag is
// per-card design labour on 221 cards going on 1,251, inherited by every set
// added afterwards and skipped by the first session in a hurry. Everything that
// makes those four walls is already sitting in the card data, so the tag is a
// fact we would be re-typing rather than one we would be adding.
//
// TERMINAL BASICS ONLY, which is Trevor's refinement and the load-bearing part.
// The tempting rule is "cannot evolve any further" and it is wrong: it calls
// Charizard a wall. A Stage 2 is three cards of investment and you absolutely do
// want to rescue it. A Basic with nowhere to go has no future to protect —
// retreating it spends Energy to park a damaged card on the Bench.
//
// Three signals, each already true of the card before we ask:
//   HP        the resource the Pokemon exists to spend. 50 is nothing, 100+ is
//             the whole point. Chansey's 120 is why it is playable at all.
//   RETREAT   what walking away actually costs. Snorlax's 4 is not a drawback
//             bolted on, it is the card telling you it is not going anywhere.
//   UTILITY   an attack that pays rent for standing there — drawing, stalling,
//             or locking the opponent down. Listed by VERB rather than matched
//             on text, because Tauros carries STATUS_SELF_ON_TAILS and that is
//             self-confusion, the exact opposite of a stalling tool. A regex on
//             "Confused" would have made Tauros a wall.
const STALL_VERBS = {
  DRAW: 1, DRAW_ON_FLIP: 1,                      // Kangaskhan's Fetch
  STATUS: 1, STATUS_ON_FLIP: 1, STATUS_COIN_EITHER: 1,   // Snorlax, Electabuzz, Lapras
  PREVENT_ALL_DMG_SELF_ON_FLIP: 1,               // Chansey's Scrunch
  DAMAGE_REDUCTION_SELF: 1,
  HEAL_SELF_ALL: 1, HEAL_SELF_IF_DAMAGED: 1, HEAL_SELF_ON_FLIP: 1,
  HEAL_SELF_EQUAL_DAMAGE: 1,
};
// STATUS_SELF and STATUS_SELF_ON_TAILS are POINTEDLY absent. So is
// DAMAGE_REDUCTION_FROM, which shields against one attacker for one turn —
// a trick, not a job.

const EVOLVED_NAMES = new WeakMap();   // db -> Set of names something evolves FROM
function namesWithAnEvolution(db) {
  let s = EVOLVED_NAMES.get(db);
  if (!s) {
    s = new Set();
    for (const k in db) if (db[k].evolvesFrom) s.add(db[k].evolvesFrom);
    EVOLVED_NAMES.set(db, s);
  }
  return s;
}

// 0 for everything that is not a wall, up to 1 for the most immovable thing in
// the format. Memoised per db: the answer is a property of the card, and the
// evolution scan is over the whole pool.
const WALL_SCORES = new WeakMap();
function wallScore(db, effects, card) {
  if (!card || card.kind !== 'pokemon') return 0;
  let m = WALL_SCORES.get(db);
  if (!m) { m = new Map(); WALL_SCORES.set(db, m); }
  if (m.has(card.id)) return m.get(card.id);

  let v = 0;
  if (card.stage === 'Basic' && !namesWithAnEvolution(db).has(card.name)) {
    const hp = Math.min(1, Math.max(0, ((card.hp || 0) - 50) / 50));
    const ret = Math.min(1, (card.retreat || 0) / 3);
    const scripts = (effects[card.id] && effects[card.id].a) || [];
    const util = scripts.some(l => (l || []).some(x => STALL_VERBS[x.v])) ? 1 : 0;
    v = 0.5 * hp + 0.3 * ret + 0.2 * util;
  }
  m.set(card.id, v);
  return v;
}

class AI {
  constructor(engine, opts = {}) {
    this.E = engine;
    this.W = Object.assign({}, AI_WEIGHTS, opts.weights || {});
    this.mode = opts.mode || 'expert';
  }

  get db() { return this.E.db; }
  get eff() { return this.E.effects; }
  // Honours Transform, exactly as the engine's topCard does. Without this the
  // bot would forecast every Ditto as a 50 HP Basic with no attacks at all —
  // it would never attack with one and would badly misjudge attacking into one.
  top(slot) {
    return (slot && slot.transformedId && this.db[slot.transformedId])
      || this.db[slot.stack[slot.stack.length - 1].id];
  }
  script(slot, idx) {
    const c = this.top(slot);
    const e = this.eff[c.id];
    return (e && e.a && e.a[idx]) || [];
  }
  remainingHP(slot) { return this.top(slot).hp - slot.dmg; }

  // ============================================================================
  // YOUR DECK IS A RESOURCE AND RUNNING OUT OF IT LOSES — 16 Aug 2026
  // ============================================================================
  //
  // Until now `deck.length` reached the scorer in exactly ONE place: Wildfire,
  // which prices the OPPONENT decking out as a weapon. So the bot understood
  // running you out of cards as a way to win and had no concept at all of doing
  // it to itself. Every draw was flat `drawCard` per card — Bill, Fetch, Pay
  // Day, Gambler, and Professor Oak at up to 35 points — none of them looking
  // at what was left.
  //
  // Measured over 648 games on the 18 ladder decks: **17.7% of them end in a
  // deck-out**, 20.5% of all voluntary draws happen with under 20 cards left,
  // and 45 times the side that then lost had burned cards with fewer than five
  // remaining. (The four theme decks say 6.3%, which is the unrepresentative-
  // pool trap in MEASUREMENT.md — do not measure this on them.)
  //
  // TWO TERMS, and they are different in kind. That distinction is the recoil
  // work's lesson reused: `selfKO` could never be made big enough to express
  // "and then the game ends", so the game-ending branch got its own term.
  //
  //   deckBurn  a cost, on the SQUARE of the share of what remains that this
  //             play consumes. Deliberately a curve and not a floor at 20 —
  //             a floor is the cliff shape that has now bitten six times, and
  //             it would make 21-vs-19 cards a personality change.
  //   deckLoss  terminal. If the play empties the deck, you cannot draw on your
  //             next turn and you have simply lost.
  //
  // `burn` is SIGNED. Gambler shuffles the hand back in before drawing, so it
  // is deck-POSITIVE on any hand bigger than about five — it is the only
  // recycling card in the game, and the one you actually want when short.
  deckRisk(pi, burn) {
    const W = this.W;   // per-instance, so `opts.weights` overrides still apply
    const left = this.E.state.players[pi].deck.length;
    if (burn <= 0) {
      // Deck-positive: worth something, and worth more the shorter you are.
      return left >= 25 ? 0 : (-burn) * W.deckBurn / Math.max(4, left) * 0.5;
    }
    if (left - burn <= 0) return -W.deckLoss;
    const frac = burn / left;
    return -W.deckBurn * frac * frac;
  }

  // What a card in hand is actually worth keeping, for the two cards that throw
  // a hand away. Trevor's rule, 16 Aug: don't pitch evolutions you can use,
  // Energy you are short of, or a Trainer worth playing — but get a desperation
  // boost when the hand holds none of what you need.
  handKeepValue(pi, excludeUid) {
    const E = this.E, me = E.state.players[pi];
    const inPlay = E.allSlots(pi);
    let v = 0;
    for (const inst of me.hand) {
      if (inst.uid === excludeUid) continue;
      const c = this.db[inst.id];
      if (!c) continue;
      if (c.kind === 'energy') {
        // Only worth keeping if something actually wants it.
        v += inPlay.some(sl => this.potential(pi, sl).short > 0) ? 4 : 1;
      } else if (c.kind === 'pokemon' && c.evolvesFrom) {
        // An evolution whose target is on the board is a real card.
        v += inPlay.some(sl => this.top(sl).name === c.evolvesFrom) ? 9 : 1.5;
      } else if (c.kind === 'pokemon') {
        v += me.bench.length < 3 ? 4 : 1.5;
      } else {
        v += 2.5;   // a Trainer. Playable ones are worth more, but scoring every
                    // one of them here would recurse into this scorer.
      }
    }
    return v;
  }

  // Am I starved of the things a turn is actually made of? Drives the
  // desperation boost on Oak and Gambler.
  handStarved(pi) {
    const E = this.E, me = E.state.players[pi];
    const inPlay = E.allSlots(pi);
    const hasEnergy = me.hand.some(x => (this.db[x.id] || {}).kind === 'energy');
    const wantsEnergy = inPlay.some(sl => this.potential(pi, sl).short > 0);
    const hasBasic = me.hand.some(x => {
      const c = this.db[x.id] || {};
      return c.kind === 'pokemon' && !c.evolvesFrom;
    });
    let n = 0;
    if (wantsEnergy && !hasEnergy) n++;
    if (me.bench.length <= 1 && !hasBasic) n++;
    return n;
  }

  // ---------------------------------------------------------------- forecast
  // Enumerate coin-flip outcomes for an attack into a probability distribution.
  // Returns raw (pre-Weakness) damage outcomes plus effect probabilities.
  rawOutcomes(atkSlot, defSlot, idx, vopts) {
    const c = this.top(atkSlot);
    const empty = { outcomes: [{ p: 1, dmg: 0 }], statuses: {}, selfDmg: 0, selfWorst: 0, pSelfWorst: 0, energyCost: 0, flags: {} };
    let atk = (c.attacks || [])[idx];
    if (!atk) return { outcomes: [], statuses: {}, selfDmg: 0, selfWorst: 0, pSelfWorst: 0, energyCost: 0, flags: {} };
    let script = this.script(atkSlot, idx);

    // Metronome and Mirror Move resolve to something OTHER than their own
    // printed line, which is blank on both. Forecasting them literally scores
    // them at zero forever — the card works and the bot never picks it, which
    // is exactly how Energy Burn hid a bug earlier in this job.
    if (script.some(v => v.v === 'METRONOME')) {
      const ci = vopts && vopts.copyIdx;
      if (ci === undefined || !defSlot) return empty;
      const dc = this.top(defSlot);
      const copied = (dc.attacks || [])[ci];
      if (!copied) return empty;
      atk = copied;
      // Copied attacks skip their costs, so the cost verbs must not be forecast.
      script = ((this.eff[dc.id] && this.eff[dc.id].a && this.eff[dc.id].a[ci]) || [])
        .filter(v => v.v.indexOf('COST_') !== 0);
    }
    if (script.some(v => v.v === 'MIRROR_MOVE')) {
      const rec = atkSlot.lastAttackResult;
      if (!rec || rec.turn < this.E.state.turn - 1) return empty;
      const st = {};
      for (const x of (rec.statuses || [])) st[x] = 1;
      // A recorded final result is already past Weakness and Resistance.
      return { outcomes: [{ p: 1, dmg: rec.damage || 0 }], statuses: st,
               selfDmg: 0, selfWorst: 0, pSelfWorst: 0, energyCost: 0, flags: { flat: true } };
    }

    let base = aiParseDamage(atk.dmg);
    let outcomes = [{ p: 1, dmg: base }];
    const statuses = {};
    const flags = {};
    let selfDmg = 0, energyCost = 0;
    // WORST-CASE self-damage and how often it happens, alongside the expected
    // figure. An average hides the branch that ends the game: 10 recoil on a
    // coin is "5 expected", and 5 never killed anybody.
    let selfWorst = 0, pSelfWorst = 1;

    const split = (fn) => {
      const next = [];
      for (const o of outcomes) for (const [p2, d2] of fn(o.dmg)) next.push({ p: o.p * p2, dmg: d2 });
      outcomes = next;
    };

    for (const v of script) {
      switch (v.v) {
        case 'COST_DISCARD_ENERGY': energyCost += v.n; break;
        case 'FLIP_OR_NOTHING':
          split(() => [[0.5, 0], [0.5, base]]);
          flags.halfWhiff = true;
          break;
        case 'DMG_PER_HEAD': {
          const n = v.coins, dist = [];
          for (let h = 0; h <= n; h++) {
            let ways = 1;
            for (let k = 0; k < h; k++) ways = ways * (n - k) / (k + 1);
            dist.push([ways / Math.pow(2, n), v.per * h]);
          }
          split(() => dist);
          break;
        }
        case 'DMG_PER_COUNTER_SELF':
          split(() => [[1, v.per * Math.floor(atkSlot.dmg / 10)]]); break;
        case 'DMG_MINUS_PER_COUNTER_SELF':
          split(() => [[1, Math.max(0, v.base - v.per * Math.floor(atkSlot.dmg / 10))]]); break;
        case 'DMG_PER_DEF_ENERGY':
          split(() => [[1, v.base + v.per * (defSlot ? defSlot.energy.length : 0)]]); break;
        case 'DMG_PER_DEF_COUNTER':
          split(() => [[1, v.base + v.per * (defSlot ? Math.floor(defSlot.dmg / 10) : 0)]]); break;
        // `s` may be a list — Venom Powder lands Confused AND Poisoned on one coin.
        case 'STATUS': for (const st of [].concat(v.s)) statuses[st] = 1; break;
        case 'STATUS_ON_FLIP': for (const st of [].concat(v.s)) statuses[st] = 0.5; break;
        case 'RECOIL': selfDmg += v.n; selfWorst += v.n; break;
        case 'RECOIL_ON_FLIP': selfDmg += v.n * 0.5; selfWorst += v.n; pSelfWorst *= 0.5; break;
        case 'BENCH_SPLASH': flags.benchSplash = v.n; break;
        case 'SWITCH_DEFENDER_CHOOSE': flags.drag = true; break;
        case 'PREVENT_ALL_DMG_SELF_ON_FLIP': flags.shield = 0.5; break;
        case 'BARRIER': flags.shield = 1; break;
        case 'HARDEN': flags.harden = v.threshold; break;
        case 'DESTINY_BOND': flags.destinyBond = true; break;
        case 'JAM_DEFENDER': flags.jam = true; break;
        case 'HEAL_SELF_ALL': flags.healAll = true; break;
        case 'HEAL_SELF_IF_DAMAGED': flags.heal = v.n; break;
        case 'ONCE_WHILE_IN_PLAY': flags.oncePerStay = true; break;

        // Everything below scored as plain base damage until 10 Aug 2026. See
        // ENGINE.md, "The silent-failure surface", and the coverage check in
        // selftest.js that now refuses to let a verb land here unnoticed.
        case 'COST_DISCARD_ALL_ENERGY':
          // Thunderbolt. The bot thought this was free and fired it on sight.
          energyCost += atkSlot.energy.length; break;
        case 'DMG_PER_SPARE_ENERGY': {
          // The Water Gun / Hydro Pump family. Mirrors the engine's arithmetic:
          // Energy of type t attached, minus what this attack's own cost eats.
          const need = (atk.cost || '').split('').filter(x => x === v.t).length;
          const have = atkSlot.energy.filter(e =>
            this.db[e.id] && this.db[e.id].provides === v.t).length;
          split(() => [[1, v.base + v.per * Math.max(0, have - need)]]);
          break;
        }
        case 'DMG_HALF_REMAINING':
          // Super Fang prints no damage number, so the bot valued it at zero.
          split(() => [[1, defSlot ? Math.ceil(this.remainingHP(defSlot) / 2 / 10) * 10 : 0]]);
          break;
        case 'FLIP_BONUS_OR_RECOIL':
          split(() => [[0.5, v.base + v.bonus], [0.5, v.base]]);
          selfDmg += v.recoil * 0.5; selfWorst += v.recoil; pSelfWorst *= 0.5; break;
        case 'STATUS_COIN_EITHER':
          statuses[v.heads] = 0.5; statuses[v.tails] = 0.5; break;
        case 'TOXIC':
          // Poison at v.n per turn rather than the usual 10, so scale the weight
          // rather than treating it as ordinary Poison.
          statuses.Poisoned = Math.max(1, v.n / 10); break;
        case 'DISCARD_DEF_ENERGY': flags.stripEnergy = 1; break;
        case 'BENCH_SPLASH_OWN': flags.benchSplashOwn = v.n; break;
        case 'ATTACK_LOCK': flags.attackLock = true; break;
        case 'BARRIER_ON_FLIP': flags.shield = 0.5; break;
        case 'WHIRLWIND': flags.dragWeak = true; break;

        // ---- Job 6d ----
        case 'NO_WR': flags.flat = true; break;      // forecast past W/R, as the card says
        case 'DMG_PER_OWN_BENCH': {
          const side = this.E.sideOf(atkSlot);
          const nb = side === null ? 0 : this.E.state.players[side].bench.length;
          split(() => [[1, v.base + v.per * nb]]);
          break;
        }
        case 'DMG_PER_NAMED_IN_PLAY': {
          const side2 = this.E.sideOf(atkSlot);
          let n5 = 0;
          if (side2 !== null) for (const sl of this.E.allSlots(side2)) if (this.top(sl).name === v.name) n5++;
          split(() => [[1, v.base + v.per * n5]]);
          break;
        }
        case 'HEAL_SELF_EQUAL_DAMAGE': flags.leech = v.half ? 0.5 : 1; break;
        case 'STATUS_SELF': flags.selfStatus = 1; break;
        case 'STATUS_SELF_ON_TAILS': flags.selfStatus = 0.5; break;
        case 'DRAW': flags.draw = v.n; break;
        case 'DRAW_ON_FLIP': flags.draw = 0.5; break;
        case 'BENCH_SNIPE': flags.snipe = { n: v.n || 1, dmg: v.dmg }; break;

        // ---- Job 6d, second batch ----
        case 'DMG_PER_HEAD_UNTIL_TAILS': {
          // Geometric: p(k heads) = 0.5^(k+1). Enumerated to 6 with the tail
          // lumped in, which is ~1.5% of the mass and keeps pLethal honest
          // rather than collapsing the whole thing to its mean.
          const dist = [];
          let acc = 0;
          for (let k = 0; k <= 6; k++) { const pk = Math.pow(0.5, k + 1); acc += pk; dist.push([pk, v.per * k]); }
          dist.push([1 - acc, v.per * 7]);
          split(() => dist);
          break;
        }
        case 'DMG_PER_ENERGY_HEADS': {
          const n = atkSlot.energy.length, dist = [];
          for (let h = 0; h <= n; h++) {
            let ways = 1;
            for (let k = 0; k < h; k++) ways = ways * (n - k) / (k + 1);
            dist.push([ways / Math.pow(2, n), v.per * h]);
          }
          split(() => (n ? dist : [[1, 0]]));
          break;
        }
        case 'WHIRLWIND_ON_FLIP': flags.dragWeak = 0.5; break;
        case 'DAMAGE_REDUCTION_SELF': flags.softShield = v.n; break;
        case 'DAMAGE_REDUCTION_FROM': flags.softShield = v.n; break;
        case 'CANT_ATTACK_ON_FLIP': flags.lockAttack = 0.5; break;
        case 'CANT_RETREAT_ON_FLIP': flags.lockRetreat = 0.5; break;
        case 'BENCH_SPLASH_FLIP_SIDE': flags.splashEither = v.n; break;
        case 'BENCH_SPLASH_PER_FLIP': flags.splashPerFlip = v; break;
        case 'BENCH_SPLASH_TYPED': flags.splashTyped = v.n; break;
        case 'SWITCH_SELF_CHOOSE': flags.selfSwitch = true; break;
        case 'NO_TRAINERS_NEXT_TURN': flags.lockTrainers = true; break;
        case 'BUFF_OWN_ATTACK': flags.buff = v; break;

        // ---- Job 6d, third batch ----
        case 'SEARCH_BASIC_TO_BENCH': flags.callFamily = true; break;
        case 'HEAL_SELF_ON_FLIP': flags.heal = (flags.heal || 0) + (v.n || 1) * 0.5; break;
        case 'ENERGY_FROM_DISCARD': flags.recover = v.n; break;
        case 'TRAINER_FROM_DISCARD': flags.recover = (flags.recover || 0) + 1; break;
        case 'RETURN_DEFENDER_TO_HAND': flags.bounce = true; break;
        case 'REARRANGE_TOP': flags.peek = v.n; break;
        case 'WILDFIRE': flags.wildfire = true; break;
        // Legality gate, like REQUIRE_DEF_STATUS: the engine never offers the
        // attack when it would be illegal, so there is nothing to price.
        case 'REQUIRE_SELF_DAMAGED': break;
      }
    }
    // FLIP_OR_NOTHING suppresses the whole attack, statuses included.
    if (flags.halfWhiff) for (const k in statuses) statuses[k] *= 0.5;
    return { outcomes, statuses, selfDmg, selfWorst, pSelfWorst: selfWorst ? pSelfWorst : 0,
             energyCost, flags };
  }

  // Run each raw outcome through the engine's own damage maths.
  forecast(pi, idx, vopts) {
    const E = this.E;
    const me = E.state.players[pi], you = E.state.players[1 - pi];
    const atkSlot = me.active, defSlot = you.active;
    if (!atkSlot || !defSlot) return null;
    const raw = this.rawOutcomes(atkSlot, defSlot, idx, vopts);
    const hpLeft = this.remainingHP(defSlot);
    // TWO damage numbers, because overkill is worth nothing and everything else
    // here needs the real one.
    //
    //   expDmg     what the attack actually does. What "turns it lethal" and
    //              the leech and Transparency checks all have to read.
    //   expUseful  the same, with each outcome capped at what is left to kill.
    //              There is no trample in this game: 80 into a Pokemon with 40
    //              HP left removes 40 and wastes 40.
    //
    // Capped PER OUTCOME rather than on the mean, which is not the same number
    // for anything that flips a coin — an attack that does 0 or 80 against 40 HP
    // averages 40 raw and 20 useful, and the mean of the capped values is the
    // one that is true.
    let expDmg = 0, expUseful = 0, pLethal = 0, pStopped = 0;
    for (const o of raw.outcomes) {
      const r = E.computeDamage(atkSlot, defSlot, o.dmg, { noWR: !!raw.flags.flat });
      expDmg += o.p * r.dmg;
      expUseful += o.p * Math.min(r.dmg, hpLeft);
      if (r.dmg >= hpLeft) pLethal += o.p;
      // How often the DEFENDER stops it outright, which as of 16 Aug 2026 is
      // also how often the attack's recoil is waived. Same test the engine uses.
      if (r.prevented || (o.dmg > 0 && r.dmg === 0)) pStopped += o.p;
    }
    // Kabuto Armor and Invisible Wall need nothing here — they live inside
    // computeDamage, which is the whole reason the bot can never predict a
    // number the engine would not actually produce.
    //
    // Haunter's Transparency does, because its coin is deliberately NOT in
    // computeDamage (that function is pure). Half the time the attack does
    // nothing at all, so halve both the damage and the odds of the Knock Out.
    if (E.activePower(defSlot, 'FLIP_TO_NEGATE')) {
      expDmg *= 0.5; expUseful *= 0.5; pLethal *= 0.5;
      pStopped += 0.5 * (1 - pStopped);        // the coin stops it half the time on top
    }

    const blocked = E.effectsBlocked(defSlot);
    // Snorlax cannot be given a CONDITION — but it can still be Smokescreened,
    // dragged, and stripped of Energy, so this is its own flag rather than
    // reusing `blocked`, which suppresses all of those too.
    const statusProof = !!E.activePower(defSlot, 'STATUS_IMMUNE');
    return { expDmg, expUseful, pLethal, pStopped, hpLeft, blocked, statusProof, ...raw };
  }

  // ------------------------------------------------------------ attack score
  scoreAttack(pi, idx, vopts) {
    const W = this.W, E = this.E;
    const f = this.forecast(pi, idx, vopts);
    if (!f) return -Infinity;
    const me = E.state.players[pi], you = E.state.players[1 - pi];
    const atkSlot = me.active;

    // USEFUL damage, not printed damage. Two attacks that both kill are worth
    // the same for killing, so the choice between them is their COST — which is
    // how Take Down stopped beating Flamethrower by a tenth of a point while
    // eating 30 recoil to overkill something already dead.
    let s = f.expUseful * W.damage;
    if (f.pLethal > 0) {
      // A Knock Out ends the game two different ways and the bot could see
      // NEITHER of them. Both were found from one of Trevor's games, where it
      // held a lethal attack against his last Pokemon and spent the turn on a
      // Super Potion instead.
      //
      // 1. Taking your last Prize. This read `you.prizes` — the OPPONENT's pile
      //    — which is inverted. Verified against the engine: the player who
      //    scores a KO draws from their OWN pile and wins when it empties
      //    (engine.js checkKOs, `opp.prizes.shift()` then `endGame(1 - pi)`).
      //    So the bonus was firing when the opponent was about to win, and
      //    never when we were. The defensive checks elsewhere — Buzzap, and the
      //    Prize term in retreat — genuinely do mean `you`, and are untouched.
      // 2. Emptying their board. Knocking out their only Pokemon wins on the
      //    spot whatever the Prize count says, and nothing in the AI knew this
      //    win condition existed at all.
      const takesLastPrize = me.prizes.length <= 1;
      const emptiesTheirBoard = you.bench.length === 0;
      s += f.pLethal * ((takesLastPrize || emptiesTheirBoard) ? W.lastPrize : W.knockout);
    }

    // status conditions - suppressed entirely if they're behind a Barrier
    if (!f.blocked) {
      if (!f.statusProof) for (const st in f.statuses) {
        const key = STATUS_VALUE[st];
        if (key) s += f.statuses[st] * W[key];
      }
      if (f.flags.jam) s += W.confuse;          // same shape as Confusion
      if (f.flags.drag && you.bench.length) s += W.drag;
      // Whirlwind drags too, but THEY choose, so they send up their best answer.
      if (f.flags.dragWeak && you.bench.length) s += W.drag * 0.5 * (f.flags.dragWeak === true ? 1 : f.flags.dragWeak);
      // Amnesia. Shuts off one attack rather than making them flip for all of
      // them, so it is worth somewhat less than a jam.
      if (f.flags.attackLock) s += W.confuse * 0.6;
      if (f.flags.stripEnergy && you.active && you.active.energy.length) s += W.stripEnergy;
    }

    // self-harm
    //
    // RECOIL IS PRICED ON HOW CLOSE IT LEAVES YOU, NOT ON ITS SIZE — 13 Aug
    // 2026, from a match log of Trevor's. This was a flat charge with a cliff at
    // the very end: 30 recoil cost the same 24 points whether Arcanine was
    // untouched or already at 60 damage, and only the blow that killed outright
    // paid `selfKO`.
    //
    // What the log showed. Ken's Arcanine, 60 damage on a 100 HP body, chose
    // Take Down (56) over Flamethrower (43) for 30 extra damage that killed
    // nothing, and finished the turn at 90 — one hit from handing over a Prize
    // it did not need to give. It had done the same thing four turns earlier.
    // The two Take Downs in that game that DID knock something out were both
    // correct, because Flamethrower's 50 could not have reached either target;
    // the fault is entirely in the ones that killed nothing.
    //
    // So the cost of recoil is not the HP. It is the share of what remains, and
    // therefore how much closer the NEXT hit is to a Prize. Squared, for the
    // same reason `retreatPrize` is: a tenth of your remaining HP is nothing and
    // three quarters of it is nearly the whole cost of the Pokemon.
    //
    // It MEETS the old cliff rather than replacing it — at `frac` of 1 the term
    // is exactly `selfKO`, which is what a lethal recoil always cost. Every
    // decision the old rule got right is unchanged; only the slope below it is
    // new.
    //
    // RECOIL IS WAIVED WHEN THE DEFENDER STOPS THE DAMAGE — 16 Aug 2026, settled
    // with Trevor and implemented in the engine. The bot has to know, or it goes
    // on refusing Take Down into a Scrunched Chansey for a cost it will not pay.
    // Charged at the odds the recoil actually lands rather than as an on/off
    // switch, because Transparency is a coin and this must not become the fifth
    // flat-with-a-cliff in this file.
    const lands = 1 - (f.pStopped || 0);
    const recoil = f.selfDmg * lands;
    if (recoil > 0) {
      s -= recoil * W.selfDamage;
      const left = Math.max(1, this.remainingHP(atkSlot));
      const frac = Math.min(1, recoil / left);
      s -= W.selfKO * frac * frac;
    }

    // DON'T LOSE THE GAME EITHER — 16 Aug 2026, the exact mirror of the "win the
    // game if you can win the game" rule in `choose`, and found the same way: a
    // match Trevor lost the other way round.
    //
    // Log 06-53-35, final turn. Electabuzz on 10 HP took Thunderpunch, which is
    // a coin: heads a bonus, tails 30 and 10 recoil. It Knocked Arcanine out —
    // and the recoil killed Electabuzz, handed Trevor his last Prize, and lost
    // the game on the turn it scored. The bot rated it 73.5 against a safe
    // Thundershock at 33.
    //
    // AN AVERAGE HID IT. `selfDmg` for that attack is "5 expected", and 5 never
    // killed anybody — the branch that ends the game is invisible the moment it
    // is folded into a mean. So the WORST case is carried alongside, with the
    // odds of reaching it, and priced at `lastPrize` rather than `selfKO`
    // whenever that death is the one that ends the match. Losing is not a big
    // Knock Out; it is a different kind of thing, and `selfKO` at 70 could never
    // outweigh a Knock Out worth 55 plus the damage.
    //
    // Note which pile is which, because the same inversion has bitten twice in
    // this file: when OUR Pokemon dies the OPPONENT draws from THEIR OWN pile,
    // so the pile to read is `you.prizes`.
    const worst = (f.selfWorst || 0) * lands;
    if (worst > 0 && worst >= this.remainingHP(atkSlot)) {
      const givesTheirLastPrize = you.prizes.length <= 1;
      const leavesUsEmpty = me.bench.length === 0;
      if (givesTheirLastPrize || leavesUsEmpty) s -= (f.pSelfWorst || 1) * W.lastPrize;
    }
    if (f.energyCost > 0) s -= f.energyCost * W.energyDiscard;

    // bench splash cuts both ways
    if (f.flags.benchSplash) {
      const n = f.flags.benchSplash;
      for (const b of you.bench) {
        s += Math.min(n, this.remainingHP(b)) * W.benchDamageFoe;
        if (this.remainingHP(b) <= n) s += W.knockout * 0.6;
      }
      for (const b of me.bench) {
        s -= Math.min(n, this.remainingHP(b)) * W.benchDamageMine;
        if (this.remainingHP(b) <= n) s -= W.selfKO * 0.6;
      }
    }

    // Earthquake hits ONLY our own bench — pure downside, and the bot used to
    // see none of it.
    if (f.flags.benchSplashOwn) {
      const n = f.flags.benchSplashOwn;
      for (const b of me.bench) {
        s -= Math.min(n, this.remainingHP(b)) * W.benchDamageMine;
        if (this.remainingHP(b) <= n) s -= W.selfKO * 0.6;
      }
    }

    // defensive plays are worth more the more danger we're in
    const danger = this.incomingThreat(pi);
    const frail = danger >= this.remainingHP(atkSlot);
    if (f.flags.shield) s += f.flags.shield * W.shieldSelf * (frail ? 1.6 : 0.7);
    if (f.flags.harden) s += W.shieldSelf * (danger <= f.flags.harden ? 1.2 : 0.3);
    if (f.flags.destinyBond) s += frail ? W.destinyBond * 1.8 : W.destinyBond * 0.3;
    if (f.flags.healAll) s += Math.min(atkSlot.dmg, this.top(atkSlot).hp) / 10 * W.healPer10;
    if (f.flags.heal) s += Math.min(f.flags.heal * 10, atkSlot.dmg) / 10 * W.healPer10;
    // Leech Life and friends heal from the damage actually dealt, so it is worth
    // nothing on an undamaged attacker and nothing against a Barrier.
    if (f.flags.leech) s += Math.min(f.expDmg * f.flags.leech, atkSlot.dmg) / 10 * W.healPer10;
    // Fetch and Pay Day draw off the same deck everything else does. Trevor's
    // note names them alongside Bill for exactly this reason.
    if (f.flags.draw) s += f.flags.draw * W.drawCard + this.deckRisk(pi, f.flags.draw);
    // Confusing or poisoning yourself is a real cost, priced as the mirror of
    // doing it to them.
    if (f.flags.selfStatus) s -= f.flags.selfStatus * W.confuse * 0.8;
    if (f.flags.snipe) {
      const { n, dmg } = f.flags.snipe;
      for (const b of you.bench.slice(0, n)) {
        s += Math.min(dmg, this.remainingHP(b)) * W.benchDamageFoe;
        if (this.remainingHP(b) <= dmg) s += W.knockout * 0.6;
      }
    }

    // ---- Job 6d, second batch ----
    // Blizzard is a coin on WHOSE bench takes it, so it is worth the average of
    // a good outcome and a bad one rather than either.
    if (f.flags.splashEither) {
      const n = f.flags.splashEither;
      for (const b of you.bench) s += 0.5 * Math.min(n, this.remainingHP(b)) * W.benchDamageFoe;
      for (const b of me.bench) s -= 0.5 * Math.min(n, this.remainingHP(b)) * W.benchDamageMine;
    }
    if (f.flags.splashPerFlip) {
      const { dmg, selfPerTail } = f.flags.splashPerFlip;
      for (const b of you.bench) {
        s += 0.5 * Math.min(dmg, this.remainingHP(b)) * W.benchDamageFoe;
        if (this.remainingHP(b) <= dmg) s += 0.5 * W.knockout * 0.6;
      }
      // Half the bench comes back at us on average, and it can be lethal.
      const expSelf = 0.5 * selfPerTail * you.bench.length;
      s -= expSelf * W.selfDamage;
      if (atkSlot.dmg + expSelf >= this.top(atkSlot).hp) s -= W.selfKO * 0.5;
    }
    if (f.flags.splashTyped && you.active) {
      const t = this.top(you.active).type;
      if (t && t !== 'C') {
        const n = f.flags.splashTyped;
        for (const b of you.bench) if (this.top(b).type === t) s += Math.min(n, this.remainingHP(b)) * W.benchDamageFoe;
        for (const b of me.bench) if (this.top(b).type === t) s -= Math.min(n, this.remainingHP(b)) * W.benchDamageMine;
      }
    }
    // A flat reduction is a weaker shield than preventing everything, and worth
    // more the harder we are about to be hit.
    if (f.flags.softShield) s += Math.min(f.flags.softShield, danger) / 20 * W.shieldSelf;
    // Stopping them attacking at all is close to Paralysis in effect.
    if (f.flags.lockAttack) s += f.flags.lockAttack * W.paralyze * 0.9;
    if (f.flags.lockRetreat) s += f.flags.lockRetreat * W.drag * 0.4;
    if (f.flags.lockTrainers) s += W.drawCard;
    if (f.flags.selfSwitch && me.bench.length) s += frail ? W.dangerSwap : 2;
    // Swords Dance only pays off if we are still here next turn to use it.
    if (f.flags.buff) s += frail ? 4 : (f.flags.buff.base || 0) * 0.35;

    // ---- Job 6d, third batch ----
    // A free Basic onto the Bench is worth roughly what benching one from hand
    // is, and much more when the Bench is nearly empty.
    if (f.flags.callFamily) s += me.bench.length === 0 ? W.benchFirst : W.benchMore;
    if (f.flags.recover) s += f.flags.recover * W.drawCard * 0.8;
    // Hurricane undoes an entire investment — every Energy on it goes back to
    // hand with it — so it scales with what they have committed, and is worth
    // nothing at all if the hit would Knock the target Out anyway.
    if (f.flags.bounce && you.active && f.pLethal < 0.9) {
      s += W.drag + you.active.energy.length * W.energyDiscard * 0.5;
    }
    if (f.flags.peek) s += f.flags.peek * 1.5;
