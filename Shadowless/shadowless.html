<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadowless — a WotC-era Pokémon TCG</title>
<style>
:root{
  /* The desk the mat is lying on. Cooler and darker than the mat itself. */
  --bg:#12161B; --panel:#1F262E; --panel2:#262F39; --line:#323C48;
  --txt:#C6D0DA; --dim:#78848F; --amber:#E2A84B; --red:#C8574C; --grn:#6FAE5A;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;

  /* The playmat. A real one is printed cloth: a single surface with the zones
     silk-screened onto it, which is what makes a board read as a board rather
     than as a form. Everything below with `--mat` draws that printing, not a
     widget — empty zones are ink on the mat, not floating dashed boxes. */
  --mat:#22302B; --mat2:#1B2622; --matline:#3B4E47; --matink:#6E837B;
  --matedge:#090D0C;

  /* Cards are pale stock laid on a dark mat. Names are set in a serif -
     the specimen's name - while every measurement stays in the mono face. */
  --stock:#E3E7E1; --stock2:#D7DCD6; --ink:#161C19; --ink2:#5C6660;
  --hair:#BFC7C0;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:var(--mono); font-size:13px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
/* 324px, down from 380. The card faces are natively 240x330, so the old rail was
   upscaling them ~1.5x and softening a scan that is already soft. Narrowing is
   not a concession here, it is the sharper option — see .cardface. */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 324px;height:100vh}
/* The mat takes the flexible space; hand and bars are fixed. A tall Active with
   three attacks then scrolls the mat instead of pushing the hand off screen. */
.boardcol{display:flex;flex-direction:column;min-width:0;min-height:0;padding:8px 12px 12px;gap:7px}
.empty,.dimtxt{color:var(--dim)}
.small{font-size:11px}

/* ---- status bar ---- */
.statusbar{display:flex;align-items:center;gap:12px;padding-bottom:6px;flex:0 0 auto}
.turnflag{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;color:var(--dim)}
.turnflag.mine{color:var(--amber)}
.turnno,.seedno{color:var(--dim);font-size:10.5px}
.seedno{margin-left:auto}

/* ---- the table: one mat, two halves, mirrored across a centre line ---- */
.table{
  /* The mat takes the leftover height. It used to be `flex:0 1 auto`, on the
     reasoning that spare room was worth more to the hand — but the hand is
     `flex:0 0 auto` and never took any of it. What actually happened was that
     the hand's `margin-top:auto` swallowed the lot and paid it out as a band of
     bare desk, ~90px of it at 1366x768.
     Growing the cloth instead is free: `justify-content:safe center` already
     centres the two halves inside it, so the extra reads as a larger mat rather
     than as a hole. It also removes the last auto margin from this column, which
     matters more than it looks — see the geometry warning in LAYOUT.md. */
  flex:1 1 auto;min-height:0;overflow:auto;
  /* The cloth is exactly as wide as the widest half and centred, so the desk
     shows either side of it. It used to stretch to the whole board column,
     which on a 1900px window printed a metre of empty mat around a board that
     was 800px of content — the same "sprawl rather than a mat" that `.mat` was
     already narrowed to fix, one level further out. Do not give this a width:
     max-content is what keeps it honest as the content changes. */
  width:max-content;max-width:100%;align-self:center;
  /* `safe` so that if the content ever does exceed the mat it overflows
     downward and stays scrollable, instead of centring and putting the top
     out of reach. */
  display:flex;flex-direction:column;justify-content:safe center;
  border-radius:7px;
  background:
    /* a faint weave, so the surface is cloth rather than a flat fill */
    repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,var(--mat2) 0%,var(--mat) 50%,var(--mat2) 100%);
  border:1px solid var(--matedge);
  /* The inner rim is what gives the mat an EDGE. Without it the cloth's bottom
     stop (--mat2) and the desk (--bg) are four points apart and the mat simply
     dissolves into the table — which reads as the board trailing off into empty
     space rather than as an object lying on a desk. It cost a session an hour
     of hunting a "dead band" that was only ever this fade. The dark border
     outside plus a light rim inside is the same two-line trick a real printed
     mat gets from its bound edge. */
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07), inset 0 18px 40px -30px #000;
}
/* Your half of the mat is lit a shade warmer than the far side. It is a small
   difference and it is the whole reason you never have to ask which row is
   yours. */
/* Each half takes the height it actually needs and the mat centres the pair, so
   slack lands as margin at the outer edges while the content still sits against
   the centre line by construction.
   This was `flex:1 1 0` and that was wrong twice over: it forced both halves to
   the same height when your half is far taller (it carries the attack buttons),
   which left a band of empty mat above the opponent while clipping your own
   bench — and because the overflow then happened INSIDE a flex item it never
   reached the table's scrollHeight, so fitBoard() could not see it to correct
   it. Natural height keeps overflow measurable. */
.side{padding:7px 11px 8px;flex:0 0 auto;display:flex;flex-direction:column}
.side.mine{background:linear-gradient(0deg,rgba(226,168,75,.045),rgba(226,168,75,0) 70%)}
.side.foe{background:linear-gradient(180deg,rgba(0,0,0,.14),rgba(0,0,0,0) 70%)}
.sidehead{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
.sidename{font-size:9.5px;letter-spacing:.16em;color:var(--matink)}
.sidedeck{font-size:9.5px;letter-spacing:.04em;color:#5E6E68}
.handcount{display:flex;gap:5px;align-items:baseline;font-size:10px;color:var(--matink);margin-left:auto}
.handcount b{color:#93A39C;font-size:12px}

/* The centre line is the halfway mark printed on the mat. */
.centreline{
  height:17px;display:flex;align-items:center;justify-content:center;position:relative;
  border-top:1px solid var(--matline);border-bottom:1px solid var(--matline);
  background:linear-gradient(180deg,rgba(0,0,0,.30),rgba(0,0,0,.10));
}
.centreline::before,.centreline::after{
  content:'';position:absolute;top:50%;width:30%;height:1px;
  background:linear-gradient(90deg,transparent,var(--matline));
}
.centreline::before{left:5%} .centreline::after{right:5%}

/* The mat is exactly as wide as its contents and centred, so the leftover green
   is margin by construction. It used to stretch to a cap, which meant the prizes
   sat hard against one edge of a 1900px window and the deck against the other
   with a quarter of the screen of empty cloth between them — sprawl rather than
   a mat. Bringing the sides in is most of the "feel" fix. */
.mat{display:flex;gap:14px;align-items:flex-start;justify-content:center;
  width:max-content;max-width:100%;margin:0 auto}
/* Centred, so the two Active Pokemon meet across the centre line instead of
   both hugging the left edge. That facing-off is the picture the board is for. */
.playarea{display:flex;flex-direction:column;gap:6px;min-width:0;align-items:center}
.activezone,.benchzone,.fieldzone{display:flex;flex-direction:column;min-width:0}
.fieldzone{gap:6px}
/* Both halves render Active-then-field so the wide layout can put them in a row
   and have the two Actives align. Stacked, the opponent's order flips so their
   Active still ends up nearest the centre line. */
.side.foe .activezone{order:2}
.side.foe .fieldzone{order:1}
/* Prizes always sit on the side of the field FURTHEST from the centre line, so
   the two benches flank the two Actives and the mirror holds. */
.side.foe .fieldzone .zone.prizes{order:1}
.side.foe .fieldzone .benchzone{order:2}
.side.mine .fieldzone .benchzone{order:1}
.side.mine .fieldzone .zone.prizes{order:2}
/* Zone captions are silk-screened onto the mat: low contrast, wide tracking. */
.zonelabel{font-size:8px;letter-spacing:.22em;color:var(--matink);margin-bottom:3px}
.activezone .activerow{display:flex}
.bench{display:flex;gap:6px}

.railzones{display:flex;flex-direction:column;gap:8px}
.zone{display:flex;flex-direction:column;gap:4px;align-items:center}
.zone-cap{display:flex;gap:4px;align-items:baseline;font-size:8px;letter-spacing:.14em;color:var(--matink)}
.zone-cap b{color:#93A39C;font-size:11px;letter-spacing:0}
.zone.hot .zone-cap b{color:var(--amber)}
/* Printed outlines: every stack sits in a shape screened onto the mat, so an
   empty deck still leaves its footprint behind. */
.stack{position:relative;width:32px;height:44px;border-radius:2px;
  box-shadow:inset 0 0 0 1px var(--matline)}
.stack .cardback{position:absolute;inset:0}
.stack-empty{position:absolute;inset:0;border-radius:2px}

.cardback{
  background:linear-gradient(160deg,#2E3841 0%,#242D35 100%);
  border:1px solid #3C4753;border-radius:2px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 2px rgba(0,0,0,.55);
}
.cardback .cb-mark{
  width:11px;height:11px;border:1.5px solid #4E5A67;border-radius:50%;
  box-shadow:inset 0 0 0 2px #262E36;
}
.cardback.sm{width:32px;height:44px}
.cardback.pz{width:34px;height:47px}
.cardback.pz .cb-mark{width:10px;height:10px;border-width:1px;box-shadow:inset 0 0 0 1px #262E36}
.cardback.taken{background:transparent;border:0;box-shadow:inset 0 0 0 1px var(--matline)}
.cardback.taken .cb-mark{display:none}
/* Prizes are the clock on the game — six cards is the entire win condition — so
   they get their own printed panel with a rule under its heading, not a loose
   grid sitting next to the deck. */
.zone.prizes{
  padding:4px 8px 5px;border-radius:4px;gap:0;
  flex-direction:row;align-items:center;
  background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 1px var(--matline);
}
.zone.prizes .zonelabel{margin:0 9px 0 0;padding-right:9px;align-self:stretch;
  display:flex;align-items:center;border-right:1px solid var(--matline)}
/* One long row, riding above the bench. Six prizes are the entire win condition
   and they read better as a countable strip than as a block. */
.prizegrid{display:flex;gap:5px}
.zone.prizes .zone-cap{margin:0 0 0 9px;padding-left:9px;align-self:stretch;
  align-items:center;border-left:1px solid var(--matline)}
.zone.prizes.hot{box-shadow:inset 0 0 0 1px #6A5326;background:rgba(226,168,75,.07)}
.zone.prizes.hot .zonelabel{color:#A0864F;border-bottom-color:#6A5326}

/* Printed onto the mat rather than panelled: it is a whisper of what just
   happened, not a second log. The rail is still the place you read properly. */
/* Top-aligned, so the ticker starts level with the top of the Active card
   opposite it rather than hanging off the bottom of its box. It was bottom-
   aligned, which anchored it to the BENCH label below and left the gap at the
   top of the field column — the most conspicuous empty space on the mat.
   It still takes the flexible slot, so what slack the column has ends up under
   the printed text where the eye reads it as margin rather than as a hole. */
.matlog{
  display:none;flex-direction:column;justify-content:flex-start;gap:1px;
  flex:1 1 auto;min-height:0;overflow:hidden;
  padding:0 2px 6px;font-size:9.5px;line-height:1.35;color:#5E6E68;
}
.mlline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlline.k-turn{color:#8A7742;letter-spacing:.05em}
.mlline.k-attack{color:#9FB0A8;font-weight:700}
.mlline.k-dmg{color:#A5705F}
.mlline.k-ko{color:#B4574C;font-weight:700}
.mlline.k-prize{color:#A0864F}
.mlline.k-flip{color:#7C8C84}
.mlline.k-win{color:#6FAE5A;font-weight:700}

.midline{min-height:0}
.prompt{color:var(--amber);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.kobanner{color:var(--red);font-size:10.5px;letter-spacing:.24em;font-weight:700;
  animation:kopulse .9s ease-out}
@keyframes kopulse{
  0%{opacity:0;transform:scale(.86)}
  18%{opacity:1;transform:scale(1.06)}
  100%{opacity:.55;transform:scale(1)}
}

/* ---- slots ---- */
.slot{
  background:var(--panel2);border:1px solid var(--line);border-radius:3px;
  padding:7px 8px;
}
.slot.targetable{border-color:var(--amber);cursor:pointer;box-shadow:0 0 0 1px var(--amber) inset}
.slottop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm{font-weight:700}
.hp{font-size:11px;color:var(--dim)}
.hp.hurt{color:var(--amber)}
.slotmeta{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--dim);margin-top:2px}
.wr{font-weight:700}
.dmgbar{height:3px;background:#131820;margin:5px 0;border-radius:2px;overflow:hidden}
.dmgbar i{display:block;height:100%;background:var(--red)}
.energyrow{display:flex;gap:3px;align-items:center;min-height:11px}
.energyrow .none{font-size:9.5px;color:#5A646E}
.pip{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.pips{display:inline-flex;gap:2px;align-items:center}
.free{font-size:10px;color:var(--dim)}
.statuses{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
/* One reserved badge row on the Active, so gaining or losing a condition does
   not resize the card. Rare multi-badge cases still wrap and grow. */
.slot.act .statuses{min-height:13px;margin-top:4px}
.badge{font-size:8.5px;letter-spacing:.08em;padding:1px 4px;border-radius:2px;border:1px solid}
.badge.slp{color:#8FA3C4;border-color:#3F4C63}
.badge.par{color:#D9BB47;border-color:#5A4E23}
.badge.cnf{color:#B78BC9;border-color:#4F3A5A}
.badge.psn{color:#7FBF6A;border-color:#3A5231}
.badge.shd{color:#7FC4D6;border-color:#2F4E58}
.badge.bns{color:var(--amber);border-color:#5C4620}

/* ---- attacks ---- */
.attacks{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.atk{
  text-align:left;background:#2C3742;border:1px solid var(--line);border-radius:2px;
  padding:5px 6px;cursor:pointer;width:100%
}
.atk:hover{border-color:var(--amber);background:#33404D}
.atk.off{opacity:.5;cursor:default}
.atk.off:hover{border-color:var(--line);background:#2C3742}
.atkline{display:flex;align-items:center;gap:8px}
.atkname{font-weight:700;flex:1}
.atkdmg{color:var(--amber);font-weight:700}
.atktext{font-size:10px;color:var(--dim);margin-top:3px;line-height:1.35}
.atkwhy{font-size:10px;color:var(--red);margin-top:3px}

/* ---- hand ---- */
/* The hand is a fanned row that never wraps, so its height is fixed however
   many cards you hold. Overlap tightens as the hand grows; hovering lifts a
   card clear of its neighbours. */
.handpanel{
  /* NO margin-top:auto. It used to pin the hand to the bottom of the column,
     which sounds right and produced a band of bare desk above it — and worse,
     an auto margin inside a `zoom`ed flex column is not reflected in
     getBoundingClientRect() or offsetTop, so the gap was invisible to every
     measurement the fitter and the DEV readout could take. The mat takes the
     leftover now; this stays exactly as tall as the cards in it. */
  flex:0 0 auto;align-self:center;
  /* clip, not hidden: horizontal overflow from sub-pixel rounding under a
     fractional zoom must not raise a scrollbar, but the hover-lift still has to
     be able to rise out of the panel. overflow:hidden would clip that too. */
  overflow-x:clip;overflow-y:visible;
  border:1px solid var(--line);border-radius:5px;
  background:linear-gradient(180deg,#1B2229 0%,#171D23 100%);
  padding:6px 10px 8px;
}
.panelhead{display:flex;justify-content:space-between;align-items:baseline;
  font-size:9.5px;letter-spacing:.16em;color:var(--dim);margin-bottom:5px}
/* stretch, not flex-start: every card in hand is the same height, set by the
   tallest. A ragged row of cards is not what a hand of cards looks like, and the
   short ones carrying some empty stock is the right kind of wrong.
   Centred, because a hand is held in front of you. Left-aligned, a small hand
   sat against one edge of a very wide panel with a metre of empty desk beside
   it, which read as a bug rather than as a hand. */
.hand{display:flex;align-items:stretch;justify-content:center;padding-top:6px}
/* position:relative is load-bearing, not decoration — later siblings paint over
   earlier ones, so without it the z-index below is inert and a lifted card
   still sits under its right-hand neighbour. */
.hand .pcard{flex:0 0 auto;position:relative;z-index:1;
  transition:transform .12s ease, box-shadow .12s ease}
.hand .pcard:not(:first-child){margin-left:var(--fan,-52px)}
.hand .pcard:hover{transform:translateY(-7px);z-index:5;
  box-shadow:0 1px 0 rgba(0,0,0,.45), 0 12px 22px -10px rgba(0,0,0,.85)}
.hand .pcard.sel{transform:translateY(-9px);z-index:6}
/* Overlap hides the right-hand side of every card but the last, so the parts
   that must stay readable — name, type, cost — live in the left strip. */

/* ---- action bar ---- */
.actionbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;flex:0 0 auto;
  border-top:1px solid var(--line);padding-top:7px;min-height:34px}
.barmsg{font-size:11px;color:var(--txt);margin-right:4px}
.btn{background:#2F3A46;border:1px solid var(--line);border-radius:2px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--amber)}
.btn.end{background:#3A2F1C;border-color:#5C4620;color:var(--amber)}
.btn.ghost{background:transparent;color:var(--dim)}
/* Pokemon Powers read as a different class of action from playing a card, so
   they get their own colour rather than sitting in the row looking like a Trainer. */
.btn.power{background:#2A2340;border-color:#4B3E6E;color:#B9A6E0}
.btn.power::before{content:'\26A1';margin-right:.4em;opacity:.85}
/* Energy-type choices for Buzzap; the border carries the type colour. */
.btn.etype{border-width:2px;padding:.3em .7em}
.btn.off{opacity:.4;pointer-events:none}

/* ---- coin flip presentation ---- */
.coinbox{display:flex;align-items:center;gap:12px;padding:2px}
.coinface{
  width:30px;height:30px;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--line);background:#232C36;color:var(--dim);
  font-weight:700;font-size:13px;letter-spacing:.02em;
}
.coinbox.landed .coinface{border-color:var(--amber);color:var(--amber);background:#3A2F1C}
.coinbox.tails .coinface{border-color:#7C8894;color:#9AA5B0;background:#242C35}
.coinmsg{display:flex;flex-direction:column;gap:1px}
.coinbig{font-weight:700;letter-spacing:.06em;color:var(--txt)}
.coinbox.landed .coinbig{color:var(--amber)}
.coinbox.tails .coinbig{color:#9AA5B0}
.coinwhy{font-size:10px;color:var(--dim)}

/* ---- rail ---- */
.rail{border-left:1px solid var(--line);background:#0F1419;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
.tab{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 0;cursor:pointer;color:var(--dim);letter-spacing:.12em;font-size:10.5px}
.tab.on{color:var(--amber);border-bottom-color:var(--amber)}
.logbox{flex:1;overflow:auto;padding:8px 10px;font-size:11px}
.logline{display:flex;gap:8px;padding:1px 0;border-left:2px solid transparent;padding-left:6px}
.lt{color:#4C5661;min-width:18px;text-align:right}
.lx{flex:1;word-break:break-word}
.logline.k-turn{border-left-color:var(--amber);margin-bottom:8px}
.logline.k-turn .lx{color:var(--amber);letter-spacing:.06em}
.logline.k-attack .lx{color:#E4E9EE;font-weight:700}
.logline.k-dmg .lx{color:#E08C7E}
.logline.k-ko{border-left-color:var(--red)}
.logline.k-ko .lx{color:var(--red);font-weight:700}
.logline.k-prize .lx{color:var(--amber)}
.logline.k-status .lx{color:#C9A9D8}
.logline.k-eff .lx{color:#7FC4D6}
.logline.k-flip .lx{color:#8D97A2}
.logline.k-trainer .lx{color:#A9B6C4}
.logline.k-err .lx{color:var(--red)}
.logline.k-win{border-left-color:var(--grn)}
.logline.k-win .lx{color:var(--grn);font-weight:700}
.logline.k-sys .lx{color:#5F6A75}

.devbox,.covbox{flex:1;overflow:auto;padding:10px 12px}
.grp{border:1px solid var(--line);border-radius:3px;padding:9px 10px;margin-bottom:10px;background:var(--panel)}
.grphead{font-size:11px;letter-spacing:.1em;color:var(--dim);margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.row label{min-width:64px;color:var(--dim);font-size:11px}
.row.chk label{min-width:0;flex:1}
.row input[type=text],.row select{flex:1;background:#141920;border:1px solid var(--line);border-radius:2px;padding:4px 6px}
.row input[type=range]{flex:1}
.dump{background:#0F141A;border:1px solid var(--line);border-radius:2px;padding:8px;font-size:10.5px;color:#9FAAB6;max-height:340px;overflow:auto;white-space:pre-wrap}
.covlist{max-height:300px;overflow:auto;margin-bottom:10px}
.covrow{display:flex;align-items:center;gap:7px;padding:2px 0;font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.dot.ok{background:var(--grn)} .dot.no{background:var(--red)}
.cn{flex:1}
.ci{color:#4C5661;font-size:10px}
.verr{color:var(--red);font-size:10.5px;padding-left:14px}
.vwarn{color:var(--amber);font-size:10.5px;padding-left:14px}

/* ---- deck select: the title screen ---- */
/* Same cloth as the mat, because this is the same table — you are sitting down
   at it rather than arriving at a menu. */
.deckscreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:clamp(8px,2vh,22px) 20px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),
    radial-gradient(120% 90% at 50% 0%,var(--mat) 0%,var(--mat2) 55%,#121917 100%);
}
.deckbox{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:clamp(7px,1.7vh,14px)}

.titleblock{text-align:center;padding-bottom:clamp(5px,1.4vh,11px);border-bottom:1px solid var(--matline)}
/* Everything on this screen is sized against the viewport, so the title screen
   fits without scrolling on a short page instead of needing its own fitter. */
.gametitle{
  margin:0;font-family:var(--serif);font-weight:600;
  font-size:clamp(28px,5.2vh,46px);line-height:1;letter-spacing:.28em;text-indent:.28em;
  color:var(--stock);
  /* the faintest drop shadow, on the one word that is named for not having one */
  text-shadow:0 2px 0 rgba(0,0,0,.45), 0 14px 34px rgba(0,0,0,.55);
}
.gamesub{margin-top:9px;font-size:11.5px;letter-spacing:.05em;color:#93A39C}
.gamenote{margin-top:3px;font-size:10px;color:var(--matink)}

.deckgrp{display:flex;flex-direction:column;gap:6px}
.grphead{font-size:9px;letter-spacing:.22em;color:var(--matink);margin:0}
.deckgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
/* Each theme deck wears the face of its own heaviest card. We have the real
   printed scans; a deck of Charizard should look like one. */
.deckcard{
  background:rgba(0,0,0,.20);border:1px solid var(--matline);border-radius:4px;
  padding:clamp(6px,1.2vh,10px) 9px;cursor:pointer;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:border-color .12s ease, transform .12s ease;
}
.deckcard:hover{border-color:#6E837B;transform:translateY(-2px)}
.deckcard.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset;background:rgba(226,168,75,.07)}
.dart{width:100%;display:flex;justify-content:center;margin-bottom:2px}
.dart .cardface{width:auto;max-width:none;height:clamp(64px,12vh,124px);margin:0;border-radius:3px;
  box-shadow:0 2px 4px rgba(0,0,0,.5), 0 10px 20px -10px #000}
.dart .cardback.deckback{height:clamp(64px,12vh,124px);width:auto;aspect-ratio:240/330}
.dname{font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.01em;color:var(--stock)}
.dtypes{display:flex;gap:3px;justify-content:center}
.dstat{font-size:10px;color:#8A9A93}
.dstat.dim{color:var(--matink);font-size:9.5px}

.deckopts{display:flex;gap:16px;align-items:flex-end;justify-content:center;
  padding-top:10px;border-top:1px solid var(--matline)}
.dfield{display:flex;flex-direction:column;gap:3px}
.dfield label{font-size:9px;letter-spacing:.16em;color:var(--matink)}
.dfield select,.dfield input{background:rgba(0,0,0,.3);border:1px solid var(--matline);
  border-radius:2px;padding:4px 7px;min-width:120px}
.deckgo{display:flex;justify-content:center}
.btn.big{padding:9px 26px;font-size:13px;letter-spacing:.06em}

/* ---- Computer Search picker ---- */
/* These live inside .sheet, which is mat cloth now, so they take the mat's
   greens rather than the old blue-grey panel colours. */
.searchlist{max-height:46vh;overflow:auto;border:1px solid var(--matline);border-radius:3px;
  margin-bottom:12px;background:rgba(0,0,0,.18)}
.searchrow{display:flex;align-items:center;gap:10px;padding:5px 9px;cursor:pointer;
  border-bottom:1px solid rgba(0,0,0,.25)}
.searchrow:hover{background:rgba(255,255,255,.05)}
.searchrow.k-pokemon{border-left:2px solid #6FAE5A}
.searchrow.k-trainer{border-left:2px solid #9269A8}
.searchrow.k-energy{border-left:2px solid #4E9BC4}
.searchrow .sn{flex:1;font-weight:700;font-size:12px}
.searchrow .sq{color:var(--amber);font-size:11px}
.searchrow .ss{color:var(--dim);font-size:10.5px;min-width:110px;text-align:right}

/* ---- overlays ---- */
.overlay{position:fixed;inset:0;background:rgba(8,11,10,.84);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
/* Sheets are the same cloth as the mat, so setup and the game-over card feel
   like part of the table rather than dialogs laid over it. */
.sheet{
  background:linear-gradient(180deg,var(--mat) 0%,var(--mat2) 100%);
  border:1px solid var(--matedge);border-radius:6px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.03), 0 24px 60px -20px #000;
  padding:20px 22px;max-width:820px;width:100%;max-height:88vh;overflow:auto;
}
.sheet h2{margin:0 0 6px;font-family:var(--serif);font-weight:600;font-size:22px;
  letter-spacing:.06em;color:var(--stock)}
.sheet p{margin:0 0 12px;color:#93A39C;font-size:11.5px}
.sheet .dimtxt{color:var(--matink)}
.sheet .grphead,.sheet .row label{color:var(--matink)}
.sheet select,.sheet input[type=text]{background:rgba(0,0,0,.3);border-color:var(--matline)}
.sheet .btn{background:rgba(0,0,0,.28);border-color:var(--matline);color:#B7C6BE}
.sheet .btn:hover{border-color:var(--amber);color:var(--txt)}
.sheet .btn.end{background:#3A2F1C;border-color:#6A5326;color:var(--amber)}
.sheet .btn.ghost{background:transparent;color:var(--matink)}
.sheet .searchrow .ss,.sheet .orderrow .ss{color:var(--matink)}
.setupcur{border:1px solid var(--matline);border-radius:3px;padding:8px 10px;margin-bottom:12px;
  background:rgba(0,0,0,.2)}
.setupcur .lbl{font-size:11px;color:#8A9A93}
/* Inside a sheet the hand is a plain wrapping row again — there is room, and
   nothing is competing for it. */
.sheet .hand{margin-bottom:14px;flex-wrap:wrap;gap:8px;padding-top:0}
.sheet .hand .pcard{margin-left:0}
.sheet .hand .pcard:hover{transform:none}
.sheet .actionbar{border-top:0;padding-top:0}

@media (max-width:1080px){
  .wrap{grid-template-columns:1fr;height:auto}
  .rail{border-left:0;border-top:1px solid var(--line);height:60vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--amber);outline-offset:1px}


/* ============================ CARD SYSTEM ============================ */
.pcard{
  background:var(--stock); color:var(--ink);
  border:1px solid var(--hair); border-radius:3px;
  box-shadow:0 1px 0 rgba(0,0,0,.45), 0 6px 14px -8px rgba(0,0,0,.7);
  padding:7px 8px;
}
.pc-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pc-name{font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:.01em;line-height:1.1}
.pc-name.big{font-size:22px}
.pc-hp{font-size:10.5px;color:var(--ink2);white-space:nowrap}
.pc-hp.big{font-size:14px;font-weight:700;color:var(--ink)}
.pc-hp.hurt{color:#A33C30;font-weight:700}
.pc-body{display:flex;gap:8px;align-items:flex-start;margin-top:5px}
.pc-info{flex:1;min-width:0}
.pc-line{font-size:9.5px;color:var(--ink2);margin-top:3px}
.pc-line.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pc-eyebrow{display:flex;justify-content:space-between;gap:8px;font-size:9.5px;letter-spacing:.14em;color:var(--ink2);border-bottom:1px solid var(--hair);padding-bottom:4px;margin-bottom:6px}
.pc-from{letter-spacing:.02em;text-transform:none}

.sigil{flex:0 0 auto;border:1px solid var(--hair);border-radius:2px;background:var(--stock2);overflow:hidden}
.sigil svg{display:block;width:100%;height:100%}
.sigil.xs{width:26px;height:26px}
.sigil.sm{width:38px;height:38px}
.sigil.md{width:52px;height:52px}
.sigil.lg{width:100%;height:150px;margin:8px 0}

.typetag{display:inline-block;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#F2F5F1;padding:1px 5px;border-radius:2px}
.typetag.trainer{background:#6F4C86}
.pc-typerow{margin:2px 0 8px}

.pc-atkline{display:flex;align-items:center;gap:7px;margin-top:4px}
/* overflow-wrap:anywhere because a long single word cannot wrap and will simply
   run out of the card — "Flamethrower" was being cut mid-word on a 150px hand
   card. min-width:0 lets the name actually shrink inside the flex row. */
.pc-atkname{flex:1;min-width:0;overflow-wrap:anywhere;
  font-family:var(--serif);font-size:12px;font-weight:600}
.pc-atkdmg{font-weight:700;font-size:12px}
.pc-text{font-size:9.5px;color:var(--ink2);line-height:1.35;margin-top:2px}
.pc-text.body{margin-top:8px;font-size:11px}
.pc-attack{border-top:1px solid var(--hair);padding-top:5px;margin-top:5px}
.pc-power{border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:5px 0;margin-top:6px}
.pc-powname{font-family:var(--serif);font-size:12px;font-weight:700;color:#8C5430}
.pc-stats{display:flex;gap:12px;border-top:1px solid var(--hair);margin-top:8px;padding-top:6px}
.pc-stat{display:flex;flex-direction:column;gap:2px}
.pc-statlbl{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.pc-statval{display:flex;align-items:center;gap:3px;font-size:10.5px}
.pc-credit{display:flex;gap:10px;justify-content:space-between;font-size:8.5px;color:#8A938C;border-top:1px solid var(--hair);margin-top:8px;padding-top:5px}
.pip.ink{width:9px;height:9px}

/* The real printed face, shown only where the card is the SUBJECT rather than
   a token in play — the preview rail, and later the dex and pack opening. */
/* Capped at the scan's native 240px and centred, so it renders 1:1 and stays
   crisp instead of being stretched to whatever the rail happens to be. The
   attack text is unreadable at this size, which is fine — that is precisely
   what the rendered data sheet underneath is for. */
.cardface{width:100%;max-width:240px;display:block;margin:0 auto 10px;border-radius:5px;
  box-shadow:0 2px 4px rgba(0,0,0,.5), 0 14px 30px -14px #000}
.cardface.miss{display:none}
/* When the real face is there, it IS the panel. The rendered card underneath was
   restating a name, HP, type and attack text that the scan already shows
   perfectly legibly at native size — so everything but the printing credits goes
   away, and you get the card by itself. Cards from an unfetched set never gain
   `.has-face`, so they still render the full face and lose nothing. */
.pcard.has-face{background:transparent;border:0;box-shadow:none;padding:0}
.pcard.has-face > *{display:none}
.pcard.has-face > .cardface{display:block}
.pcard.has-face > .pc-credit{display:flex;border-top:0;margin-top:0;padding-top:0;
  color:var(--dim);justify-content:center;gap:14px}

/* ---- cards in hand ---- */
/* 116px, down from 150. The hand face carries no attack names and no rules
   text, so the width those needed is width the fan can spend on fitting more
   cards on screen: at 1366px this is 8 cards before any overlap at all, where
   150px managed 6. See handCard() for why the words went.
   The overlay sheets still use miniCard, which keeps its own natural width —
   there is room in a dialog and nothing competing for it. */
.hand .pcard{width:150px;cursor:pointer}
/* 98px. Everything on this face is scaled with the width rather than only the
   box being narrowed — type, name, damage and the cost pips all step down
   together — so it reads as the same card printed smaller instead of the same
   text crammed into less room.
   Two things fight this number and both are working as intended. The fitter
   partly undoes it: a shorter hand frees height, which lets fitBoard grow the
   whole column, so the card on screen shrinks by less than the figure here.
   And the aspect changed on the way — these were nearly 2:1 tall because the
   sigil was taking its own intrinsic height; at 98x~140 they are close to the
   3:4 of a real card, which is what they are drawings of. */
.hand .handcard{width:98px}
.hand .pcard:hover{border-color:var(--amber)}
.hand .pcard.sel{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber), 0 10px 18px -8px rgba(0,0,0,.8)}
.hand .pcard.dead{opacity:.45;cursor:default}
.hand .pcard.inspected{border-color:#5C6660}
.hand .pcard.targetable{border-color:var(--amber)}
/* A left edge in the type colour survives the overlap, so a fanned hand is
   still readable as "two Fire, a Grass, two Trainers" at a glance. */
.pcard.k-pokemon,.pcard.k-energy,.pcard.k-trainer{border-left-width:3px}

/* ---- the hand face ---- */
/* Four things and no more: name, kind, art, and what each attack costs against
   what it does. Everything is stacked in a single column and ordered by how
   much of it survives being overlapped by the next card — name first, because
   the first six characters of a name are usually the whole answer. */
.handcard{display:flex;flex-direction:column;padding:5px 6px 6px;gap:0}
/* Two lines, reserved whether or not they are used, so a hand of long and short
   names still has its type tags on one line and its costs on another. Wrapping
   is by word: an unbreakable name is allowed to be clipped at the card edge
   rather than broken into syllables, which is what the old face did. */
.hc-name{
  font-family:var(--serif);font-size:10.5px;font-weight:600;line-height:1.15;
  height:2.3em;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.hc-tags{display:flex;align-items:center;gap:3px;margin-top:3px;min-height:12px}
.hc-tags .typetag{font-size:7.5px;letter-spacing:.04em;padding:1px 3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hc-hp{margin-left:auto;font-size:8.5px;color:var(--ink2);white-space:nowrap}
/* The cost pips step down with everything else. Scoped, because .pip.ink is
   shared with the Active card and the preview panel, which did not shrink. */
.handcard .pip.ink{width:8px;height:8px}
/* The sigil is a 100x100 viewBox and keeps its aspect, so a wide box shows it
   square and centred with stock either side — an art window rather than a
   stretched emblem. */
/* flex:1 so the art takes ALL the spare stock rather than leaving it in a lump
   at the bottom. Every card in the hand is stretched to the tallest, so a
   Trainer beside a two-attack Pokemon has ~40px going spare — as a gap that
   reads as an unfinished card, as a taller art window it reads as a card with
   a bigger picture on it, which is what a Trainer actually has. */
/* flex-basis 0, NOT auto. The sigil's SVG is a square viewBox with no intrinsic
   height, so at `width:100%` an auto basis resolves to the card's own width —
   the art silently sets the row height instead of consuming what is left of it,
   and every card in the hand inflates to fit a ~90px emblem. With a basis of 0
   the row is sized by the text, min-height guarantees the art a floor, and the
   grow factor hands it whatever the tallest card left over. */
.sigil.hc-art{width:100%;flex:1 1 0;min-height:38px;margin:4px 0 0}
.hc-atks{padding-top:4px;display:flex;flex-direction:column;gap:2px}
.hc-atk{display:flex;align-items:center;gap:5px;
  border-top:1px solid var(--hair);padding-top:3px}
.hc-atk .pips{flex:0 0 auto}
.hc-dmg{margin-left:auto;font-weight:700;font-size:10.5px}

/* ---- the Active Pokemon ---- */
.slot.pcard{cursor:pointer}
/* Wide enough that attack text does not wrap to three lines, and no wider. It
   was 400 for a while, which bought height back but left the card looking
   stretched next to everything else on the mat.
   One width in both layouts, so the fixed heights below hold in both. */
.slot.pcard.act{width:318px}
/* Fixed heights, so the board stops resizing itself every time the Active
   changes. Both numbers are MEASURED, not chosen: the tallest of all 69
   implemented Pokemon rendered into each slot at this width (Clefairy for
   yours, Metronome's text being long; Chansey for theirs). Re-derive by
   rendering the pool if the card face or fonts change.
   The cost is small because it is not an outlier: two-thirds of Pokemon carry
   two attacks and already sit at or near 239, so only the 24 single-attack
   cards gain any empty stock at the bottom. */
.side.mine .slot.pcard.act{min-height:249px}
.side.foe .slot.pcard.act{min-height:149px}
.slot.pcard.targetable{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber)}
.slot.pcard.inspected{border-color:#5C6660}
.slot .slotmeta{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--ink2)}
.slot .stage{font-size:9px}
.slot .dmgbar{height:4px;background:#C6CDC7;margin:5px 0;border-radius:2px;overflow:hidden}
.slot .dmgbar i{display:block;height:100%;background:#B4453A}
.slot .energyrow{display:flex;gap:3px;align-items:center;min-height:11px;flex-wrap:wrap}
.slot .energyrow .none{font-size:9px;color:#939C96}
.slot .retreatnote{margin-left:auto;font-size:8.5px;color:#939C96}
/* An empty Active is a printed footprint on the mat, not a card. */
.slot.empty{background:transparent;border:0;box-shadow:inset 0 0 0 1px var(--matline);
  border-radius:3px;display:flex;align-items:center;justify-content:center;
  color:var(--matink);font-size:9px;letter-spacing:.16em}
.slot.empty.act{width:318px;min-height:96px}
.side.mine .slot.empty.act{min-height:249px}
.side.foe .slot.empty.act{min-height:149px}

/* ---- benched Pokemon: the same information, a third of the area ---- */
/* Bench tiles are deliberately NOT small copies of the Active card. They carry
   only what you steer by from across the table — who, how hurt, how charged —
   and the size gap is what makes the Active read as the one that is fighting. */
/* 84px tall, and the number is a BUDGET, not a preference. The opponent's field
   column is only as tall as their Active (149px) and already spends 56 on
   prizes, so 84 is very nearly all the room that side has — which is the number
   that matters, because the two benches must be the same height or the mirror
   the whole mat is built on stops reading. Your side has more slack than this;
   it stays in the ticker above rather than making your bench taller than theirs.
   Fixed, not stretched, for the same reason the Active is fixed: a benched
   Pokemon getting Poisoned should not resize the board. */
.bench .benchcard{
  width:106px;min-height:84px;padding:5px 6px;border-radius:3px;cursor:pointer;
  display:flex;flex-direction:column;
  background:var(--stock2);color:var(--ink);border:1px solid var(--hair);
  border-left-width:3px;
  box-shadow:0 1px 0 rgba(0,0,0,.4), 0 4px 9px -6px rgba(0,0,0,.7);
}
/* The emblem takes whatever the fixed height leaves over, so a tile carrying
   two status badges shrinks its art instead of growing the row. Every other
   face in the game carries a sigil; without one the bench read as a list of
   names rather than as cards on a mat. */
/* Square and centred, not a full-width band. The sigil's viewBox is square and
   it keeps its aspect, so a 94x29 band renders a 29px emblem adrift in a field
   of pale stock — it reads as a smudge rather than as art. Sized off the height
   the tile has left, it comes out around 30px: a stamp on the card, which is
   the most a bench tile can carry without becoming a small copy of the Active. */
/* A CROPPED band, not a shrunken emblem. The tile can spare about 30px of
   height and has 94px of width, and the sigil's viewBox is square — so letting
   it keep its aspect gives a 30px emblem adrift in pale stock, which reads as a
   smudge. Instead the emblem is drawn at the tile's full width and the box
   clips it to the height available, centred: you get the core of the mark at a
   size you can actually see, in a window shaped like an illustration window.
   Every other face in the game carries a sigil; without one the bench read as a
   list of names rather than as cards on a mat. */
.bench .benchcard .sigil.bcart{
  flex:1 1 0;min-height:12px;width:100%;margin:3px 0 2px;
  display:flex;align-items:center;overflow:hidden;
  border:0;background:transparent;
}
.bench .benchcard .sigil.bcart svg{flex:0 0 auto;width:100%;height:auto}
.bench .benchcard .bn{font-family:var(--serif);font-size:11px;font-weight:600;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bench .benchcard .bhp{display:flex;align-items:baseline;gap:1px;
  font-size:9px;color:var(--ink2);margin-top:1px}
.bench .benchcard .bhp b{font-size:10.5px;color:var(--ink);font-weight:700}
.bench .benchcard .bhp b.hurt{color:#A33C30}
.bench .benchcard .bhp .bstack{margin-left:auto;color:#8A938C;font-size:8.5px}
.bench .benchcard .dmgbar{height:3px;margin:4px 0 3px}
.bench .benchcard .energyrow{min-height:9px;gap:2px}
.bench .benchcard .pip{width:7px;height:7px}
.bench .benchcard .statuses{gap:2px;margin-top:3px}
.bench .benchcard .badge{font-size:7.5px;padding:0 3px;letter-spacing:.04em}
.bench .benchcard.targetable{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber)}
.bench .benchcard.inspected{border-color:#5C6660}
/* Empty bench places stay visible so the row keeps its shape and you can always
   see how much room is left. */
.slot.empty.benchslot{width:106px;min-height:84px;padding:0;
  background:transparent;border:0;box-shadow:inset 0 0 0 1px var(--matline);
  border-radius:3px;font-size:0}

/* status tabs sit ON the stock, so they need ink-side colours */
.slot .badge,.benchcard .badge{font-size:8px;letter-spacing:.07em;padding:1px 4px;border-radius:2px;border:1px solid;background:#EDF0EC}
.badge.slp{color:#3E5175;border-color:#93A6C4}
.badge.par{color:#7A6410;border-color:#C9B45E}
.badge.cnf{color:#6B3E80;border-color:#B592C4}
.badge.psn{color:#3D6B2C;border-color:#8FBE7C}
.badge.shd{color:#20606E;border-color:#7FB6C2}
.badge.bns{color:#8A5A12;border-color:#D3A85A}
.badge.bond{color:#7A2230;border-color:#C07684}

/* attack buttons on your own Active */
.slot .attacks{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.slot .atk{text-align:left;background:#EDF0EC;border:1px solid var(--hair);border-radius:2px;padding:4px 6px;cursor:pointer;width:100%;color:var(--ink)}
.slot .atk:hover{border-color:var(--amber);background:#F4F6F3}
.slot .atk.off{opacity:.5;cursor:default}
.slot .atk.off:hover{border-color:var(--hair);background:#EDF0EC}
.slot .atk .pc-text{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* The opponent's attack list: numbers only, no text, and no button affordance
   because you cannot press them. */
.slot .attacks.foeatks{margin-top:6px;border-top:1px solid var(--hair);padding-top:5px;gap:2px}
.slot .attacks.foeatks .pc-atkline{margin-top:0;padding:1px 0}
.slot .attacks.foeatks .pc-atkname{font-size:11.5px}
.slot .attacks.foeatks .pc-atkdmg{font-size:11.5px;color:#8A3A2E}
.atkwhy{font-size:9px;color:#A33C30;margin-top:2px}

/* preview rail */
.prevbox{flex:1;overflow:auto;padding:12px}
.prevbox .pcard{width:100%}
.emptynote{color:var(--dim);font-size:11px;padding:14px 2px}

/* search list rows keep the card family */
.searchrow .sn{font-family:var(--serif);font-weight:600;font-size:12.5px}

/* The deck-select hero art must not inherit the preview panel's native-size cap
   — there it is the subject at 1:1, here it is a thumbnail sized by height. */
.deckcard .pcard{background:transparent;border:0;box-shadow:none;padding:0}


/* ---- motion ---- */
.slot.fx-hit,.benchcard.fx-hit{animation:hitflash .6s ease-out}
@keyframes hitflash{
  0%{box-shadow:0 0 0 3px rgba(200,87,76,.95), 0 6px 14px -8px rgba(0,0,0,.7);transform:translateX(0)}
  16%{transform:translateX(-3px)}
  34%{transform:translateX(3px)}
  52%{transform:translateX(-2px)}
  70%{transform:translateX(0)}
  100%{box-shadow:0 1px 0 rgba(0,0,0,.45), 0 6px 14px -8px rgba(0,0,0,.7)}
}
.cardback.fx-prize{animation:prizeflip .9s ease-out}
@keyframes prizeflip{
  0%{background:var(--amber);box-shadow:inset 0 0 0 1px var(--amber);transform:rotateY(0)}
  40%{background:var(--amber);box-shadow:inset 0 0 0 1px var(--amber);transform:rotateY(180deg)}
  100%{background:transparent;box-shadow:inset 0 0 0 1px var(--matline);transform:rotateY(180deg)}
}

@media (prefers-reduced-motion:reduce){
  .slot.fx-hit,.benchcard.fx-hit,.cardback.fx-prize,.kobanner{animation:none!important}
}


/* ---- generic picker ---- */
.orderlist{border:1px solid var(--matline);border-radius:3px;margin-bottom:12px;max-height:46vh;
  overflow:auto;background:rgba(0,0,0,.18)}
.orderrow{display:flex;align-items:center;gap:9px;padding:6px 9px;border-bottom:1px solid rgba(0,0,0,.25)}
.orderrow.k-pokemon{border-left:2px solid #6FAE5A}
.orderrow.k-trainer{border-left:2px solid #9269A8}
.orderrow.k-energy{border-left:2px solid #4E9BC4}
.ordnum{width:18px;text-align:right;color:var(--amber);font-size:11px}
.orderrow .sn{flex:1;font-family:var(--serif);font-weight:600;font-size:12.5px}
.orderrow .ss{color:var(--dim);font-size:10.5px;min-width:100px;text-align:right}
.btn.tiny{padding:1px 7px;font-size:11px;line-height:1.3}
.searchrow.on{background:#3A2F1C;border-color:var(--amber)}


/* ===================== WIDE LAYOUT — must stay last =====================
   Stand the field (prizes + bench) beside the Active instead of under it. That
   is the good trade on a screen: the mat has width going spare and no height at
   all, and this takes roughly 75px per side out of the stack.

   Applied by chooseLayout() measuring whether it actually fits — NOT by a media
   query. A media query tests CSS pixels, which are not what the user sees: with
   display scaling at 125% a 1920-wide screen is a 1536-wide page, so a
   `min-width:1560px` rule never fires on the machine it was written for. That
   is exactly how this silently reverted to stacked once already.

   THIS BLOCK MUST BE THE LAST THING IN THE FILE. It overrides widths set in
   the CARD SYSTEM section at equal specificity, so moving it earlier silently
   loses to those rules and the two Actives stop lining up. */
.boardcol.wide .playarea{flex-direction:row;align-items:stretch;gap:16px;justify-content:center}
/* Both halves lay out Active-then-field here, and the two Actives are the same
   width, so each pair centres identically and they line up across the centre
   line. */
.boardcol.wide .side.foe .activezone,.boardcol.wide .side.foe .fieldzone{order:0}
/* The Active is one width in both layouts now, so nothing to override here. */
/* The Active anchors on the centre line while the field sits out at the far
   edge of the row. */
/* The on-mat ticker only exists where there is a gap to put it in. */
.boardcol.wide .side.mine .matlog{display:flex}
.boardcol.wide .side.mine .activezone{justify-content:flex-start}
.boardcol.wide .side.mine .fieldzone{justify-content:flex-end}
.boardcol.wide .side.foe .activezone{justify-content:flex-end}
.boardcol.wide .side.foe .fieldzone{justify-content:flex-start}

// EFFECT SCRIPTS — hand-authored. Each card_id maps to its implemented behaviour.
// Attacks: `a` is an array parallel to CARD_DB[id].attacks; each entry is a verb list.
// Trainers/Energy: `t` is a verb list.
// A card absent from this table, or with a null entry, is NOT IMPLEMENTED and the
// deck validator will refuse to build a deck containing it.
//
// VERB REFERENCE
//   cost phase (checked for legality, paid on use):
//     COST_DISCARD_ENERGY {n, t}   discard n Energy providing type t, attached to self
//     ONCE_WHILE_IN_PLAY           this attack may be used only once per stay in play
//   damage-shaping (replaces/gates the printed damage):
//     FLIP_OR_NOTHING              flip; tails => whole attack does nothing
//     DMG_PER_HEAD {coins, per}    flip N coins; damage = per * heads
//     DMG_PER_COUNTER_SELF {per}   damage = per * (own damage / 10)
//     DMG_MINUS_PER_COUNTER_SELF {base, per}
//                                  damage = base - per * (own damage / 10), floored at 0
//     DMG_PER_DEF_ENERGY {base, per}   base + per * Energy attached to the defender
//     DMG_PER_DEF_COUNTER {base, per}  base + per * damage counters on the defender
//     REQUIRE_DEF_STATUS {s, label}    attack is illegal unless the defender has status s
//   post-damage:
//     STATUS {s}                   apply status to defender
//     STATUS_ON_FLIP {s}           flip; heads => apply status to defender
//     RECOIL {n}                   self takes n damage (no weakness/resistance)
//     HEAL_SELF_ALL                remove all damage counters from self
//     HEAL_SELF_IF_DAMAGED {n}     remove n counters from self unless all damage prevented
//     PREVENT_ALL_DMG_SELF_ON_FLIP flip; heads => prevent all damage to self during
//                                  opponent's next turn
//     HARDEN {threshold}           prevent damage to self of `threshold` or less
//                                  during opponent's next turn (after W/R)
//     JAM_DEFENDER {label}         defender must flip to attack next turn or it fails
//     BARRIER                      prevent ALL effects of attacks (incl. damage) on self
//                                  during the opponent's next turn
//     DESTINY_BOND                 if something KOs self during the opponent's next
//                                  turn, that Pokemon is Knocked Out too
//     RECOIL_ON_FLIP {n, label}    flip; TAILS => self takes n damage
//     BENCH_SPLASH {n}             n damage to every Benched Pokemon on BOTH sides,
//                                  ignoring Weakness/Resistance
//     SWITCH_DEFENDER_CHOOSE       attacker picks one of defender's benched; swap to active
//   trainers:
//     T_DRAW {n} / T_HEAL {n} / T_DISCARD_ENERGY_THEN_HEAL {n} / T_SWITCH_OWN
//     T_SWITCH_OPPONENT / T_DISCARD_OPP_ENERGY / T_PLUSPOWER / T_LASS
//     T_ENERGY_RETRIEVAL {n} / T_PROFESSOR_OAK / T_SUPER_ENERGY_REMOVAL
//     T_DEFENDER / T_COMPUTER_SEARCH
//
// POKEMON POWERS
//   `p` is a single object, not a verb list — Powers are not attacks and don't
//   share the attack pipeline. They fire outside the attack step, and the ones
//   that say "as often as you like" fire repeatedly within one turn.
//
//   Every Base Set Power carries "can't be used if <self> is Asleep, Confused or
//   Paralyzed", so the engine gates ALL of them on that and no card restates it.
//   A Power works wherever its Pokemon is — Active or Bench — unless noted.
//
//   { kind, name, ... }
//     RETALIATE {dmg}        passive. When an opponent's attack damages this
//                            Pokemon, deal `dmg` back to the attacker, ignoring
//                            Weakness and Resistance. Fires even if this Pokemon
//                            is Knocked Out by that damage.
//     ENERGY_AS {type}       toggle, lasts the rest of the turn. Every Energy
//                            attached to this Pokemon counts as `type` for
//                            paying attack costs. Symbol COUNT is unchanged, so
//                            Double Colorless still pays for two.
//     MOVE_DAMAGE            interactive, repeatable. Move 1 damage counter
//                            between your own Pokemon. Illegal if it would Knock
//                            Out the receiving Pokemon.
//     MOVE_ENERGY {energy}   interactive, repeatable. Move 1 basic Energy of that
//                            type from one of your Pokemon to a different one.
//                            No restriction on the destination's type.
//     BUZZAP                 interactive, ONCE. Knocks out its own Pokemon and
//                            turns that card into an Energy card providing 2 of a
//                            chosen type, attached to another of your Pokemon.
//                            The opponent takes a Prize — see RULINGS.md, which
//                            is emphatic, and which two of us guessed wrong.
//                            Takes a `type` as well as a target, so its actions
//                            enumerate (target, type) pairs.
//     EXTRA_ATTACH {energy, targetType}
//                            interactive, repeatable. Attach 1 basic Energy of
//                            that type FROM HAND to one of your Pokemon of
//                            `targetType`. Does NOT consume the turn's one
//                            Energy attachment.
//
//   "1 <Type> Energy card" means a BASIC one. Double Colorless is excluded by
//   type anyway, but Rainbow Energy later on would not be, so the check is on
//   cls === 'Basic' rather than on the type alone.
//
//   Interactive Powers come in two shapes and the UI reads which from the
//   enumerated actions: those carrying `from` need a source click then a target
//   click; those without need only a target click.
//
//   Interactive Powers enumerate one legal action per (source, target) pair, so
//   the AI can score them like any other action and the UI can highlight them.
