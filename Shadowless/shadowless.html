        for (let i = 0; i < n6; i++) if (this.flip(`coin ${i + 1}/${n6}`)) h3++;
        base = v.per * h3;
        this.log(`${h3} of ${n6} heads -> ${base} damage.`);
      } else if (v.v === 'BUFF_OWN_ATTACK') {
        // Swords Dance does no damage itself; it arms the NEXT turn's Slash.
        // Handled below as a lasting effect, so nothing to shape here.
      } else if (v.v === 'DMG_PER_OWN_BENCH') {
        // Wigglytuff's Do the Wave. A Clefairy Doll on the Bench DOES count —
        // it is a Pokemon while in play. Settled with Trevor, see RULINGS.md.
        const n3 = me.bench.length;
        base = v.base + v.per * n3;
        this.log(`${v.base} plus ${v.per} per Benched Pokemon (${n3}) -> ${base} damage.`);
      } else if (v.v === 'DMG_PER_NAMED_IN_PLAY') {
        // Nidoqueen's Boyfriends. Matched on card NAME rather than species, so a
        // differently-named Nidoking would not count. Counts every slot you have,
        // which in practice is the Bench — the attacker is Nidoqueen herself.
        let n4 = 0;
        for (const sl of this.allSlots(pi)) if (topCard(this.db, sl).name === v.name) n4++;
        base = v.base + v.per * n4;
        this.log(`${v.base} plus ${v.per} per ${v.name} in play (${n4}) -> ${base} damage.`);
      }
    }

    if (nothing) { this.log('The attack does nothing.', 'eff'); return { ok: true }; }

    // Snapshot the defender's conditions so the post-damage loop's additions can
    // be diffed out afterwards. This is what Mirror Move replays: an EVENT
    // RECORD, written when the attack resolves, rather than the log — which is
    // prose for humans and would have to be parsed back into numbers.
    const stBefore = def ? Object.assign({}, def.status) : null;

    // Haunter. ONE coin for the whole attack, flipped before anything resolves,
    // because the card is "whenever an attack does anything" rather than a
    // per-instance shield. It lives here and not in computeDamage() for the same
    // reason: computeDamage is pure and the AI forecasts with it, so a flip in
    // there would consume RNG every time the bot thought about attacking.
    //
    // Only what is done TO Haunter is prevented. Recoil, bench splash and the
    // attacker's own buffs are untouched, which falls out of `blocked` gating
    // exactly the defender-targeting verbs and nothing else.
    const veil = def ? this.activePower(def, 'FLIP_TO_NEGATE') : null;
    let negated = false;
    if (veil) {
      negated = this.flip(`${veil.name}: prevent the attack?`);
      if (negated) this.log(`${veil.name}: everything done to ${this.nameOf(def)} is prevented.`, 'eff');
    }

    // Magneton's Sonicboom. "Don't apply Weakness and Resistance for this
    // attack" — everything AFTER W/R (PlusPower, Defender, Kabuto Armor) still
    // applies, which is exactly what dealDamage's existing noWR already means.
    const flat = script.some(v => v.v === 'NO_WR');
    const res = negated ? { dealt: 0, prevented: true }
      : this.dealDamage(atk, def, base, { noWR: flat });

    // RECOIL DOES NOT APPLY WHEN THE DEFENDER STOPPED THE DAMAGE — 16 Aug 2026,
    // settled with Trevor. Take Down into Chansey's Scrunch was hurting Arcanine
    // for 30 while achieving nothing.
    //
    // The printed text reads the other way and I argued for that: Scrunch
    // prevents damage done to CHANSEY, and Take Down's 30 is damage Arcanine
    // does to ITSELF, so they look like separate things. Trevor's answer is both
    // the arbiter and the better argument — it is how the Game Boy game plays it
    // and how Pocket plays it, and the balance reasoning is to reverse the
    // viewpoint: preventing the damage is already the whole reward for standing
    // there, and handing the preventer a free 30 on top swings it too far.
    //
    // SCOPE, and this is the part to read before widening it. It covers damage
    // and DEFENDER-SIDE consequences only. Self-inflicted status — Tauros
    // confusing itself on tails — still applies, because that is the attacker's
    // own coin rather than anything the defender did. The defender-side half was
    // already right by accident: `retaliate()` sits inside `if (r.dmg > 0)`, so
    // a Strikes Back never fired on a prevented hit.
    //
    // Keyed on the DEFENDER having stopped it, not on "the number came out 0".
    // A whiffed coin flip is the attacker's own bad luck and pays its recoil.
    const stopped = res.prevented || (base > 0 && res.dealt === 0);
    if (stopped && (pendingRecoil > 0 || script.some(v => v.v === 'RECOIL' || v.v === 'RECOIL_ON_FLIP'))) {
      this.log(`${this.nameOf(def)} took no damage, so ${card.name} takes no recoil.`, 'eff');
    }
    if (pendingRecoil > 0 && !stopped) {
      atk.dmg += pendingRecoil;
      this.log(`${card.name} does ${pendingRecoil} damage to itself. (${atk.dmg} total)`, 'eff');
    }

    // post-damage verbs
    const blocked = negated || this.effectsBlocked(def);
    for (const v of script) {
      switch (v.v) {
        // `s` may be a list. Venom Powder applies Confused AND Poisoned on one
        // coin, which is legal because Poison sits outside the
        // Asleep/Confused/Paralyzed group rather than replacing it.
        case 'STATUS':
          if (blocked) this.log(`${this.nameOf(def)} is protected - no ${v.s}.`, 'eff');
          else for (const st of [].concat(v.s)) this.applyStatus(def, st);
          break;
        case 'STATUS_ON_FLIP':
          if (this.flip(`${[].concat(v.s).join(' and ')}?`)) {
            if (blocked) this.log(`${this.nameOf(def)} is protected - no ${v.s}.`, 'eff');
            else for (const st of [].concat(v.s)) this.applyStatus(def, st);
          }
          break;
        case 'BARRIER_ON_FLIP':
          if (this.flip(v.label || 'prevent all effects?')) {
            atk.effects.push({ kind: 'PREVENT_ALL_EFFECTS', label: v.label || 'Agility',
                               expireAtStartOfTurn: s.turn + 2 });
            this.log(`${card.name} will prevent all effects of attacks during the opponent's next turn.`, 'eff');
          }
          break;
        case 'STATUS_COIN_EITHER':
          // heads one condition, tails the other - never nothing
          if (blocked) { this.log(`${this.nameOf(def)} is protected.`, 'eff'); break; }
          this.applyStatus(def, this.flip(`${v.heads} or ${v.tails}?`) ? v.heads : v.tails);
          break;
        case 'TOXIC':
          if (blocked) { this.log(`${this.nameOf(def)} is protected - no Poison.`, 'eff'); break; }
          this.applyStatus(def, 'Poisoned');
          def.poisonDamage = v.n;
          this.log(`${this.nameOf(def)} now takes ${v.n} Poison damage between turns.`, 'status');
          break;
        case 'DISCARD_DEF_ENERGY': {
          if (blocked) { this.log(`${this.nameOf(def)} is protected.`, 'eff'); break; }
          if (!def || !def.energy.length) { this.log('No Energy to discard.', 'eff'); break; }
          const e2 = this.takeEnergy(def, 1, null, a.opts && a.opts.energyUids)[0];
          if (!e2) { this.log('No Energy to discard.', 'eff'); break; }
          you.discard.push(e2);
          this.log(`${this.db[e2.id].name} is discarded from ${this.nameOf(def)}.`, 'eff');
          break;
        }
        case 'BENCH_SPLASH_OWN': {
          for (const b of me.bench) this.dealDamage(atk, b, v.n, { noWR: true });
          this.log(`${v.n} damage to each of ${me.name}'s own Benched Pokemon.`, 'eff');
          break;
        }
        case 'ATTACK_LOCK': {
          if (blocked) { this.log(`${this.nameOf(def)} is protected.`, 'eff'); break; }
          if (!def) break;
          const dc = topCard(this.db, def);
          const which = (a.opts && a.opts.attackIdx !== undefined)
            ? a.opts.attackIdx : this.pick((dc.attacks || []).length);
          def.effects.push({ kind: 'ATTACK_DISABLED', idx: which,
                             label: (dc.attacks[which] || {}).name || 'an attack',
                             expireAtStartOfTurn: s.turn + 2 });
          this.log(`${dc.name} can't use ${(dc.attacks[which] || {}).name} during the opponent's next turn.`, 'eff');
          break;
        }
        // Porygon. Both changes are permanent for as long as that Pokemon stays
        // in play — the card sets no expiry, and evolving or leaving play drops
        // the override with the slot.
        case 'CONVERT_DEF_WEAKNESS': {
          if (blocked) { this.log(`${this.nameOf(def)} is protected.`, 'eff'); break; }
          if (!def || !this.weaknessOf(def)) { this.log('The Defending Pokemon has no Weakness to change.', 'eff'); break; }
          const t = (a && a.opts && a.opts.type) || this.energyTypes().filter(x => x !== 'C')[0];
          def.wkOverride = t;
          this.log(`Conversion 1: ${this.nameOf(def)}'s Weakness is now ${t}.`, 'eff');
          break;
        }
        case 'CONVERT_SELF_RESISTANCE': {
          const t2 = (a && a.opts && a.opts.type) || this.energyTypes().filter(x => x !== 'C')[0];
          atk.rsOverride = t2;
          this.log(`Conversion 2: ${card.name}'s Resistance is now ${t2}.`, 'eff');
          break;
        }
        case 'WHIRLWIND':
          // The DEFENDER chooses, not the attacker — the one place in Base Set
          // where a player makes a decision during their opponent's turn. The
          // engine defers the end of turn until they have.
          if (blocked) { this.log(`${this.nameOf(def)} is protected.`, 'eff'); break; }
          if (!you.bench.length) { this.log(`${you.name} has no Benched Pokemon to switch to.`, 'eff'); break; }
          s.pendingSwitch = 1 - pi;
          this.log(`${you.name} must choose a Benched Pokemon to switch in.`, 'eff');
          break;
        case 'BARRIER':
          atk.effects.push({ kind: 'PREVENT_ALL_EFFECTS', label: 'Barrier',
                             expireAtStartOfTurn: s.turn + 2 });
          this.log(`${card.name} raises a Barrier - all effects of attacks, including damage, are prevented during the opponent's next turn.`, 'eff');
          break;
        case 'DESTINY_BOND':
          atk.effects.push({ kind: 'DESTINY_BOND', label: 'Destiny Bond',
                             expireAtStartOfTurn: s.turn + 2 });
          this.log(`${card.name} seals a Destiny Bond - whatever Knocks it out next turn goes down with it.`, 'eff');
          break;
        case 'RECOIL_ON_FLIP':
          // The flip is skipped entirely rather than rolled and discarded: it is
          // announced to the player, and a coin nobody is bound by is noise.
          if (stopped) break;
          if (!this.flip(v.label || 'avoid recoil?')) {
            atk.dmg += v.n;
            this.log(`${card.name} does ${v.n} damage to itself. (${atk.dmg} total)`, 'eff');
          }
          break;
        case 'HARDEN':
          atk.effects.push({ kind: 'PREVENT_UP_TO', threshold: v.threshold,
                             label: 'Harden', expireAtStartOfTurn: s.turn + 2 });
          this.log(`${card.name} hardens: ${v.threshold} or less damage will be prevented during the opponent's next turn.`, 'eff');
          break;
        case 'JAM_DEFENDER':
          if (blocked) { this.log(`${this.nameOf(def)} is protected.`, 'eff'); break; }
          def.effects.push({ kind: 'ATTACK_FLIP', label: v.label || 'Sand-attack',
                             expireAtStartOfTurn: s.turn + 2 });
          this.log(`${this.nameOf(def)} is dazed - it must flip to attack next turn.`, 'eff');
          break;
        case 'BENCH_SPLASH': {
          for (let pi2 = 0; pi2 < 2; pi2++) {
            for (const b of s.players[pi2].bench) this.dealDamage(atk, b, v.n, { noWR: true });
          }
          this.log(`${v.n} damage splashed onto every Benched Pokemon.`, 'eff');
          break;
        }
        case 'RECOIL':
          if (stopped) break;
          atk.dmg += v.n;
          this.log(`${card.name} does ${v.n} damage to itself. (${atk.dmg} total)`, 'eff'); break;
        case 'HEAL_SELF_ALL':
          if (atk.dmg > 0) { this.log(`${card.name} removes all ${atk.dmg} damage from itself.`, 'eff'); atk.dmg = 0; }
          break;
        // Leech Life, Mega Drain, Absorb. `half` rounds UP to the nearest 10, as
        // both cards printing it say; the plain version removes the damage dealt.
        // Capped at what is actually on the Pokemon, which is the "if it has
        // fewer damage counters than that, remove all of them" clause.
        case 'SEARCH_BASIC_TO_BENCH': {
          // Call for Family / Call for Friend / Sprout. Named, or by type for
          // Marowak. Legality already refused a full Bench.
          const wants = (c2) => {
            if (c2.kind !== 'pokemon' || c2.stage !== 'Basic') return false;
            if (v.names) return v.names.indexOf(c2.name) >= 0;
            if (v.name) return c2.name === v.name;
            if (v.type) return c2.type === v.type;
            return true;
          };
          const eligible = me.deck.map((x, i) => [x, i]).filter(([x]) => wants(this.db[x.id]));
          if (!eligible.length) { this.log('Nothing in the deck to call.', 'eff'); this.shuffle(me.deck); break; }
          let at = -1;
          if (a && a.opts && a.opts.pickUid !== undefined) at = me.deck.findIndex(x => x.uid === a.opts.pickUid);
          if (at === -1) at = eligible[this.pick(eligible.length)][1];
          const got = me.deck.splice(at, 1)[0];
          me.bench.push(this.mkSlot(got));
          me.bench[me.bench.length - 1].playedTurn = s.turn;
          this.log(`${card.name} calls ${this.db[got.id].name} to the Bench.`, 'eff');
          this.shuffle(me.deck);
          break;
        }
        case 'HEAL_SELF_ON_FLIP':
          if (this.flip(v.label || 'remove a damage counter?')) {
            const h4 = Math.min((v.n || 1) * 10, atk.dmg);
            atk.dmg -= h4;
            this.log(`${card.name} removes ${h4} damage from itself.`, 'eff');
          }
          break;
        case 'ENERGY_FROM_DISCARD': {
          // Gastly's Energy Conversion: UP TO n, so an empty discard is fine.
          const picks = (a && a.opts && a.opts.uids) || null;
          const taken2 = [];
          if (picks) {
            for (const u of picks.slice(0, v.n)) {
              const k = me.discard.findIndex(x => x.uid === u);
              if (k >= 0 && this.db[me.discard[k].id].kind === 'energy') taken2.push(me.discard.splice(k, 1)[0]);
            }
          } else {
            // Unattended fallback: the most recently discarded Energy, which is
            // deterministic and therefore keeps a seeded game reproducible.
            for (let i = me.discard.length - 1; i >= 0 && taken2.length < v.n; i--) {
              if (this.db[me.discard[i].id].kind === 'energy') taken2.push(me.discard.splice(i, 1)[0]);
            }
          }
          taken2.forEach(x => me.hand.push(x));
          this.log(`${card.name} takes back ${taken2.length} Energy.`, 'eff');
          break;
        }
        case 'TRAINER_FROM_DISCARD': {
          let k2 = -1;
          if (a && a.opts && a.opts.pickUid !== undefined) k2 = me.discard.findIndex(x => x.uid === a.opts.pickUid);
          if (k2 === -1) k2 = me.discard.map((x, i) => [x, i])
            .filter(([x]) => this.db[x.id].kind === 'trainer').map(([, i]) => i).pop() ?? -1;
          if (k2 === -1) { this.log('No Trainer card in the discard pile.', 'eff'); break; }
          const got2 = me.discard.splice(k2, 1)[0];
          me.hand.push(got2);
          this.log(`${card.name} salvages ${this.db[got2.id].name}.`, 'eff');
          break;
        }
        case 'WILDFIRE': {
          // Moltres. The player chooses how many Fire to burn, capped at what is
          // attached — Trevor, 10 Aug. Each one mills a card from their deck.
          const fire = atk.energy.filter(e => energyProvides(this.db, e) === 'R');
          const max = fire.length;
          let n7 = (a && a.opts && a.opts.count !== undefined) ? a.opts.count : max;
          n7 = Math.max(0, Math.min(n7, max));
          if (n7 === 0) { this.log('No Fire Energy discarded, so nothing burns.', 'eff'); break; }
          this.takeEnergy(atk, n7, 'R', a.opts && a.opts.costUids).forEach(e => me.discard.push(e));
          let burned = 0;
          for (let i = 0; i < n7 && you.deck.length; i++) { you.discard.push(you.deck.shift()); burned++; }
          this.log(`Wildfire: ${n7} Fire discarded, ${burned} card(s) burned off ${you.name}'s deck.`, 'eff');
          break;
        }
        case 'REARRANGE_TOP': {
          // Hypno's Prophecy. Either deck — rearranging THEIRS is a real effect
          // even against an opponent that sees everything, because it decides
          // what they draw and when. See RULINGS.md.
          const side = (a && a.opts && a.opts.side === 'them') ? you : me;
          const n8 = Math.min(v.n, side.deck.length);
          if (n8 === 0) { this.log('That deck is empty.', 'eff'); break; }
          const order = (a && a.opts && a.opts.order) || null;
          if (order && order.length === n8) {
            const head = side.deck.slice(0, n8);
            const seen = {};
            const rebuilt = [];
            for (const i of order) {
              if (i >= 0 && i < n8 && !seen[i]) { seen[i] = 1; rebuilt.push(head[i]); }
            }
            for (let i = 0; i < n8; i++) if (!seen[i]) rebuilt.push(head[i]);
            side.deck.splice(0, n8, ...rebuilt);
          }
          this.log(`${card.name} looks at the top ${n8} of ${side.name}'s deck.`, 'eff');
          break;
        }
        case 'RETURN_DEFENDER_TO_HAND': {
          // Pidgeot's Hurricane. "Unless this attack Knocks Out the Defending
          // Pokemon" — so a lethal hit simply Knocks it Out in the normal way.
          if (!def) break;
          if (blocked) { this.log(`${this.nameOf(def)} is protected.`, 'eff'); break; }
          if (def.dmg >= topCard(this.db, def).hp) { this.log('It was Knocked Out instead.', 'eff'); break; }
          const nm = this.nameOf(def);
          const where2 = this.removeSlot(1 - pi, def);
          this.gatherSlot(def).forEach(x => you.hand.push(x));
          this.log(`${nm} and everything attached go back to ${you.name}'s hand.`, 'eff');
          if (where2 === 'active' && you.bench.length) this.addPromote(1 - pi);
          break;
        }
        case 'WHIRLWIND_ON_FLIP':
          // Arbok's Terror Strike. The damage lands either way; only the switch
          // is on the coin.
          if (blocked) { this.log(`${this.nameOf(def)} is protected.`, 'eff'); break; }
          if (this.flip(v.label || 'force a switch?')) {
            if (!you.bench.length) this.log(`${you.name} has no Benched Pokemon to switch to.`, 'eff');
            else { s.pendingSwitch = 1 - pi; this.log(`${you.name} must choose a Benched Pokemon to switch in.`, 'eff'); }
          }
          break;
        case 'DAMAGE_REDUCTION_SELF':
          atk.effects.push({ kind: 'DAMAGE_REDUCTION', amount: v.n, label: v.label || 'Minimize',
                             expireAtStartOfTurn: s.turn + 2 });
          this.log(`Damage to ${card.name} is reduced by ${v.n} during the opponent's next turn.`, 'eff');
          break;
        case 'DAMAGE_REDUCTION_FROM':
          // Pounce, Snivel. Only from THIS defender — `fromUid` is what
          // computeDamage checks, and it doubles as the "benching either Pokemon
          // ends this effect" clause, since a benched attacker stops being the
          // Active one whose uid it names.
          if (!def) break;
          atk.effects.push({ kind: 'DAMAGE_REDUCTION', amount: v.n, fromUid: def.uid,
                             label: v.label || 'a flinch', expireAtStartOfTurn: s.turn + 2 });
          this.log(`Damage from ${this.nameOf(def)} is reduced by ${v.n} next turn.`, 'eff');
          break;
        case 'CANT_ATTACK_ON_FLIP':
          if (blocked) { this.log(`${this.nameOf(def)} is protected.`, 'eff'); break; }
          if (!def) break;
          if (this.flip(v.label || 'stop them attacking?')) {
            def.effects.push({ kind: 'CANT_ATTACK', fromUid: atk.uid, label: v.label || 'Tail Wag',
                               expireAtStartOfTurn: s.turn + 2 });
            this.log(`${this.nameOf(def)} can't attack ${card.name} during the opponent's next turn.`, 'eff');
          }
          break;
        case 'CANT_RETREAT_ON_FLIP':
          if (blocked) { this.log(`${this.nameOf(def)} is protected.`, 'eff'); break; }
          if (!def) break;
          if (this.flip(v.label || 'stop them retreating?')) {
            def.effects.push({ kind: 'CANT_RETREAT', label: v.label || 'Acid',
                               expireAtStartOfTurn: s.turn + 2 });
            this.log(`${this.nameOf(def)} can't retreat during the opponent's next turn.`, 'eff');
          }
          break;
        case 'BENCH_SPLASH_FLIP_SIDE': {
          // Articuno's Blizzard. One coin decides WHOSE bench takes it.
          const mineSide = !this.flip(v.label || 'their bench?');
          const side = mineSide ? me.bench : you.bench;
          for (const b of side) this.dealDamage(atk, b, v.n, { noWR: true });
          this.log(`${v.n} to each of ${(mineSide ? me : you).name}'s Benched Pokemon.`, 'eff');
          break;
        }
        case 'BENCH_SPLASH_PER_FLIP': {
          // Zapdos' Thunderstorm. A coin per benched Pokemon, then self-damage
          // for every tail — so a wide opposing bench is a real risk to take.
          let tails = 0;
          for (const b of you.bench) {
            if (this.flip(`hit ${this.nameOf(b)}?`)) this.dealDamage(atk, b, v.dmg, { noWR: true });
            else tails++;
          }
          if (tails > 0) {
            atk.dmg += tails * v.selfPerTail;
            this.log(`${tails} tail(s): ${card.name} takes ${tails * v.selfPerTail}. (${atk.dmg} total)`, 'eff');
          }
          break;
        }
        case 'BENCH_SPLASH_TYPED': {
          // Electrode's Chain Lightning. Nothing happens at all against a
          // Colorless defender, which is the card's own clause and not a guard.
          if (!def) break;
          const dt = topCard(this.db, def).type;
          if (!dt || dt === 'C') { this.log('The Defending Pokemon is Colorless - Chain Lightning stops there.', 'eff'); break; }
          for (let pi2 = 0; pi2 < 2; pi2++) {
            for (const b of s.players[pi2].bench) {
              if (topCard(this.db, b).type === dt) this.dealDamage(atk, b, v.n, { noWR: true });
            }
          }
          this.log(`${v.n} to every Benched ${dt} Pokemon on both sides.`, 'eff');
          break;
        }
        case 'SWITCH_SELF_CHOOSE': {
          // Exeggutor's Teleport. A free switch the ATTACKER chooses, with no
          // retreat cost and no Energy paid.
          if (!me.bench.length) { this.log('No Benched Pokemon to switch with.', 'eff'); break; }
          const bi2 = (a && a.opts && a.opts.bench !== undefined) ? a.opts.bench : this.pick(me.bench.length);
          const b2 = me.bench[bi2];
          if (b2) {
            const old2 = me.active;
            clearStatus(old2);
            me.active = b2; me.bench.splice(bi2, 1); me.bench.push(old2);
            this.log(`${card.name} switches out for ${this.nameOf(b2)}.`, 'eff');
          }
          break;
        }
        case 'NO_TRAINERS_NEXT_TURN':
          you.noTrainersUntil = s.turn + 2;
          this.log(`${you.name} can't play Trainer cards during their next turn.`, 'eff');
          break;
        case 'BUFF_OWN_ATTACK':
          atk.effects.push({ kind: 'ATTACK_BUFF', name: v.attack, base: v.base,
                             label: v.label || 'Swords Dance', expireAtStartOfTurn: s.turn + 2 });
          this.log(`${card.name}'s ${v.attack} does ${v.base} during your next turn.`, 'eff');
          break;
        case 'HEAL_SELF_EQUAL_DAMAGE': {
          const dealt = res.dealt || 0;
          if (dealt > 0 && atk.dmg > 0) {
            const want = v.half ? Math.ceil(dealt / 2 / 10) * 10 : dealt;
            const h2 = Math.min(want, atk.dmg);
            atk.dmg -= h2;
            this.log(`${card.name} removes ${h2} damage from itself.`, 'eff');
          }
          break;
        }
        case 'STATUS_SELF':
          // Petal Dance, Foul Odor. On SELF, so Barrier on the defender is
          // irrelevant and `blocked` is deliberately not consulted.
          this.applyStatus(atk, v.s);
          break;
        case 'STATUS_SELF_ON_TAILS':
          if (!this.flip(v.label || `${v.s}?`)) this.applyStatus(atk, v.s);
          break;
        case 'DRAW':
          for (let i = 0; i < v.n && me.deck.length; i++) me.hand.push(me.deck.shift());
          this.log(`${me.name} draws ${v.n}.`, 'eff');
          break;
        case 'DRAW_ON_FLIP':
          if (this.flip('draw a card?')) {
            if (me.deck.length) { me.hand.push(me.deck.shift()); this.log(`${me.name} draws a card.`, 'eff'); }
          }
          break;
        // Dark Mind, Spark, Stretch Kick, Gigashock. The ATTACKER chooses, and
        // Weakness and Resistance never apply to Bench damage.
        case 'BENCH_SNIPE': {
          const bench = you.bench;
          if (!bench.length) { this.log('No Benched Pokemon to hit.', 'eff'); break; }
          const want = Math.min(v.n || 1, bench.length);
          let picks = (a && a.opts && a.opts.bench) || [];
          if (!Array.isArray(picks)) picks = [picks];
          picks = picks.filter(i => i >= 0 && i < bench.length).slice(0, want);
          for (let i = 0; picks.length < want; i++) if (picks.indexOf(i) < 0) picks.push(i);
          for (const i of picks) {
            this.dealDamage(atk, bench[i], v.dmg, { noWR: true });
            this.log(`${v.dmg} to ${this.nameOf(bench[i])} on the Bench.`, 'eff');
          }
          break;
        }
        case 'HEAL_SELF_IF_DAMAGED':
          if (!res.prevented && atk.dmg > 0) {
            const h = Math.min(v.n * 10, atk.dmg); atk.dmg -= h;
            this.log(`${card.name} removes ${h} damage from itself.`, 'eff');
          }
          break;
        case 'PREVENT_ALL_DMG_SELF_ON_FLIP':
          if (this.flip('prevent damage?')) {
            atk.effects.push({ kind: 'PREVENT_ALL_DAMAGE', expireAtStartOfTurn: s.turn + 2 });
            this.log(`${card.name} will prevent all damage during the opponent's next turn.`, 'eff');
          }
          break;
        case 'SWITCH_DEFENDER_CHOOSE': {
          if (you.active && you.bench.length) {
            const bi = (a.opts && a.opts.bench !== undefined) ? a.opts.bench : this.pick(you.bench.length);
            const b = you.bench[bi];
            if (b) {
              const old = you.active;
              clearStatus(old);
              you.active = b; you.bench.splice(bi, 1); you.bench.push(old);
              this.log(`${this.nameOf(b)} is dragged into the Active spot.`, 'eff');
            }
          }
          break;
        }
      }
    }

    // Write the event record onto the DEFENDER. Mirror Move on that Pokemon's
    // next turn reads exactly this and nothing else.
    if (def && stBefore) {
      const gained = ['Asleep', 'Confused', 'Paralyzed', 'Poisoned']
        .filter(n => def.status[n.toLowerCase()] && !stBefore[n.toLowerCase()]);
      def.lastAttackResult = {
        turn: s.turn, by: atk.uid, label: `${card.name}'s ${attack.name}`,
        damage: res.dealt, statuses: gained,
      };
    }
    return { ok: true };
  }

  // Which of the defender's attacks Metronome may copy. A Metronome copying a
  // Metronome has no sensible resolution, so it is excluded — logged as a
  // deliberate call in RULINGS.md rather than left to recurse.
  metronomeChoices(pi) {
    const def = this.state.players[1 - pi].active;
    if (!def) return [];
    const dc = topCard(this.db, def);
    const out = [];
    (dc.attacks || []).forEach((x, i) => {
      const ds = (this.effects[dc.id] && this.effects[dc.id].a && this.effects[dc.id].a[i]) || [];
      if (ds.some(v => v.v === 'METRONOME')) return;
      out.push(i);
    });
    return out;
  }

  // Some attacks need a parameter chosen before they can be used, the same way
  // interactive Powers do. One entry per legal choice; [null] means "no choice
  // to make"; an EMPTY array means the attack is unusable right now.
  attackVariants(pi, idx) {
    const p = this.state.players[pi];
    if (!p.active) return [];
    const c = topCard(this.db, p.active);
    const script = (this.effects[c.id] && this.effects[c.id].a && this.effects[c.id].a[idx]) || [];
    const def = this.state.players[1 - pi].active;
    const types = this.energyTypes().filter(t => t !== 'C');   // "other than Colorless"

    if (script.some(v => v.v === 'METRONOME')) {
      if (!def) return [];
      const dc = topCard(this.db, def);
      return this.metronomeChoices(pi).map(i => ({
        opts: { copyIdx: i }, label: `Metronome: copy ${dc.attacks[i].name}`,
      }));
    }
    if (script.some(v => v.v === 'CONVERT_DEF_WEAKNESS')) {
      if (!def || !this.weaknessOf(def)) return [];            // "if it HAS a Weakness"
      return types.map(t => ({ opts: { type: t }, label: `Conversion 1: Weakness to ${t}` }));
    }
    if (script.some(v => v.v === 'CONVERT_SELF_RESISTANCE')) {
      return types.map(t => ({ opts: { type: t }, label: `Conversion 2: Resistance to ${t}` }));
    }
    return [null];
  }

  // Weakness and Resistance are normally the card's, but Porygon's Conversion
  // rewrites them per slot, so every read goes through these.
  weaknessOf(slot) {
    return slot.wkOverride !== undefined ? slot.wkOverride : topCard(this.db, slot).wkType;
  }
  resistanceOf(slot) {
    return slot.rsOverride !== undefined ? slot.rsOverride : topCard(this.db, slot).rsType;
  }

  finishAttack() {
    this.checkKOs();
    const s = this.state;
    if (s.phase === 'over') return { ok: true };
    // A Whirlwind switch is moot if the damage Knocked that Pokemon Out — the
    // player is promoting a replacement instead, which is the same decision.
    if (s.pendingSwitch !== null && !s.players[s.pendingSwitch].active) s.pendingSwitch = null;
    if (s.pendingSwitch !== null && !s.players[s.pendingSwitch].bench.length) s.pendingSwitch = null;
    return this.endTurn();
  }

  applyStatus(slot, s) {
    if (!slot) return;
    if (this.playsAsPokemon(slot)) {
      this.log(`${this.nameOf(slot)} can't be ${s}.`, 'eff');
      return;
    }
    // Snorlax. Note the card's own joke, which is faithfully reproduced by the
    // shared gate rather than special-cased: "can't be used if Snorlax is
    // ALREADY Asleep, Confused, or Paralyzed" — so the Power that prevents
    // those conditions stops working once one of them lands by another route.
    const skin = this.activePower(slot, 'STATUS_IMMUNE');
    if (skin) {
      this.log(`${skin.name}: ${this.nameOf(slot)} can't be ${s}.`, 'eff');
      return;
    }
    if (s === 'Poisoned') { slot.status.poisoned = true; if (!slot.poisonDamage) slot.poisonDamage = 10; }
    else {
      slot.status.asleep = false; slot.status.paralyzed = false; slot.status.confused = false;
      if (s === 'Asleep') slot.status.asleep = true;
      if (s === 'Paralyzed') { slot.status.paralyzed = true; slot.paralyzedTurn = this.state.turn; }
      if (s === 'Confused') slot.status.confused = true;
    }
    this.log(`${this.nameOf(slot)} is now ${s}.`, 'status');
  }

  // PURE. Returns what `base` damage from atkSlot would do to defSlot, with a
  // step log, without mutating anything. dealDamage() applies the result, and
  // the AI uses it to forecast. Single source of truth: the AI can never
  // predict something the engine wouldn't actually do.
  computeDamage(atkSlot, defSlot, base, opts = {}) {
    const steps = [];
    if (!defSlot) return { dmg: 0, prevented: false, steps };
    const A = topCard(this.db, atkSlot), D = topCard(this.db, defSlot);
    let dmg = base;
    if (dmg > 0 && !opts.noWR) {
      // Read through the per-slot overrides — Porygon's Conversion rewrites these.
      const wk = this.weaknessOf(defSlot), rs = this.resistanceOf(defSlot);
      const at = this.typeOf(atkSlot);          // Shift can change this mid-game
      if (wk && wk === at) {
        dmg *= this.cfg.weaknessMultiplier;
        steps.push(`Weakness: ${D.name} takes double -> ${dmg}.`);
      }
      if (rs && rs === at) {
        dmg -= this.cfg.resistanceFlat;
        steps.push(`Resistance: -${this.cfg.resistanceFlat} -> ${Math.max(0, dmg)}.`);
      }
      if (dmg < 0) dmg = 0;
    }
    if (dmg > 0) {
      for (const e of atkSlot.effects) {
        if (e.kind === 'DAMAGE_BONUS') { dmg += e.amount; steps.push(`+${e.amount} from ${e.label || 'a bonus'} -> ${dmg}.`); }
      }
    }
    if (dmg > 0) {
      for (const e of defSlot.effects) {
        if (e.kind === 'DAMAGE_REDUCTION') {
          // Pounce and Snivel reduce damage only from the Pokemon that used
          // them; Minimize and Defender reduce it from anything. `fromUid` is
          // what tells them apart.
          if (e.fromUid !== undefined && (!atkSlot || atkSlot.uid !== e.fromUid)) continue;
          dmg -= e.amount;
          steps.push(`-${e.amount} from ${e.label || 'a shield'} -> ${Math.max(0, dmg)}.`);
        }
      }
      if (dmg < 0) dmg = 0;
    }
    // Passive Powers that reshape incoming damage. CONSULTED here rather than
    // living in defSlot.effects, so Muk switching them off is one question asked
    // at the moment it matters instead of a cache to keep in step. Both are
    // "after applying Weakness and Resistance" by their own text, which is why
    // they sit below the W/R block and inside the same band as PlusPower and
    // Defender. Deterministic on purpose: this function is PURE and the AI
    // forecasts with it, so Haunter's coin lives in dealDamage instead.
    if (dmg > 0) {
      const halve = this.activePower(defSlot, 'DAMAGE_HALVE');
      if (halve) {
        dmg = Math.floor(dmg / 2 / 10) * 10;                 // "rounded DOWN to the nearest 10"
        steps.push(`${halve.name}: halved to ${dmg}.`);
      }
    }
    let prevented = false;
    const absolute = defSlot.effects.find(e => e.kind === 'PREVENT_ALL_DAMAGE' || e.kind === 'PREVENT_ALL_EFFECTS');
    const threshold = defSlot.effects.find(e => e.kind === 'PREVENT_UP_TO');
    // Mr. Mime. The inverse of Harden: big hits bounce, small ones land.
    const wall = this.activePower(defSlot, 'PREVENT_AT_LEAST');
    if (absolute) {
      if (dmg > 0) { steps.push(`All damage to ${D.name} is prevented.`); prevented = true; }
      dmg = 0;
    } else if (threshold && dmg > 0 && dmg <= threshold.threshold) {
      steps.push(`${D.name} is Hardened: ${dmg} damage (${threshold.threshold} or less) is prevented.`);
      dmg = 0; prevented = true;
    } else if (wall && dmg >= wall.n) {
      steps.push(`${wall.name}: ${dmg} damage (${wall.n} or more) is prevented.`);
      dmg = 0; prevented = true;
    }
    return { dmg, prevented, steps };
  }

  dealDamage(atkSlot, defSlot, base, opts = {}) {
    if (!defSlot) return { dealt: 0, prevented: false };
    const D = topCard(this.db, defSlot);
    const r = this.computeDamage(atkSlot, defSlot, base, opts);
    r.steps.forEach(t => this.log(t, t.indexOf('prevented') >= 0 || t.indexOf('Hardened') >= 0 ? 'eff' : 'dmg'));
    if (r.dmg > 0) {
      defSlot.dmg += r.dmg;
      defSlot.lastHitBy = { uid: atkSlot.uid, turn: this.state.turn };
      // HP REMAINING, not damage dealt — the same way round as the board reads.
      // It printed `dmg/hp`, so a Staryu on exactly lethal damage logged
      // "(40/40)" on the line directly above "is Knocked Out!", which reads as
      // untouched. One convention across the game; the board's is the one every
      // player is already looking at.
      this.log(`${D.name} takes ${r.dmg}. (${Math.max(0, D.hp - defSlot.dmg)}/${D.hp} left)`, 'dmg');
      this.retaliate(atkSlot, defSlot, opts);
    }
    return { dealt: r.dmg, prevented: r.prevented };
  }

  // RETALIATE (Machamp's Strikes Back). Fires here, immediately after the damage
  // lands and before checkKOs, which is what makes it work "even if Machamp is
  // Knocked Out". Every dealDamage() call is attack damage from one Pokemon to
  // another — recoil adds to `dmg` directly and never comes through here — so
  // the only guards needed are self-damage and one level of recursion, the
  // latter for the Machamp-versus-Machamp case.
  retaliate(atkSlot, defSlot, opts) {
    if (opts.noRetaliate || !atkSlot || atkSlot === defSlot) return;
    const p = this.powerOf(defSlot);
    if (!p || p.kind !== 'RETALIATE' || !this.powerUsable(defSlot)) return;
    this.log(`${p.name}: ${this.nameOf(defSlot)} strikes back at `
      + `${this.nameOf(atkSlot)} for ${p.dmg}.`, 'eff');
    this.dealDamage(defSlot, atkSlot, p.dmg, { noWR: true, noRetaliate: true });
  }

  // True when an attack's non-damage effects should be suppressed on this target.
  effectsBlocked(slot) {
    return !!slot && slot.effects.some(e => e.kind === 'PREVENT_ALL_EFFECTS');
  }

  // ---------------------------------------------------------- KO / win -----
  checkKOs() {
    const s = this.state;
    if (s.phase === 'over') return;
    let any = true;
    while (any) {
      any = false;
      for (let i = 0; i < 2 && !any; i++) {
        const p = s.players[i], o = s.players[1 - i];
        const kill = (slot, fromBench, idx) => {
          const c = topCard(this.db, slot);
          this.log(`${c.name} is Knocked Out!`, 'ko');
          if (s.koThisAction) s.koThisAction.push({ uid: slot.uid, pi: i });
          // Destiny Bond: whatever Knocked this out is Knocked Out in turn.
          const bond = slot.effects.find(e => e.kind === 'DESTINY_BOND');
          if (bond && slot.lastHitBy) {
            const killer = this.allSlots(1 - i).find(x => x.uid === slot.lastHitBy.uid);
            if (killer && !killer.forcedKO) {
              killer.forcedKO = true;
              this.log(`Destiny Bond: ${this.nameOf(killer)} is dragged down with ${c.name}!`, 'ko');
            }
          }
          slot.stack.forEach(x => p.discard.push(x));
          slot.energy.forEach(x => p.discard.push(x));
          slot.effects.forEach(e => { if (e.card) p.discard.push(e.card); });
          if (fromBench) p.bench.splice(idx, 1); else p.active = null;
          // "If Clefairy Doll is Knocked Out, it doesn't count as a Knocked Out
          // Pokemon" — no Prize. The no-Pokemon-left loss below still applies,
          // because that keys on the board, not on the Knock Out.
          if (c.playsAs === 'pokemon') {
            this.log(`${c.name} doesn't count as a Knocked Out Pokemon - no Prize.`, 'eff');
          } else if (o.prizes.length) {
            o.hand.push(o.prizes.shift());
            this.log(`${o.name} takes a Prize. (${o.prizes.length} left)`, 'prize');
          }
        };
        const dead = (sl) => sl.forcedKO || sl.dmg >= topCard(this.db, sl).hp;
        if (p.active && dead(p.active)) { kill(p.active, false, -1); any = true; }
        if (!any) for (let k = 0; k < p.bench.length; k++) {
          if (dead(p.bench[k])) { kill(p.bench[k], true, k); any = true; break; }
        }
        if (any) {
          if (o.prizes.length === 0) return this.endGame(1 - i, `${o.name} took all Prizes`);
          if (!p.active && p.bench.length === 0) return this.endGame(1 - i, `${p.name} has no Pokemon left`);
          if (!p.active && p.bench.length > 0) this.addPromote(i);
        }
      }
    }
  }

  endGame(winner, reason) {
    this.state.phase = 'over';
    this.state.winner = winner;
    this.state.winReason = reason;
    this.state.pendingPromote = null;
    this.state.promoteQueue = [];
    this.log(`GAME OVER - ${this.state.players[winner].name} wins: ${reason}`, 'win');
    return { ok: true, over: true };
  }

  // ---------------------------------------------------------------- AI -----
  // Returns ONE action, or null if this player has nothing to do. The UI steps
  // through these so the opponent's turn reads at human pace; the harness loops.
  //
  // 'expert' / 'novice' delegate to the expected-value AI in ai.js.
  // 'greedy' and 'random' are kept as rules fuzzers - see the note in choose().
  aiChoose(pi, mode = 'expert') {
    if (mode === 'expert' || mode === 'novice') {
      if (!this._ai || this._ai.mode !== mode) {
        // ai.js is concatenated before this file in the browser bundle, and
        // required here under Node. Resolve at call time so both work.
        const Klass = (typeof AI !== 'undefined') ? AI : require('./ai.js').AI;
        this._ai = new Klass(this, { mode });
      }
      return this._ai.choose(pi);
    }
    const s = this.state;
    if (s.phase === 'over') return null;

    // Whirlwind asks the DEFENDER, so this has to be answered even by the simple
    // bots — otherwise nobody replies and the turn never ends.
    if (s.pendingSwitch !== null) {
      if (s.pendingSwitch !== pi) return null;
      const sw = this.legalActions(pi).filter(a => a.t === 'switchIn');
      if (!sw.length) return null;
      if (mode === 'random') return sw[this.pick(sw.length)];
      const pp = s.players[pi];
      let bestSw = sw[0], bhSw = -1;
      sw.forEach(a => { const h = topCard(this.db, pp.bench[a.bench]).hp; if (h > bhSw) { bhSw = h; bestSw = a; } });
      return bestSw;
    }

    if (s.pendingPromote !== null) {
      if (s.pendingPromote !== pi) return null;
      const acts = this.legalActions(pi).filter(a => a.t === 'promote');
      if (!acts.length) return null;
      if (mode === 'random') return acts[this.pick(acts.length)];
      const p = s.players[pi];
      let best = acts[0], bh = -1;
      acts.forEach(a => { const h = topCard(this.db, p.bench[a.bench]).hp; if (h > bh) { bh = h; best = a; } });
      return best;
    }

    if (s.active !== pi) return null;
    const acts = this.legalActions(pi);
    if (!acts.length) return null;

    if (mode === 'random') {
      const attacks = acts.filter(x => x.t === 'attack');
      const others = acts.filter(x => x.t !== 'attack' && x.t !== 'pass');
      if (others.length && this.rand() < 0.72) return others[this.pick(others.length)];
      if (attacks.length) return attacks[this.pick(attacks.length)];
      return acts.find(x => x.t === 'pass');
    }

    const p = s.players[pi];
    const evolve = acts.find(a => a.t === 'evolve' && p.active && a.target === p.active.uid)
                || acts.find(a => a.t === 'evolve');
    const attachActive = acts.find(a => a.t === 'attachEnergy' && p.active && a.target === p.active.uid);
    const benchIt = acts.find(a => a.t === 'playBasic');
    const attacks = acts.filter(a => a.t === 'attack');

    if (evolve) return evolve;
    if (attachActive) return attachActive;
    if (p.bench.length < 2 && benchIt) return benchIt;
    if (attacks.length) {
      let best = attacks[0], bd = -1;
      for (const a of attacks) {
        const d = parseDamage(topCard(this.db, p.active).attacks[a.idx].dmg);
        if (d > bd) { bd = d; best = a; }
      }
      return best;
    }
    return acts.find(a => a.t === 'pass');
  }

  aiTurn(pi, mode = 'expert', maxActions = 40) {
    let n = 0;
    while (n++ < maxActions) {
      const s = this.state;
      if (s.phase === 'over') return;
      const a = this.aiChoose(pi, mode);
      if (!a) return;
      const before = s.turn;
      this.act(pi, a);
      if (s.turn !== before || (s.active !== pi && s.pendingPromote === null)) return;
    }
    if (this.state.active === pi && this.state.phase !== 'over' && this.state.pendingPromote === null) {
      this.act(pi, { t: 'pass' });
    }
  }

  randomTurn(pi) { return this.aiTurn(pi, 'random'); }

  // A blunt "always builds the Active and swings" player. Not smart - its job is
  // to drive games to Prize-based endings so the KO / promote / win paths get
  // exercised, which pure random play almost never does.
  greedyTurn(pi) { return this.aiTurn(pi, 'greedy'); }
}


// ============================================================================
// COLLECTION — what the player owns, and the save file that remembers it.
//
// Job 5a. Pure data: no DOM, no engine, no CARD_DB import. Everything that
// needs the card database takes a `db` argument, which is what lets the whole
// module be driven from tools/collectiontest.js with no browser.
//
// THE ONE IDEA WORTH READING BEFORE THE CODE
//
// The unit of storage is the VARIANT COMBINATION, not the physical card. A
// player with twelve Rattata, one of them Shiny and two Reverse Holo, is:
//
//     owned['base1-61'] = { '': 9, 'sh': 1, 'rh': 2 }
//
// Twelve cards, three numbers. This is what makes two things true at once:
// the collection screen can show a card ONCE with its best variant as the
// face, and the deck builder can still let you put that specific Shiny in a
// deck while the other eleven stay plain. Per-physical-card objects would give
// the same power and cost thousands of entries to do it.
//
// A deck entry is therefore [qty, id] or [qty, id, vkey]. The two-element form
// means plain, which is why data/decks.json and the DECKS in cards.js remain
// valid deck definitions with no migration at all.
// ============================================================================

const SAVE_VERSION = 1;
const SAVE_KEY = 'shadowless.save';
const SAVE_BACKUP_KEY = 'shadowless.save.corrupt';

// --------------------------------------------------------------- variants --
// Declared in ascending order of how impressive a pull is. That single order
// does three jobs: it canonicalises keys (so 'sh+fe' and 'fe+sh' are the same
// pile), it ranks variants for bestVariant(), and it is the order the UI should
// list them in. Add a flag here and the rest follows.
//
// mp1/mp2/mp3 are the Misprint glitch flavours. They live in the key rather
// than beside it so that two differently-broken Rattata are genuinely different
// collectibles, while two identically-broken ones still collapse into one pile.
// They are mutually exclusive: a card is misprinted one way or not at all.
const VARIANTS = [
  { key: 'rh',  label: 'Reverse Holo', family: 'rh' },
  { key: 'fe',  label: '1st Edition',  family: 'fe' },
  { key: 'sh',  label: 'Shiny',        family: 'sh' },
  { key: 'sl',  label: 'Shadowless',   family: 'sl' },
  { key: 'mp1', label: 'Misprint',     family: 'mp' },
  { key: 'mp2', label: 'Misprint',     family: 'mp' },
  { key: 'mp3', label: 'Misprint',     family: 'mp' },
];
const VARIANT_ORDER = VARIANTS.map(v => v.key);
const VARIANT_BY_KEY = {};
VARIANTS.forEach((v, i) => { VARIANT_BY_KEY[v.key] = Object.assign({ rank: i + 1 }, v); });

const PLAIN = '';

// Canonicalise a set of flags into a storage key. Accepts an array, a Set, or
// an already-joined string, so callers never have to care which they have.
// Unknown flags are dropped rather than stored — a typo must not silently
// create a pile that no renderer will ever draw.
function vkey(flags) {
  if (!flags) return PLAIN;
  let list;
  if (typeof flags === 'string') list = flags.split('+');
  else if (Array.isArray(flags)) list = flags.slice();
  else list = Array.from(flags);
  const seen = {};
  const fams = {};
  const out = [];
  for (const f of list) {
    const v = VARIANT_BY_KEY[f];
    if (!v || seen[f]) continue;
    if (fams[v.family]) continue;      // one per family; first declared wins
    seen[f] = 1; fams[v.family] = 1;
    out.push(f);
  }
  out.sort((a, b) => VARIANT_BY_KEY[a].rank - VARIANT_BY_KEY[b].rank);
  return out.join('+');
}

const vflags = key => (key ? String(key).split('+').filter(f => VARIANT_BY_KEY[f]) : []);
const isPlain = key => vkey(key) === PLAIN;

// How impressive a pile is, for picking the face of a stack. Rarer flags are
// worth exponentially more so that one Shadowless outranks any number of
// Reverse Holos, rather than three cheap flags out-scoring one expensive one.
function vscore(key) {
  return vflags(key).reduce((a, f) => a + (1 << VARIANT_BY_KEY[f].rank), 0);
}

function vlabel(key) {
  const f = vflags(key);
  if (!f.length) return 'Normal';
  return f.map(x => VARIANT_BY_KEY[x].label).join(' · ');
}

// --------------------------------------------------------------- the save --
function newSave(opts = {}) {
  return {
    v: SAVE_VERSION,
    created: opts.now || Date.now(),
    owned: {},                 // cardId -> { vkey: count }
    decks: [],                 // [{ name, list: [[qty, id, vkey?], ...] }]
    packs: {},                 // setCode -> unopened packs held
    starter: opts.starter || '',
    stats: { wins: 0, losses: 0, packsOpened: 0, cardsPulled: 0 },
    // Job 7. Which named opponents you have beaten, and how often. There is no
    // `unlocked` list beside it on purpose — progress.js derives what is open
    // from this map every time it is asked, so the two can never disagree.
    progress: { beaten: {}, lost: {} },
  };
}

// Fill in fields a save predates. Distinct from migrate() on purpose: migrate
// handles a FORMAT change and must fail loudly on a version it cannot bridge,
// whereas this is for additive fields where "absent" and "empty" mean the same
// thing. Adding an optional field to the save is a change to this function and
// nothing else — no version bump, no migration step.
// Fills only fields that are ABSENT. A present-but-wrong-typed field is
// corruption, not an old format, and repairing it here would hide it from
// validate() and silently discard whatever the player actually had. That
// distinction is the whole reason this is a separate function: `decks: "no"`
// must still be refused, while a save written before `packs` existed must not.
// (Written the lenient way first, which quietly turned a refused import into
// an accepted one — caught by collectiontest.)
function ensureShape(s) {
  if (s.owned == null) s.owned = {};
  if (s.decks == null) s.decks = [];
  if (s.packs == null) s.packs = {};
  // Counters are bookkeeping rather than collection data, so they are the one
  // place a wrong type is cheaper to reset than to reject.
  if (s.stats == null || typeof s.stats !== 'object') s.stats = {};
  ['wins', 'losses', 'packsOpened', 'cardsPulled'].forEach(k => {
    if (typeof s.stats[k] !== 'number') s.stats[k] = 0;
  });
  if (typeof s.starter !== 'string') s.starter = '';
  // Additive field (Job 7), so it belongs here rather than in a migration: a
  // save written before progression existed has beaten nobody, which is exactly
  // what an empty map means. Absent and empty are the same thing.
  if (s.progress == null || typeof s.progress !== 'object') s.progress = {};
  if (s.progress.beaten == null || typeof s.progress.beaten !== 'object') s.progress.beaten = {};
  if (s.progress.lost == null || typeof s.progress.lost !== 'object') s.progress.lost = {};
  // Decks predate both `id` and `built`. Absent id gets one; absent `built`
  // means true, because every deck that existed before the flag was a real,
  // playable, card-reserving deck. Filling only what is ABSENT, as above.
  let next = 0;
  for (const d of s.decks) { const n = parseInt(d && d.id, 10); if (n > next) next = n; }
  for (const d of s.decks) {
    if (!d || typeof d !== 'object') continue;
    if (d.id == null) d.id = String(++next);
    if (d.built == null) d.built = true;
  }
  return s;
}

const packsHeld = (save, set) => (save.packs && save.packs[set]) || 0;
const packsTotal = save => Object.keys(save.packs || {}).reduce((a, k) => a + save.packs[k], 0);

function addPacks(save, set, n) {
  if (!save.packs) save.packs = {};
  save.packs[set] = (save.packs[set] || 0) + n;
  return save;
}

function takePack(save, set) {
  if (packsHeld(save, set) <= 0) return false;
  save.packs[set]--;
  if (save.packs[set] <= 0) delete save.packs[set];
  return true;
}

function grant(save, cardId, key, n = 1) {
  if (n <= 0) return save;
  const k = vkey(key);
  const pile = save.owned[cardId] || (save.owned[cardId] = {});
  pile[k] = (pile[k] || 0) + n;
  return save;
}

// Hand the player a whole deck definition as loose cards. Used for the starter
// grant. `variants` is deliberately not a parameter: a granted deck is always
// plain. Trevor, 9 Aug — the first Shiny should be something a pack gave you,
// not something that was already in the box.
function grantDeck(save, deckDef) {
  for (const [qty, id] of deckDef.list) grant(save, id, PLAIN, qty);
  return save;
}

const ownedOf = (save, cardId, key) => (save.owned[cardId] || {})[vkey(key)] || 0;

function ownedTotal(save, cardId) {
  const pile = save.owned[cardId];
  if (!pile) return 0;
  let n = 0;
  for (const k in pile) n += pile[k];
  return n;
}

const isOwned = (save, cardId) => ownedTotal(save, cardId) > 0;

// The pile a stack should show its face as: the best variant owned, or plain.
// Returns a vkey, so a caller that owns nothing gets '' and renders normally
// rather than having to special-case an absence.
function bestVariant(save, cardId) {
  const pile = save.owned[cardId];
  if (!pile) return PLAIN;
  let best = PLAIN, bestScore = -1;
  for (const k in pile) {
    if (pile[k] <= 0) continue;
    const s = vscore(k);
    if (s > bestScore) { bestScore = s; best = k; }
  }
  return best;
}

// Every non-empty pile for a card, best first. This is what the deck builder
// lists under a card and what the collection screen shows on a detail view.
function pilesOf(save, cardId) {
  const pile = save.owned[cardId] || {};
  return Object.keys(pile)
    .filter(k => pile[k] > 0)
    .map(k => ({ key: k, n: pile[k], score: vscore(k), label: vlabel(k) }))
    .sort((a, b) => b.score - a.score);
}

// ------------------------------------------------------------- decks -------
// A deck is { id, name, list, built }.
//
// BUILT IS THE WHOLE MODEL, and it arrived by accident. Trevor's answer to
// "should an illegal draft be saveable" was yes, but its cards should stay in
// the pool for other decks — which is exactly the definition of a deck that
// does not reserve. That makes a draft and a "blueprint" (a deck you cannot
// afford yet) the same object, and it independently reproduces the GBC game's
// split between decks you have BUILT and layouts you have merely SAVED.
//
//   built: true   reserves its cards, and can be played
//   built: false  reserves nothing, cannot be played, costs nothing to keep
//
// Two consequences worth knowing. Un-building is LOSSLESS — the list survives,
// so dismantling is a reversible act rather than a destructive one. And a
// saved layout can go stale: another deck may claim a card it wanted, so its
// availability has to be rechecked at build time, never cached.
const deckIsBuilt = d => d.built !== false;
const builtDecks = save => save.decks.filter(deckIsBuilt);

// Ids are sequential rather than random so a save diffs cleanly and a test can
// predict them. Names are display only — they may repeat, and they may be
// anything the player types.
function nextDeckId(save) {
  let max = 0;
  for (const d of save.decks) { const n = parseInt(d.id, 10); if (n > max) max = n; }
  return String(max + 1);
}

const findDeck = (save, id) => save.decks.find(d => String(d.id) === String(id)) || null;

// A NAME MUST IDENTIFY AT MOST ONE DECK. Ids are the real identity and always
// were, but names are what the player sees, what deck select lists, and what
// `UI.myDeck` holds — so a duplicate name is an ambiguity the player has no way
// to see and no way to resolve.
//
// The builder's default name is "New deck", which makes the collision the
// DEFAULT path rather than an unlucky one: save a draft, build a deck, rename
// neither. That is exactly how Trevor's save came to hold a 41-card blueprint
// and a 60-card deck under one name, and `deckFor` served the blueprint.
//
// Suffixed rather than refused. The name that collides is nearly always the one
// the player never chose, so refusing would be friction over a decision they did
// not make — and the new name is on the tile the moment they return, which is
// the feedback. Renaming afterwards is one click and costs nothing.
function uniqueDeckName(save, name, exceptId) {
  const taken = n => save.decks.some(d =>
    String(d.id) !== String(exceptId) && d.name === n);
  if (!taken(name)) return name;
  for (let i = 2; ; i++) if (!taken(`${name} ${i}`)) return `${name} ${i}`;
}

// The last BUILT deck may not be un-built or deleted. With un-building now
// lossless this is no longer protection against losing work — it is protection
// against a confusing empty state where deck select offers nothing but
// Sandbox and it is not obvious why.
function canUnbuild(save, id) {
  const d = findDeck(save, id);
  if (!d) return { ok: false, why: 'no such deck' };
  if (!deckIsBuilt(d)) return { ok: false, why: 'that deck is not built' };
  if (builtDecks(save).length <= 1) return { ok: false, why: 'this is your only built deck' };
  return { ok: true, why: '' };
}

// What a deck needs that the player cannot currently supply, counting only
// cards locked up by OTHER built decks. Returns [] when the deck is buildable.
// Recomputed on demand and never stored — see the note on reservation below.
function deckShortfall(save, deck, db) {
  const want = {};
  for (const entry of deck.list) {
    const id = entry[1], k = vkey(entry[2]);
    (want[id] = want[id] || {})[k] = (want[id][k] || 0) + entry[0];
  }
  const res = reservedCounts(save, deck.id);
  const out = [];
  for (const id in want) {
    for (const k in want[id]) {
      const own = ownedOf(save, id, k);
      const held = (res[id] || {})[k] || 0;      // locked up by other BUILT decks
      const have = own - held;
      if (want[id][k] > have) {
        // `own` and `held` are reported separately because "you have none" and
        // "your other deck is holding them" are completely different problems
        // with completely different fixes — open packs, or dismantle. A single
        // "0 free" number cannot tell the player which one they are looking at,
        // and that is the most confusing state a reservation model can produce.
        out.push({ id, vkey: k, need: want[id][k], have: Math.max(0, have),
          owned: own, held,
          name: (db && db[id] && db[id].name) || id });
      }
    }
  }
  return out;
}

// ---------------------------------------------------------- reservation ----
// DERIVED, never stored. "How many plain Rattata are free" is owned minus the
// sum across every BUILT deck, recomputed on demand. Storing it would mean two
// numbers that can disagree, and they always eventually do.
//
// `exceptDeck` matches an id or a name, so a deck being edited does not
// reserve against itself.
function reservedCounts(save, exceptDeck) {
  const out = {};
  for (const d of save.decks) {
    if (!deckIsBuilt(d)) continue;              // drafts and blueprints hold nothing
    if (exceptDeck !== undefined && (String(d.id) === String(exceptDeck) || d.name === exceptDeck)) continue;
    for (const entry of d.list) {
      const [qty, id] = entry;
      const k = vkey(entry[2]);
      const pile = out[id] || (out[id] = {});
      pile[k] = (pile[k] || 0) + qty;
    }
  }
  return out;
}

function available(save, cardId, key, exceptDeck) {
  const k = vkey(key);
  const res = reservedCounts(save, exceptDeck);
  return ownedOf(save, cardId, k) - ((res[cardId] || {})[k] || 0);
}

// The 4-copy rule is BY NAME and ignores variants entirely — four Rattata is
// four Rattata whether or not one of them is Shiny. Counting per vkey here
// would silently allow a 16-Rattata deck.
function copiesByNameIn(db, list) {
  const out = {};
  for (const [qty, id] of list) {
    const c = db[id];
    if (!c) continue;
    out[c.name] = (out[c.name] || 0) + qty;
  }
  return out;
}

// ------------------------------------------------------------------ dex ----
// Denominators come from `db`, never from a constant. A dex that hardcodes 102
// starts lying the moment tools/gen_cards.js is run with --sets.
function collectionStats(save, db) {
  const ids = Object.keys(db);
  let ownedCards = 0, totalCards = 0;
  const speciesAll = {}, speciesOwned = {};
  const bySet = {};
  for (const id of ids) {
    const c = db[id];
    totalCards++;
    const set = (bySet[c.set] = bySet[c.set] || { owned: 0, total: 0 });
    set.total++;
    const have = isOwned(save, id);
    if (have) { ownedCards++; set.owned++; }
    if (c.dex) {
      speciesAll[c.dex] = 1;
      if (have) speciesOwned[c.dex] = 1;
    }
  }
  return {
    cards: { owned: ownedCards, total: totalCards },
    species: { owned: Object.keys(speciesOwned).length, total: Object.keys(speciesAll).length },
    bySet,
  };
}

// ------------------------------------------------------------ migration ----
// One entry per version step: MIGRATIONS[n] upgrades a v(n) save to v(n+1).
// Empty today because v1 is the first format — the machinery exists so that
// Job 6 widening the pool, or Job 7 adding progression, is an added function
// rather than a save wipe. tools/collectiontest.js exercises it with a fake
// step, so it is tested rather than merely present.
const MIGRATIONS = {};

function migrate(raw) {
  let s = raw;
  let guard = 0;
  while ((s.v || 0) < SAVE_VERSION) {
    const step = MIGRATIONS[s.v || 0];
    if (!step) throw new Error(`no migration from save version ${s.v} to ${SAVE_VERSION}`);
    s = step(s);
    if (++guard > 64) throw new Error('migration did not converge');
  }
  if (s.v > SAVE_VERSION) throw new Error(`save is from a newer version (${s.v} > ${SAVE_VERSION})`);
  return ensureShape(s);
}

// Structural check only. Deliberately does NOT verify that every card id exists
// in CARD_DB: a save made after Job 6 must still load when someone runs a build
// generated for Base Set alone, showing what it can rather than refusing.
function validate(s) {
  if (!s || typeof s !== 'object') throw new Error('save is not an object');
  if (typeof s.v !== 'number') throw new Error('save has no version');
  if (!s.owned || typeof s.owned !== 'object') throw new Error('save has no owned map');
  if (!Array.isArray(s.decks)) throw new Error('save has no deck list');
  for (const id in s.owned) {
    const pile = s.owned[id];
    if (!pile || typeof pile !== 'object') throw new Error(`owned["${id}"] is not a pile`);
    for (const k in pile) {
      if (typeof pile[k] !== 'number' || pile[k] < 0 || !isFinite(pile[k]))
        throw new Error(`owned["${id}"]["${k}"] is not a count`);
    }
  }
  for (const d of s.decks) {
    if (!d || typeof d.name !== 'string' || !Array.isArray(d.list))
      throw new Error('a saved deck is malformed');
  }
  return s;
}

// ---------------------------------------------------------- persistence ----
// Guarded so the module can be required in Node, where there is no
// localStorage. Every storage path returns a result rather than throwing, and
// nothing here is called at load time.
function storage() {
  try {
    if (typeof localStorage === 'undefined' || !localStorage) return null;
    return localStorage;
  } catch (e) { return null; }        // Firefox throws outright when cookies are off
}

// Returns { save, status } where status is one of:
//   'ok'      loaded and migrated
//   'empty'   nothing stored yet — save is null
//   'nostore' localStorage unavailable — save is null, and the caller should
//             say so rather than silently running a session that won't persist
//   'corrupt' something was there and could not be read. The raw text is moved
//             to a backup key first: a save that cannot be parsed today might
//             be recoverable by hand, and overwriting it is unrecoverable.
function loadSave() {
  const ls = storage();
  if (!ls) return { save: null, status: 'nostore' };
  let text;
  try { text = ls.getItem(SAVE_KEY); } catch (e) { return { save: null, status: 'nostore' }; }
  if (!text) return { save: null, status: 'empty' };
  try {
    return { save: validate(migrate(JSON.parse(text))), status: 'ok' };
  } catch (e) {
    try { ls.setItem(SAVE_BACKUP_KEY, text); } catch (e2) { /* nothing more we can do */ }
    return { save: null, status: 'corrupt', error: String(e && e.message || e) };
  }
}

// Returns { ok, error }. Quota is the realistic failure: a full collection is
// small, but a browser at its limit will throw and the caller must be able to
// tell the player their progress is not being written down.
function writeSave(save) {
  const ls = storage();
  if (!ls) return { ok: false, error: 'no local storage available' };
  try {
    ls.setItem(SAVE_KEY, JSON.stringify(save));
    return { ok: true };
  } catch (e) {
    return { ok: false, error: String(e && e.message || e) };
  }
}

// ------------------------------------------------------- export / import ---
// There is no server and no remote, so a cleared browser profile is the only
// thing standing between the player and their whole collection. Export is the
// backup; import is the restore, and it validates and migrates exactly the way
// a load does, so an old exported file still works after a format change.
function exportSave(save) {
  return JSON.stringify({ game: 'shadowless', exported: Date.now(), save }, null, 2);
}

function importSave(text) {
  let blob;
  try { blob = JSON.parse(text); } catch (e) { throw new Error('that is not valid JSON'); }
  const raw = (blob && blob.save) ? blob.save : blob;   // accept a bare save too
  return validate(migrate(raw));
}

// ONE LINE, deliberately. tools/build.js strips this with a line-anchored
// regex, so a multi-line export leaves its own body behind in the bundle and
// breaks the built HTML. The builder now refuses that rather than emitting it.


// ============================================================================
// BOOSTER PACKS — the rarity table from PACKS.md, as logic.
//
// Job 5b. Pure and dependency-free: takes a card database and a random
// function, returns what a pack contained. No DOM, no engine, no collection —
// which is what lets tools/packtest.js open a few hundred thousand of them and
// check the odds actually land where PACKS.md claims before anyone tunes a
// number by feel.
//
// Variants come out as FLAG ARRAYS, not canonical keys: collection.js's
// grant(save, id, flags) canonicalises on the way in, so this module never has
// to know how a key is spelled. It also means packs.js has no dependencies.
//
// EVERY NUMBER IN PACK_ODDS IS A PLACEHOLDER. PACKS.md is explicit that the
// table is a pacing schedule rather than tuned values. It lives in one object
// for exactly that reason.
// ============================================================================

// 1 Rare + 3 Uncommon + 7 Common-tier = 11, constant across the whole game.
const PACK_SHAPE = { rare: 1, uncommon: 3, common: 7 };
const PACK_SIZE = PACK_SHAPE.rare + PACK_SHAPE.uncommon + PACK_SHAPE.common;

const PACK_ODDS = {
  // Flat 2:1 non-holo:holo on the Rare slot for every set. Deliberately not
  // each set's real pool ratio, which drifts 45-55% and isn't worth chasing.
  holo: 1 / 3,

  // Whole-pack rolls.
  firstEd: 1 / 20,
  intrusion: 1 / 100,      // a promo or Southern Islands card replaces one Common

  // Per-card rolls. reverseHolo is offered only on the 10 Common/Uncommon
  // slots — the Rare slot already has its own holo axis. The other three roll
  // against all 11.
  reverseHolo: 1 / 100,
  shiny: 1 / 440,
  shadowless: 1 / 2200,
  misprint: 1 / 11000,
};

// PACKS.md wants 2-3 glitch flavours so a Misprint sighting reads as a fresh
// joke rather than "oh, the misprint effect again". They are separate variant
// keys, so two differently-broken cards are different collectibles.
const MISPRINT_FLAVOURS = ['mp1', 'mp2', 'mp3'];

// HOW MUCH BASIC ENERGY A PACK CAN CONTAIN, AND HOW LITTLE — 16 Aug 2026, and
// this replaced the stipend outright. Trevor, from play, in two notes:
//
//   "There are just way too many and it ends up feeling to the player like
//    they're being robbed of other cards when too many energies come in."
//
//   "...just including energies in the common pool for every set, and do that by
//    pretty much just throwing them right into each set but with their original
//    base1 card codes, and not tracking them as part of the number in the new
//    set."
//
// WHAT WENT. Jungle and Fossil print no basic Energy at all, so Job 6a handed
// their packs two Energy BESIDE the eleven cards. That made a Jungle booster a
// 13-card pack with two mandatory Energy in it, which is the thing being
// complained about. base1's Energy now sits in every set's Common pool instead,
// under its own base1 ids, so it is drawn rather than granted and it never
// counts toward the set it turns up in.
//
// TWO NUMBERS, AND THEY MEAN DIFFERENT THINGS.
//
//   ENERGY_FLOOR   a guarantee, per set. Only base1 has one, and it is the same
//                  early-game pacing the floor always was: the first packs a
//                  player opens have to be able to build a deck. A set that is
//                  not listed gets Energy at the pool's own natural rate, which
//                  is what "include them in the common pool" means.
//   ENERGY_CAP     a ceiling, everywhere, and the actual fix. base1's remaining
//                  five Common slots drew from a pool CONTAINING Energy, so a
//                  Base Set pack could and did run well past two.
//
// Set the floor to 0 to make base1 behave like every other set; that is the one
// line, and it is the only thing separating the two readings of the note above.
const ENERGY_FLOOR = { base1: 2 };
const ENERGY_CAP = 2;

// Which set's basic Energy stands in for a set that prints none. Resolved from
// the database rather than hardcoded, so a build generated without base1 still
// works instead of silently borrowing nothing.
function energySource(db) {
  let best = null;
  for (const id in db) {
    const c = db[id];
    if (c.kind !== 'energy' || c.cls !== 'Basic') continue;
    if (best === null || c.set < best) best = c.set;
  }
  return best;
}

// Not boosters. Southern Islands was a fixed boxed set and promos came from
// magazines, tins and events, so neither belongs in a normal pack's pools —
// they are only reachable through the intrusion roll.
const NON_BOOSTER_SETS = { basep: 1, si1: 1 };

// The Rare slot's foil half. Rare Shining and Rare Secret are real printed
// rarities that sit in the Rare slot, and both are foil treatments, so they
// pool with Rare Holo.
//
// FLAG FOR JOB 8: this makes an RS as likely as any other holo Rare. Neo
// Destiny prints 8 RS against ~40 holos, which would land them at ~20% of
// holo pulls — nothing like their real scarcity. PACKS.md says RS needs no RNG
// layer of its own, and at Base Set that is true because there are none. It
// stops being true the moment neo3/neo4 load.
const HOLO_RARITIES = { 'Rare Holo': 1, 'Rare Shining': 1, 'Rare Secret': 1 };

// --------------------------------------------------------------- pools -----
// Partition a set into the buckets a pack draws from.
//
// Basic Energy carries a blank `rarity` in the corpus (see PACKS.md Part 1 —
// it is a quirk of the data, not evidence of an unnumbered pool). It is a
// Common-tier card, so it goes in `common` AND is tracked separately in
// `energy` for the floor. Double Colorless is Uncommon and is not Energy for
// the floor's purposes — the floor is about basic Energy for a first deck.
//
// Memoised per (database, set). openPack() calls this once per pack, and the
// scan is O(whole database) — invisible when a player opens one, and the
// dominant cost when packtest.js opens 200,000. It was already 3x worse the
// moment Jungle and Fossil generated, and would be 12x worse at fourteen sets.
//
// Safe because pools are READ-ONLY downstream (pickFrom and drawSlots only
// read) and a card database is built once and not mutated. If you ever do
// mutate one, build it fully before opening a pack against it.
const POOL_CACHE = new WeakMap();

function buildPools(db, setCode) {
  let perSet = POOL_CACHE.get(db);
  if (!perSet) { perSet = {}; POOL_CACHE.set(db, perSet); }
  const key = setCode || '*';
  if (perSet[key]) return perSet[key];

  const pools = { rareHolo: [], rare: [], uncommon: [], common: [], commonNoEnergy: [], energy: [] };
  for (const id in db) {
    const c = db[id];
    if (setCode && c.set !== setCode) continue;
    if (NON_BOOSTER_SETS[c.set]) continue;
    const isBasicEnergy = c.kind === 'energy' && c.cls === 'Basic';
    if (isBasicEnergy) { pools.energy.push(id); pools.common.push(id); continue; }
    if (HOLO_RARITIES[c.rarity]) pools.rareHolo.push(id);
    else if (c.rarity === 'Rare') pools.rare.push(id);
    else if (c.rarity === 'Uncommon') pools.uncommon.push(id);
    else if (c.rarity === 'Common') { pools.common.push(id); pools.commonNoEnergy.push(id); }
    // Anything else (Promo, or a rarity we have not met) is deliberately
    // dropped rather than guessed into a bucket.
  }

  // HOW OFTEN A COMMON SLOT IS ENERGY, as a share rather than as a side effect
  // of how long an array is.
  //
  // Drawing uniformly from `common` looks like it means "at the set's natural
  // rate" and does not, the moment a set borrows: base1's six Energy are six of
  // its own 38 Commons (16%), but dropped into Jungle's 16 they become six of 22
  // (27%). Jungle would get more Energy than Base Set for no reason other than
  // having fewer Commons to dilute it. So a borrowing set inherits the SOURCE's
  // share, and the roll is explicit.
  //
  // For a set that prints its own this is exactly what uniform drawing already
  // did, so nothing about Base Set changes.
  pools.energyShare = pools.common.length ? pools.energy.length / pools.common.length : 0;

  // A set that prints no basic Energy of its own borrows base1's, ids and all.
  // This is what replaced the stipend: the Energy is IN the Common pool and is
  // drawn like anything else, rather than handed over beside an eleven-card pack
  // as a twelfth and thirteenth card. It keeps its base1 number, so it is never
  // part of the set it fell out of — Trevor's call, and the reason the dex and
  // the set-completion counters need no special case for it.
  if (setCode && !pools.energy.length) {
    const src = energySource(db);
    if (src && src !== setCode) {
      const from = buildPools(db, src);
      for (const id of from.energy) { pools.energy.push(id); pools.common.push(id); }
      pools.energyShare = from.energyShare;
    }
  }

  const share = pools.energyShare;
  for (const k in pools) if (Array.isArray(pools[k])) pools[k].sort();   // deterministic given a seed
  pools.energyShare = share;
  perSet[key] = pools;
  return pools;
}

// The pool a promo intrusion may draw from. Progression-gated in principle —
// PACKS.md is clear that a promo from an era the player hasn't reached would
// read as broken rather than delightful — but Job 7 doesn't exist, so the
// caller passes the eligible pool and the default is none.
function promoPool(db, allowedSets) {
  const out = [];
  for (const id in db) {
    const c = db[id];
    if (!NON_BOOSTER_SETS[c.set]) continue;
    if (allowedSets && allowedSets.indexOf(c.set) < 0) continue;
    out.push(id);
  }
  return out.sort();
}

// ---------------------------------------------------------------- draws ----
const pickFrom = (arr, rand) => arr[Math.floor(rand() * arr.length)];

// Draw n cards, refusing a repeat WITHIN THIS PACK unless the card is basic
// Energy.
//
// Two different rules on purpose. Three identical Rattata in one pack is
// annoying and reads as a bug; two of the same Energy is normal and is exactly
// what you want when you are building a deck around one type. Real packs could
// repeat a Common, so this is a feel decision over a fidelity one — noted here
// because it is the kind of thing a later session would otherwise "fix".
//
// The retry is bounded: a pool smaller than the slot count would otherwise
// spin forever, so it gives up and allows the duplicate rather than hanging.
function drawSlots(pool, n, rand, isEnergy, taken) {
  const out = [];
  for (let i = 0; i < n; i++) {
    let id = null;
    for (let tries = 0; tries < 40; tries++) {
      const cand = pickFrom(pool, rand);
      if (isEnergy[cand] || !taken[cand]) { id = cand; break; }
    }
    if (id === null) id = pickFrom(pool, rand);
    if (!isEnergy[id]) taken[id] = 1;
    out.push(id);
  }
  return out;
}

// Per-card cosmetic rolls. `slot` decides whether Reverse Holo is on the table.
function rollVariants(rand, slot, odds, firstEd) {
  const flags = [];
  if (firstEd) flags.push('fe');
  if (slot !== 'rare' && rand() < odds.reverseHolo) flags.push('rh');
  if (rand() < odds.shiny) flags.push('sh');
  if (rand() < odds.shadowless) flags.push('sl');
  if (rand() < odds.misprint) flags.push(MISPRINT_FLAVOURS[Math.floor(rand() * MISPRINT_FLAVOURS.length)]);
  return flags;
}

// --------------------------------------------------------------- a pack ----
// Returns:
//   {
//     set, firstEd, intrusion,
//     cards: [ { id, slot, flags, holo }, ... ]   // 11 of them, Rare first
//   }
//
// `slot` is 'rare' | 'uncommon' | 'common' | 'promo'. `holo` is only meaningful
// on the Rare slot and records which side of the 2:1 the roll landed.
function openPack(db, setCode, rand, opts = {}) {
  const odds = Object.assign({}, PACK_ODDS, opts.odds);
  const pools = opts.pools || buildPools(db, setCode);
  const promos = opts.promos || [];

  if (!pools.common.length || !pools.uncommon.length ||
      (!pools.rare.length && !pools.rareHolo.length)) {
    throw new Error(`set "${setCode}" cannot fill a pack — pools are empty`);
  }

  const firstEd = rand() < odds.firstEd;
  const wantIntrusion = promos.length > 0 && rand() < odds.intrusion;

  const isEnergy = {};
  pools.energy.forEach(id => { isEnergy[id] = 1; });
  const taken = {};
  const cards = [];

  // --- the Rare slot. Roll holo-vs-not FIRST, then pick within that tier.
  // If a set has only one side (nothing does today, but Job 8 might), fall
  // back rather than throwing.
  let holo = rand() < odds.holo;
  if (holo && !pools.rareHolo.length) holo = false;
  if (!holo && !pools.rare.length) holo = true;
  const rareId = pickFrom(holo ? pools.rareHolo : pools.rare, rand);
  taken[rareId] = 1;
  cards.push({ id: rareId, slot: 'rare', holo, flags: rollVariants(rand, 'rare', odds, firstEd) });

  // --- 3 Uncommon
  for (const id of drawSlots(pools.uncommon, PACK_SHAPE.uncommon, rand, isEnergy, taken)) {
    cards.push({ id, slot: 'uncommon', holo: false, flags: rollVariants(rand, 'uncommon', odds, firstEd) });
  }

  // --- 7 Common-tier: the floor first, then the rest against the cap.
  //
  // The floor slots draw from `energy`; the rest draw from `common`, which
  // CONTAINS Energy, so it can still turn up at its natural share — and that is
  // exactly what used to let a base1 pack run to five or six of them. The draw
  // is now one slot at a time so it can switch to `commonNoEnergy` the moment
  // the cap is reached. `taken` is threaded through, so no-repeats still holds.
  const cap = Math.max(0, opts.energyCap === undefined ? ENERGY_CAP : opts.energyCap);
  const floor = Math.min(ENERGY_FLOOR[setCode] || 0, cap, pools.energy.length ? PACK_SHAPE.common : 0);
  const commonIds = [];
  let energyCount = 0;
  if (floor > 0) {
    const got = drawSlots(pools.energy, floor, rand, isEnergy, taken);
    energyCount += got.length;
    commonIds.push(...got);
  }
  while (commonIds.length < PACK_SHAPE.common) {
    const roomLeft = energyCount < cap && pools.energy.length;
    const wantEnergy = roomLeft && rand() < pools.energyShare;
    const from = wantEnergy ? pools.energy
