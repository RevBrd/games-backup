// ============================================================================
// ART — card sigils.
//
// We have card TEXT but no card ART. Rather than leave an empty illustration
// window, each card gets a geometric emblem generated deterministically from
// its own card_id, so the same card always looks the same and no two look
// alike. It is not pretending to be a picture of the creature.
//
// The emblem also encodes two true facts, readable at a glance in play:
//   petals      = number of attacks (1-3)
//   ring marks  = retreat cost
// ============================================================================

// Type colours. Two sets: BRIGHT for dark surfaces, INK for pale card stock.
const ENERGY_COLOR = { G: '#6FAE5A', R: '#D4603C', W: '#4E9BC4', L: '#D9BB47', P: '#9269A8', F: '#B07248', C: '#AAB2BB', D: '#5A6672', M: '#8A94A0' };
const ENERGY_INK   = { G: '#4A7C3A', R: '#B44A2A', W: '#2F7CA6', L: '#9A7C12', P: '#6F4C86', F: '#8C5430', C: '#6E7780', D: '#414B56', M: '#69737E' };
const ENERGY_NAME  = { G: 'Grass', R: 'Fire', W: 'Water', L: 'Lightning', P: 'Psychic', F: 'Fighting', C: 'Colorless', D: 'Darkness', M: 'Metal' };

// FNV-1a, then a murmur3 finalizer. The finalizer is not optional: raw FNV-1a
// mixes its LOW bits poorly, and every parameter below is derived with `% n`,
// which reads exactly those bits. Without it, cards whose hashes differ wildly
// still land on identical parameter tuples.
function hash32(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 16; h = Math.imul(h, 2246822507);
  h ^= h >>> 13; h = Math.imul(h, 3266489909);
  h ^= h >>> 16;
  return h >>> 0;
}

// Independent parameter streams. Bit-shifting a single hash reuses overlapping
// bits, which quietly shrinks the real parameter space; separate salted hashes
// keep the dimensions independent as the card pool grows.
function hparam(id, salt, n) { return hash32(id + '#' + salt) % n; }

function polyPoints(cx, cy, r, n, rotDeg) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (rotDeg * Math.PI / 180) + (i * 2 * Math.PI / n) - Math.PI / 2;
    pts.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1));
  }
  return pts.join(' ');
}

function sigilType(card) {
  if (card.kind === 'pokemon') return card.type || 'C';
  if (card.kind === 'energy') return card.provides && card.provides.length === 1 ? card.provides : 'C';
  return 'P';
}

// Returns an SVG string. Pure and deterministic: same card_id, same emblem.
function sigilSVG(card) {
  const h = hash32(card.id);
  const t = sigilType(card);
  const col = ENERGY_INK[t] || ENERGY_INK.C;
  const sides = 3 + hparam(card.id, 'sd', 6);   // 3..8
  const rot = hparam(card.id, 'rt', 360);
  const style = hparam(card.id, 'sy', 3);
  const jitter = hparam(card.id, 'jt', 9) - 4;

  const petals = card.kind === 'pokemon' ? Math.max(1, (card.attacks || []).length) : 1;
  const marks = card.kind === 'pokemon' ? Math.min(4, card.retreat || 0) : 0;

  const parts = [];
  parts.push(`<rect x="0" y="0" width="100" height="100" fill="${col}" opacity="0.07"/>`);

  if (card.kind === 'trainer') {
    // Trainers get a bracket-and-seal motif rather than a creature emblem.
    // There are ~190 Trainers in the WOTC run, so the parameter space has to be
    // wide enough that the birthday problem doesn't produce twins.
    const inset = 16 + hparam(card.id, 'in', 7);
    const sz = 100 - inset * 2;
    const tilt = hparam(card.id, 'ti', 45);
    const core = hparam(card.id, 'co', 4);
    const bars = 2 + hparam(card.id, 'ba', 3);
    const corner = hparam(card.id, 'cn', 3);
    const ring = hparam(card.id, 'ri', 3);
    const studs = hparam(card.id, 'st', 5);
    const barW = 10 + hparam(card.id, 'bw', 5) * 2;
    const innerSz = 34 + hparam(card.id, 'is', 5) * 2;
    parts.push(`<rect x="${inset}" y="${inset}" width="${sz}" height="${sz}" fill="none" stroke="${col}" stroke-width="2.5" opacity="0.85"/>`);
    parts.push(`<rect x="${50 - innerSz / 2}" y="${50 - innerSz / 2}" width="${innerSz}" height="${innerSz}" fill="none" stroke="${col}" stroke-width="1.2" opacity="0.5" transform="rotate(${tilt} 50 50)"/>`);
    const cl = 10 + corner * 5;
    parts.push(`<path d="M${inset} ${inset + cl} L${inset} ${inset} L${inset + cl} ${inset}" fill="none" stroke="${col}" stroke-width="4"/>`);
    parts.push(`<path d="M${100 - inset} ${100 - inset - cl} L${100 - inset} ${100 - inset} L${100 - inset - cl} ${100 - inset}" fill="none" stroke="${col}" stroke-width="4"/>`);
    if (ring === 1) parts.push(`<circle cx="50" cy="50" r="27" fill="none" stroke="${col}" stroke-width="1" opacity="0.4"/>`);
    else if (ring === 2) parts.push(`<circle cx="50" cy="50" r="22" fill="none" stroke="${col}" stroke-width="1" opacity="0.4" stroke-dasharray="4 3"/>`);
    for (let i = 0; i < bars; i++) {
      const y = 50 - (bars - 1) * 4 + i * 8;
      parts.push(`<line x1="${50 - barW}" y1="${y}" x2="${50 + barW}" y2="${y}" stroke="${col}" stroke-width="1.6" opacity="0.55"/>`);
    }
    for (let i = 0; i < studs; i++) {
      const a = (-90 + (i - (studs - 1) / 2) * 26) * Math.PI / 180;
      parts.push(`<circle cx="${(50 + 35 * Math.cos(a)).toFixed(1)}" cy="${(50 + 35 * Math.sin(a)).toFixed(1)}" r="2.6" fill="${col}" opacity="0.8"/>`);
    }
    if (core === 0) parts.push(`<circle cx="50" cy="50" r="7" fill="${col}" opacity="0.9"/>`);
    else if (core === 1) parts.push(`<polygon points="${polyPoints(50, 50, 9, 3, tilt)}" fill="${col}" opacity="0.9"/>`);
    else if (core === 2) parts.push(`<rect x="44" y="44" width="12" height="12" fill="${col}" opacity="0.9" transform="rotate(45 50 50)"/>`);
    else parts.push(`<polygon points="${polyPoints(50, 50, 9, 6, tilt)}" fill="${col}" opacity="0.9"/>`);
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${parts.join('')}</svg>`;
  }

  if (card.kind === 'energy') {
    const rays = 6 + hparam(card.id, 'ry', 5);          // 6..10
    const coreR = 26 + hparam(card.id, 'er', 4) * 2;    // 26..32
    const inner = hparam(card.id, 'ei', 3);
    parts.push(`<circle cx="50" cy="50" r="${coreR}" fill="${col}" opacity="0.9"/>`);
    parts.push(`<circle cx="50" cy="50" r="${coreR}" fill="none" stroke="${col}" stroke-width="2"/>`);
    if (inner === 1) parts.push(`<circle cx="50" cy="50" r="${(coreR * 0.55).toFixed(1)}" fill="none" stroke="#FFF" stroke-width="1.6" opacity="0.5"/>`);
    else if (inner === 2) parts.push(`<polygon points="${polyPoints(50, 50, coreR * 0.5, 6, rot)}" fill="none" stroke="#FFF" stroke-width="1.6" opacity="0.5"/>`);
    for (let i = 0; i < rays; i++) {
      const a = (i * (360 / rays) + rot) * Math.PI / 180;
      parts.push(`<line x1="${(50 + (coreR + 4) * Math.cos(a)).toFixed(1)}" y1="${(50 + (coreR + 4) * Math.sin(a)).toFixed(1)}" x2="${(50 + (coreR + 14) * Math.cos(a)).toFixed(1)}" y2="${(50 + (coreR + 14) * Math.sin(a)).toFixed(1)}" stroke="${col}" stroke-width="3" opacity="0.7"/>`);
    }
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${parts.join('')}</svg>`;
  }

  // ---- Pokemon ----
  // Parameter space has to comfortably exceed the pool size, or the birthday
  // problem produces twins: 1020 Pokemon against a ~58k space yields ~9
  // expected collisions, which is what a narrower version of this actually did.
  const petalRx = 7 + hparam(card.id, 'px', 5);        // 7..11
  const petalRy = 17 + hparam(card.id, 'py', 5);       // 17..21
  const coreR = 21 + hparam(card.id, 'cr', 5);         // 21..25
  const dash = hparam(card.id, 'ds', 2);
  const petalTop = 20 + jitter;

  parts.push(`<circle cx="50" cy="50" r="41" fill="none" stroke="${col}" stroke-width="1" opacity="0.35"${dash ? ' stroke-dasharray="3 4"' : ''}/>`);

  // petals = attack count
  for (let i = 0; i < petals; i++) {
    const a = rot + i * (360 / petals);
    parts.push(`<ellipse cx="50" cy="${petalTop}" rx="${petalRx}" ry="${petalRy}" fill="${col}" opacity="0.30" transform="rotate(${a.toFixed(0)} 50 50)"/>`);
  }

  // core polygon, identity-driven
  parts.push(`<polygon points="${polyPoints(50, 50, coreR, sides, rot)}" fill="none" stroke="${col}" stroke-width="2.4" opacity="0.95"/>`);
  if (style === 0) {
    parts.push(`<polygon points="${polyPoints(50, 50, coreR * 0.54, sides, rot + 180 / sides)}" fill="${col}" opacity="0.75"/>`);
  } else if (style === 1) {
    parts.push(`<circle cx="50" cy="50" r="${(coreR * 0.5).toFixed(1)}" fill="none" stroke="${col}" stroke-width="2.4" opacity="0.9"/>`);
    parts.push(`<circle cx="50" cy="50" r="4.5" fill="${col}"/>`);
  } else {
    for (let i = 0; i < sides; i++) {
      const a = (rot + i * (360 / sides) - 90) * Math.PI / 180;
      const rr = coreR * 0.54;
      parts.push(`<circle cx="${(50 + rr * Math.cos(a)).toFixed(1)}" cy="${(50 + rr * Math.sin(a)).toFixed(1)}" r="3.4" fill="${col}" opacity="0.85"/>`);
    }
  }

  // ring marks = retreat cost
  for (let i = 0; i < marks; i++) {
    const a = (-90 + (i - (marks - 1) / 2) * 22) * Math.PI / 180;
    parts.push(`<circle cx="${(50 + 41 * Math.cos(a)).toFixed(1)}" cy="${(50 + 41 * Math.sin(a)).toFixed(1)}" r="3.6" fill="${col}"/>`);
  }

  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${parts.join('')}</svg>`;
}


// ============================================================================
// DECK GENERATOR
//
// Given a pool of card ids, build a legal 60-card deck: complete evolution
// lines, enough Basics to open reliably, Energy matching the Pokemon's actual
// attack costs, and the 4-copy-by-name rule respected.
//
// Used now for sandbox testing of newly implemented cards, and later for
// generating campaign opponents from a set-gated pool.
// ============================================================================

const DECKGEN_DEFAULTS = {
  size: 60,
  energy: 28,
  maxCopies: 4,
  minBasics: 12,
  trainerTarget: 8,
};

function generateDeck(db, poolIds, rand, opts = {}) {
  const cfg = Object.assign({}, DECKGEN_DEFAULTS, opts);
  const pick = (n) => Math.floor(rand() * n);
  const pool = poolIds.filter(id => db[id]);

  const basicEnergy = pool.filter(id => db[id].kind === 'energy' && db[id].cls === 'Basic');
  const trainers = pool.filter(id => db[id].kind === 'trainer');
  const mons = pool.filter(id => db[id].kind === 'pokemon');
  const basics = mons.filter(id => db[id].stage === 'Basic');
  if (!basics.length || !basicEnergy.length) return null;

  const byName = {};
  mons.forEach(id => { (byName[db[id].name] = byName[db[id].name] || []).push(id); });
  // who evolves from whom
  const evosOf = {};
  mons.forEach(id => {
    const f = db[id].evolvesFrom;
    if (f) (evosOf[f] = evosOf[f] || []).push(id);
  });

  const counts = {};       // card_id -> qty
  const nameCounts = {};   // name -> qty (the 4-copy rule is by NAME)
  let total = 0;

  const room = (id, want) => {
    const name = db[id].name;
    const free = cfg.maxCopies - (nameCounts[name] || 0);
    return Math.max(0, Math.min(want, free, cfg.size - total));
  };
  const add = (id, want) => {
    const n = room(id, want);
    if (n <= 0) return 0;
    counts[id] = (counts[id] || 0) + n;
    nameCounts[db[id].name] = (nameCounts[db[id].name] || 0) + n;
    total += n;
    return n;
  };

  // --- 1. pick a few evolution lines, seeded from Basics that actually evolve
  const seeds = basics.slice();
  for (let i = seeds.length - 1; i > 0; i--) { const j = pick(i + 1); [seeds[i], seeds[j]] = [seeds[j], seeds[i]]; }

  const monTarget = cfg.size - cfg.energy - cfg.trainerTarget;
  let lines = 0;
  for (const baseId of seeds) {
    if (total >= monTarget) break;
    if (lines >= 4) break;
    const name = db[baseId].name;
    const chain = [];
    let cur = name;
    while (evosOf[cur] && evosOf[cur].length) {
      const nxt = evosOf[cur][pick(evosOf[cur].length)];
      chain.push(nxt);
      cur = db[nxt].name;
    }
    if (chain.length) {
      add(baseId, 4);
      add(chain[0], 3);
      if (chain[1]) add(chain[1], 2);
      lines++;
    }
  }
  // --- 2. top up with standalone Basics so we always open with something
  for (const baseId of seeds) {
    if (total >= monTarget) break;
    add(baseId, 3);
  }
  // guarantee a healthy Basic count
  let basicCount = Object.keys(counts).reduce((a, id) =>
    a + (db[id].kind === 'pokemon' && db[id].stage === 'Basic' ? counts[id] : 0), 0);
  for (const baseId of seeds) {
    if (basicCount >= cfg.minBasics) break;
    const got = add(baseId, 1);
    basicCount += got;
    if (!got) continue;
  }

  // --- 3. Trainers
  const trShuffled = trainers.slice();
  for (let i = trShuffled.length - 1; i > 0; i--) { const j = pick(i + 1); [trShuffled[i], trShuffled[j]] = [trShuffled[j], trShuffled[i]]; }
  let trAdded = 0;
  for (const id of trShuffled) {
    if (trAdded >= cfg.trainerTarget) break;
    trAdded += add(id, 2);
  }

  // --- 4. Energy, weighted by what the chosen Pokemon actually need
  const need = {};
  for (const id in counts) {
    const c = db[id];
    if (c.kind !== 'pokemon') continue;
    (c.attacks || []).forEach(a => a.cost.split('').forEach(t => {
      if (t !== 'C') need[t] = (need[t] || 0) + counts[id];
    }));
  }
  const types = Object.keys(need);
  const remaining = cfg.size - total;
  if (!types.length) {
    // colourless-only deck: any basic Energy will do
    add(basicEnergy[0], remaining);
  } else {
    const totalNeed = types.reduce((a, t) => a + need[t], 0);
    let placed = 0;
    types.forEach((t, i) => {
      const src = basicEnergy.find(id => db[id].provides === t);
      if (!src) return;
      const share = i === types.length - 1
        ? remaining - placed
        : Math.round(remaining * (need[t] / totalNeed));
      const n = Math.max(0, Math.min(share, cfg.size - total));
      if (n > 0) { counts[src] = (counts[src] || 0) + n; total += n; placed += n; }
    });
    // any shortfall (missing Energy type in the pool) goes to whatever exists
    if (total < cfg.size) {
      const src = basicEnergy[0];
      const n = cfg.size - total;
      counts[src] = (counts[src] || 0) + n; total += n;
    }
  }

  if (total !== cfg.size) return null;
  const list = Object.keys(counts).map(id => [counts[id], id]);
  return { name: opts.name || 'Sandbox', list, generated: true };
}


// ============================================================================
// AI — expected-value play.
//
// The core idea: never judge an attack by its printed damage. Enumerate the
// coin-flip outcomes into a probability distribution, run each outcome through
// the ENGINE's own damage calculation, and score the result. That way the bot
// values Twineedle at its true average, understands that Bubblebeam's paralysis
// is worth more than 10 extra damage, and refuses to attack into a Barrier.
//
// Scoring is in abstract "points". Roughly: 1 point ~= 1 damage. A Knock Out is
// worth much more than the damage it took, because Prizes are the win condition.
// ============================================================================

const AI_WEIGHTS = {
  damage: 1.0,          // per point of expected damage dealt
  knockout: 55,         // landing a KO (on top of the damage)
  lastPrize: 240,       // KO that wins the game outright
  selfDamage: 0.8,      // per point of expected damage to self
  selfKO: 70,           // killing your own Pokemon
  benchDamageFoe: 0.7,  // splash onto their bench
  benchDamageMine: 0.9, // splash onto mine
  paralyze: 26,         // costs them a turn
  sleep: 22,            // ~50% they stay down, plus they can't attack
  confuse: 15,          // ~50% their attack fails and they self-hit
  poison: 12,           // 10/turn until they switch
  energyDiscard: 7,     // per Energy burned as an attack cost
  drag: 14,             // forcing a benched Pokemon into the Active spot
  shieldSelf: 20,       // Stiffen / Withdraw / Barrier
  destinyBond: 18,      // arming Destiny Bond when death looks likely
  attachEnable: 1.0,    // scale on "how much better my attacks get"
  attachBuild: 3.5,     // progress toward an attack we can't afford yet
  evolveHP: 0.45,       // per point of max-HP gained
  evolveBase: 16,       // evolving is good almost always
  benchFirst: 26,       // first spare Basic on the bench is important
  benchMore: 7,         // each additional one
  benchTooMany: 2,
  retreatBase: -6,      // retreating costs tempo and Energy
  dangerSwap: 22,       // ...but escaping a lethal threat is worth it
  drawCard: 5,          // per card drawn
  healPer10: 3.5,
  stripEnergy: 11,      // per Energy removed from the opponent
  threshold: 0.5,       // don't bother with actions scoring below this
};

// Local copy: ai.js is concatenated BEFORE engine.js in the bundle, so it
// cannot rely on engine-scope helpers being defined yet.
function aiParseDamage(d) {
  if (!d) return 0;
  const m = String(d).match(/^(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}

const STATUS_VALUE = { Paralyzed: 'paralyze', Asleep: 'sleep', Confused: 'confuse', Poisoned: 'poison' };

class AI {
  constructor(engine, opts = {}) {
    this.E = engine;
    this.W = Object.assign({}, AI_WEIGHTS, opts.weights || {});
    this.mode = opts.mode || 'expert';
  }

  get db() { return this.E.db; }
  get eff() { return this.E.effects; }
  top(slot) { return this.db[slot.stack[slot.stack.length - 1].id]; }
  script(slot, idx) {
    const c = this.top(slot);
    const e = this.eff[c.id];
    return (e && e.a && e.a[idx]) || [];
  }
  remainingHP(slot) { return this.top(slot).hp - slot.dmg; }

  // ---------------------------------------------------------------- forecast
  // Enumerate coin-flip outcomes for an attack into a probability distribution.
  // Returns raw (pre-Weakness) damage outcomes plus effect probabilities.
  rawOutcomes(atkSlot, defSlot, idx, vopts) {
    const c = this.top(atkSlot);
    const empty = { outcomes: [{ p: 1, dmg: 0 }], statuses: {}, selfDmg: 0, energyCost: 0, flags: {} };
    let atk = (c.attacks || [])[idx];
    if (!atk) return { outcomes: [], statuses: {}, selfDmg: 0, energyCost: 0, flags: {} };
    let script = this.script(atkSlot, idx);

    // Metronome and Mirror Move resolve to something OTHER than their own
    // printed line, which is blank on both. Forecasting them literally scores
    // them at zero forever — the card works and the bot never picks it, which
    // is exactly how Energy Burn hid a bug earlier in this job.
    if (script.some(v => v.v === 'METRONOME')) {
      const ci = vopts && vopts.copyIdx;
      if (ci === undefined || !defSlot) return empty;
      const dc = this.top(defSlot);
      const copied = (dc.attacks || [])[ci];
      if (!copied) return empty;
      atk = copied;
      // Copied attacks skip their costs, so the cost verbs must not be forecast.
      script = ((this.eff[dc.id] && this.eff[dc.id].a && this.eff[dc.id].a[ci]) || [])
        .filter(v => v.v.indexOf('COST_') !== 0);
    }
    if (script.some(v => v.v === 'MIRROR_MOVE')) {
      const rec = atkSlot.lastAttackResult;
      if (!rec || rec.turn < this.E.state.turn - 1) return empty;
      const st = {};
      for (const x of (rec.statuses || [])) st[x] = 1;
      // A recorded final result is already past Weakness and Resistance.
      return { outcomes: [{ p: 1, dmg: rec.damage || 0 }], statuses: st,
               selfDmg: 0, energyCost: 0, flags: { flat: true } };
    }

    let base = aiParseDamage(atk.dmg);
    let outcomes = [{ p: 1, dmg: base }];
    const statuses = {};
    const flags = {};
    let selfDmg = 0, energyCost = 0;

    const split = (fn) => {
      const next = [];
      for (const o of outcomes) for (const [p2, d2] of fn(o.dmg)) next.push({ p: o.p * p2, dmg: d2 });
      outcomes = next;
    };

    for (const v of script) {
      switch (v.v) {
        case 'COST_DISCARD_ENERGY': energyCost += v.n; break;
        case 'FLIP_OR_NOTHING':
          split(() => [[0.5, 0], [0.5, base]]);
          flags.halfWhiff = true;
          break;
        case 'DMG_PER_HEAD': {
          const n = v.coins, dist = [];
          for (let h = 0; h <= n; h++) {
            let ways = 1;
            for (let k = 0; k < h; k++) ways = ways * (n - k) / (k + 1);
            dist.push([ways / Math.pow(2, n), v.per * h]);
          }
          split(() => dist);
          break;
        }
        case 'DMG_PER_COUNTER_SELF':
          split(() => [[1, v.per * Math.floor(atkSlot.dmg / 10)]]); break;
        case 'DMG_MINUS_PER_COUNTER_SELF':
          split(() => [[1, Math.max(0, v.base - v.per * Math.floor(atkSlot.dmg / 10))]]); break;
        case 'DMG_PER_DEF_ENERGY':
          split(() => [[1, v.base + v.per * (defSlot ? defSlot.energy.length : 0)]]); break;
        case 'DMG_PER_DEF_COUNTER':
          split(() => [[1, v.base + v.per * (defSlot ? Math.floor(defSlot.dmg / 10) : 0)]]); break;
        case 'STATUS': statuses[v.s] = 1; break;
        case 'STATUS_ON_FLIP': statuses[v.s] = 0.5; break;
        case 'RECOIL': selfDmg += v.n; break;
        case 'RECOIL_ON_FLIP': selfDmg += v.n * 0.5; break;
        case 'BENCH_SPLASH': flags.benchSplash = v.n; break;
        case 'SWITCH_DEFENDER_CHOOSE': flags.drag = true; break;
        case 'PREVENT_ALL_DMG_SELF_ON_FLIP': flags.shield = 0.5; break;
        case 'BARRIER': flags.shield = 1; break;
        case 'HARDEN': flags.harden = v.threshold; break;
        case 'DESTINY_BOND': flags.destinyBond = true; break;
        case 'JAM_DEFENDER': flags.jam = true; break;
        case 'HEAL_SELF_ALL': flags.healAll = true; break;
        case 'HEAL_SELF_IF_DAMAGED': flags.heal = v.n; break;
        case 'ONCE_WHILE_IN_PLAY': flags.oncePerStay = true; break;
      }
    }
    // FLIP_OR_NOTHING suppresses the whole attack, statuses included.
    if (flags.halfWhiff) for (const k in statuses) statuses[k] *= 0.5;
    return { outcomes, statuses, selfDmg, energyCost, flags };
  }

  // Run each raw outcome through the engine's own damage maths.
  forecast(pi, idx, vopts) {
    const E = this.E;
    const me = E.state.players[pi], you = E.state.players[1 - pi];
    const atkSlot = me.active, defSlot = you.active;
    if (!atkSlot || !defSlot) return null;
    const raw = this.rawOutcomes(atkSlot, defSlot, idx, vopts);
    const hpLeft = this.remainingHP(defSlot);
    let expDmg = 0, pLethal = 0;
    for (const o of raw.outcomes) {
      const r = E.computeDamage(atkSlot, defSlot, o.dmg, { noWR: !!raw.flags.flat });
      expDmg += o.p * r.dmg;
      if (r.dmg >= hpLeft) pLethal += o.p;
    }
    const blocked = E.effectsBlocked(defSlot);
    return { expDmg, pLethal, hpLeft, blocked, ...raw };
  }

  // ------------------------------------------------------------ attack score
  scoreAttack(pi, idx, vopts) {
    const W = this.W, E = this.E;
    const f = this.forecast(pi, idx, vopts);
    if (!f) return -Infinity;
    const me = E.state.players[pi], you = E.state.players[1 - pi];
    const atkSlot = me.active;

    let s = f.expDmg * W.damage;
    if (f.pLethal > 0) {
      s += f.pLethal * (you.prizes.length <= 1 ? W.lastPrize : W.knockout);
    }

    // status conditions - suppressed entirely if they're behind a Barrier
    if (!f.blocked) {
      for (const st in f.statuses) {
        const key = STATUS_VALUE[st];
        if (key) s += f.statuses[st] * W[key];
      }
      if (f.flags.jam) s += W.confuse;          // same shape as Confusion
      if (f.flags.drag && you.bench.length) s += W.drag;
    }

    // self-harm
    if (f.selfDmg > 0) {
      s -= f.selfDmg * W.selfDamage;
      if (atkSlot.dmg + f.selfDmg >= this.top(atkSlot).hp) s -= W.selfKO;
    }
    if (f.energyCost > 0) s -= f.energyCost * W.energyDiscard;

    // bench splash cuts both ways
    if (f.flags.benchSplash) {
      const n = f.flags.benchSplash;
      for (const b of you.bench) {
        s += Math.min(n, this.remainingHP(b)) * W.benchDamageFoe;
        if (this.remainingHP(b) <= n) s += W.knockout * 0.6;
      }
      for (const b of me.bench) {
        s -= Math.min(n, this.remainingHP(b)) * W.benchDamageMine;
        if (this.remainingHP(b) <= n) s -= W.selfKO * 0.6;
      }
    }

    // defensive plays are worth more the more danger we're in
    const danger = this.incomingThreat(pi);
    const frail = danger >= this.remainingHP(atkSlot);
    if (f.flags.shield) s += f.flags.shield * W.shieldSelf * (frail ? 1.6 : 0.7);
    if (f.flags.harden) s += W.shieldSelf * (danger <= f.flags.harden ? 1.2 : 0.3);
    if (f.flags.destinyBond) s += frail ? W.destinyBond * 1.8 : W.destinyBond * 0.3;
    if (f.flags.healAll) s += Math.min(atkSlot.dmg, this.top(atkSlot).hp) / 10 * W.healPer10;
    if (f.flags.heal) s += Math.min(f.flags.heal * 10, atkSlot.dmg) / 10 * W.healPer10;

    // don't burn a once-per-stay attack on a whiff-heavy turn for nothing
    if (f.flags.oncePerStay && f.expDmg <= 0 && !Object.keys(f.statuses).length) s -= 10;

    return s;
  }

  // Biggest single hit the opponent's Active could land on ours right now.
  incomingThreat(pi) {
    const E = this.E;
    const me = E.state.players[pi], you = E.state.players[1 - pi];
    if (!you.active || !me.active) return 0;
    let worst = 0;
    const c = this.top(you.active);
    (c.attacks || []).forEach((a, i) => {
      if (!E.costSatisfied(you.active, a.cost)) return;
      const raw = this.rawOutcomes(you.active, me.active, i);
      for (const o of raw.outcomes) {
        const r = E.computeDamage(you.active, me.active, o.dmg);
        if (r.dmg > worst) worst = r.dmg;
      }
    });
    return worst;
  }

  bestAttackScore(pi) {
    const E = this.E, p = E.state.players[pi];
    if (!p.active || !E.canAttackAtAll(pi)) return { score: -Infinity, idx: -1 };
    const c = this.top(p.active);
    let best = { score: -Infinity, idx: -1 };
    (c.attacks || []).forEach((a, i) => {
      if (!E.canUseAttack(pi, i).ok) return;
      const s = this.scoreAttack(pi, i);
      if (s > best.score) best = { score: s, idx: i };
    });
    return best;
  }

  // How good is this slot's best attack if we pretend `extra` Energy is on it?
  // Used to decide where an Energy attachment does the most good.
  potential(pi, slot, extraEnergyId) {
    const E = this.E;
    const c = this.top(slot);
    // an Energy card may provide several symbols (Double Colorless)
    const pool = [];
    slot.energy.forEach(e => (this.db[e.id].provides || 'C').split('').forEach(x => pool.push(x)));
    if (extraEnergyId) (this.db[extraEnergyId].provides || 'C').split('').forEach(x => pool.push(x));
    let best = -Infinity, bestShort = 99;
    (c.attacks || []).forEach((a, i) => {
      const need = a.cost.split('').filter(x => x !== 'C');
      const generic = a.cost.length - need.length;
      const used = new Array(pool.length).fill(false);
      let short = 0;
      for (const t of need) {
        const k = pool.findIndex((x, j) => !used[j] && x === t);
        if (k === -1) short++; else used[k] = true;
      }
      const spare = pool.filter((x, j) => !used[j]).length;
      if (spare < generic) short += generic - spare;
      const isActive = E.state.players[pi].active === slot;
      let val;
      if (short === 0) {
        val = isActive ? this.scoreAttackHypothetical(pi, slot, i) : aiParseDamage(a.dmg);
      } else {
        val = -1;
      }
      if (short < bestShort) bestShort = short;
      if (val > best) best = val;
    });
    return { best: best === -Infinity ? 0 : best, short: bestShort };
  }

  // --------------------------------------------------------- power score ---
  // How good a place to dump damage counters is this Pokemon? Trevor's
  // recollection of how the GBC game played Alakazam, which turns out to be
  // strategically sound: prefer high max HP and low offensive value. A Chansey
  // at 120 HP with feeble attacks is the ideal sink; an Electabuzz is not.
  //
  // Note it deliberately uses MAX HP, not remaining HP — the GBC bot happily
  // piled counters onto already-injured Pokemon, and that is correct. What
  // matters is total capacity to absorb, and the "don't Knock Out" rule already
  // stops it going too far. `potential()` supplies the offensive term, so this
  // reuses the same expected-value machinery as everything else.
  sinkScore(pi, slot) {
    const hp = this.top(slot).hp;
    const threat = Math.max(0, this.potential(pi, slot).best);
    return hp / (10 + threat);
  }

  // How close the whole team is to being able to attack. Used as a strictly
  // increasing yardstick for Energy-moving Powers, so they cannot loop.
  // The Active is weighted heaviest because it is the one that swings this turn;
  // a benched Pokemon losing its own attack costs nothing yet, but is not free
  // either, which is what stops Energy sloshing around the Bench.
  teamReadiness(pi) {
    const E = this.E, me = E.state.players[pi];
    let v = 0;
    for (const sl of E.allSlots(pi)) {
      const w = (sl === me.active) ? 4 : 1;
      const pot = this.potential(pi, sl, null);
      v += w * (Math.max(0, pot.best) * 0.1 - Math.min(pot.short, 9) * 10);
    }
    return v;
  }

  scorePower(pi, a) {
    const E = this.E, W = this.W;
    const slot = E.allSlots(pi).find(x => x.uid === a.uid);
    if (!slot) return -Infinity;

    switch (a.kind) {
      // Only worth switching on when it actually unlocks an attack. Free
      // otherwise, but a no-op action the bot could loop on forever.
      case 'ENERGY_AS': {
        // bestAttackScore returns {score, idx}, not a number, and its score is
        // -Infinity when nothing is playable. Flatten both to a comparable
        // figure before touching them.
        const reach = () => {
          const b = this.bestAttackScore(pi);
          return b.score === -Infinity ? 0 : b.score;
        };
        const before = reach();
        const saved = slot.energyAs;
        slot.energyAs = (E.powerOf(slot) || {}).type;
        const after = reach();
        slot.energyAs = saved;
        // Free and harmless, but a no-op action the bot could otherwise loop on,
        // so only worth doing when it actually improves what we can attack with.
        if (after <= before) return -Infinity;
        return W.threshold + (after - before);
      }

      case 'MOVE_DAMAGE': {
        const from = E.allSlots(pi).find(x => x.uid === a.from);
        const to = E.allSlots(pi).find(x => x.uid === a.to);
        if (!from || !to) return -Infinity;

        // Never move damage the wrong way: onto something more valuable, or off
        // a Pokemon that was in no danger to begin with.
        const gain = this.sinkScore(pi, to) - this.sinkScore(pi, from);
        if (gain <= 0) return -Infinity;

        // The point of the Power is keeping something alive. Weight the move by
        // how close the source is to dying and by how much it is worth keeping.
        const srcHP = this.remainingHP(from);
        const active = E.state.players[pi].active;
        const urgency = from === active ? this.incomingThreat(pi) : 0;
        const doomed = urgency >= srcHP ? 1 : 0;          // dies next turn if nothing changes
        const worth = Math.max(0, this.potential(pi, from).best);

        let score = gain * 2;
        if (doomed) score += W.knockout * 0.35 + worth * 0.2;
        else if (urgency > 0 && urgency >= srcHP - 20) score += worth * 0.1;
        return score;
      }

      // Rain Dance. Mechanically an Energy attachment that costs nothing, so it
      // reuses the attachEnergy scoring and adds a premium for being free — the
      // bot should always prefer the free attachment over spending its one.
      case 'EXTRA_ATTACH': {
        const to = E.allSlots(pi).find(x => x.uid === a.to);
        const inst = E.state.players[pi].hand[a.hand];
        if (!to || !inst) return -Infinity;
        const before = this.potential(pi, to, null);
        const after = this.potential(pi, to, inst.id);
        let s = Math.max(0, after.best - Math.max(0, before.best)) * W.attachEnable;
        if (after.short < before.short) s += W.attachBuild * (before.short - after.short) * 2;
        else if (after.best > before.best) s += W.attachBuild;
        else s += 0.4;
        s += (to === E.state.players[pi].active) ? 4 : 1;
        return s + W.attachBuild;                        // free, so worth more than the normal one
      }

      // Energy Trans. Scored against a single board-wide figure that the move
      // must strictly improve.
      //
      // This is deliberately not a source-versus-destination comparison. Two
      // earlier versions were, and both were wrong in opposite directions: one
      // weighed a benched Pokemon's loss as heavily as the Active's gain and so
      // refused to feed a starving Active, and the fix for that ignored the
      // source's loss entirely — which made A→B and B→A BOTH look like gains and
      // sent the bot into an infinite shuffle. It moved Energy 44,000 times in
      // 80 games and hung eleven of them.
      //
      // A scalar that must strictly increase cannot cycle: the number of Energy
      // arrangements is finite, so there is nowhere for an endless sequence of
      // improvements to go.
      case 'MOVE_ENERGY': {
        const from = E.allSlots(pi).find(x => x.uid === a.from);
        const to = E.allSlots(pi).find(x => x.uid === a.to);
        if (!from || !to) return -Infinity;
        const def = E.powerOf(E.allSlots(pi).find(x => x.uid === a.uid)) || {};
        const k = from.energy.findIndex(e => E.isBasicEnergyOf(e, def.energy));
        if (k === -1) return -Infinity;

        const before = this.teamReadiness(pi);
        const moved = from.energy.splice(k, 1)[0];
        to.energy.push(moved);
        const after = this.teamReadiness(pi);
        to.energy.pop();
        from.energy.splice(k, 0, moved);

        if (after <= before + 1e-6) return -Infinity;
        return W.attachBuild * (after - before);
      }

      // Buzzap. Unlike the other Powers this one COSTS something real — a Prize —
      // so the bar is high and the default is don't.
      case 'BUZZAP': {
        const me3 = E.state.players[pi], opp = E.state.players[1 - pi];
        const to = E.allSlots(pi).find(x => x.uid === a.to);
        if (!to) return -Infinity;

        // Never hand over the Prize that ends the game. This is a hard rule, not
        // a preference — Buzzap can lose on the spot.
        if (opp.prizes.length <= 1) return -Infinity;
        // Nor the last Pokemon standing, nor a Pokemon that is doing fine.
        if (!me3.bench.length && me3.active === slot) return -Infinity;

        // The Prize is only cheap when it was going to be lost anyway. If the
        // Electrode survives the turn, sacrificing it is just giving one away.
        const doomed = slot === me3.active
          && this.remainingHP(slot) <= this.incomingThreat(pi);
        if (!doomed) return -Infinity;

        // Two Energy of a chosen type, so value it as two attachments onto the
        // target — but only counting types that actually get it closer to
        // attacking, which is what stops it picking a useless type.
        const before = this.potential(pi, to, null);
        const fake = { id: to.stack[0].id, uid: -1, asEnergy: a.type + a.type };
        to.energy.push(fake);
        const after = this.potential(pi, to, null);
        to.energy.pop();

        const gain = Math.max(0, before.short - after.short);
        if (gain <= 0) return -Infinity;
        return W.attachBuild * gain * 2 + Math.max(0, after.best - Math.max(0, before.best)) * W.attachEnable;
      }

      default: return -Infinity;
    }
  }

  // Score an attack as if `slot` were Active (used for bench planning).
  scoreAttackHypothetical(pi, slot, idx) {
    const E = this.E, p = E.state.players[pi];
    if (p.active === slot) {
      const chk = E.canUseAttack(pi, idx);
      return chk.ok ? this.scoreAttack(pi, idx) : aiParseDamage(this.top(slot).attacks[idx].dmg);
    }
    return aiParseDamage(this.top(slot).attacks[idx].dmg);
  }

  // ------------------------------------------------------------ action score
  scoreAction(pi, a) {
    const E = this.E, W = this.W;
    const me = E.state.players[pi], you = E.state.players[1 - pi];

    switch (a.t) {
      case 'attack': {
        let sc = this.scoreAttack(pi, a.idx, a.opts);
        // Porygon deals no damage with either Conversion, so the whole value is
        // in picking a USEFUL type. Without this the bot would choose at random
        // among options that all score the same nothing.
        if (a.opts && a.opts.type && me.active) {
          const scr = this.script(me.active, a.idx);
          if (scr.some(v => v.v === 'CONVERT_DEF_WEAKNESS')) {
            const mine = new Set(E.allSlots(pi).map(x => this.top(x).type));
            if (mine.has(a.opts.type)) sc += 12;
          }
          if (scr.some(v => v.v === 'CONVERT_SELF_RESISTANCE')) {
            const theirs = E.state.players[1 - pi].active;
            if (theirs && this.top(theirs).type === a.opts.type) sc += 10;
          }
        }
        return sc;
      }

      case 'power': return this.scorePower(pi, a);

      case 'attachEnergy': {
        const slot = E.allSlots(pi).find(x => x.uid === a.target);
        if (!slot) return -Infinity;
        const inst = me.hand[a.hand];
        const before = this.potential(pi, slot, null);
        const after = this.potential(pi, slot, inst.id);
        let s = Math.max(0, after.best - Math.max(0, before.best)) * W.attachEnable;
        if (after.short < before.short) s += W.attachBuild * (before.short - after.short) * 2;
        else if (after.best > before.best) s += W.attachBuild;
        else s += 0.4;
        if (slot === me.active) s += 4;                 // the Active uses it soonest
        else s += 1;
        return s;
      }

      case 'evolve': {
        const slot = E.allSlots(pi).find(x => x.uid === a.target);
        if (!slot) return -Infinity;
        const oldC = this.top(slot), newC = this.db[me.hand[a.hand].id];
        let s = W.evolveBase + Math.max(0, newC.hp - oldC.hp) * W.evolveHP;
        if (slot === me.active) s += 6;
        // evolving also wipes Special Conditions
        const st = slot.status;
        if (st.asleep || st.paralyzed || st.confused) s += 14;
        if (st.poisoned) s += 8;
        return s;
      }

      case 'playBasic': {
        const n = me.bench.length;
        if (n === 0) return W.benchFirst;
        if (n < 3) return W.benchMore;
        return W.benchTooMany;
      }

      case 'retreat': {
        if (!me.active) return -Infinity;
        const b = me.bench[a.bench];
        if (!b) return -Infinity;
        const cost = this.top(me.active).retreat;
        const danger = this.incomingThreat(pi);
        const dying = danger >= this.remainingHP(me.active);
        const mineNow = this.bestAttackScore(pi).score;
        const theirs = this.potential(pi, b, null);
        let s = W.retreatBase - cost * 4;
        if (dying) s += W.dangerSwap;
        if (mineNow < 0 || mineNow === -Infinity) s += 10;
        if (theirs.short === 0) s += 8;
        // never retreat into something that dies instantly
        if (danger >= this.remainingHP(b)) s -= 18;
        return s;
      }

      case 'promote': {
        const b = me.bench[a.bench];
        if (!b) return -Infinity;
        const pot = this.potential(pi, b, null);
        return this.remainingHP(b) * 0.35 + (pot.short === 0 ? 25 : 0) + pot.best * 0.2;
      }

      // Being Whirlwinded up is not the same as choosing to promote — the timing
      // is the opponent's — but the preference is: whatever survives longest and
      // can actually swing next turn. Scored on the same basis as a promotion.
      //
      // It MUST return a real number rather than falling through to the default:
      // pickBest yields null when every option scores -Infinity, and a null there
      // means nobody answers the prompt and the game stalls with the turn frozen.
      case 'switchIn': {
        const b = me.bench[a.bench];
        if (!b) return -Infinity;
        const pot = this.potential(pi, b, null);
        return this.remainingHP(b) * 0.35 + (pot.short === 0 ? 25 : 0) + Math.max(0, pot.best) * 0.2;
      }

      case 'playTrainer': return this.scoreTrainer(pi, a);
      case 'pass': return 0;
      default: return -Infinity;
    }
  }

  // ----------------------------------------------------------- trainer score
  // Also fills in a.opts, so the engine never has to pick targets at random.
  scoreTrainer(pi, a) {
    const E = this.E, W = this.W;
    const me = E.state.players[pi], you = E.state.players[1 - pi];
    const inst = me.hand[a.hand];
    const script = (this.eff[inst.id] && this.eff[inst.id].t) || [];
    let s = 0;
    a.opts = a.opts || {};

    // Is our Active going to erase their Active this turn anyway? If so,
    // disrupting that Pokemon is wasted - it is about to be discarded.
    const finisher = this.bestAttackScore(pi);
    let killingActiveNow = false;
    if (finisher.idx >= 0) {
      const f = this.forecast(pi, finisher.idx);
      if (f && f.pLethal >= 0.85) killingActiveNow = true;
    }

    for (const v of script) {
      switch (v.v) {
        case 'T_DRAW': s += v.n * W.drawCard; break;

        case 'T_PROFESSOR_OAK': {
          // good when the hand is dead, terrible when it's full of gas
          const keep = me.hand.filter(x => x.uid !== inst.uid).length;
          s += (7 - keep) * W.drawCard;
          if (keep >= 6) s -= 30;
          break;
        }

        case 'T_HEAL': {
          const cands = E.allSlots(pi).filter(x => x.dmg > 0);
          if (!cands.length) return -Infinity;
          let best = cands[0];
          for (const c of cands) if (c.dmg > best.dmg) best = c;
          a.opts.targetUid = best.uid;
          s += Math.min(v.n * 10, best.dmg) / 10 * W.healPer10;
          if (best === me.active && this.incomingThreat(pi) >= this.remainingHP(best)) s += 12;
          break;
        }

        case 'T_DISCARD_ENERGY_THEN_HEAL': {
          const cands = E.allSlots(pi).filter(x => x.dmg > 0 && x.energy.length);
          if (!cands.length) return -Infinity;
          let best = cands[0];
          for (const c of cands) if (c.dmg > best.dmg) best = c;
          a.opts.targetUid = best.uid;
          s += Math.min(v.n * 10, best.dmg) / 10 * W.healPer10 - W.energyDiscard;
          break;
        }

        case 'T_SWITCH_OWN': {
          if (!me.bench.length || !me.active) return -Infinity;
          let bestI = -1, bestV = -Infinity;
          me.bench.forEach((b, i) => {
            const pot = this.potential(pi, b, null);
            const v2 = this.remainingHP(b) * 0.3 + (pot.short === 0 ? 20 : 0);
            if (v2 > bestV) { bestV = v2; bestI = i; }
          });
          a.opts.bench = bestI;
          const danger = this.incomingThreat(pi);

      .map(x => {

        if (c.kind === 'energy') junk = 3;
        else if (c.kind === 'pokemon' && c.evolvesFrom && !inPlay.has(c.evolvesFrom)) junk = 5;

        else junk = 1;

  wantFromDeck(pi) {

  // Sequencing rule that matters more than any weight: attacking ENDS the turn,
  // so every worthwhile non-attack action must happen first.
  choose(pi) {

      if (!acts.length) return null;

      if (!acts.length) return null;
      return this.pickBest(pi, acts, true);

    if (!acts.length) return null;

    const best = setup.length ? this.pickBest(pi, setup) : null;
    if (best && best.__score >= this.W.threshold) return best;

    const attacks = acts.filter(a => a.t === 'attack');
    if (attacks.length) {
      const bestAtk = this.pickBest(pi, attacks);
      if (bestAtk && bestAtk.__score > 0) return bestAtk;

  pickBest(pi, acts, allowNegative = false) {

    for (const a of acts) {
      let sc = this.scoreAction(pi, a);
      if (noisy && sc > -Infinity) sc += (this.E.rand() - 0.5) * 12;

    if (!allowNegative && bestScore === -Infinity) return null;

    // move, not a random one. Deliberately fumbling into nonsense made it play
    // worse than the dumb greedy bot, which is not what "easier" should mean.
    if (noisy && this.E.rand() < 0.22) {

        const pickIt = ok[Math.floor(this.E.rand() * ok.length)];
        this.scoreAction(pi, pickIt.a);      // re-run so opts are populated
        pickIt.a.__score = pickIt.sc;
        return pickIt.a;
      }
    }
    best.__score = bestScore;
    return best;
  }

// ============================================================================
// RULES ENGINE  —  WOTC-era (Base Set) Pokemon TCG
// Pure logic. No DOM. Drives both the UI and the headless test harness.
// ============================================================================

const CONFIG_DEFAULTS = {
  prizeCount: 6,          // dev-adjustable to shorten games
  benchMax: 5,
  handSize: 7,
  deckSize: 60,
  maxCopiesByName: 4,     // basic Energy exempt
  weaknessMultiplier: 2,  // WOTC: x2
  resistanceFlat: 30,     // WOTC: -30
  firstPlayerMayAttack: true,   // ASSUMPTION - see notes
  noEvolveFirstTurn: true,      // ASSUMPTION - see notes
  trainersPerTurn: Infinity,    // Base Set has no Supporter restriction
  maxMulligans: 20,
};

// ---------------------------------------------------------------- RNG -------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ------------------------------------------------------------- helpers ------
// Clearing Special Conditions must also reset Toxic's escalated Poison damage,
// or a Pokemon that retreats out of Toxic and is later re-Poisoned normally
// would still be taking 20 a turn.
function clearStatus(slot) {
  slot.status = { asleep: false, paralyzed: false, confused: false, poisoned: false };
  slot.poisonDamage = 10;
}

const cardOf = (db, inst) => db[inst.id];
const topInst = (slot) => slot.stack[slot.stack.length - 1];
const topCard = (db, slot) => db[topInst(slot).id];

function parseDamage(d) {
  if (!d) return 0;
  const m = String(d).match(/^(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}

function energyProvides(db, inst) {
  // A card can BE an Energy card without being one in the card data: Electrode's
  // Buzzap turns the Electrode itself into one. `asEnergy` is that override, set
  // on the card instance rather than the definition, because it is true of this
  // one Electrode in play and not of Electrode the card.
  if (inst && inst.asEnergy) return inst.asEnergy;
  const c = db[inst.id];
  return c && c.kind === 'energy' ? (c.provides || 'C') : '';
}
// Double Colorless Energy provides TWO symbols from one card, so cost matching
// and retreat have to count symbols while discarding whole cards.
function energySymbols(db, inst) {
  return energyProvides(db, inst).split('').filter(Boolean);
}
function symbolCount(db, list) {
  return list.reduce((a, e) => a + energySymbols(db, e).length, 0);
}

// ============================================================================
// ENGINE
// ============================================================================
class Engine {
  constructor(db, effects, opts = {}) {
    this.db = db;
    this.effects = effects;
    this.cfg = Object.assign({}, CONFIG_DEFAULTS, opts.cfg || {});
    this.seed = (opts.seed === undefined) ? (Date.now() & 0x7fffffff) : opts.seed;
    this.rand = mulberry32(this.seed);
    this.uid = 1;
    this.dev = { forceFlip: null };   // null | 'H' | 'T'
    this.state = null;
  }

  // ------------------------------------------------------------ logging ----
  log(text, kind = 'info') {
    this.state.log.push({ t: this.state.turn, p: this.state.active, text, kind });
    if (this.state.log.length > 4000) this.state.log.shift();
  }

  flip(reason = '') {
    let heads;
    if (this.dev.forceFlip === 'H') heads = true;
    else if (this.dev.forceFlip === 'T') heads = false;
    else heads = this.rand() < 0.5;
    this.log(`Coin flip${reason ? ' (' + reason + ')' : ''}: ${heads ? 'HEADS' : 'TAILS'}`, 'flip');
    return heads;
  }

  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.rand() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ------------------------------------------------------- deck building ---
  buildDeck(deckDef) {
    const out = [];
    for (const [qty, id] of deckDef.list) {
      for (let i = 0; i < qty; i++) out.push({ uid: this.uid++, id });
    }
    return out;
  }

  validateDeck(deckDef) {
    const errors = [], warnings = [];
    const total = deckDef.list.reduce((a, [q]) => a + q, 0);
    if (total !== this.cfg.deckSize) errors.push(`Deck has ${total} cards, needs ${this.cfg.deckSize}`);

    const byName = {}, names = new Set();
    let basics = 0, unimplemented = [];
    for (const [q, id] of deckDef.list) {
      const c = this.db[id];
      if (!c) { errors.push(`Unknown card_id ${id}`); continue; }
      names.add(c.name);
      const isBasicEnergy = c.kind === 'energy' && c.cls === 'Basic';
      if (!isBasicEnergy) byName[c.name] = (byName[c.name] || 0) + q;
      if (c.kind === 'pokemon' && c.stage === 'Basic') basics += q;
      if (!this.isImplemented(id)) unimplemented.push(`${c.name} (${id})`);
    }
    for (const n in byName) {
      if (byName[n] > this.cfg.maxCopiesByName)
        errors.push(`${byName[n]}x "${n}" exceeds the ${this.cfg.maxCopiesByName}-copy limit`);
    }
    if (basics === 0) errors.push('Deck contains no Basic Pokemon');
    if (unimplemented.length) errors.push(`Not yet implemented: ${unimplemented.join(', ')}`);

    for (const [q, id] of deckDef.list) {
      const c = this.db[id];
      if (c && c.kind === 'pokemon' && c.evolvesFrom && !names.has(c.evolvesFrom))
        warnings.push(`${c.name} has no ${c.evolvesFrom} in deck`);
    }
    return { ok: errors.length === 0, errors, warnings, total, basics };
  }

  isImplemented(id) {
    const c = this.db[id];
    if (!c) return false;
    const e = this.effects[id];
    if (!e) return false;
    if (c.kind === 'pokemon') {
      if (!e.a || e.a.length !== (c.attacks || []).length) return false;
      return e.a.every(x => Array.isArray(x));
    }
    return Array.isArray(e.t);
  }

  coverageReport() {
    const rows = [];
    for (const id in this.db) rows.push({ id, name: this.db[id].name, kind: this.db[id].kind, done: this.isImplemented(id) });
    return { rows, done: rows.filter(r => r.done).length, total: rows.length };
  }

  // ------------------------------------------------------------- setup -----
  newGame(deckA, deckB, names = ['Player', 'Opponent']) {
    const mkPlayer = (def, name) => ({
      name, deckDef: def,
      deck: this.shuffle(this.buildDeck(def)),
      hand: [], discard: [], prizes: [],
      active: null, bench: [],
      turnsTaken: 0, energyAttached: false, retreated: false, trainersPlayed: 0,
      mulligans: 0,
    });
    this.state = {
      cfg: this.cfg, turn: 0, active: 0, phase: 'setup',
      winner: null, winReason: '', log: [],
      players: [mkPlayer(deckA, names[0]), mkPlayer(deckB, names[1])],
      pendingPromote: null, promoteQueue: [], pendingEndTurn: false, setupDone: [false, false],
      // Whirlwind: the DEFENDING player owes a choice of who comes up.
      pendingSwitch: null,
    };
    this.log(`New game. Seed ${this.seed}.`, 'sys');

    for (let i = 0; i < 2; i++) this.openingHand(i);

    // who goes first
    this.state.active = this.flip('who goes first') ? 0 : 1;
    this.log(`${this.state.players[this.state.active].name} will go first.`, 'sys');
    return this.state;
  }

  openingHand(pi) {
    const p = this.state.players[pi];
    let tries = 0;
    while (tries++ < this.cfg.maxMulligans) {
      p.hand = p.deck.splice(0, this.cfg.handSize);
      if (p.hand.some(x => { const c = this.db[x.id]; return c.kind === 'pokemon' && c.stage === 'Basic'; })) break;
      this.log(`${p.name} has no Basic Pokemon - mulligan.`, 'sys');
      p.deck = this.shuffle(p.deck.concat(p.hand)); p.hand = []; p.mulligans++;
    }
    // opponent draws 1 extra per mulligan
    if (p.mulligans > 0) {
      const opp = this.state.players[1 - pi];
      // deferred: opponent's hand may not be dealt yet; record and apply at setup end
      opp.bonusDraws = (opp.bonusDraws || 0) + p.mulligans;
    }
  }

  setupPlace(pi, handIdx, where) {
    const p = this.state.players[pi];
    if (this.state.phase !== 'setup') return this.fail('Not in setup');
    if (this.state.setupDone[pi]) return this.fail('Setup already confirmed');
    const inst = p.hand[handIdx];
    if (!inst) return this.fail('No such card');
    const c = this.db[inst.id];
    if (!(c.kind === 'pokemon' && c.stage === 'Basic')) return this.fail('Only Basic Pokemon may be placed');
    if (where === 'active') {
      if (p.active) return this.fail('Active already set');
      p.hand.splice(handIdx, 1); p.active = this.mkSlot(inst);
    } else {
      if (!p.active) return this.fail('Set your Active first');
      if (p.bench.length >= this.cfg.benchMax) return this.fail('Bench is full');
      p.hand.splice(handIdx, 1); p.bench.push(this.mkSlot(inst));
    }
    return { ok: true };
  }

  setupAuto(pi) {
    const p = this.state.players[pi];
    const basics = () => p.hand.map((x, i) => [i, this.db[x.id]])
      .filter(([, c]) => c.kind === 'pokemon' && c.stage === 'Basic');
    let b = basics();
    if (!b.length) return this.fail('No Basic to place');
    b.sort((x, y) => y[1].hp - x[1].hp);
    this.setupPlace(pi, b[0][0], 'active');
    while (p.bench.length < this.cfg.benchMax) {
      b = basics(); if (!b.length) break;
      this.setupPlace(pi, b[0][0], 'bench');
    }
    return this.setupConfirm(pi);
  }

  setupConfirm(pi) {
    const p = this.state.players[pi];
    if (!p.active) return this.fail('You must place an Active Pokemon');
    this.state.setupDone[pi] = true;
    if (this.state.setupDone[0] && this.state.setupDone[1]) this.beginPlay();
    return { ok: true };
  }

  mkSlot(inst) {
    return {
      uid: this.uid++, stack: [inst], dmg: 0, energy: [],
      status: { asleep: false, paralyzed: false, confused: false, poisoned: false },
      poisonDamage: 10,
      paralyzedTurn: -1, playedTurn: 0, effects: [], usedAttacks: {}, forcedKO: false,
    };
  }

  beginPlay() {
    for (let i = 0; i < 2; i++) {
      const p = this.state.players[i];
      for (let k = 0; k < this.cfg.prizeCount; k++) p.prizes.push(p.deck.shift());
      if (p.bonusDraws) { for (let k = 0; k < p.bonusDraws; k++) if (p.deck.length) p.hand.push(p.deck.shift()); this.log(`${p.name} draws ${p.bonusDraws} extra (opponent mulligans).`, 'sys'); }
    }
    this.state.phase = 'main';
    this.state.turn = 0;
    this.startTurn();
  }

  fail(msg) { if (this.state) this.log('Illegal: ' + msg, 'err'); return { ok: false, error: msg }; }

  // Both Active Pokemon can be Knocked Out at once (Take Down recoil, Poison),
  // so promotion is a queue, not a single slot. Turn player promotes first.
  syncPromote() {
    const s = this.state;
    s.promoteQueue.sort((a, b) => (a === s.active ? -1 : b === s.active ? 1 : 0));
    s.pendingPromote = s.promoteQueue.length ? s.promoteQueue[0] : null;
  }
  addPromote(i) {
    const s = this.state;
    if (!s.promoteQueue.includes(i)) s.promoteQueue.push(i);
    this.syncPromote();
  }
  clearPromote(i) {
    const s = this.state;
    s.promoteQueue = s.promoteQueue.filter(x => x !== i);
    this.syncPromote();
  }

  // -------------------------------------------------------- turn cycle -----
  cur() { return this.state.players[this.state.active]; }
  opp() { return this.state.players[1 - this.state.active]; }

  startTurn() {
    const s = this.state;
    s.turn++;
    const p = this.cur();
    p.turnsTaken++; p.energyAttached = false; p.retreated = false; p.trainersPlayed = 0;

    // ENERGY_AS lasts "for the rest of the turn", so it lapses on both sides at
    // every turn boundary rather than only on its owner's.
    this.eachSlot((slot) => { if (slot.energyAs) slot.energyAs = null; });

    // purge lasting effects that expire at the start of this turn
    this.eachSlot((slot) => {
      slot.effects = slot.effects.filter(e => {
        if (e.expireAtStartOfTurn !== undefined && e.expireAtStartOfTurn <= s.turn) {
          this.log(`${this.nameOf(slot)}: ${e.kind} wears off.`, 'eff'); return false;
        }
        return true;
      });
    });

    this.log(`--- Turn ${s.turn}: ${p.name} ---`, 'turn');

    if (p.deck.length === 0) {
      return this.endGame(1 - s.active, `${p.name} could not draw a card`);
    }
    p.hand.push(p.deck.shift());
    this.log(`${p.name} draws a card. (${p.deck.length} left)`);
    return { ok: true };
  }

  endTurn() {
    const s = this.state;
    if (s.phase === 'over') return { ok: true };
    const ended = s.active;

    // end-of-turn effect expiry (e.g. PlusPower is discarded)
    this.eachSlot((slot, pi) => {
      slot.effects = slot.effects.filter(e => {
        if (e.expireAtEndOfTurn !== undefined && e.expireAtEndOfTurn <= s.turn) {
          if (e.card) { s.players[pi].discard.push(e.card); this.log(`${this.db[e.card.id].name} is discarded.`, 'eff'); }
          else this.log(`${this.nameOf(slot)}: ${e.kind} ends.`, 'eff');
          return false;
        }
        return true;
      });
    });

    this.betweenTurns(ended);
    if (s.phase === 'over') return { ok: true };
    if (s.pendingPromote !== null || s.pendingSwitch !== null) { s.pendingEndTurn = true; return { ok: true }; }

    s.active = 1 - s.active;
    return this.startTurn();
  }

  // Between turns: poison damage, then Asleep flips, then Paralysis recovery
  // for the player whose turn just ended.
  betweenTurns(endedPlayer) {
    const s = this.state;
    for (let i = 0; i < 2; i++) {
      const a = s.players[i].active;
      if (a && a.status.poisoned) {
        const pd = a.poisonDamage || 10;
        a.dmg += pd;
        this.log(`${this.nameOf(a)} takes ${pd} from Poison. (${a.dmg} total)`, 'status');
      }
    }
    this.checkKOs();
    if (s.phase === 'over') return;

    for (let i = 0; i < 2; i++) {
      const a = s.players[i].active;
      if (a && a.status.asleep) {
        if (this.flip(`${this.nameOf(a)} waking`)) { a.status.asleep = false; this.log(`${this.nameOf(a)} woke up.`, 'status'); }
        else this.log(`${this.nameOf(a)} is still Asleep.`, 'status');
      }
    }
    const ea = s.players[endedPlayer].active;
    if (ea && ea.status.paralyzed && ea.paralyzedTurn < s.turn) {
      ea.status.paralyzed = false;
      this.log(`${this.nameOf(ea)} is no longer Paralyzed.`, 'status');
    }
  }

  eachSlot(fn) {
    for (let i = 0; i < 2; i++) {
      const p = this.state.players[i];
      if (p.active) fn(p.active, i);
      p.bench.forEach(s => fn(s, i));
    }
  }

  nameOf(slot) { return topCard(this.db, slot).name; }

  // ------------------------------------------------------------ actions ----
  legalActions(pi) {
    const s = this.state;
    const acts = [];
    if (s.phase === 'over') return acts;
    if (s.pendingSwitch === pi) {
      s.players[pi].bench.forEach((b, i) =>
        acts.push({ t: 'switchIn', bench: i, label: `Send up ${this.nameOf(b)}` }));
      return acts;
    }
    if (s.pendingPromote === pi) {
      s.players[pi].bench.forEach((b, i) => acts.push({ t: 'promote', bench: i, label: `Promote ${this.nameOf(b)}` }));
      return acts;
    }
    if (s.pendingSwitch !== null || s.pendingPromote !== null) return acts;   // owed by the other player
    if (s.phase !== 'main' || s.active !== pi) return acts;
    const p = s.players[pi];

    p.hand.forEach((inst, i) => {
      const c = this.db[inst.id];
      if (this.playableAsBasic(c) && p.bench.length < this.cfg.benchMax)
        acts.push({ t: 'playBasic', hand: i, label: `Bench ${c.name}` });
      if (c.kind === 'pokemon' && c.evolvesFrom) {
        this.allSlots(pi).forEach(sl => {
          if (this.canEvolve(pi, sl, c)) acts.push({ t: 'evolve', hand: i, target: sl.uid, label: `Evolve into ${c.name}` });
        });
      }
      if (c.kind === 'energy' && !p.energyAttached) {
        this.allSlots(pi).forEach(sl => acts.push({ t: 'attachEnergy', hand: i, target: sl.uid, label: `Attach ${c.name} to ${this.nameOf(sl)}` }));
      }
      if (c.kind === 'trainer' && c.playsAs !== 'pokemon'
          && p.trainersPlayed < this.cfg.trainersPerTurn && this.trainerPlayable(pi, inst))
        acts.push({ t: 'playTrainer', hand: i, label: `Play ${c.name}` });
    });

    if (!p.retreated && p.active && p.bench.length && this.canRetreat(p.active))
      p.bench.forEach((b, i) => acts.push({ t: 'retreat', bench: i, label: `Retreat to ${this.nameOf(b)}` }));

    // "At any time during your turn before your attack, you may discard Clefairy
    // Doll." This is its only exit — it cannot retreat — so without it a Doll in
    // the Active spot would lock you there until something Knocked it Out.
    for (const slot of this.allSlots(pi)) {
      if (this.playsAsPokemon(slot))
        acts.push({ t: 'discardInPlay', uid: slot.uid, label: `Discard ${this.nameOf(slot)}` });
    }

    // Powers come before the attack: every "as often as you like" Power in the
    // era says "before your attack", and attacking ends the turn anyway.
    this.powerActions(pi).forEach(a => acts.push(a));

    if (p.active && this.canAttackAtAll(pi)) {
      const c = topCard(this.db, p.active);
      (c.attacks || []).forEach((atkDef, i) => {
        if (!this.canUseAttack(pi, i).ok) return;
        // An attack that needs a choice made up front enumerates one action per
        // legal choice, exactly as interactive Powers do — so the AI scores each
        // option and the UI never has to restate which are legal.
        for (const variant of this.attackVariants(pi, i)) {
          if (variant === null) acts.push({ t: 'attack', idx: i, label: `Attack: ${atkDef.name}` });
          else acts.push({ t: 'attack', idx: i, opts: variant.opts, label: variant.label });
        }
      });
    }
    acts.push({ t: 'pass', label: 'End turn' });
    return acts;
  }

  allSlots(pi) {
    const p = this.state.players[pi];
    return (p.active ? [p.active] : []).concat(p.bench);
  }
  findSlot(pi, uid) { return this.allSlots(pi).find(s => s.uid === uid); }

  // ------------------------------------------------------------- powers ----
  // A Power belongs to the card on TOP of the stack, so evolving away from a
  // Power loses it and evolving into one gains it, both immediately.
  powerOf(slot) {
    if (!slot) return null;
    const e = this.effects[topCard(this.db, slot).id];
    return (e && e.p) ? e.p : null;
  }

  // Every Base Set Power is switched off by Sleep, Confusion and Paralysis, so
  // the gate lives here rather than being restated on each card. A Power also
  // stops working if the Pokemon is having all effects prevented (Barrier).
  powerUsable(slot) {
    const p = this.powerOf(slot);
    if (!p) return false;
    const st = slot.status;
    if (st.asleep || st.confused || st.paralyzed) return false;
    if (this.effectsBlocked(slot)) return false;
    return true;
  }

  // Energy symbols a slot currently provides, honouring an ENERGY_AS override
  // (Charizard's Energy Burn). Count is preserved — Double Colorless still pays
  // twice — only the type changes.
  slotSymbols(slot) {
    const out = [];
    slot.energy.forEach(e => energySymbols(this.db, e).forEach(x => out.push(slot.energyAs || x)));
    return out;
  }

  // "1 Water Energy card" and the like mean a BASIC one. In Base Set the type
  // check alone would do, since Double Colorless is Colorless — but Rainbow
  // Energy counts as every type, so the class check is what keeps this honest
  // once Base Set 2 lands.
  isBasicEnergyOf(inst, type) {
    const c = this.db[inst.id];
    return !!c && c.kind === 'energy' && c.cls === 'Basic' && c.provides === type;
  }

  // One action per legal (source, target) pair, so the AI scores Powers with the
  // same machinery as everything else and the UI can just highlight what's legal.
  powerActions(pi) {
    const acts = [];
    const me = this.state.players[pi];
    for (const slot of this.allSlots(pi)) {
      const p = this.powerOf(slot);
      if (!p || !this.powerUsable(slot)) continue;
      const owner = this.nameOf(slot);
      switch (p.kind) {
        case 'ENERGY_AS':
          if (slot.energyAs) break;                      // already on; no point offering it again
          if (!slot.energy.length) break;
          acts.push({ t: 'power', uid: slot.uid, kind: p.kind, label: `${owner}: ${p.name}` });
          break;
        case 'MOVE_DAMAGE':
          for (const from of this.allSlots(pi)) {
            if (from.dmg < 10) continue;
            for (const to of this.allSlots(pi)) {
              if (to === from) continue;
              if (to.dmg + 10 >= topCard(this.db, to).hp) continue;   // may not Knock Out
              acts.push({
                t: 'power', uid: slot.uid, kind: p.kind, from: from.uid, to: to.uid,
                label: `${p.name}: ${this.nameOf(from)} → ${this.nameOf(to)}`,
              });
            }
          }
          break;
        case 'MOVE_ENERGY':
          for (const from of this.allSlots(pi)) {
            if (!from.energy.some(e => this.isBasicEnergyOf(e, p.energy))) continue;
            for (const to of this.allSlots(pi)) {
              if (to === from) continue;
              acts.push({
                t: 'power', uid: slot.uid, kind: p.kind, from: from.uid, to: to.uid,
                label: `${p.name}: ${this.nameOf(from)} → ${this.nameOf(to)}`,
              });
            }
          }
          break;
        case 'EXTRA_ATTACH': {
          // Every basic Energy of a given type is interchangeable, so the source
          // card is not a choice — only the destination is. That keeps this a
          // one-click flow rather than making the player pick between identical
          // cards in hand.
          const hand = me.hand.findIndex(e => this.isBasicEnergyOf(e, p.energy));
          if (hand === -1) break;
          for (const to of this.allSlots(pi)) {
            if (p.targetType && topCard(this.db, to).type !== p.targetType) continue;
            acts.push({
              t: 'power', uid: slot.uid, kind: p.kind, hand, to: to.uid,
              label: `${p.name}: attach to ${this.nameOf(to)}`,
            });
          }
          break;
        }
        case 'BUZZAP':
          // "1 of your OTHER Pokemon" — so there has to be somewhere to put it.
          for (const to of this.allSlots(pi)) {
            if (to === slot) continue;
            for (const type of this.energyTypes()) {
              acts.push({
                t: 'power', uid: slot.uid, kind: p.kind, to: to.uid, type,
                label: `${p.name}: become ${type} Energy on ${this.nameOf(to)}`,
              });
            }
          }
          break;
        default: break;                                  // passive Powers offer no action
      }
    }
    return acts;
  }

  // Which Energy types this card pool actually uses. Offering Darkness and Metal
  // in a Base-Set-only game would be legal but silly, and this scales itself as
  // sets are added rather than needing a hand-kept list.
  energyTypes() {
    if (!this._energyTypes) {
      const seen = new Set(['C']);
      for (const id in this.db) if (this.db[id].kind === 'pokemon' && this.db[id].type) seen.add(this.db[id].type);
      this._energyTypes = [...seen].sort();
    }
    return this._energyTypes;
  }

  doPower(pi, a) {
    const slot = this.findSlot(pi, a.uid);
    if (!slot) return this.fail('No such Pokemon');
    const p = this.powerOf(slot);
    if (!p) return this.fail('That Pokemon has no Pokemon Power');
    if (!this.powerUsable(slot)) return this.fail(`${this.nameOf(slot)} can't use ${p.name} right now`);

    switch (p.kind) {
      case 'ENERGY_AS': {
        if (!slot.energy.length) return this.fail('No Energy attached');
        slot.energyAs = p.type;
        // art.js owns the type names. Same bundle-or-Node guard used for AI below.
        const names = (typeof ENERGY_NAME !== 'undefined')
          ? ENERGY_NAME : require('./art.js').ENERGY_NAME;
        this.log(`${p.name}: all Energy on ${this.nameOf(slot)} counts as `
          + `${names[p.type] || p.type} for the rest of the turn.`, 'eff');
        return { ok: true };
      }
      case 'MOVE_DAMAGE': {
        const from = this.findSlot(pi, a.from), to = this.findSlot(pi, a.to);
        if (!from || !to) return this.fail('No such Pokemon');
        if (from === to) return this.fail('Pick two different Pokemon');
        if (from.dmg < 10) return this.fail(`${this.nameOf(from)} has no damage counters`);
        const tc = topCard(this.db, to);
        if (to.dmg + 10 >= tc.hp) return this.fail(`That would Knock Out ${tc.name}`);
        from.dmg -= 10; to.dmg += 10;
        this.log(`${p.name}: 1 damage counter moved from ${this.nameOf(from)} `
          + `to ${this.nameOf(to)}. (${to.dmg}/${tc.hp})`, 'eff');
        return { ok: true };
      }
      case 'MOVE_ENERGY': {
        const from = this.findSlot(pi, a.from), to = this.findSlot(pi, a.to);
        if (!from || !to) return this.fail('No such Pokemon');
        if (from === to) return this.fail('Pick two different Pokemon');
        const k = from.energy.findIndex(e => this.isBasicEnergyOf(e, p.energy));
        if (k === -1) return this.fail(`${this.nameOf(from)} has no ${p.energy} Energy to move`);
        const moved = from.energy.splice(k, 1)[0];
        to.energy.push(moved);
        this.log(`${p.name}: ${this.db[moved.id].name} moved from ${this.nameOf(from)} `
          + `to ${this.nameOf(to)}.`, 'eff');
        return { ok: true };
      }
      case 'EXTRA_ATTACH': {
        const to = this.findSlot(pi, a.to);
        if (!to) return this.fail('No such Pokemon');
        if (p.targetType && topCard(this.db, to).type !== p.targetType)
          return this.fail(`${this.nameOf(to)} is not a ${p.targetType} Pokemon`);
        const me2 = this.state.players[pi];
        const k = me2.hand.findIndex(e => this.isBasicEnergyOf(e, p.energy));
        if (k === -1) return this.fail(`No ${p.energy} Energy in hand`);
        const card = me2.hand.splice(k, 1)[0];
        to.energy.push(card);
        // Deliberately does NOT touch me2.energyAttached — the whole point of
        // the Power is that it sits outside the one-attachment-per-turn rule.
        this.log(`${p.name}: ${this.db[card.id].name} attached to ${this.nameOf(to)} `
          + `without using this turn's Energy attachment.`, 'eff');
        return { ok: true };
      }
      // The one Power in Base Set that changes what a card IS. See RULINGS.md:
      // the Electrode card itself becomes ONE Energy card providing TWO Energy
      // of the chosen type, the Voltorb beneath it is discarded, and the
      // opponent takes a Prize because a Knock Out is a Knock Out even when you
      // did it to yourself.
      case 'BUZZAP': {
        const me3 = this.state.players[pi], opp = this.state.players[1 - pi];
        const to = this.findSlot(pi, a.to);
        if (!to) return this.fail('No such Pokemon');
        if (to === slot) return this.fail('Buzzap needs one of your OTHER Pokemon');
        if (!a.type || !this.energyTypes().includes(a.type)) return this.fail('Choose a type of Energy');
        const name = this.nameOf(slot);

        // Only the top card survives. Everything else attached to the Electrode
        // — the Voltorb, its Energy, any Trainer cards — goes to the discard,
        // exactly as it would on any other Knock Out.
        const card = slot.stack.pop();
        slot.stack.forEach(x => me3.discard.push(x));
        slot.energy.forEach(x => me3.discard.push(x));
        slot.effects.forEach(e => { if (e.card) me3.discard.push(e.card); });
        slot.stack = []; slot.energy = []; slot.effects = [];
        this.removeSlot(pi, slot);

        card.asEnergy = a.type + a.type;                 // one card, two symbols
        to.energy.push(card);
        const tn = (typeof ENERGY_NAME !== 'undefined')
          ? ENERGY_NAME : require('./art.js').ENERGY_NAME;
        this.log(`${p.name}: ${name} is Knocked Out and becomes an Energy card `
          + `providing 2 ${tn[a.type] || a.type} Energy, attached to ${this.nameOf(to)}.`, 'eff');

        if (opp.prizes.length) {
          opp.hand.push(opp.prizes.shift());
          this.log(`${opp.name} takes a Prize. (${opp.prizes.length} left)`, 'prize');
        }
        if (opp.prizes.length === 0) { this.endGame(1 - pi, `${opp.name} took all Prizes`); return { ok: true }; }
        if (!me3.active && me3.bench.length === 0) {
          this.endGame(1 - pi, `${me3.name} has no Pokemon left`); return { ok: true };
        }
        if (!me3.active && me3.bench.length > 0) this.addPromote(pi);
        return { ok: true };
      }

      default:
        return this.fail(`${p.name} is not an activated Power`);
    }
  }

  canEvolve(pi, slot, evoCard) {
    const s = this.state;
    if (topCard(this.db, slot).name !== evoCard.evolvesFrom) return false;
    if (slot.playedTurn >= s.turn) return false;                       // played this turn
    if (slot.evolvedTurn === s.turn) return false;                     // already evolved this turn
    if (this.cfg.noEvolveFirstTurn && s.players[pi].turnsTaken <= 1) return false;
    return true;
  }

  // Clefairy Doll and Mysterious Fossil are Trainers played AS Basic Pokemon.
  // Note what this deliberately does NOT cover: the opening setup, where they are
  // still Trainer cards in hand and neither satisfy the "must start with a Basic"
  // check nor prevent a mulligan; and basicsIn(), because a Doll in the discard
  // pile is a Trainer card again and Revive cannot reach it.
  playableAsBasic(c) {
    return !!c && ((c.kind === 'pokemon' && c.stage === 'Basic') || c.playsAs === 'pokemon');
  }
  playsAsPokemon(slot) {
    return !!slot && topCard(this.db, slot).playsAs === 'pokemon';
  }

  canRetreat(slot) {
    if (this.playsAsPokemon(slot)) return false;          // "can't retreat", flatly
    if (slot.status.asleep || slot.status.paralyzed) return false;
    return symbolCount(this.db, slot.energy) >= topCard(this.db, slot).retreat;
  }

  canAttackAtAll(pi) {
    const s = this.state, p = s.players[pi];
    if (!p.active || !this.opp().active) return false;
    if (p.active.status.asleep || p.active.status.paralyzed) return false;
    if (!this.cfg.firstPlayerMayAttack && s.turn === 1) return false;
    return true;
  }

  // Does the attached Energy satisfy the cost string (e.g. "RRC")?
  costSatisfied(slot, cost) {
    const pool = this.slotSymbols(slot);
    const need = cost.split('').filter(x => x !== 'C');
    const generic = cost.length - need.length;
    const used = new Array(pool.length).fill(false);
    for (const t of need) {
      const k = pool.findIndex((p, i) => !used[i] && p === t);
      if (k === -1) return false;
      used[k] = true;
    }
    return pool.filter((p, i) => !used[i]).length >= generic;
  }

  canUseAttack(pi, idx) {
    const p = this.state.players[pi];
    if (!p.active) return { ok: false, why: 'No Active Pokemon' };
    const c = topCard(this.db, p.active);
    const a = (c.attacks || [])[idx];
    if (!a) return { ok: false, why: 'No such attack' };
    if (!this.costSatisfied(p.active, a.cost)) return { ok: false, why: 'Not enough Energy' };
    const script = (this.effects[c.id] && this.effects[c.id].a && this.effects[c.id].a[idx]) || [];
    if (p.active.usedAttacks && p.active.usedAttacks[idx]
        && script.some(v => v.v === 'ONCE_WHILE_IN_PLAY'))
      return { ok: false, why: 'Already used while this Pokemon has been in play' };
    const locked = p.active.effects.find(e => e.kind === 'ATTACK_DISABLED' && e.idx === idx);
    if (locked) return { ok: false, why: `${a.name} is disabled this turn` };
    for (const v of script) {
      if (v.v === 'COST_DISCARD_ENERGY') {
        // No `t` means any Energy card will do (Charizard's Fire Spin discards 2
        // Energy of any type; Ninetales' Fire Blast demands Fire specifically).
        const have = p.active.energy.filter(e => !v.t || energyProvides(this.db, e) === v.t).length;
        if (have < v.n) return { ok: false, why: `Needs ${v.n} ${v.t || ''} Energy to discard`.replace('  ', ' ') };
      }
      if (v.v === 'COST_DISCARD_ALL_ENERGY') {
        if (p.active.energy.length === 0) return { ok: false, why: 'No Energy to discard' };
      }
      if (v.v === 'REQUIRE_DEF_STATUS') {
        const def = this.state.players[1 - pi].active;
        if (!def || !def.status[v.s]) return { ok: false, why: `Defending Pokemon must be ${v.label || v.s}` };
      }
    }
    return { ok: true };
  }

  trainerPlayable(pi, inst) {
    const p = this.state.players[pi], o = this.state.players[1 - pi];
    const script = (this.effects[inst.id] && this.effects[inst.id].t) || [];
    for (const v of script) {
      switch (v.v) {
        case 'T_DRAW': if (p.deck.length === 0) return false; break;
        case 'T_SWITCH_OWN': if (!p.active || p.bench.length === 0) return false; break;
        case 'T_SWITCH_OPPONENT': if (!o.active || o.bench.length === 0) return false; break;
        case 'T_DISCARD_OPP_ENERGY':
          if (!this.allSlots(1 - pi).some(s => s.energy.length)) return false; break;
        case 'T_HEAL': if (!this.allSlots(pi).some(s => s.dmg > 0)) return false; break;
        case 'T_DISCARD_ENERGY_THEN_HEAL':
          if (!this.allSlots(pi).some(s => s.dmg > 0 && s.energy.length)) return false; break;
        case 'T_PLUSPOWER': if (!p.active) return false; break;
        case 'T_PROFESSOR_OAK': if (p.deck.length === 0) return false; break;
        case 'T_DEFENDER': if (!this.allSlots(pi).length) return false; break;
        case 'T_FULL_HEAL': {
          if (!p.active) return false;
          const st = p.active.status;
          if (!(st.asleep || st.confused || st.paralyzed || st.poisoned)) return false;
          break;
        }
