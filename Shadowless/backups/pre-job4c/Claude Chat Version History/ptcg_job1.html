<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Base Set playtest — rules engine (Job 1)</title>
<style>
:root{
  --bg:#171C22; --panel:#1F262E; --panel2:#262F39; --line:#323C48;
  --txt:#C6D0DA; --dim:#78848F; --amber:#E2A84B; --red:#C8574C; --grn:#6FAE5A;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:var(--mono); font-size:13px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100vh}
.boardcol{display:flex;flex-direction:column;min-width:0;overflow:auto;padding:14px 16px;gap:12px}
.empty,.dimtxt{color:var(--dim)}
.small{font-size:11px}

/* ---- status bar ---- */
.statusbar{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.turnflag{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--dim)}
.turnflag.mine{color:var(--amber)}
.turnno,.seedno{color:var(--dim);font-size:11px}
.seedno{margin-left:auto}

/* ---- sides ---- */
.side{border:1px solid var(--line);border-radius:3px;background:var(--panel);padding:10px}
.side.mine{border-color:#3B4757}
.sidehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sidename{font-size:11px;letter-spacing:.1em;color:var(--dim)}
.counters{display:flex;gap:10px}
.ctr{display:flex;gap:4px;align-items:baseline;font-size:11px;color:var(--dim)}
.ctr b{color:var(--txt);font-size:13px}
.ctr.hot b{color:var(--amber)}
.bench{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.activerow{display:flex}
.midline{min-height:4px;display:flex;justify-content:center}
.prompt{color:var(--amber);font-size:11px;letter-spacing:.06em;text-transform:uppercase}

/* ---- slots ---- */
.slot{
  background:var(--panel2);border:1px solid var(--line);border-radius:3px;
  padding:8px 9px;min-width:172px;max-width:260px;
}
.slot.act{min-width:300px;border-color:#45525F}
.slot.empty{color:var(--dim);display:flex;align-items:center;justify-content:center;min-height:52px;font-size:11px}
.slot.targetable{border-color:var(--amber);cursor:pointer;box-shadow:0 0 0 1px var(--amber) inset}
.slot.targetable:hover{background:#2E3946}
.slottop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm{font-weight:700}
.hp{font-size:11px;color:var(--dim)}
.hp.hurt{color:var(--amber)}
.slotmeta{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--dim);margin-top:3px}
.wr{font-weight:700}
.dmgbar{height:2px;background:#131820;margin:6px 0;border-radius:2px;overflow:hidden}
.dmgbar i{display:block;height:100%;background:var(--red)}
.energyrow{display:flex;gap:3px;align-items:center;min-height:12px}
.energyrow .none{font-size:10px;color:#5A646E}
.pip{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.pips{display:inline-flex;gap:2px;align-items:center}
.free{font-size:10px;color:var(--dim)}
.statuses{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:9px;letter-spacing:.08em;padding:1px 4px;border-radius:2px;border:1px solid}
.badge.slp{color:#8FA3C4;border-color:#3F4C63}
.badge.par{color:#D9BB47;border-color:#5A4E23}
.badge.cnf{color:#B78BC9;border-color:#4F3A5A}
.badge.psn{color:#7FBF6A;border-color:#3A5231}
.badge.shd{color:#7FC4D6;border-color:#2F4E58}
.badge.bns{color:var(--amber);border-color:#5C4620}

/* ---- attacks ---- */
.attacks{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.atk{
  text-align:left;background:#2C3742;border:1px solid var(--line);border-radius:2px;
  padding:6px 7px;cursor:pointer;width:100%
}
.atk:hover{border-color:var(--amber);background:#33404D}
.atk.off{opacity:.5;cursor:default}
.atk.off:hover{border-color:var(--line);background:#2C3742}
.atkline{display:flex;align-items:center;gap:8px}
.atkname{font-weight:700;flex:1}
.atkdmg{color:var(--amber);font-weight:700}
.atktext{font-size:10px;color:var(--dim);margin-top:3px;line-height:1.35}
.atkwhy{font-size:10px;color:var(--red);margin-top:3px}

/* ---- hand ---- */
.handpanel{border:1px solid var(--line);border-radius:3px;background:var(--panel);padding:10px}
.panelhead{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;color:var(--dim);margin-bottom:8px}
.hand{display:flex;gap:7px;flex-wrap:wrap}
.card{
  background:var(--panel2);border:1px solid var(--line);border-radius:3px;
  padding:7px 8px;width:150px;cursor:pointer
}
.card:hover{border-color:#55636F}
.card.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.card.dead{opacity:.38;cursor:default}
.card.targetable{border-color:var(--amber);cursor:pointer}
.card.k-energy{border-left:2px solid #4E9BC4}
.card.k-trainer{border-left:2px solid #9269A8}
.card.k-pokemon{border-left:2px solid #6FAE5A}
.cname{font-weight:700;font-size:12px}
.csub{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--dim);margin-top:2px}
.ctext{font-size:10px;color:var(--dim);margin-top:4px;line-height:1.35}

/* ---- action bar ---- */
.actionbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.barmsg{font-size:11px;color:var(--txt);margin-right:4px}
.btn{background:#2F3A46;border:1px solid var(--line);border-radius:2px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--amber)}
.btn.end{background:#3A2F1C;border-color:#5C4620;color:var(--amber)}
.btn.ghost{background:transparent;color:var(--dim)}
.btn.off{opacity:.4;pointer-events:none}

/* ---- rail ---- */
.rail{border-left:1px solid var(--line);background:#141920;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 0;cursor:pointer;color:var(--dim);letter-spacing:.12em;font-size:11px}
.tab.on{color:var(--amber);border-bottom-color:var(--amber)}
.logbox{flex:1;overflow:auto;padding:8px 10px;font-size:11.5px}
.logline{display:flex;gap:8px;padding:1px 0;border-left:2px solid transparent;padding-left:6px}
.lt{color:#4C5661;min-width:18px;text-align:right}
.lx{flex:1;word-break:break-word}
.logline.k-turn{border-left-color:var(--amber);margin-top:8px}
.logline.k-turn .lx{color:var(--amber);letter-spacing:.06em}
.logline.k-attack .lx{color:#E4E9EE;font-weight:700}
.logline.k-dmg .lx{color:#E08C7E}
.logline.k-ko{border-left-color:var(--red)}
.logline.k-ko .lx{color:var(--red);font-weight:700}
.logline.k-prize .lx{color:var(--amber)}
.logline.k-status .lx{color:#C9A9D8}
.logline.k-eff .lx{color:#7FC4D6}
.logline.k-flip .lx{color:#8D97A2}
.logline.k-trainer .lx{color:#A9B6C4}
.logline.k-err .lx{color:var(--red)}
.logline.k-win{border-left-color:var(--grn)}
.logline.k-win .lx{color:var(--grn);font-weight:700}
.logline.k-sys .lx{color:#5F6A75}

.devbox,.covbox{flex:1;overflow:auto;padding:10px 12px}
.grp{border:1px solid var(--line);border-radius:3px;padding:9px 10px;margin-bottom:10px;background:var(--panel)}
.grphead{font-size:11px;letter-spacing:.1em;color:var(--dim);margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.row label{min-width:64px;color:var(--dim);font-size:11px}
.row.chk label{min-width:0;flex:1}
.row input[type=text],.row select{flex:1;background:#141920;border:1px solid var(--line);border-radius:2px;padding:4px 6px}
.row input[type=range]{flex:1}
.dump{background:#0F141A;border:1px solid var(--line);border-radius:2px;padding:8px;font-size:10.5px;color:#9FAAB6;max-height:340px;overflow:auto;white-space:pre-wrap}
.covlist{max-height:300px;overflow:auto;margin-bottom:10px}
.covrow{display:flex;align-items:center;gap:7px;padding:2px 0;font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.dot.ok{background:var(--grn)} .dot.no{background:var(--red)}
.cn{flex:1}
.ci{color:#4C5661;font-size:10px}
.verr{color:var(--red);font-size:10.5px;padding-left:14px}
.vwarn{color:var(--amber);font-size:10.5px;padding-left:14px}

/* ---- overlays ---- */
.overlay{position:fixed;inset:0;background:rgba(10,13,17,.82);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:20px 22px;max-width:820px;width:100%;max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 6px;font-size:16px;letter-spacing:.04em}
.sheet p{margin:0 0 12px}
.setupcur{border:1px solid var(--line);border-radius:3px;padding:8px 10px;margin-bottom:12px;background:var(--panel2)}
.setupcur .lbl{font-size:11px;color:var(--dim)}
.sheet .hand{margin-bottom:14px}
.sheet .actionbar{border-top:0;padding-top:0}

@media (max-width:1080px){
  .wrap{grid-template-columns:1fr;height:auto}
  .rail{border-left:0;border-top:1px solid var(--line);height:60vh}
  .slot.act{min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

</style>
</head>

// ============================================================================
// RULES ENGINE  —  WOTC-era (Base Set) Pokemon TCG
// Pure logic. No DOM. Drives both the UI and the headless test harness.
// ============================================================================

const CONFIG_DEFAULTS = {
  prizeCount: 6,          // dev-adjustable to shorten games
  benchMax: 5,
  handSize: 7,
  deckSize: 60,
  maxCopiesByName: 4,     // basic Energy exempt
  weaknessMultiplier: 2,  // WOTC: x2
  resistanceFlat: 30,     // WOTC: -30
  firstPlayerMayAttack: true,   // ASSUMPTION - see notes
  noEvolveFirstTurn: true,      // ASSUMPTION - see notes
  trainersPerTurn: Infinity,    // Base Set has no Supporter restriction
  maxMulligans: 20,
};

// ---------------------------------------------------------------- RNG -------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ------------------------------------------------------------- helpers ------
const cardOf = (db, inst) => db[inst.id];
const topInst = (slot) => slot.stack[slot.stack.length - 1];
const topCard = (db, slot) => db[topInst(slot).id];

function parseDamage(d) {
  if (!d) return 0;
  const m = String(d).match(/^(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}

function energyProvides(db, inst) {
  const c = db[inst.id];
  return c && c.kind === 'energy' ? (c.provides || 'C') : '';
}

// ============================================================================
// ENGINE
// ============================================================================
class Engine {
  constructor(db, effects, opts = {}) {
    this.db = db;
    this.effects = effects;
    this.cfg = Object.assign({}, CONFIG_DEFAULTS, opts.cfg || {});
    this.seed = (opts.seed === undefined) ? (Date.now() & 0x7fffffff) : opts.seed;
    this.rand = mulberry32(this.seed);
    this.uid = 1;
    this.dev = { forceFlip: null };   // null | 'H' | 'T'
    this.state = null;
  }

  // ------------------------------------------------------------ logging ----
  log(text, kind = 'info') {
    this.state.log.push({ t: this.state.turn, p: this.state.active, text, kind });
    if (this.state.log.length > 4000) this.state.log.shift();
  }

  flip(reason = '') {
    let heads;
    if (this.dev.forceFlip === 'H') heads = true;
    else if (this.dev.forceFlip === 'T') heads = false;
    else heads = this.rand() < 0.5;
    this.log(`Coin flip${reason ? ' (' + reason + ')' : ''}: ${heads ? 'HEADS' : 'TAILS'}`, 'flip');
    return heads;
  }

  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.rand() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ------------------------------------------------------- deck building ---
  buildDeck(deckDef) {
    const out = [];
    for (const [qty, id] of deckDef.list) {
      for (let i = 0; i < qty; i++) out.push({ uid: this.uid++, id });
    }
    return out;
  }

  validateDeck(deckDef) {
    const errors = [], warnings = [];
    const total = deckDef.list.reduce((a, [q]) => a + q, 0);
    if (total !== this.cfg.deckSize) errors.push(`Deck has ${total} cards, needs ${this.cfg.deckSize}`);

    const byName = {}, names = new Set();
    let basics = 0, unimplemented = [];
    for (const [q, id] of deckDef.list) {
      const c = this.db[id];
      if (!c) { errors.push(`Unknown card_id ${id}`); continue; }
      names.add(c.name);
      const isBasicEnergy = c.kind === 'energy' && c.cls === 'Basic';
      if (!isBasicEnergy) byName[c.name] = (byName[c.name] || 0) + q;
      if (c.kind === 'pokemon' && c.stage === 'Basic') basics += q;
      if (!this.isImplemented(id)) unimplemented.push(`${c.name} (${id})`);
    }
    for (const n in byName) {
      if (byName[n] > this.cfg.maxCopiesByName)
        errors.push(`${byName[n]}x "${n}" exceeds the ${this.cfg.maxCopiesByName}-copy limit`);
    }
    if (basics === 0) errors.push('Deck contains no Basic Pokemon');
    if (unimplemented.length) errors.push(`Not yet implemented: ${unimplemented.join(', ')}`);

    for (const [q, id] of deckDef.list) {
      const c = this.db[id];
      if (c && c.kind === 'pokemon' && c.evolvesFrom && !names.has(c.evolvesFrom))
        warnings.push(`${c.name} has no ${c.evolvesFrom} in deck`);
    }
    return { ok: errors.length === 0, errors, warnings, total, basics };
  }

  isImplemented(id) {
    const c = this.db[id];
    if (!c) return false;
    const e = this.effects[id];
    if (!e) return false;
    if (c.kind === 'pokemon') {
      if (!e.a || e.a.length !== (c.attacks || []).length) return false;
      return e.a.every(x => Array.isArray(x));
    }
    return Array.isArray(e.t);
  }

  coverageReport() {
    const rows = [];
    for (const id in this.db) rows.push({ id, name: this.db[id].name, kind: this.db[id].kind, done: this.isImplemented(id) });
    return { rows, done: rows.filter(r => r.done).length, total: rows.length };
  }

  // ------------------------------------------------------------- setup -----
  newGame(deckA, deckB, names = ['Player', 'Opponent']) {
    const mkPlayer = (def, name) => ({
      name, deckDef: def,
      deck: this.shuffle(this.buildDeck(def)),
      hand: [], discard: [], prizes: [],
      active: null, bench: [],
      turnsTaken: 0, energyAttached: false, retreated: false, trainersPlayed: 0,
      mulligans: 0,
    });
    this.state = {
      cfg: this.cfg, turn: 0, active: 0, phase: 'setup',
      winner: null, winReason: '', log: [],
      players: [mkPlayer(deckA, names[0]), mkPlayer(deckB, names[1])],
      pendingPromote: null, promoteQueue: [], pendingEndTurn: false, setupDone: [false, false],
    };
    this.log(`New game. Seed ${this.seed}.`, 'sys');

    for (let i = 0; i < 2; i++) this.openingHand(i);

    // who goes first
    this.state.active = this.flip('who goes first') ? 0 : 1;
    this.log(`${this.state.players[this.state.active].name} will go first.`, 'sys');
    return this.state;
  }

  openingHand(pi) {
    const p = this.state.players[pi];
    let tries = 0;
    while (tries++ < this.cfg.maxMulligans) {
      p.hand = p.deck.splice(0, this.cfg.handSize);
      if (p.hand.some(x => { const c = this.db[x.id]; return c.kind === 'pokemon' && c.stage === 'Basic'; })) break;
      this.log(`${p.name} has no Basic Pokemon - mulligan.`, 'sys');
      p.deck = this.shuffle(p.deck.concat(p.hand)); p.hand = []; p.mulligans++;
    }
    // opponent draws 1 extra per mulligan
    if (p.mulligans > 0) {
      const opp = this.state.players[1 - pi];
      // deferred: opponent's hand may not be dealt yet; record and apply at setup end
      opp.bonusDraws = (opp.bonusDraws || 0) + p.mulligans;
    }
  }

  setupPlace(pi, handIdx, where) {
    const p = this.state.players[pi];
    if (this.state.phase !== 'setup') return this.fail('Not in setup');
    if (this.state.setupDone[pi]) return this.fail('Setup already confirmed');
    const inst = p.hand[handIdx];
    if (!inst) return this.fail('No such card');
    const c = this.db[inst.id];
    if (!(c.kind === 'pokemon' && c.stage === 'Basic')) return this.fail('Only Basic Pokemon may be placed');
    if (where === 'active') {
      if (p.active) return this.fail('Active already set');
      p.hand.splice(handIdx, 1); p.active = this.mkSlot(inst);
    } else {
      if (!p.active) return this.fail('Set your Active first');
      if (p.bench.length >= this.cfg.benchMax) return this.fail('Bench is full');
      p.hand.splice(handIdx, 1); p.bench.push(this.mkSlot(inst));
    }
    return { ok: true };
  }

  setupAuto(pi) {
    const p = this.state.players[pi];
    const basics = () => p.hand.map((x, i) => [i, this.db[x.id]])
      .filter(([, c]) => c.kind === 'pokemon' && c.stage === 'Basic');
    let b = basics();
    if (!b.length) return this.fail('No Basic to place');
    b.sort((x, y) => y[1].hp - x[1].hp);
    this.setupPlace(pi, b[0][0], 'active');
    while (p.bench.length < this.cfg.benchMax) {
      b = basics(); if (!b.length) break;
      this.setupPlace(pi, b[0][0], 'bench');
    }
    return this.setupConfirm(pi);
  }

  setupConfirm(pi) {
    const p = this.state.players[pi];
    if (!p.active) return this.fail('You must place an Active Pokemon');
    this.state.setupDone[pi] = true;
    if (this.state.setupDone[0] && this.state.setupDone[1]) this.beginPlay();
    return { ok: true };
  }

  mkSlot(inst) {
    return {
      uid: this.uid++, stack: [inst], dmg: 0, energy: [],
      status: { asleep: false, paralyzed: false, confused: false, poisoned: false },
      paralyzedTurn: -1, playedTurn: 0, effects: [],
    };
  }

  beginPlay() {
    for (let i = 0; i < 2; i++) {
      const p = this.state.players[i];
      for (let k = 0; k < this.cfg.prizeCount; k++) p.prizes.push(p.deck.shift());
      if (p.bonusDraws) { for (let k = 0; k < p.bonusDraws; k++) if (p.deck.length) p.hand.push(p.deck.shift()); this.log(`${p.name} draws ${p.bonusDraws} extra (opponent mulligans).`, 'sys'); }
    }
    this.state.phase = 'main';
    this.state.turn = 0;
    this.startTurn();
  }

  fail(msg) { if (this.state) this.log('Illegal: ' + msg, 'err'); return { ok: false, error: msg }; }

  // Both Active Pokemon can be Knocked Out at once (Take Down recoil, Poison),
  // so promotion is a queue, not a single slot. Turn player promotes first.
  syncPromote() {
    const s = this.state;
    s.promoteQueue.sort((a, b) => (a === s.active ? -1 : b === s.active ? 1 : 0));
    s.pendingPromote = s.promoteQueue.length ? s.promoteQueue[0] : null;
  }
  addPromote(i) {
    const s = this.state;
    if (!s.promoteQueue.includes(i)) s.promoteQueue.push(i);
    this.syncPromote();
  }
  clearPromote(i) {
    const s = this.state;
    s.promoteQueue = s.promoteQueue.filter(x => x !== i);
    this.syncPromote();
  }

  // -------------------------------------------------------- turn cycle -----
  cur() { return this.state.players[this.state.active]; }
  opp() { return this.state.players[1 - this.state.active]; }

  startTurn() {
    const s = this.state;
    s.turn++;
    const p = this.cur();
    p.turnsTaken++; p.energyAttached = false; p.retreated = false; p.trainersPlayed = 0;

    // purge lasting effects that expire at the start of this turn
    this.eachSlot((slot) => {
      slot.effects = slot.effects.filter(e => {
        if (e.expireAtStartOfTurn !== undefined && e.expireAtStartOfTurn <= s.turn) {
          this.log(`${this.nameOf(slot)}: ${e.kind} wears off.`, 'eff'); return false;
        }
        return true;
      });
    });

    this.log(`--- Turn ${s.turn}: ${p.name} ---`, 'turn');

    if (p.deck.length === 0) {
      return this.endGame(1 - s.active, `${p.name} could not draw a card`);
    }
    p.hand.push(p.deck.shift());
    this.log(`${p.name} draws a card. (${p.deck.length} left)`);
    return { ok: true };
  }

  endTurn() {
    const s = this.state;
    if (s.phase === 'over') return { ok: true };
    const ended = s.active;

    // end-of-turn effect expiry (e.g. PlusPower is discarded)
    this.eachSlot((slot, pi) => {
      slot.effects = slot.effects.filter(e => {
        if (e.expireAtEndOfTurn !== undefined && e.expireAtEndOfTurn <= s.turn) {
          if (e.card) { s.players[pi].discard.push(e.card); this.log(`${this.db[e.card.id].name} is discarded.`, 'eff'); }
          else this.log(`${this.nameOf(slot)}: ${e.kind} ends.`, 'eff');
          return false;
        }
        return true;
      });
    });

    this.betweenTurns(ended);
    if (s.phase === 'over') return { ok: true };
    if (s.pendingPromote !== null) { s.pendingEndTurn = true; return { ok: true }; }

    s.active = 1 - s.active;
    return this.startTurn();
  }

  // Between turns: poison damage, then Asleep flips, then Paralysis recovery
  // for the player whose turn just ended.
  betweenTurns(endedPlayer) {
    const s = this.state;
    for (let i = 0; i < 2; i++) {
      const a = s.players[i].active;
      if (a && a.status.poisoned) {
        a.dmg += 10;
        this.log(`${this.nameOf(a)} takes 10 from Poison. (${a.dmg} total)`, 'status');
      }
    }
    this.checkKOs();
    if (s.phase === 'over') return;

    for (let i = 0; i < 2; i++) {
      const a = s.players[i].active;
      if (a && a.status.asleep) {
        if (this.flip(`${this.nameOf(a)} waking`)) { a.status.asleep = false; this.log(`${this.nameOf(a)} woke up.`, 'status'); }
        else this.log(`${this.nameOf(a)} is still Asleep.`, 'status');
      }
    }
    const ea = s.players[endedPlayer].active;
    if (ea && ea.status.paralyzed && ea.paralyzedTurn < s.turn) {
      ea.status.paralyzed = false;
      this.log(`${this.nameOf(ea)} is no longer Paralyzed.`, 'status');
    }
  }

  eachSlot(fn) {
    for (let i = 0; i < 2; i++) {
      const p = this.state.players[i];
      if (p.active) fn(p.active, i);
      p.bench.forEach(s => fn(s, i));
    }
  }

  nameOf(slot) { return topCard(this.db, slot).name; }

  // ------------------------------------------------------------ actions ----
  legalActions(pi) {
    const s = this.state;
    const acts = [];
    if (s.phase === 'over') return acts;
    if (s.pendingPromote !== null) {
      if (s.pendingPromote === pi) {
        s.players[pi].bench.forEach((b, i) => acts.push({ t: 'promote', bench: i, label: `Promote ${this.nameOf(b)}` }));
      }
      return acts;
    }
    if (s.phase !== 'main' || s.active !== pi) return acts;
    const p = s.players[pi];

    p.hand.forEach((inst, i) => {
      const c = this.db[inst.id];
      if (c.kind === 'pokemon' && c.stage === 'Basic' && p.bench.length < this.cfg.benchMax)
        acts.push({ t: 'playBasic', hand: i, label: `Bench ${c.name}` });
      if (c.kind === 'pokemon' && c.evolvesFrom) {
        this.allSlots(pi).forEach(sl => {
          if (this.canEvolve(pi, sl, c)) acts.push({ t: 'evolve', hand: i, target: sl.uid, label: `Evolve into ${c.name}` });
        });
      }
      if (c.kind === 'energy' && !p.energyAttached) {
        this.allSlots(pi).forEach(sl => acts.push({ t: 'attachEnergy', hand: i, target: sl.uid, label: `Attach ${c.name} to ${this.nameOf(sl)}` }));
      }
      if (c.kind === 'trainer' && p.trainersPlayed < this.cfg.trainersPerTurn && this.trainerPlayable(pi, inst))
        acts.push({ t: 'playTrainer', hand: i, label: `Play ${c.name}` });
    });

    if (!p.retreated && p.active && p.bench.length && this.canRetreat(p.active))
      p.bench.forEach((b, i) => acts.push({ t: 'retreat', bench: i, label: `Retreat to ${this.nameOf(b)}` }));

    if (p.active && this.canAttackAtAll(pi)) {
      const c = topCard(this.db, p.active);
      (c.attacks || []).forEach((a, i) => {
        if (this.canUseAttack(pi, i).ok) acts.push({ t: 'attack', idx: i, label: `Attack: ${a.name}` });
      });
    }
    acts.push({ t: 'pass', label: 'End turn' });
    return acts;
  }

  allSlots(pi) {
    const p = this.state.players[pi];
    return (p.active ? [p.active] : []).concat(p.bench);
  }
  findSlot(pi, uid) { return this.allSlots(pi).find(s => s.uid === uid); }

  canEvolve(pi, slot, evoCard) {
    const s = this.state;
    if (topCard(this.db, slot).name !== evoCard.evolvesFrom) return false;
    if (slot.playedTurn >= s.turn) return false;                       // played this turn
    if (slot.evolvedTurn === s.turn) return false;                     // already evolved this turn
    if (this.cfg.noEvolveFirstTurn && s.players[pi].turnsTaken <= 1) return false;
    return true;
  }

  canRetreat(slot) {
    if (slot.status.asleep || slot.status.paralyzed) return false;
    return slot.energy.length >= topCard(this.db, slot).retreat;
  }

  canAttackAtAll(pi) {
    const s = this.state, p = s.players[pi];
    if (!p.active || !this.opp().active) return false;
    if (p.active.status.asleep || p.active.status.paralyzed) return false;
    if (!this.cfg.firstPlayerMayAttack && s.turn === 1) return false;
    return true;
  }

  // Does the attached Energy satisfy the cost string (e.g. "RRC")?
  costSatisfied(slot, cost) {
    const pool = slot.energy.map(e => energyProvides(this.db, e));
    const need = cost.split('').filter(x => x !== 'C');
    const generic = cost.length - need.length;
    const used = new Array(pool.length).fill(false);
    for (const t of need) {
      const k = pool.findIndex((p, i) => !used[i] && p === t);
      if (k === -1) return false;
      used[k] = true;
    }
    return pool.filter((p, i) => !used[i]).length >= generic;
  }

  canUseAttack(pi, idx) {
    const p = this.state.players[pi];
    if (!p.active) return { ok: false, why: 'No Active Pokemon' };
    const c = topCard(this.db, p.active);
    const a = (c.attacks || [])[idx];
    if (!a) return { ok: false, why: 'No such attack' };
    if (!this.costSatisfied(p.active, a.cost)) return { ok: false, why: 'Not enough Energy' };
    const script = (this.effects[c.id] && this.effects[c.id].a && this.effects[c.id].a[idx]) || [];
    for (const v of script) {
      if (v.v === 'COST_DISCARD_ENERGY') {
        const have = p.active.energy.filter(e => energyProvides(this.db, e) === v.t).length;
        if (have < v.n) return { ok: false, why: `Needs ${v.n} ${v.t} Energy to discard` };
      }
    }
    return { ok: true };
  }

  trainerPlayable(pi, inst) {
    const p = this.state.players[pi], o = this.state.players[1 - pi];
    const script = (this.effects[inst.id] && this.effects[inst.id].t) || [];
    for (const v of script) {
      switch (v.v) {
        case 'T_DRAW': if (p.deck.length === 0) return false; break;
        case 'T_SWITCH_OWN': if (!p.active || p.bench.length === 0) return false; break;
        case 'T_SWITCH_OPPONENT': if (!o.active || o.bench.length === 0) return false; break;
        case 'T_DISCARD_OPP_ENERGY':
          if (!this.allSlots(1 - pi).some(s => s.energy.length)) return false; break;
        case 'T_HEAL': if (!this.allSlots(pi).some(s => s.dmg > 0)) return false; break;
        case 'T_DISCARD_ENERGY_THEN_HEAL':
          if (!this.allSlots(pi).some(s => s.dmg > 0 && s.energy.length)) return false; break;
        case 'T_PLUSPOWER': if (!p.active) return false; break;
        case 'T_ENERGY_RETRIEVAL':
          if (!p.discard.some(x => { const c = this.db[x.id]; return c.kind === 'energy' && c.cls === 'Basic'; })) return false;
          if (p.hand.length < 2) return false; break;
      }
    }
    return true;
  }

  // ------------------------------------------------------------- dispatch --
  act(pi, a) {
    const s = this.state;
    if (s.phase === 'over') return this.fail('Game is over');
    if (s.pendingPromote !== null && a.t !== 'promote') return this.fail('Must promote a Pokemon first');
    if (a.t !== 'promote' && s.active !== pi) return this.fail('Not your turn');

    switch (a.t) {
      case 'playBasic':    return this.doPlayBasic(pi, a);
      case 'evolve':       return this.doEvolve(pi, a);
      case 'attachEnergy': return this.doAttach(pi, a);
      case 'playTrainer':  return this.doTrainer(pi, a);
      case 'retreat':      return this.doRetreat(pi, a);
      case 'attack':       return this.doAttack(pi, a);
      case 'promote':      return this.doPromote(pi, a);
      case 'pass':         return this.endTurn();
      default:             return this.fail('Unknown action ' + a.t);
    }
  }

  doPlayBasic(pi, a) {
    const p = this.state.players[pi];
    const inst = p.hand[a.hand]; if (!inst) return this.fail('No such card');
    const c = this.db[inst.id];
    if (!(c.kind === 'pokemon' && c.stage === 'Basic')) return this.fail('Not a Basic Pokemon');
    if (p.bench.length >= this.cfg.benchMax) return this.fail('Bench is full');
    p.hand.splice(a.hand, 1);
    const sl = this.mkSlot(inst); sl.playedTurn = this.state.turn;
    p.bench.push(sl);
    this.log(`${p.name} benches ${c.name}.`);
    return { ok: true };
  }

  doEvolve(pi, a) {
    const p = this.state.players[pi];
    const inst = p.hand[a.hand]; if (!inst) return this.fail('No such card');
    const c = this.db[inst.id];
    const sl = this.findSlot(pi, a.target); if (!sl) return this.fail('No such target');
    if (!this.canEvolve(pi, sl, c)) return this.fail('Cannot evolve that Pokemon now');
    p.hand.splice(a.hand, 1);
    const was = this.nameOf(sl);
    sl.stack.push(inst);
    sl.evolvedTurn = this.state.turn;
    sl.status = { asleep: false, paralyzed: false, confused: false, poisoned: false };
    this.log(`${was} evolves into ${c.name}. Special Conditions removed.`, 'eff');
    return { ok: true };
  }

  doAttach(pi, a) {
    const p = this.state.players[pi];
    if (p.energyAttached) return this.fail('Already attached Energy this turn');
    const inst = p.hand[a.hand]; if (!inst) return this.fail('No such card');
    const c = this.db[inst.id];
    if (c.kind !== 'energy') return this.fail('Not an Energy card');
    const sl = this.findSlot(pi, a.target); if (!sl) return this.fail('No such target');
    p.hand.splice(a.hand, 1);
    sl.energy.push(inst); p.energyAttached = true;
    this.log(`${p.name} attaches ${c.name} to ${this.nameOf(sl)}.`);
    return { ok: true };
  }

  doRetreat(pi, a) {
    const p = this.state.players[pi];
    if (p.retreated) return this.fail('Already retreated this turn');
    if (!p.active) return this.fail('No Active Pokemon');
    if (!this.canRetreat(p.active)) return this.fail('Cannot retreat (status or insufficient Energy)');
    const b = p.bench[a.bench]; if (!b) return this.fail('No such benched Pokemon');
    const cost = topCard(this.db, p.active).retreat;
    let pay = a.pay;
    if (!pay) pay = this.retreatPayOrder(p.active).slice(0, cost).map(e => e.uid);
    if (pay.length !== cost) return this.fail(`Must discard exactly ${cost} Energy`);
    for (const uid of pay) {
      const k = p.active.energy.findIndex(e => e.uid === uid);
      if (k === -1) return this.fail('Energy not attached');
      p.discard.push(p.active.energy.splice(k, 1)[0]);
    }
    const old = p.active;
    old.status = { asleep: false, paralyzed: false, confused: false, poisoned: false };
    p.active = b; p.bench.splice(a.bench, 1); p.bench.push(old);
    p.retreated = true;
    this.log(`${p.name} retreats ${this.nameOf(old)}; ${this.nameOf(b)} is now Active.`);
    return { ok: true };
  }

  // When the caller doesn't specify which Energy to discard for retreat, spend
  // the ones this Pokemon's own attacks don't ask for, so we never eat the last
  // Fire off a Charmeleon to pay a Colorless cost.
  retreatPayOrder(slot) {
    const c = topCard(this.db, slot);
    const needed = new Set();
    (c.attacks || []).forEach(a => a.cost.split('').forEach(x => { if (x !== 'C') needed.add(x); }));
    return slot.energy.slice().sort((x, y) => {
      const nx = needed.has(energyProvides(this.db, x)) ? 1 : 0;
      const ny = needed.has(energyProvides(this.db, y)) ? 1 : 0;
      return nx - ny;
    });
  }

  doPromote(pi, a) {
    const s = this.state;
    if (s.pendingPromote !== pi) return this.fail('Not waiting on you');
    const p = s.players[pi];
    const b = p.bench[a.bench]; if (!b) return this.fail('No such benched Pokemon');
    p.bench.splice(a.bench, 1); p.active = b;
    this.log(`${p.name} promotes ${this.nameOf(b)} to Active.`);
    this.clearPromote(pi);
    if (s.pendingPromote !== null) return { ok: true };   // another player still owes a promote
    if (s.pendingEndTurn) {
      s.pendingEndTurn = false;
      s.active = 1 - s.active;
      return this.startTurn();
    }
    return { ok: true };
  }

  // ------------------------------------------------------------- trainers --
  doTrainer(pi, a) {
    const p = this.state.players[pi], o = this.state.players[1 - pi];
    const inst = p.hand[a.hand]; if (!inst) return this.fail('No such card');
    const c = this.db[inst.id];
    if (c.kind !== 'trainer') return this.fail('Not a Trainer card');
    if (p.trainersPlayed >= this.cfg.trainersPerTurn) return this.fail('Trainer limit reached this turn');
    const script = (this.effects[inst.id] && this.effects[inst.id].t);
    if (!script) return this.fail(`${c.name} is not implemented`);
    if (!this.trainerPlayable(pi, inst)) return this.fail(`${c.name} would do nothing`);

    p.hand.splice(a.hand, 1);
    this.log(`${p.name} plays ${c.name}.`, 'trainer');
    let toDiscard = true;

    for (const v of script) {
      switch (v.v) {
        case 'T_DRAW': {
          for (let i = 0; i < v.n && p.deck.length; i++) p.hand.push(p.deck.shift());
          this.log(`${p.name} draws ${v.n}.`); break;
        }
        case 'T_SWITCH_OWN': {
          const bi = (a.opts && a.opts.bench !== undefined) ? a.opts.bench : this.pick(p.bench.length);
          const b = p.bench[bi]; if (!b) return this.fail('Bad target');
          const old = p.active;
          old.status = { asleep: false, paralyzed: false, confused: false, poisoned: false };
          p.active = b; p.bench.splice(bi, 1); p.bench.push(old);
          this.log(`${this.nameOf(b)} is now Active.`); break;
        }
        case 'T_SWITCH_OPPONENT': {
          const bi = (a.opts && a.opts.bench !== undefined) ? a.opts.bench : this.pick(o.bench.length);
          const b = o.bench[bi]; if (!b) return this.fail('Bad target');
          const old = o.active;
          old.status = { asleep: false, paralyzed: false, confused: false, poisoned: false };
          o.active = b; o.bench.splice(bi, 1); o.bench.push(old);
          this.log(`${o.name}'s ${this.nameOf(b)} is dragged into the Active spot.`); break;
        }
        case 'T_DISCARD_OPP_ENERGY': {
          const slots = this.allSlots(1 - pi).filter(s => s.energy.length);
          const tgt = (a.opts && a.opts.targetUid) ? slots.find(s => s.uid === a.opts.targetUid) : slots[this.pick(slots.length)];
          if (!tgt) return this.fail('No Energy to remove');
          const e = tgt.energy.splice((a.opts && a.opts.energyIdx) || 0, 1)[0];
          o.discard.push(e);
          this.log(`${this.db[e.id].name} discarded from ${this.nameOf(tgt)}.`); break;
        }
        case 'T_HEAL': {
          const slots = this.allSlots(pi).filter(s => s.dmg > 0);
          const tgt = (a.opts && a.opts.targetUid) ? slots.find(s => s.uid === a.opts.targetUid) : slots[this.pick(slots.length)];
          if (!tgt) return this.fail('Nothing damaged');
          const heal = Math.min(v.n * 10, tgt.dmg);
          tgt.dmg -= heal;
          this.log(`${this.nameOf(tgt)} heals ${heal}. (${tgt.dmg} damage left)`); break;
        }
        case 'T_DISCARD_ENERGY_THEN_HEAL': {
          const slots = this.allSlots(pi).filter(s => s.dmg > 0 && s.energy.length);
          const tgt = (a.opts && a.opts.targetUid) ? slots.find(s => s.uid === a.opts.targetUid) : slots[this.pick(slots.length)];
          if (!tgt) return this.fail('No valid target');
          p.discard.push(tgt.energy.splice(0, 1)[0]);
          const heal = Math.min(v.n * 10, tgt.dmg);
          tgt.dmg -= heal;
          this.log(`${this.nameOf(tgt)} discards Energy and heals ${heal}.`); break;
        }
        case 'T_PLUSPOWER': {
          if (!p.active) return this.fail('No Active Pokemon');
          p.active.effects.push({
            kind: 'DAMAGE_BONUS', amount: 10,
            expireAtEndOfTurn: this.state.turn, card: inst,
          });
          this.log(`PlusPower attached to ${this.nameOf(p.active)} (+10 this turn).`, 'eff');
          toDiscard = false;   // discarded when the effect expires
          break;
        }
        case 'T_LASS': {
          let moved = 0;
          for (const pl of [p, o]) {
            const keep = [];
            for (const x of pl.hand) {
              if (this.db[x.id].kind === 'trainer') { pl.deck.push(x); moved++; }
              else keep.push(x);
            }
            pl.hand = keep; this.shuffle(pl.deck);
          }
          this.log(`Lass: ${moved} Trainer card(s) shuffled back into decks.`); break;
        }
        case 'T_ENERGY_RETRIEVAL': {
          if (p.hand.length < 1) return this.fail('No card to trade');
          const di = (a.opts && a.opts.discardHandIdx !== undefined) ? a.opts.discardHandIdx : this.pick(p.hand.length);
          p.discard.push(p.hand.splice(di, 1)[0]);
          let got = 0;
          for (let i = 0; i < v.n; i++) {
            const k = p.discard.findIndex(x => { const c2 = this.db[x.id]; return c2.kind === 'energy' && c2.cls === 'Basic'; });
            if (k === -1) break;
            p.hand.push(p.discard.splice(k, 1)[0]); got++;
          }
          this.log(`Energy Retrieval: recovered ${got} basic Energy.`); break;
        }
        default: return this.fail(`Unimplemented verb ${v.v}`);
      }
    }
    p.trainersPlayed++;
    if (toDiscard) p.discard.push(inst);
    this.checkKOs();
    return { ok: true };
  }

  pick(n) { return n <= 0 ? 0 : Math.floor(this.rand() * n); }

  // --------------------------------------------------------------- combat --
  doAttack(pi, a) {
    const s = this.state;
    const me = s.players[pi], you = s.players[1 - pi];
    if (!this.canAttackAtAll(pi)) return this.fail('Cannot attack right now');
    const chk = this.canUseAttack(pi, a.idx);
    if (!chk.ok) return this.fail(chk.why);

    const atk = me.active, def = you.active;
    const card = topCard(this.db, atk);
    const attack = card.attacks[a.idx];
    const script = (this.effects[card.id] && this.effects[card.id].a && this.effects[card.id].a[a.idx]) || [];
    this.log(`${card.name} uses ${attack.name}.`, 'attack');

    // Confusion gate
    if (atk.status.confused) {
      if (!this.flip('Confusion')) {
        this.log(`${card.name} is Confused - the attack fails and it hits itself for 30.`, 'status');
        atk.dmg += 30;
        return this.finishAttack();
      }
    }

    // pay attack costs
    for (const v of script) {
      if (v.v === 'COST_DISCARD_ENERGY') {
        for (let i = 0; i < v.n; i++) {
          const k = atk.energy.findIndex(e => energyProvides(this.db, e) === v.t);
          if (k === -1) return this.fail('Cost could not be paid');
          me.discard.push(atk.energy.splice(k, 1)[0]);
        }
        this.log(`${card.name} discards ${v.n} ${v.t} Energy as a cost.`);
      }
    }

    // base damage / damage-shaping verbs
    let base = parseDamage(attack.dmg);
    let nothing = false;
    for (const v of script) {
      if (v.v === 'FLIP_OR_NOTHING') { if (!this.flip('attack succeeds?')) nothing = true; }
      else if (v.v === 'DMG_PER_HEAD') {
        let h = 0;
        for (let i = 0; i < v.coins; i++) if (this.flip(`coin ${i + 1}/${v.coins}`)) h++;
        base = v.per * h;
        this.log(`${h} head(s) -> ${base} damage.`);
      } else if (v.v === 'DMG_PER_COUNTER_SELF') {
        base = v.per * (atk.dmg / 10);
        this.log(`${Math.floor(atk.dmg / 10)} damage counter(s) -> ${base} damage.`);
      }
    }

    if (nothing) { this.log('The attack does nothing.', 'eff'); return this.finishAttack(); }

    const res = this.dealDamage(atk, def, base);

    // post-damage verbs
    for (const v of script) {
      switch (v.v) {
        case 'STATUS': this.applyStatus(def, v.s); break;
        case 'STATUS_ON_FLIP': if (this.flip(`${v.s}?`)) this.applyStatus(def, v.s); break;
        case 'RECOIL':
          atk.dmg += v.n;
          this.log(`${card.name} does ${v.n} damage to itself. (${atk.dmg} total)`, 'eff'); break;
        case 'HEAL_SELF_ALL':
          if (atk.dmg > 0) { this.log(`${card.name} removes all ${atk.dmg} damage from itself.`, 'eff'); atk.dmg = 0; }
          break;
        case 'HEAL_SELF_IF_DAMAGED':
          if (!res.prevented && atk.dmg > 0) {
            const h = Math.min(v.n * 10, atk.dmg); atk.dmg -= h;
            this.log(`${card.name} removes ${h} damage from itself.`, 'eff');
          }
          break;
        case 'PREVENT_ALL_DMG_SELF_ON_FLIP':
          if (this.flip('prevent damage?')) {
            atk.effects.push({ kind: 'PREVENT_ALL_DAMAGE', expireAtStartOfTurn: s.turn + 2 });
            this.log(`${card.name} will prevent all damage during the opponent's next turn.`, 'eff');
          }
          break;
        case 'SWITCH_DEFENDER_CHOOSE': {
          if (you.active && you.bench.length) {
            const bi = (a.opts && a.opts.bench !== undefined) ? a.opts.bench : this.pick(you.bench.length);
            const b = you.bench[bi];
            if (b) {
              const old = you.active;
              old.status = { asleep: false, paralyzed: false, confused: false, poisoned: false };
              you.active = b; you.bench.splice(bi, 1); you.bench.push(old);
              this.log(`${this.nameOf(b)} is dragged into the Active spot.`, 'eff');
            }
          }
          break;
        }
      }
    }
    return this.finishAttack();
  }

  finishAttack() {
    this.checkKOs();
    if (this.state.phase === 'over') return { ok: true };
    return this.endTurn();
  }

  applyStatus(slot, s) {
    if (!slot) return;
    if (s === 'Poisoned') { slot.status.poisoned = true; }
    else {
      slot.status.asleep = false; slot.status.paralyzed = false; slot.status.confused = false;
      if (s === 'Asleep') slot.status.asleep = true;
      if (s === 'Paralyzed') { slot.status.paralyzed = true; slot.paralyzedTurn = this.state.turn; }
      if (s === 'Confused') slot.status.confused = true;
    }
    this.log(`${this.nameOf(slot)} is now ${s}.`, 'status');
  }

  // WOTC damage order: base -> Weakness -> Resistance -> other modifiers -> prevention
  dealDamage(atkSlot, defSlot, base) {
    if (!defSlot) return { dealt: 0, prevented: false };
    const A = topCard(this.db, atkSlot), D = topCard(this.db, defSlot);
    let dmg = base;
    if (dmg > 0) {
      if (D.wkType && D.wkType === A.type) {
        dmg *= this.cfg.weaknessMultiplier;
        this.log(`Weakness: ${D.name} takes double -> ${dmg}.`, 'dmg');
      }
      if (D.rsType && D.rsType === A.type) {
        dmg -= this.cfg.resistanceFlat;
        this.log(`Resistance: -${this.cfg.resistanceFlat} -> ${Math.max(0, dmg)}.`, 'dmg');
      }
      if (dmg < 0) dmg = 0;
    }
    if (dmg > 0) {
      for (const e of atkSlot.effects) {
        if (e.kind === 'DAMAGE_BONUS') { dmg += e.amount; this.log(`+${e.amount} from PlusPower -> ${dmg}.`, 'dmg'); }
      }
    }
    let prevented = false;
    if (defSlot.effects.some(e => e.kind === 'PREVENT_ALL_DAMAGE')) {
      if (dmg > 0) { this.log(`All damage to ${D.name} is prevented.`, 'eff'); prevented = true; }
      dmg = 0;
    }
    if (dmg > 0) {
      defSlot.dmg += dmg;
      this.log(`${D.name} takes ${dmg}. (${defSlot.dmg}/${D.hp})`, 'dmg');
    }
    return { dealt: dmg, prevented };
  }

  // ---------------------------------------------------------- KO / win -----
  checkKOs() {
    const s = this.state;
    if (s.phase === 'over') return;
    let any = true;
    while (any) {
      any = false;
      for (let i = 0; i < 2 && !any; i++) {
        const p = s.players[i], o = s.players[1 - i];
        const kill = (slot, fromBench, idx) => {
          const c = topCard(this.db, slot);
          this.log(`${c.name} is Knocked Out!`, 'ko');
          slot.stack.forEach(x => p.discard.push(x));
          slot.energy.forEach(x => p.discard.push(x));
          slot.effects.forEach(e => { if (e.card) p.discard.push(e.card); });
          if (fromBench) p.bench.splice(idx, 1); else p.active = null;
          if (o.prizes.length) {
            o.hand.push(o.prizes.shift());
            this.log(`${o.name} takes a Prize. (${o.prizes.length} left)`, 'prize');
          }
        };
        if (p.active && p.active.dmg >= topCard(this.db, p.active).hp) { kill(p.active, false, -1); any = true; }
        if (!any) for (let k = 0; k < p.bench.length; k++) {
          if (p.bench[k].dmg >= topCard(this.db, p.bench[k]).hp) { kill(p.bench[k], true, k); any = true; break; }
        }
        if (any) {
          if (o.prizes.length === 0) return this.endGame(1 - i, `${o.name} took all Prizes`);
          if (!p.active && p.bench.length === 0) return this.endGame(1 - i, `${p.name} has no Pokemon left`);
          if (!p.active && p.bench.length > 0) this.addPromote(i);
        }
      }
    }
  }

  endGame(winner, reason) {
    this.state.phase = 'over';
    this.state.winner = winner;
    this.state.winReason = reason;
    this.state.pendingPromote = null;
    this.state.promoteQueue = [];
    this.log(`GAME OVER - ${this.state.players[winner].name} wins: ${reason}`, 'win');
    return { ok: true, over: true };
  }

  // ---------------------------------------------------------------- AI -----
  // Returns ONE action, or null if this player has nothing to do. The UI steps
  // through these so the opponent's turn reads at human pace; the harness loops.
  aiChoose(pi, mode = 'greedy') {
    const s = this.state;
    if (s.phase === 'over') return null;

    if (s.pendingPromote !== null) {
      if (s.pendingPromote !== pi) return null;
      const acts = this.legalActions(pi).filter(a => a.t === 'promote');
      if (!acts.length) return null;
      if (mode === 'random') return acts[this.pick(acts.length)];
      const p = s.players[pi];
      let best = acts[0], bh = -1;
      acts.forEach(a => { const h = topCard(this.db, p.bench[a.bench]).hp; if (h > bh) { bh = h; best = a; } });
      return best;
    }

    if (s.active !== pi) return null;
    const acts = this.legalActions(pi);
    if (!acts.length) return null;

    if (mode === 'random') {
      const attacks = acts.filter(x => x.t === 'attack');
      const others = acts.filter(x => x.t !== 'attack' && x.t !== 'pass');
      if (others.length && this.rand() < 0.72) return others[this.pick(others.length)];
      if (attacks.length) return attacks[this.pick(attacks.length)];
      return acts.find(x => x.t === 'pass');
    }

    const p = s.players[pi];
    const evolve = acts.find(a => a.t === 'evolve' && p.active && a.target === p.active.uid)
                || acts.find(a => a.t === 'evolve');
    const attachActive = acts.find(a => a.t === 'attachEnergy' && p.active && a.target === p.active.uid);
    const benchIt = acts.find(a => a.t === 'playBasic');
    const attacks = acts.filter(a => a.t === 'attack');

    if (evolve) return evolve;
    if (attachActive) return attachActive;
    if (p.bench.length < 2 && benchIt) return benchIt;
    if (attacks.length) {
      let best = attacks[0], bd = -1;
      for (const a of attacks) {
        const d = parseDamage(topCard(this.db, p.active).attacks[a.idx].dmg);
        if (d > bd) { bd = d; best = a; }
      }
      return best;
    }
    return acts.find(a => a.t === 'pass');
  }

  aiTurn(pi, mode, maxActions = 24) {
    let n = 0;
    while (n++ < maxActions) {
      const s = this.state;
      if (s.phase === 'over') return;
      const a = this.aiChoose(pi, mode);
      if (!a) return;
      const before = s.turn;
      this.act(pi, a);
      if (s.turn !== before || (s.active !== pi && s.pendingPromote === null)) return;
    }
    if (this.state.active === pi && this.state.phase !== 'over' && this.state.pendingPromote === null) {
      this.act(pi, { t: 'pass' });
    }
  }

  randomTurn(pi) { return this.aiTurn(pi, 'random'); }

  // A blunt "always builds the Active and swings" player. Not smart - its job is
  // to drive games to Prize-based endings so the KO / promote / win paths get
  // exercised, which pure random play almost never does.
  greedyTurn(pi) { return this.aiTurn(pi, 'greedy'); }
}

// UI LAYER — deliberately instrument-like. Job 1 is about reading the rules
// engine clearly, not about card art. The log is a first-class panel.

const ENERGY_COLOR = { G: '#6FAE5A', R: '#D4603C', W: '#4E9BC4', L: '#D9BB47', P: '#9269A8', F: '#B07248', C: '#AAB2BB', D: '#5A6672', M: '#8A94A0' };
const ENERGY_NAME = { G: 'Grass', R: 'Fire', W: 'Water', L: 'Lightning', P: 'Psychic', F: 'Fighting', C: 'Colorless', D: 'Darkness', M: 'Metal' };

// Trainers that need the player to choose something.
const TRAINER_TARGET = {
  'base1-95': { scope: 'ownBench',          prompt: 'Choose a Benched Pokemon to bring up' },
  'base1-93': { scope: 'oppBench',          prompt: "Choose an opposing Benched Pokemon to drag up" },
  'base1-92': { scope: 'oppEnergy',         prompt: 'Choose an opposing Pokemon to remove Energy from' },
  'base1-94': { scope: 'ownDamaged',        prompt: 'Choose a damaged Pokemon to heal' },
  'base1-90': { scope: 'ownDamagedEnergy',  prompt: 'Choose a damaged Pokemon with Energy attached' },
  'base1-81': { scope: 'handDiscard',       prompt: 'Choose a card from your hand to trade away' },
};

const UI = {
  E: null,
  sel: null,          // {kind:'hand', idx} | null
  targeting: null,    // {scope, prompt, dispatch(payload)}
  aiMode: 'greedy',
  aiDelay: 420,
  aiTimer: null,
  devTab: 'log',
  cfgDraft: { prizeCount: 6, firstPlayerMayAttack: true, noEvolveFirstTurn: true },
  seedDraft: '',
};

// -------------------------------------------------------------- bootstrap --
function newGame() {
  clearTimeout(UI.aiTimer);
  const seed = UI.seedDraft === '' ? (Math.random() * 2147483647 | 0) : (parseInt(UI.seedDraft, 10) | 0);
  UI.E = new Engine(CARD_DB, EFFECTS, { seed, cfg: Object.assign({}, UI.cfgDraft) });
  UI.E.newGame(DECKS['Brushfire'], DECKS['Overgrowth'], ['You', 'Opponent']);
  UI.E.setupAuto(1);                     // opponent sets itself up
  UI.sel = null; UI.targeting = null;
  render();
}

// ---------------------------------------------------------------- helpers --
const el = (tag, cls, txt) => { const d = document.createElement(tag); if (cls) d.className = cls; if (txt !== undefined) d.textContent = txt; return d; };
const S = () => UI.E.state;
const me = () => S().players[0];
const foe = () => S().players[1];

function myLegal() { return S().phase === 'main' || S().pendingPromote !== null ? UI.E.legalActions(0) : []; }

function costPips(cost) {
  const w = el('span', 'pips');
  for (const c of cost) {
    const p = el('i', 'pip'); p.style.background = ENERGY_COLOR[c] || '#888'; p.title = ENERGY_NAME[c] || c;
    w.appendChild(p);
  }
  if (!cost) w.appendChild(el('span', 'free', 'free'));
  return w;
}

// ------------------------------------------------------------- rendering ---
function render() {
  const root = document.getElementById('app');
  root.innerHTML = '';
  if (!UI.E) { root.appendChild(el('div', 'empty', 'No game loaded.')); return; }

  const wrap = el('div', 'wrap');
  wrap.appendChild(renderBoardColumn());
  wrap.appendChild(renderRail());
  root.appendChild(wrap);

  if (S().phase === 'setup') root.appendChild(renderSetup());
  if (S().phase === 'over') root.appendChild(renderOver());

  maybeRunAI();
}

function renderBoardColumn() {
  const col = el('div', 'boardcol');
  col.appendChild(renderStatusBar());
  col.appendChild(renderSide(1, true));
  col.appendChild(renderMidline());
  col.appendChild(renderSide(0, false));
  col.appendChild(renderHand());
  col.appendChild(renderActionBar());
  return col;
}

function renderStatusBar() {
  const s = S();
  const bar = el('div', 'statusbar');
  const who = s.phase === 'over' ? 'Game over'
    : s.pendingPromote !== null ? (s.pendingPromote === 0 ? 'Choose a Pokemon to promote' : 'Opponent is promoting')
    : (s.active === 0 ? 'Your turn' : "Opponent's turn");
  const t = el('div', 'turnflag' + (s.active === 0 && s.phase === 'main' ? ' mine' : ''), who);
  bar.appendChild(t);
  bar.appendChild(el('div', 'turnno', `turn ${s.turn}`));
  bar.appendChild(el('div', 'seedno', `seed ${UI.E.seed}`));
  return bar;
}

function renderMidline() {
  const m = el('div', 'midline');
  if (UI.targeting) m.appendChild(el('div', 'prompt', UI.targeting.prompt));
  return m;
}

function counters(p, mine) {
  const c = el('div', 'counters');
  const add = (label, n, cls) => { const d = el('div', 'ctr ' + (cls || '')); d.appendChild(el('b', null, String(n))); d.appendChild(el('span', null, label)); c.appendChild(d); };
  add('prizes', p.prizes.length, p.prizes.length <= 2 ? 'hot' : '');
  add('deck', p.deck.length, p.deck.length <= 5 ? 'hot' : '');
  add('hand', p.hand.length);
  add('discard', p.discard.length);
  return c;
}

function renderSide(pi, isFoe) {
  const p = S().players[pi];
  const side = el('div', 'side' + (isFoe ? ' foe' : ' mine'));
  const head = el('div', 'sidehead');
  head.appendChild(el('div', 'sidename', isFoe ? 'OPPONENT — Overgrowth' : 'YOU — Brushfire'));
  head.appendChild(counters(p, !isFoe));
  side.appendChild(head);

  const benchRow = el('div', 'bench');
  if (!p.bench.length) benchRow.appendChild(el('div', 'slot empty', 'bench empty'));
  p.bench.forEach((b, i) => benchRow.appendChild(renderSlot(b, pi, 'bench', i)));

  const actRow = el('div', 'activerow');
  if (p.active) actRow.appendChild(renderSlot(p.active, pi, 'active', -1));
  else actRow.appendChild(el('div', 'slot empty', 'no active pokemon'));

  if (isFoe) { side.appendChild(benchRow); side.appendChild(actRow); }
  else { side.appendChild(actRow); side.appendChild(benchRow); }
  return side;
}

function slotTargetable(slot, pi, where, idx) {
  const t = UI.targeting; if (!t) return false;
  switch (t.scope) {
    case 'ownBench': return pi === 0 && where === 'bench';
    case 'oppBench': return pi === 1 && where === 'bench';
    case 'oppEnergy': return pi === 1 && slot.energy.length > 0;
    case 'ownDamaged': return pi === 0 && slot.dmg > 0;
    case 'ownDamagedEnergy': return pi === 0 && slot.dmg > 0 && slot.energy.length > 0;
    case 'promote': return pi === 0 && where === 'bench';
    case 'attachTo': case 'evolveOn': return pi === 0 && t.uids.includes(slot.uid);
    default: return false;
  }
}

function renderSlot(slot, pi, where, idx) {
  const c = topCard(CARD_DB, slot);
  const d = el('div', 'slot');
  if (where === 'active') d.classList.add('act');
  const can = slotTargetable(slot, pi, where, idx);
  if (can) d.classList.add('targetable');

  const top = el('div', 'slottop');
  top.appendChild(el('div', 'nm', c.name));
  const hp = el('div', 'hp');
  hp.textContent = `${Math.max(0, c.hp - slot.dmg)}/${c.hp}`;
  if (slot.dmg > 0) hp.classList.add('hurt');
  top.appendChild(hp);
  d.appendChild(top);

  const meta = el('div', 'slotmeta');
  const ty = el('i', 'pip'); ty.style.background = ENERGY_COLOR[c.type]; ty.title = ENERGY_NAME[c.type];
  meta.appendChild(ty);
  meta.appendChild(el('span', 'stage', c.stage + (slot.stack.length > 1 ? ` (${slot.stack.length})` : '')));
  if (c.wkType) { const w = el('span', 'wr'); w.textContent = 'wk'; w.style.color = ENERGY_COLOR[c.wkType]; meta.appendChild(w); }
  if (c.rsType) { const r = el('span', 'wr'); r.textContent = 'rs'; r.style.color = ENERGY_COLOR[c.rsType]; meta.appendChild(r); }
  meta.appendChild(el('span', 'rt', 'retreat ' + c.retreat));
  d.appendChild(meta);

  const bar = el('div', 'dmgbar');
  const fill = el('i'); fill.style.width = Math.min(100, (slot.dmg / c.hp) * 100) + '%';
  bar.appendChild(fill); d.appendChild(bar);

  const en = el('div', 'energyrow');
  slot.energy.forEach(e => {
    const p = el('i', 'pip'); const t = CARD_DB[e.id].provides;
    p.style.background = ENERGY_COLOR[t]; p.title = CARD_DB[e.id].name; en.appendChild(p);
  });
  if (!slot.energy.length) en.appendChild(el('span', 'none', 'no energy'));
  d.appendChild(en);

  const st = el('div', 'statuses');
  const badge = (txt, cls) => { const b = el('span', 'badge ' + cls, txt); st.appendChild(b); };
  if (slot.status.asleep) badge('ASLEEP', 'slp');
  if (slot.status.paralyzed) badge('PARALYZED', 'par');
  if (slot.status.confused) badge('CONFUSED', 'cnf');
  if (slot.status.poisoned) badge('POISONED', 'psn');
  slot.effects.forEach(e => {
    if (e.kind === 'PREVENT_ALL_DAMAGE') badge('SHIELDED', 'shd');
    if (e.kind === 'DAMAGE_BONUS') badge('+' + e.amount, 'bns');
  });
  if (st.children.length) d.appendChild(st);

  // your active: attack buttons
  if (pi === 0 && where === 'active' && S().phase === 'main' && S().active === 0 && S().pendingPromote === null) {
    const atks = el('div', 'attacks');
    (c.attacks || []).forEach((a, i) => {
      const chk = UI.E.canUseAttack(0, i);
      const canAtk = chk.ok && UI.E.canAttackAtAll(0);
      const b = el('button', 'atk' + (canAtk ? '' : ' off'));
      const l = el('div', 'atkline');
      l.appendChild(costPips(a.cost));
      l.appendChild(el('span', 'atkname', a.name));
      l.appendChild(el('span', 'atkdmg', a.dmg || '—'));
      b.appendChild(l);
      if (a.text) b.appendChild(el('div', 'atktext', a.text));
      if (!canAtk) {
        const why = !UI.E.canAttackAtAll(0)
          ? (slot.status.asleep ? 'Asleep — cannot attack' : slot.status.paralyzed ? 'Paralyzed — cannot attack' : 'Cannot attack')
          : chk.why;
        b.appendChild(el('div', 'atkwhy', why));
      } else {
        b.onclick = () => doAttack(i);
      }
      atks.appendChild(b);
    });
    d.appendChild(atks);
  }

  if (can) d.onclick = () => resolveTarget(slot, pi, where, idx);
  return d;
}

function renderHand() {
  const h = el('div', 'handpanel');
  const head = el('div', 'panelhead');
  head.appendChild(el('span', null, 'YOUR HAND'));
  head.appendChild(el('span', 'dimtxt', me().hand.length + ' cards'));
  h.appendChild(head);

  const row = el('div', 'hand');
  const legal = myLegal();
  me().hand.forEach((inst, i) => {
    const c = CARD_DB[inst.id];
    const acts = legal.filter(a => a.hand === i);
    const card = el('div', 'card k-' + c.kind);
    if (UI.sel && UI.sel.idx === i) card.classList.add('sel');
    if (!acts.length) card.classList.add('dead');
    if (UI.targeting && UI.targeting.scope === 'handDiscard') card.classList.add('targetable');

    card.appendChild(el('div', 'cname', c.name));
    const sub = el('div', 'csub');
    if (c.kind === 'pokemon') {
      const p = el('i', 'pip'); p.style.background = ENERGY_COLOR[c.type]; sub.appendChild(p);
      sub.appendChild(el('span', null, `${c.stage} · ${c.hp} HP`));
    } else if (c.kind === 'energy') {
      const p = el('i', 'pip'); p.style.background = ENERGY_COLOR[c.provides]; sub.appendChild(p);
      sub.appendChild(el('span', null, c.cls + ' Energy'));
    } else {
      sub.appendChild(el('span', null, c.sub));
    }
    card.appendChild(sub);
    if (c.kind === 'trainer') card.appendChild(el('div', 'ctext', c.text));
    if (c.kind === 'pokemon' && c.evolvesFrom) card.appendChild(el('div', 'ctext', '← ' + c.evolvesFrom));

    card.onclick = () => {
      if (UI.targeting && UI.targeting.scope === 'handDiscard') { UI.targeting.dispatch({ discardHandIdx: i }); return; }
      if (!acts.length) return;
      UI.sel = (UI.sel && UI.sel.idx === i) ? null : { idx: i };
      UI.targeting = null;
      render();
    };
    row.appendChild(card);
  });
  if (!me().hand.length) row.appendChild(el('div', 'empty', 'hand empty'));
  h.appendChild(row);
  return h;
}

function renderActionBar() {
  const bar = el('div', 'actionbar');
  const s = S();

  if (UI.targeting) {
    const cancel = el('button', 'btn ghost', 'Cancel');
    cancel.onclick = () => { UI.targeting = null; UI.sel = null; render(); };
    bar.appendChild(el('div', 'barmsg', UI.targeting.prompt));
    bar.appendChild(cancel);
    return bar;
  }

  if (s.pendingPromote === 0) {
    bar.appendChild(el('div', 'barmsg', 'Your Active Pokemon was Knocked Out. Choose a replacement from your Bench.'));
    me().bench.forEach((b, i) => {
      const btn = el('button', 'btn', 'Promote ' + topCard(CARD_DB, b).name);
      btn.onclick = () => { UI.E.act(0, { t: 'promote', bench: i }); render(); };
      bar.appendChild(btn);
    });
    return bar;
  }

  if (s.phase !== 'main' || s.active !== 0) { bar.appendChild(el('div', 'barmsg dimtxt', 'Waiting…')); return bar; }

  if (UI.sel) {
    const i = UI.sel.idx;
    const inst = me().hand[i];
    if (!inst) { UI.sel = null; return bar; }
    const c = CARD_DB[inst.id];
    const acts = myLegal().filter(a => a.hand === i);
    bar.appendChild(el('div', 'barmsg', c.name));

    const bench = acts.find(a => a.t === 'playBasic');
    if (bench) { const b = el('button', 'btn', 'Put on Bench'); b.onclick = () => { UI.E.act(0, bench); UI.sel = null; render(); }; bar.appendChild(b); }

    const evos = acts.filter(a => a.t === 'evolve');
    if (evos.length) {
      const b = el('button', 'btn', 'Evolve…');
      b.onclick = () => {
        UI.targeting = { scope: 'evolveOn', uids: evos.map(a => a.target), prompt: `Choose the Pokemon to evolve into ${c.name}`,
          dispatch: (uid) => { UI.E.act(0, evos.find(a => a.target === uid)); UI.targeting = null; UI.sel = null; render(); } };
        render();
      };
      bar.appendChild(b);
    }

    const atts = acts.filter(a => a.t === 'attachEnergy');
    if (atts.length) {
      const b = el('button', 'btn', 'Attach to…');
      b.onclick = () => {
        UI.targeting = { scope: 'attachTo', uids: atts.map(a => a.target), prompt: `Choose a Pokemon to attach ${c.name} to`,
          dispatch: (uid) => { UI.E.act(0, atts.find(a => a.target === uid)); UI.targeting = null; UI.sel = null; render(); } };
        render();
      };
      bar.appendChild(b);
    }

    const tr = acts.find(a => a.t === 'playTrainer');
    if (tr) {
      const need = TRAINER_TARGET[c.id];
      const b = el('button', 'btn', need ? 'Play…' : 'Play');
      b.onclick = () => {
        if (!need) { UI.E.act(0, tr); UI.sel = null; render(); return; }
        UI.targeting = { scope: need.scope, prompt: need.prompt,
          dispatch: (opts) => { UI.E.act(0, { t: 'playTrainer', hand: i, opts }); UI.targeting = null; UI.sel = null; render(); } };
        render();
      };
      bar.appendChild(b);
    }

    const x = el('button', 'btn ghost', 'Deselect');
    x.onclick = () => { UI.sel = null; render(); };
    bar.appendChild(x);
    return bar;
  }

  const retreats = myLegal().filter(a => a.t === 'retreat');
  if (retreats.length) {
    const cost = topCard(CARD_DB, me().active).retreat;
    const b = el('button', 'btn', `Retreat (discard ${cost} Energy)…`);
    b.onclick = () => {
      UI.targeting = { scope: 'ownBench', prompt: 'Choose a Benched Pokemon to bring up',
        dispatch: (opts) => { UI.E.act(0, { t: 'retreat', bench: opts.bench }); UI.targeting = null; render(); } };
      render();
    };
    bar.appendChild(b);
  } else if (me().active && me().bench.length && !me().retreated) {
    const c = topCard(CARD_DB, me().active);
    const why = me().active.status.asleep ? 'Asleep — cannot retreat'
      : me().active.status.paralyzed ? 'Paralyzed — cannot retreat'
      : `Needs ${c.retreat} Energy to retreat`;
    bar.appendChild(el('div', 'barmsg dimtxt', why));
  }

  const end = el('button', 'btn end', 'End turn');
  end.onclick = () => { UI.sel = null; UI.E.act(0, { t: 'pass' }); render(); };
  bar.appendChild(end);
  return bar;
}

function resolveTarget(slot, pi, where, idx) {
  const t = UI.targeting; if (!t) return;
  if (t.scope === 'attachTo' || t.scope === 'evolveOn') return t.dispatch(slot.uid);
  if (t.scope === 'ownBench' || t.scope === 'oppBench') return t.dispatch({ bench: idx });
  if (t.scope === 'oppEnergy') return t.dispatch({ targetUid: slot.uid, energyIdx: 0 });
  return t.dispatch({ targetUid: slot.uid });
}

function doAttack(i) {
  const c = topCard(CARD_DB, me().active);
  const script = (EFFECTS[c.id] && EFFECTS[c.id].a && EFFECTS[c.id].a[i]) || [];
  const needsBench = script.some(v => v.v === 'SWITCH_DEFENDER_CHOOSE') && foe().bench.length > 0;
  if (needsBench) {
    UI.targeting = { scope: 'oppBench', prompt: 'Choose which Benched Pokemon to drag into the Active spot',
      dispatch: (opts) => { UI.targeting = null; UI.sel = null; UI.E.act(0, { t: 'attack', idx: i, opts }); render(); } };
    render(); return;
  }
  UI.sel = null;
  UI.E.act(0, { t: 'attack', idx: i });
  render();
}

// ------------------------------------------------------------------ setup --
function renderSetup() {
  const ov = el('div', 'overlay');
  const box = el('div', 'sheet');
  box.appendChild(el('h2', null, 'Opening setup'));
  box.appendChild(el('p', 'dimtxt', 'Place one Basic Pokemon as your Active, then up to five more on your Bench. Prizes are dealt once both players are ready.'));

  const p = me();
  const cur = el('div', 'setupcur');
  cur.appendChild(el('div', 'lbl', 'Active: ' + (p.active ? topCard(CARD_DB, p.active).name : '— none —')));
  cur.appendChild(el('div', 'lbl', 'Bench: ' + (p.bench.length ? p.bench.map(b => topCard(CARD_DB, b).name).join(', ') : '— empty —')));
  box.appendChild(cur);

  const row = el('div', 'hand');
  p.hand.forEach((inst, i) => {
    const c = CARD_DB[inst.id];
    const isBasic = c.kind === 'pokemon' && c.stage === 'Basic';
    const card = el('div', 'card k-' + c.kind + (isBasic ? '' : ' dead'));
    card.appendChild(el('div', 'cname', c.name));
    const sub = el('div', 'csub');
    if (c.kind === 'pokemon') { const q = el('i', 'pip'); q.style.background = ENERGY_COLOR[c.type]; sub.appendChild(q); sub.appendChild(el('span', null, `${c.stage} · ${c.hp} HP`)); }
    else if (c.kind === 'energy') { const q = el('i', 'pip'); q.style.background = ENERGY_COLOR[c.provides]; sub.appendChild(q); sub.appendChild(el('span', null, 'Energy')); }
    else sub.appendChild(el('span', null, 'Trainer'));
    card.appendChild(sub);
    if (isBasic) card.onclick = () => { UI.E.setupPlace(0, i, p.active ? 'bench' : 'active'); render(); };
    row.appendChild(card);
  });
  box.appendChild(row);

  const bar = el('div', 'actionbar');
  const auto = el('button', 'btn ghost', 'Fill automatically');
  auto.onclick = () => { UI.E.setupAuto(0); render(); };
  const done = el('button', 'btn end', 'Ready');
  done.onclick = () => { const r = UI.E.setupConfirm(0); if (!r.ok) alert(r.error); render(); };
  if (!p.active) done.classList.add('off');
  bar.appendChild(auto); bar.appendChild(done);
  box.appendChild(bar);
  ov.appendChild(box);
  return ov;
}

function renderOver() {
  const s = S();
  const ov = el('div', 'overlay');
  const box = el('div', 'sheet');
  box.appendChild(el('h2', null, s.winner === 0 ? 'You win' : 'Opponent wins'));
  box.appendChild(el('p', null, s.winReason));
  box.appendChild(el('p', 'dimtxt', `Game lasted ${s.turn} turns. Seed ${UI.E.seed}.`));
  const bar = el('div', 'actionbar');
  const again = el('button', 'btn end', 'New game');
  again.onclick = () => { UI.seedDraft = ''; newGame(); };
  const rerun = el('button', 'btn ghost', 'Replay this seed');
  rerun.onclick = () => { UI.seedDraft = String(UI.E.seed); newGame(); };
  bar.appendChild(again); bar.appendChild(rerun);
  box.appendChild(bar);
  ov.appendChild(box);
  return ov;
}

// ------------------------------------------------------------------- rail --
function renderRail() {
  const rail = el('div', 'rail');
  const tabs = el('div', 'tabs');
  ['log', 'dev', 'cards'].forEach(t => {
    const b = el('button', 'tab' + (UI.devTab === t ? ' on' : ''), t.toUpperCase());
    b.onclick = () => { UI.devTab = t; render(); };
    tabs.appendChild(b);
  });
  rail.appendChild(tabs);
  if (UI.devTab === 'log') rail.appendChild(renderLog());
  if (UI.devTab === 'dev') rail.appendChild(renderDev());
  if (UI.devTab === 'cards') rail.appendChild(renderCoverage());
  return rail;
}

function renderLog() {
  const box = el('div', 'logbox');
  const entries = S().log.slice(-400);
  entries.forEach(e => {
    const d = el('div', 'logline k-' + e.kind);
    d.appendChild(el('span', 'lt', String(e.t)));
    d.appendChild(el('span', 'lx', e.text));
    box.appendChild(d);
  });
  setTimeout(() => { box.scrollTop = box.scrollHeight; }, 0);
  return box;
}

function renderDev() {
  const box = el('div', 'devbox');

  const g1 = el('div', 'grp');
  g1.appendChild(el('div', 'grphead', 'New game'));
  const seedRow = el('div', 'row');
  seedRow.appendChild(el('label', null, 'seed'));
  const si = el('input'); si.type = 'text'; si.placeholder = 'random'; si.value = UI.seedDraft;
  si.oninput = () => { UI.seedDraft = si.value.trim(); };
  seedRow.appendChild(si);
  g1.appendChild(seedRow);

  const przRow = el('div', 'row');
  przRow.appendChild(el('label', null, 'prizes'));
  const ps = el('select');
  [6, 4, 3, 2, 1].forEach(n => { const o = el('option', null, String(n)); o.value = n; if (UI.cfgDraft.prizeCount === n) o.selected = true; ps.appendChild(o); });
  ps.onchange = () => { UI.cfgDraft.prizeCount = parseInt(ps.value, 10); };
  przRow.appendChild(ps);
  g1.appendChild(przRow);

  const mkChk = (label, key) => {
    const r = el('div', 'row chk');
    const c = el('input'); c.type = 'checkbox'; c.checked = UI.cfgDraft[key];
    c.onchange = () => { UI.cfgDraft[key] = c.checked; };
    r.appendChild(c); r.appendChild(el('label', null, label));
    return r;
  };
  g1.appendChild(mkChk('first player may attack on turn 1', 'firstPlayerMayAttack'));
  g1.appendChild(mkChk('no evolving on your first turn', 'noEvolveFirstTurn'));
  const go = el('button', 'btn', 'Start new game');
  go.onclick = () => newGame();
  g1.appendChild(go);
  box.appendChild(g1);

  const g2 = el('div', 'grp');
  g2.appendChild(el('div', 'grphead', 'Live controls'));
  const coinRow = el('div', 'row');
  coinRow.appendChild(el('label', null, 'coin'));
  const cs = el('select');
  [['auto', ''], ['always heads', 'H'], ['always tails', 'T']].forEach(([t, v]) => {
    const o = el('option', null, t); o.value = v; if ((UI.E.dev.forceFlip || '') === v) o.selected = true; cs.appendChild(o);
  });
  cs.onchange = () => { UI.E.dev.forceFlip = cs.value || null; };
  coinRow.appendChild(cs); g2.appendChild(coinRow);

  const aiRow = el('div', 'row');
  aiRow.appendChild(el('label', null, 'opponent'));
  const as = el('select');
  [['greedy', 'greedy'], ['random (rules fuzzer)', 'random']].forEach(([t, v]) => {
    const o = el('option', null, t); o.value = v; if (UI.aiMode === v) o.selected = true; as.appendChild(o);
  });
  as.onchange = () => { UI.aiMode = as.value; };
  aiRow.appendChild(as); g2.appendChild(aiRow);

  const spRow = el('div', 'row');
  spRow.appendChild(el('label', null, 'pace'));
  const sp = el('input'); sp.type = 'range'; sp.min = 0; sp.max = 1200; sp.step = 60; sp.value = UI.aiDelay;
  sp.oninput = () => { UI.aiDelay = parseInt(sp.value, 10); };
  spRow.appendChild(sp); g2.appendChild(spRow);
  box.appendChild(g2);

  const g3 = el('div', 'grp');
  g3.appendChild(el('div', 'grphead', 'State'));
  const s = S();
  const dump = {
    turn: s.turn, phase: s.phase, activePlayer: s.active,
    pendingPromote: s.pendingPromote, promoteQueue: s.promoteQueue,
    you: playerDump(s.players[0]), opponent: playerDump(s.players[1]),
  };
  const pre = el('pre', 'dump', JSON.stringify(dump, null, 1));
  g3.appendChild(pre);
  box.appendChild(g3);
  return box;
}

function playerDump(p) {
  const sl = (x) => x ? {
    name: topCard(CARD_DB, x).name, dmg: x.dmg,
    energy: x.energy.map(e => CARD_DB[e.id].provides).join(''),
    status: Object.keys(x.status).filter(k => x.status[k]),
    effects: x.effects.map(e => e.kind),
  } : null;
  return {
    hand: p.hand.length, deck: p.deck.length, discard: p.discard.length, prizes: p.prizes.length,
    energyAttachedThisTurn: p.energyAttached, retreatedThisTurn: p.retreated,
    active: sl(p.active), bench: p.bench.map(sl),
  };
}

function renderCoverage() {
  const box = el('div', 'covbox');
  const rep = UI.E.coverageReport();
  const head = el('div', 'grphead', `Implemented ${rep.done} / ${rep.total} cards in play`);
  box.appendChild(head);
  box.appendChild(el('div', 'dimtxt small', 'Every card in both decks has a working effect script. Cards without one are rejected by the deck validator, so an unimplemented card can never quietly do nothing.'));
  const list = el('div', 'covlist');
  rep.rows.sort((a, b) => (a.done - b.done) || a.name.localeCompare(b.name));
  rep.rows.forEach(r => {
    const d = el('div', 'covrow');
    d.appendChild(el('span', 'dot ' + (r.done ? 'ok' : 'no')));
    d.appendChild(el('span', 'cn', r.name));
    d.appendChild(el('span', 'ci', r.id));
    list.appendChild(d);
  });
  box.appendChild(list);

  const v = el('div', 'grp');
  v.appendChild(el('div', 'grphead', 'Deck validation'));
  ['Brushfire', 'Overgrowth'].forEach(k => {
    const res = UI.E.validateDeck(DECKS[k]);
    const d = el('div', 'covrow');
    d.appendChild(el('span', 'dot ' + (res.ok ? 'ok' : 'no')));
    d.appendChild(el('span', 'cn', k));
    d.appendChild(el('span', 'ci', `${res.total} cards · ${res.basics} basics`));
    v.appendChild(d);
    res.errors.forEach(e => v.appendChild(el('div', 'verr', e)));
    res.warnings.forEach(e => v.appendChild(el('div', 'vwarn', e)));
  });
  box.appendChild(v);
  return box;
}

// --------------------------------------------------------------- AI driver -
function maybeRunAI() {
  clearTimeout(UI.aiTimer);
  const s = S();
  if (s.phase !== 'main') return;
  const needMe = s.pendingPromote === 0;
  if (needMe) return;
  const aiTurn = (s.pendingPromote === 1) || (s.pendingPromote === null && s.active === 1);
  if (!aiTurn) return;
  UI.aiTimer = setTimeout(() => {
    const a = UI.E.aiChoose(1, UI.aiMode);
    if (a) UI.E.act(1, a);
    render();
  }, Math.max(30, UI.aiDelay));
}

window.addEventListener('DOMContentLoaded', newGame);

</script>
</body>
</html>
